ation is unclear, and the diviner must ponder the signs. (And ask a staff member, when they become available.) Visions almost always take time to reflect upon.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Guidance","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Augur","call":"","description":"This spell allows the diviner to gain insight into one of many paths that a subject could take to achieve a given objective. The subject must express what they are trying to achieve. This spell is designed simply to set someone on a path, yet it should be known that tere are many paths that are equally valid and yet might notbe as readily seen by the diviner","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Meditative Deflection","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Augur, Bestow","call":"Bestow Disarm","description":"After meditating on the weave and all possible futures, you gain one use of the 'Disarm' skill, till used, or until 30 minutes have expired. The skill functions as it normally would. Remember that the Disarm skill may only be used with a one handed weapon while the offhand is empty.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Meditative Evasion","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Augur, Bestow","call":"Bestow Dodge","description":"After meditating on the weave and all possible futures, you gain one use of the 'Dodge' skill, till used, or until 30 minutes have expired. The skill functions as it normally would.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Meditative Killing Strike","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Augur, Bestow","call":"Bestow Lesser Death","description":"After meditating on the weave and all possible futures, you gain one use of weapon-delivered 'Lesser Death', till used, or until 30 minutes have expired.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Weapon of Light","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Touch","call":"Bestow Light","description":"Bestows light damage on weapon for the next 30 minutes or until you let go of the weapon - whichever happens first you may call light.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Awaken","tier":"Apprentice","core":true,"delivery":"Touch","casting":"Touch","call":"“Remove Sleep”","description":"By making physical contact with someone, you are also able to make contact with their mind where it connects to the Dreaming. By taking a moment to untangle them from their slumber, you can bring them back to the waking world. Attempting to use this spell while you are in the Dreaming can have wild, unpredictable, and potentially dangerous results.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Charge","tier":"Apprentice","core":true,"delivery":"Touch","casting":"Imbue","call":"“Imbue [Chosen Metal]”","description":"By swiftly merging your mind with the “identity” that a weapon projects into the Dreaming, you can temporarily enable it to interact with the world in a way that a different metal would. Choose Iron, Silver, or Gold. The affected weapon will deal the chosen type of metal damage for its next attack; while this does not increase the numerical damage it deals, it may have special effects on anything weak against the chosen metal. The weapon does not notably change in appearance; this spell changes the way the weapon strikes, not how shiny it is.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Manifest Tether","tier":"Apprentice","core":false,"delivery":"Special","casting":"Tether","call":"Special","description":"This spell allows the Dream Mage to summon their 1st tether.\nA person summoned as a tether retains all of their skills, spells, and abilities with the following changes. The individual's spells, hp, mana, etc, start all at their highest point, however, these traits cannot be restored through any means. A summon is immune to all forms of healing and mana regeneration, and their skills cannot be restored, refreshed, or renewed even by skills which expressly do that (Such as \"Invoke Challenge.\") This means that once a tether is summoned it will eventually burn out with enough exposure to the dream.\nWhen a Dream Mage's last tether is destroyed he dies and returns to the world in a catatonic state. (see \"Manifest Will\" scroll.) When a summoned tether dies in the dream, they also return to the wakened world dead, but simply in a death count and may receive a \"life\" spell or effect as normal.\nA Manifested Tether must do any task asked of them by the dreamer as if they were under the effects of dominate. (This effect may not be resisted or prevented in any way) It should be understood however that unlike normal dominate effects, the Manifested Tether is not a mindless zombic, but an active part of the dream. They should justify the action as best as they can and rp accordingly. A manifested tether is also encouraged to roleplay their character not how they actually are, but in an altered way in accordance with the token being used to summon them. The Manifested Tether could even change how their character is physically presented via costuming, makeup, etc, if ooc time permit. This is a dream, so players are encouraged to be creative.\nNote: While a tether can take many forms including items, structures, puzzles, traps, and so forth, these alternative forms of tethers typically are tagged items with their effects written onto them as to what they do when manifested.\nNote: You MAY make yourself, as the dreamer, also a tether, but should you be killed, all other tethers are also instantly destroyed.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Manifest Will","tier":"Apprentice","core":false,"delivery":"Self","casting":"Dreaming","call":"Special","description":"While in the dream realm, you may invoke your will to attach yourself to the dream. This allows you to use some of dream magic's more powerful spells, but also carries with it a significant increase to danger.\nWhile everyone dreams, and can even be killed in the dreaming, a dream mage's connection, (once his will has manifest) is much stronger. This means that if he dies in the dreaming not only does he die physically, but he also dies mentally. In mechanical terms, the dreamer would wake up in a death count that cannot be cured, ignored, resisted, prevented, or stopped in any way. (In-character this represents waking up in a coma or catatonic state.) If a \"Life\" spell or effect is used on the dreamer while in this state, the death count is refreshed but with the mind dead, the body once again begins to wither away and the death count begins anew.\nFortunately, it is also much harder to kill a dream mage while their will is manifested. Even if a dream mage's form is destroyed while in the dreaming, they don't actually die until their last tether is destroyed. They can remain in the dreaming (out of character in the event that their dream body is destroyed) and can continue to direct their manifestations as desired. If the dreamer awakens before their last tether is destroyed, they awaken normally, (not in a death count.)\nThis spell lasts until the dreamer leaves the dream realm and wakes up.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Passing Fancy*","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Show","call":"[None]","description":"As a dream mage, you have a more nuanced view of reality than most. Some would call this insanity. You call it a gift and with some effort it is a gift that you can share.\nYou may share a 3 second vision with one willing creature that you are touching. This has no mechanical effect on the recipient and is not a dream for mechanical purposes. Due to the rudimentary nature of the vision it may only pass surface ievel information. Examples include a face, a soundscape, or 3 or fewer words of speech. This vision ends immediately if you break physical contact or if anything occurs that would break your concentration.","note":"SPECIAL NOTE:\nUnlike nearly all other spells, this spell costs 0 mana to cast.","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Phantasmagoria","tier":"Apprentice","core":true,"delivery":"Special","casting":"Conjure","call":"“Create Dream Figment: [Description]”","description":"By meditatively pulling threads of the Dreaming into the waking world, you can weave together the image or seeming of some small thing and let it exist for a few moments, cradled in the palm of your hand. You can choose every detail of the dream figment you create, describing its every particular—and anyone nearby will see exactly what you describe. The figment cannot be larger than your hand, though, and it cannot produce any sound, light, smell, or taste. It is translucent and ghostly. You may push it to change slightly, and describe it as such (a flower blooming, an egg hatching, etc.), but it cannot ever leave your hand. The figment cannot meaningfully, physically interact with any other thing in the real world (like, for instance, acting as the key to open a lock). At the end of 30 seconds, or if you move more than a step, or if your concentration is broken for any reason (by taking damage, etc.), the spell ends immediately.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Sleep Augury","tier":"Apprentice","core":true,"delivery":"Self","casting":"Sleepwalk","call":"[None]","description":"This strange spell can only be cast while you are asleep; it requires a fullscale connection to the Dreaming to work, so you must be experiencing a dream at the time. (This can mean “actively exploring the Dreaming as a Dream Mage” or simply “taking a long nap.”) It allows you to determine if another person, anywhere in the world, is asleep at the moment you cast this spell—but you must have previously met the person whose status you wish to check.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Imbue","tier":"Journeyman","core":false,"delivery":"Touch","casting":"Imbue","call":"\"\u003cSilver, Gold, or Iron\u003e\"","description":"By charging a weapon with dream magic you can awaken latent dream energy stored in it for a short period of time and use it to temporarily transmute the weapons material. All attacks with the weapons, made within 3 seconds can change its damage type to Silver, Gold or Iron.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Lasamaya's Web","tier":"Journeyman","core":false,"delivery":"Gaze","casting":"Stare","call":"\"By my Gaze, Bind by Fear\"","description":"Originally creatred by the dream mage Cellagar's Apprentice, this spell draws upon a common theme present in both dreams and nightmares: inescapable terror, and the inability to moe your legs to escape. By drawing these latent memories to the surface with a glance, you can lock a target in place with a moment of manufactured, irrational fright.\n\nWith your eyes directed toward your target, you affect a creature with a \"Bind,\" meaning they cannot move their feet from that spot for 3 seconds. if the enemy is not facing you, or if it is too dark to easily see where your gaze is directed, it is helpful to point at your target or call them out by name or description before calling the effect.\n\nNOTE: Targets cannot safely stop immediately if they are moving very quickly, but they should take the effect as soon as they are able to safely stop moving. Also, an effected person can use an Escape effect to free themselves from this spell.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Manifest Magic","tier":"Journeyman","core":true,"delivery":"As Chosen Spell","casting":"Manifest","call":"As Chosen Spell","description":"Through deep concentration, a Dream Mage can touch the edges of the realm of dreams and draw upon its potentiality—its swirling blend of ideas and magical essences—to form the shapes of spells that are normally beyond that mage’s talents, manifesting that potential into reality.\nTo manifest a spell, you must have the LORE skill for that Magical Art. You must possess a scroll of the 1st-Circle spell you wish to cast, or cast a 1st-Circle Core Spell. After concentrating for 2 seconds, you must spend 2 mana to activate this spell, then an additional 1 mana to cast the chosen 1st-Circle spell, after following all requirements of the spell as if you were casting it normally. \n(If you use this to cast a spell that creates a ward line your maximum number of ward stones is 2.)\nNote: Manifest Magic may not be used to cast any spells designated as “Exclusive” on their scrolls.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Manifest Tether 2","tier":"Journeyman","core":false,"delivery":"Special","casting":"Tether","call":"Special","description":"This spell allows the Dream Mage to summon their 2nd tether.\nA person summoned as a tether retains all of their skills, spells, and abilities with the following changes. The individual's spells, hp, mana, etc, start all at their highest point, however, these traits cannot be restored through any means. A summon is immune to all forms of healing and mana regeneration, and their skills cannot be restored, refreshed, or renewed even by skills which expressly do that (Such as \"Invoke Challenge.\") This means that once a tether is summoned it will eventually burn out with enough exposure to the dream.\nWhen a Dream Mage's last tether is destroyed he dies and returns to the world in a catatonic state. (see \"Manifest Will\" scroll.) When a summoned tether dies in the dream, they also return to the wakened world dead, but simply in a death count and may receive a \"life\" spell or effect as normal.\nA Manifested Tether must do any task asked of them by the dreamer as if they were under the effects of dominate. (This effect may not be resisted or prevented in any way) It should be understood however that unlike normal dominate effects, the Manifested Tether is not a mindless zombie, but an active part of the dream. They should justify the action as best as they can and rp accordingly. A manifested tether is also encouraged to roleplay their character not how they actually are, but in an altered way in accordance with the token being used to summon them. The Manifested Tether could even change how their character is physically presented via costuming, makeup, etc, if ooc time permit. This is a dream, so players are encouraged to be creative.\nNote: While a tether can take many forms including items, structures, puzzles, traps, and so forth, these alternative forms of tethers typically are tagged items with their effects written onto them as to what they do when manifested.\nNote: You MAY make yourself, as the dreamer, also a tether, but should you be killed, all other tethers are also instantly destroyed.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Sending","tier":"Journeyman","core":false,"delivery":"Special","casting":"","call":"Special","description":"While asleep you may compose a message and send it to someone who is also asleep (Detected via Augury.) Write the message out. However the fickle and shifting nature of the Dreaming makes it almost impossible to ensure the message will make it to the receipting completely intact. You may spend 1 additional mana per word to underline words within your message. Those words will make it to the receipting unaltered, the rest are subject to the distorting whims of the dream.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Sense Dreaming","tier":"Journeyman","core":false,"delivery":"Self","casting":"Concentrate","call":"\"Sense Dreaming\"","description":"By focusing on the rhythm and flow of the dreaming, you can sense whether or not your surroundings have that same fluidity, and can thereby \"Sense\" if you are in the \"Dreaming.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Shared Dream of Truth","tier":"Journeyman","core":true,"delivery":"Touch","casting":"Join","call":"[None]","description":"This spell allows a Dream Mage to draw another person into a bubble of dreamlike energy in which they can share images, thoughts, and feelings. The spell lasts for 3 minutes. It can also be broken at any time if one of the participants… 1) breaks physical contact with another, 2) takes damage, or 3) simply wishes to end the spell. Participants can end the spell at any time by releasing their hands from the other person’s. While the spell is ongoing, participants cannot perceive the world outside that “bubble” in any way. During the spell, the caster “paints with words” to share any memory, feeling, or experience clearly, but cannot share anything that is fictional or imagined. Since the caster’s words are not silent, anyone overhearing them can act as though their character received a pale imitation of the full vision. After this spell ends, each player whose character was involved may choose to have their character forget everything they witnessed in the Shared Dream.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Startle","tier":"Journeyman","core":true,"delivery":"Packet","casting":"Hurl","call":"Stun","description":"You touch the Dreaming for just long enough to draw out a mote of its essence, infuse it into a spell component, and throw it at a target. When it hits, it swirls into a burst of confusing energy that distracts and Stuns that target. * If you cast this spell while in the Dreaming, its delivery changes to “Gesture”; you simply point at the target and call “By My Gesture, Stun.”","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Acesso's Allure","tier":"Master","core":false,"delivery":"Gaze","casting":"Stare","call":"\"By my Gaze, attract by Fear\"","description":"Through your gaze you are able to invoke paranoia and a nightmarish fear of what lurks behind an individual. Those caught in your gaze believe, -ever so briefly- that you are the only path to salvation from the nightmares that wait behind them. Through their fear, they are attracted.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Alloy","tier":"Master","core":false,"delivery":"Touch","casting":"Imbue","call":"“\u003cSilver, Gold, or Iron\u003e”","description":"By charging a weapon with dream magic you can awaken latent dream energy stored in it for a short period of time and use it to temporarily transmute the weapons material. All attacks with the weapons, made within 3 minutes, or until the weapon is let go of, can change its damage type to Silver, Gold or Iron","note":"Note: You must choose the desired damage type (Silver, Gold, or Iron) when the spell is cast, and may only benefit from that damage type for the duration of the spell.","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Gilded Tongue","tier":"Master","core":false,"delivery":"Gaze","casting":"Economancy","call":"\"By My Gaze, Lesser Dominate by Greed\"","description":"Originally created by Ink Dripper, this spell allows a dream mage to weave magic into their words and gestures to reach across a short expanse of the waking world and seize control of an unwary creature's actions. Whereas many spells that take control of a person's body use otherworldly magic or brute mechanical force, this spell works in more subtle ways, preying on an individual's desire for monetary gain or power to allow the dream mage to influence their movements.\n\nYou must spend at least 30 uninterrupted seconds engaging in roleplay with the target(s), which should primarily be verbal conversation, and you must also be doing something obvious with your hands during this time involving coins, paper currency, or other noteworthy paperwork. While this period of conversation must be continuous, it does not count as Concentration. At the end of the 30 second period, you may call the effect on the target(s) you have been conversing with. If multiple creatures have fulfilled all the requirements to be a target for this spell, you may spend mana and make a separate call for each of them.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Lesser Sleep","tier":"Master","core":true,"delivery":"Touch","casting":"Touch","call":"“Lesser Sleep”","description":"A Dream Mage can use their connection to the land of dreams to touch the mind of a creature with a weaker spirit and cause them to fall into an enchanted slumber from which no amount of noise or physical distress will wake them.\nTo cast this spell, maintain contact with a creature while concentrating for 3 seconds, then call “Lesser Sleep.” If the target can be affected by Lesser effects, they will pass into a Sleep that will last for 3 minutes, even if they are shaken or wounded.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Manifest Magic 2","tier":"Master","core":false,"delivery":"As Chosen Spell","casting":"Manifest","call":"As Chosen Spell","description":"Cast Journeyman spell of other school. May not be used to cast any spells designated as “Exclusive” on their scrolls.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Manifest Tether 3","tier":"Master","core":false,"delivery":"Special","casting":"Tether","call":"Special","description":"This spell allows the Dream Mage to summon their 3rd tether.\nA person summoned as a tether retains all of their skills, spells, and abilities with the following changes. The individual's spells, hp, mana, etc, start all at their highest point, however, these traits cannot be restored through any means. A summon is immune to all forms of healing and mana regeneration, and their skills cannot be restored, refreshed, or renewed even by skills which expressly do that (Such as \"Invoke Challenge.\") This means that once a tether is summoned it will eventually burn out with enough exposure to the dream.\nWhen a Dream Mage's last tether is destroyed he dies and returns to the world in a catatonic state. (see \"Manifest Will\" scroll.) When a summoned tether dies in the dream, they also return to the wakened world dead, but simply in a death count and may receive a \"life\" spell or effect as normal.\nA Manifested Tether must do any task asked of them by the dreamer as if they were under the effects of dominate. (This effect may not be resisted or prevented in any way) It should be understood however that unlike normal dominate effects, the Manifested Tether is not a mindless zombie, but an active part of the dream. They should justify the action as best as they can and rp accordingly. A manifested tether is also encouraged to roleplay their character not how they actually are, but in an altered way in accordance with the token being used to summon them. The Manifested Tether could even change how their character is physically presented via costuming, makeup, etc, if ooc time permit. This is a dream, so players are encouraged to be creative.\nNote: While a tether can take many forms including items, structures, puzzles, traps, and so forth, these alternative forms of tethers typically are tagged items with their effects written onto them as to what they do when manifested.\nNote: You MAY make yourself, as the dreamer, also a tether, but should you be killed, all other tethers are also instantly destroyed.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Shared Dream of Falsehood","tier":"Master","core":true,"delivery":"Touch","casting":"Join","call":"[None]","description":"This spell allows a Dream Mage to draw another person into a bubble of dreamlike energy in which they can share images, thoughts, and feelings. The spell lasts for 3 minutes. It can also be broken at any time if one of the participants… 1) breaks physical contact with another, 2) takes damage, or 3) simply wishes to end the spell. Participants can end the spell at any time by releasing their hands from the other person’s. While the spell is ongoing, participants cannot perceive the world outside that “bubble” in any way. During the spell, the caster “paints with words” to share any memory, feeling, or experience they can imagine clearly, even one that is entirely fabricated. Since the caster’s words are not silent, anyone overhearing them can act as though their character received a pale imitation of the full vision.\nAfter this spell ends, each player whose character was involved may choose to have their character forget everything they witnessed in the Shared Dream.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Tseari's Gate to Tamogara","tier":"Master","core":false,"delivery":"Self","casting":"Nap-centrate","call":"\"Self Awaken\"","description":"Demonstrating your mastery over sleep, you may choose to \"Self Awaken\" even while under sleep effects.\nSpecial: You may cast this spell while under a sleep effect.\nNote: If you are in the dream realm, (Especially the deep dreaming) this spell might not be enough to pull you out of it.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Will of the Moon","tier":"Master","core":false,"delivery":"Gaze","casting":"Stare","call":"“By my Gaze, Repel by Fear\"","description":"Through your gaze you are able to remind an individual of the nightmares that hide deep inside of their mind. Those caught in your gaze is repelled by fear.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Alter Reality: Health","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Concentrate","call":"\"Heal Self 10\" *","description":"By tapping into the infinite possibilities of the Dreaming-all things that are, things that were, and things that could be-you actively recall a version of yourself who was uninjured, standing strong, and you infuse yourself\nwith that same energy.\nYou Heal yourself for 10 Health. This spell cannot raise your Health past its maximum.\n* If you cast this spell while in the Dreaming, it allows you to also hurl a strange, warped, negative bolt of life-drain at an opponent, echoing the amount you healed.\n*If you are currently in the Dreaming, you may throw a packet within 3 seconds of calling \"Heal 10\" that produces a \"Drain 10\" effect -- bypassing armor to deal damage directly to a creature's Health and transferring that Health to you- if it strikes any part of a target's body, clothes, weapon, or shield.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Havoc","tier":"Grandmaster","core":false,"delivery":"Packet","casting":"Hurl","call":"\"Lesser Berserk\"","description":"As an experienced dream mage, you have learned to imbue packets with the madness of the Dreaming. When the packet hits the target a burst of energy swirls around them over taking their minds with feral rage.\n\n*If you cant this spell in the Dreaming, its delivery changes to \"Gesture\"; you simply point at the target and call \"By My Gesture, Lesser Berserk.\"","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Imbued Tether Strength","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Imbued Tether","call":"\"Bestow +1 Damage\"","description":"While you are woven into the Dreaming through the power of the Manifest Will spell, you have the option of bringing your friends along by casting Manifest Tether spells -- but those friends are not quite their normal selves. Because they are your \"tethers\" and shaped by your perceptions and beliefs, you have unusual power to direct them, as though they were characters in a story you are telling.\n\nYou may only cast this spell in the Dreaming, and may only cast it on a person currently acting as one of your Tethers, summoned by Manifest Tether 1-4. You bestow +1 damage for 30 minutes that applies to any weapons the person may wield during this time, but only while they continue acting as your Tether in the Dreaming. As this is bestowed damage, it does not stack with any other source of bestowed damage, or with itself.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Manifest Magic 3","tier":"Grandmaster","core":false,"delivery":"As Chosen Spell","casting":"Manifest","call":"As Chosen Spell","description":"Cast Master spell of other school.  May not be used to cast any spells designated as “Exclusive” on their scrolls.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Manifest Tether 4","tier":"Grandmaster","core":false,"delivery":"Special","casting":"Tether","call":"Special","description":"This spell allows you to conjure a person's mind and essence to aid you in the Dreaming. drawing a version of their physical form into that realm. While other Manifest Tether spells let you conjure additional people, this spell brings your Fourth Tether: the chosen person will exist in the Dreaming as a manifestation of themselves, as if they were a character in your dream.\n\nYour Tethers start with full Health, Mana, Armor, and all items/skills refreshed. Your Tethers cannot be healed or have skills, abilities, items, or other stats refreshed in any way.\nYour tethers are \"different versions of themselves\" as manifested by your vision of them. They should role-play a shifted emphasis on their personality related either to you or the token they have provided you. If possible, they should alter their costume/makeup to match that new version of their character.\nYour tethers are required to agree to your requests as though they are under the effect of a \"Dominate\" effect that cannot be prevented in any way, although unlike Dominate, they should rationalize why they are agreeing to your requests as your ally, not a puppet.\nIt a tether dies, their corpse will reappear outside the Dreaming, but can accept \"Life\" effects. (If you make yourself your own tether, all your other tethers are instantly killed if you die.)","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Shared Dream of Community","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Join","call":"Special","description":"This spell allows a dream mage to connect their mind with one or more people, to temporarily share images, thoughts, and feelings. The subject receiving the information is not compelled-in any way-to continue the connection and can end the spell at any time by letting go of the Mage's. hands. The casting mage may share any memory, feeling, or experience that they can imagine. The caster has three minutes to describe or paint with words, the memory or experience that is being conveyed.\nOnce the three minutes are up, the spell is over and the target is free to either retain the information or \"forget it\"--the eventual outcome is at the player's (not character's) discretion. If the player chooses to forget the shared dream, their character will remember nothing that was shared. While sharing the dream, the characters involved are unaware of the outside world and can't hear, see, or perceive in any way what is going on around them. Note: This description is not silent; therefore, characters nearby who overhear the description can take what they hear into character, though they did not see and feel the scene in the same way that participants do.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Dream","name":"Oblivion","tier":"Paragon","core":false,"delivery":"","casting":"","call":"","description":"It allows for a willing target, with consent, to remove any number and amount of memories from their mind.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Basic Animation","tier":"Apprentice","core":true,"delivery":"Touch","casting":"Reanimate","call":"“Animate Dead”","description":"This basic animation spell is most often used by apprentices trying to master the basics of necromancy. This spell may not be cast on a Returned. This animation lasts for 3 minutes or until the undead dies, and a necromancer may only have 1 animated creature active at once. The undead animated by this spell has the following stats and no skills, and this spell takes as long to cast as it does to communicate these stats:\n• Must follow all orders from the necromancer\n• 5 Health Points, cannot be healed, dies when reduced to 0 Health\n• Swings for 1 damage, fights as if under a “Slow” effect\n• Ought to fight clumsily and unintelligently, making slow, broad, occasionally wild swings\n• Cannot speak, run, or perform actions other than combat\n• Cannot receive “Life” effects after being animated\n• Does not have access to the memories it had in life and possesses only a rudimentary understanding of “friend” and “foe”\n• SPECIAL: May not accept “Imbue” spells","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Corpse Sight","tier":"Apprentice","core":true,"delivery":"Touch","casting":"Speak","call":"[The hushed explanation of the spell]","description":"This spell uses necromantic energy to draw out the last vestiges of memory from a corpse’s brain before it is lost to the entropy of death. When you cast this spell, you see, exactly as the corpse saw it, the last 3 minutes of its life before it died. You gain no additional sensory information such as sound, taste, smell, touch, or thought.\nYou must maintain contact with the corpse for the entire 3 minutes you are casting this spell, and you are essentially under the effect of a “Stun” while you are witnessing this memory, although you may choose to end the effect at any time by breaking contact with the corpse.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Decay Corpse","tier":"Apprentice","core":true,"delivery":"Touch","casting":"Discorporate","call":"\"Destroy Corpse\"","description":"This spell floods a corpse with an incredible amount of entropic energy, replicating centuries of brutal decay and reducing the body to dust in mere moments. This entropy is voracious and indiscriminate, and the corpse will leave nothing behind, including items not removed from the body beforehand","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Durwin's Deathly Visage","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Bestow","call":"\"Bestow Deathly Appearance\"","description":"Originally created by the necromancer Durwin \"Doctor\" Sawbones, this spell allows you to let the outward traits of death-stillness, coldness, and so on-flow from your hand into the body of another person, effectively making them appear dead to all possible inspections for as long as they maintain the stillness of true death.\nYou must maintain physical contact with the target for the full duration of casting this spell, and may only cast it on a willing target that is not currently Dead. The target may answer in the affirmative to any effects that attempt to determine whether a target is dead, whether by answering \"yes\" to effects that attempt to detect death, or by answering \"dead\" to effects such as Examine Wounds that attempt to determine the state of a body. This spell lasts for 30 minutes, or until the target voluntarily moves. The target may be moved and even damaged by others without interrupting this spell.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Echoes of Death*","tier":"Apprentice","core":false,"delivery":"Packet","casting":"Deathblow","call":"\"1 Darkness\"","description":"As a necromancer, you know that there is more to death than the cessation of life. Every death, no matter how small, has a spark of that strange power and if you are close you can tap into it.\nWithin 30 seconds, you can throw up to 3 packets calling the effect each time.","note":"SPECIAL NOTE:\nUnlike nearly all other spells, his spell costs mana to cast.","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Entropic Limb Stunning","tier":"Apprentice","core":false,"delivery":"Packet","casting":"","call":"\"Stun [Specify Limb]\"","description":"You throw a packet and a deliver a Stun effect to a specific limb when you connect with any part of an enemy's body, clothes, weapon, or shield. This renders that limb incapable of being used for 3 seconds.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Hear Final Listenings","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Corporate","call":"Special","description":"This spell uses necromantic energy to recall the last things that a skull heard before it died. Like holding your ear up to a macabre seashell, you will be able to hear the distorted echoes of what happened to the spirit that once inhabited that skull in the moments before death.\nYou must maintain physical contact with a corpse for the full duration of this spell, and it requires a corpse to have an intact skull. If cast on an NPC, this spell requires the involvement of Story Staff. You will hear a distorted and fragmented version of up to the final 30 seconds of what the skull heard before it died.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Imbue Fortitude","tier":"Apprentice","core":true,"delivery":"Touch","casting":"Imbue","call":"“Imbue [Number] Health”","description":"This spell grants preternatural resilience to a corpse you are animating into an undead; there are legends of undead that have been enhanced so thoroughly in this way as to be almost impossible to destroy. This spell can only be cast on an undead while it is in the process of being animated by another spell. It may be cast multiple times, adding an additional second of concentration per casting during the process of animation; the undead is imbued with 2 additional Health Points per casting.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Imbue Morality","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Imbue","call":"\"Imbue Morality\"","description":"The torturous process that chains a formerly-living soul into an undead creature generally strips away everything but the base impulses to move and fight. With this spell, though, you can selectively safeguard a part of that soul: its original sense of right and wrong. The undead will still have to follow your commands, but it will feel remorse if forced to act against its ethical code. Some necromancers use this spell specifically to torment previous foes with \"overdeveloped\" senses of morality.\nYou may only cast this spell in conjunction with a spell that animates an Undead. The corpse that you are animating receives the same sense of morality and \"right and wrong\" that it possessed in life, though it still retains none of its memories. The Undead must still follow your commands unquestioningly, and so this spell has no mechanical effect, it simply allows the Undead to understand the implications and consequences of its actions.\nNOTE: Because the undead retains none of its memories from life, it is no more torturous to have it kill its former friends, for example, than if it were to kill any other person, though it may still find the slaughter of innocents reprehensible.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Spell of Reason","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Imbue","call":"\"Imbue Reason\"","description":"\"The corpse that you are animating now is granted some elements of reason, and may now think and fight intelligently and with strategy. They may still not recall memories.\"\nNote: This spell does nothing on its own, but rather enhances animation spells and rituals.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Spell of Speech","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Imbue","call":"\"Imbue Speech\"","description":"\"The corpse that you are animating now is granted the ability to speak, and may convey messages upon command. They do not have memory however, and may not recall instances of the past.\"\nNote: This spell does nothing on its own, but rather enhances animation spells and rituals. Also, animated corpses are considered to be under incredible amounts of pain, and animated creatures with the ability to speak, especially if they also have reason, will often let out cries of pain, or ask for those around them to kill them. Conjuring necromancers will frequently command these animated servants to be quiet.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Spell of Speed","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Imbue","call":"\"Imbue Speed\"","description":"Reanimating an undead servitor, in many cases, will produce an entity only capable of slow and shuffling movement. In those cases, this spell can enhance the animation process's efficacy, holding slightly wider the dark gate through which energy can pour... to allow more flexibility and speed in the resulting undead.\nYou may only cast this spell in conjunction with a spell that animates an Undead. The corpse that you are animating receives the ability to move and fight at full speed. It may run, or even perform leaps or other feats of acrobatics if it somehow possesses them, though this spell does not impart any of those things.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Death Sight","tier":"Journeyman","core":false,"delivery":"Gaze","casting":"Stare","call":"\"By my Gaze, Sense Death\"","description":"By looking at a target, you can determine whether or not they are alive or dead. You sometimes (at staff discretion) may also be able to sense if a person or object is strongly connected to the aspect of death.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Entropic Stun","tier":"Journeyman","core":true,"delivery":"Packet","casting":"Hurl","call":"Stun”","description":"By hurling a packet of entropic components imbued with necromantic energy, you can briefly cause a target’s body to be wracked by decay and debilitation. The target suffers from a “Stun” effect for 3 seconds.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Halt Death","tier":"Journeyman","core":true,"delivery":"Touch","casting":"Exviviate","call":"“Slow Death”","description":"This spell is extremely dangerous and rarely used by any necromancer, as it requires them to temporarily sacrifice their life without the promise of return. Upon casting, the necromancer dies and enters Death Count as their spirit tethers itself to the target corpse and anchors it to this plane. For the remainder of the necromancer’s Death Count, the target’s Death Count is paused. If the necromancer’s body takes damage or breaks physical contact with the target, the spell ends and the necromancer receives a “Life” effect, being restored to full health and entering Weakness as normal. If the necromancer reaches the end of their Death Count without the spell ending, they mist as normal, and the target resumes their Death Count.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Improved Animation","tier":"Journeyman","core":true,"delivery":"Touch","casting":"Imbue","call":"“Animate Dead”","description":"This improved animation is the most often created version of an undead, and can be used for a variety of tasks and purposes. This spell may not be cast on a Returned. This animation lasts for 3 minutes or until the undead dies, and a necromancer may only have 1 animated creature active at once. The undead animated by this spell has the following stats and no skills, and this spell takes as long to cast as it does to communicate these stats:\n• Must follow all orders from the necromancer\n• 10 Health Points, cannot be healed, dies when reduced to 0 Health\n• Swings for 1 damage, fights as if under a “Slow” effect\n• May fight with basic intelligence but no complex strategy\n• Cannot speak or run\n• Cannot receive “Life” effects after being animated\n• Does not have access to the memories it had in life and possesses only a rudimentary understanding of “friend” and “foe”","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Speak with the Dead","tier":"Journeyman","core":false,"delivery":"Touch","casting":"Corporate","call":"\"Speak With Dead\"","description":"By sending out a tendril of your magic into the spirit realm along ways where so many souls have fled, you are able to open a channel to ask questions of the spirit of a recently-killed corpse. As long as it still has a face and lungs, the body will speak with you while you maintain contact with it, speaking aloud with the intelligence of the person it once was.\nYou may only cast this spell on a corpse with an intact head and lungs, and that corpse must have died during the current Twin Mask game. You must maintain physical contact with the corpse for entire duration of this spell. You may ask the corpse questions and it will respond verbally, potentially allowing others to hear, though it is under no obligation or compulsion to tell you the truth or give you specific information. The corpse possesses the personality and knowledge it possessed up until the point it died, but nothing further. If you ever break physical contact with the corpse, the spell immediately ends.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Zaafira's Cage of Bones","tier":"Journeyman","core":false,"delivery":"Touch","casting":"Discorporate","call":"\"Destroy Corpse, Self Bestow 4 Armor\"","description":"A corpse is a resource to any necromancer. With a touch, this spell allows you to destroy a dead body and use its bones to bestow yourself with 4 additional armor. As with other bestowed abilities it can be refreshed but does not stack with itself. It lasts for 30 minutes or until used.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Zura's Liberation","tier":"Journeyman","core":false,"delivery":"Touch","casting":"Reanimate","call":"\"Imbue Willpower\"","description":"Originally created by the necromancer Zura Azur Kai, this unusual spell complicates the magic that animates a dead body, introducing an element of free will to the resulting undead. By letting a thin ray of its original life's sunlight illuminate the spirit animating this body, you grant it the chance to forge its own path, even if its choices could lead to rebellion and violence against you.\n\nYou may only cast this spell in conjunction with a spell that animates an Undead. The corpse that you are animating is now granted a single use of \"Willpower\" per time you cast this spell. This Willpower can be used to prevent any effect that Willpower normally defends against Additionally, the undead gains the unique ability to use the \"Willpower\" skill to momentarily break free from its creator's control, ignoring a single command and even attacking its creator if it chooses.\nNote: As this spell fundamentally changes the way an undead and its creator interact, it is important you explain the full ramifications of this spell to the person you are casting an animate spell upon.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Compel Truth from the Dead","tier":"Master","core":false,"delivery":"Touch","casting":"Seance","call":"\"Torture\"","description":"By whispering into the spirit realm, you can not only commune with the dead, but force it to answer truthfully. The Necromancer can facilitate the corpse responding, so long as its head and lunges remain intact. Those nearby may also be able to hear the corpse's response.\n~Note: This spell only works on the recently deceased. Before this spell forced a lesser \u0026 dead creature to answer three questions truthfully. Now it requires roleplay and acts as a form of torture. In line with torture you can only ask Yes or No questions. Necromancer Exclusive Spell.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Consume Corpse","tier":"Master","core":false,"delivery":"Touch","casting":"Touch*","call":"\"Destroy Corpse\" \"Heal Self 5\" OR \"Destroy Corpse\" \"Heal 3\"","description":"This spell consumes a corpse and uses its body parts to heal and mend the flesh of another target. After concentrating for 2 seconds, you may call \"Destroy Corpse\" on the dead body, and then immediately call \"Heal 5\" to the individual that you wish to heal.\nNote: This can be yourself.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Defender Animation","tier":"Master","core":true,"delivery":"Touch","casting":"Imbue","call":"“Animate Dead”","description":"This specialized animation spell creates a hearty undead that excels in defending the caster; it is often used as part of a master necromancer’s personal retinue to protect against assassins. This spell may not be cast on a Returned. This animation lasts for 3 minutes or until the undead dies, and a necromancer may only have 1 animated creature active at once. The undead animated by this spell has the following stats and skills, and this spell takes as long to cast as it does to communicate these stats:\n• Must follow all orders from the necromancer\n• 15 Health Points, cannot be healed, dies when reduced to 0 Health\n• Swings for 1 damage, fights at normal speed with normal intelligence\n• Has 3 uses of PARRY and the GUARDIAN skill\n• Cannot speak; defaults to defending the caster unless given other orders\n• Cannot receive “Life” effects after being animated\n• Does not have access to the memories it had in life and possesses only a rudimentary understanding of “friend” and “foe”","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Entropic Paralysis","tier":"Master","core":true,"delivery":"Packet","casting":"Hurl","call":"“Paralyze”","description":"By hurling a packet of entropic components imbued with necromantic energy, you can briefly cause a target’s body to be afflicted by induced rigor mortis and seize up. The target suffers from a “Paralyze” effect for 3 seconds","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Imbue Dark Hatred","tier":"Master","core":false,"delivery":"Touch","casting":"Imbue","call":"\"Imbue Hatred\"","description":"As part of animating a dead body to serve you, you can infuse the magic that moves that body's limbs with a frightful, dark surge of hatred for the living. The undead will still obey your will, but it will also strike at your foes with a black, self-ravaging magical energy that both underpins and shortens its temporary, false life.\nYou may only cast this spell in conjunction with a spell that animates an Undead. The corpse that you are animating gains +2 Weapon Damage and may call \"Darkness\" for any weapon they wield while animated. However, this spell reduces the total duration of the Animate spell to 30 seconds. This timer begins once all Animate spells, Imbues, and other spells related to the original Animate spell are complete.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Regenerate Corpse","tier":"Master","core":false,"delivery":"Touch","casting":"Touch","call":"\"Restore Corpse\"","description":"To attempt to do momentous things with the power to bring false life to corpses... you need to have some functional corpses to work with. By tapping into a dead body's imprinted sense of what it used to be, this spell can bring cause that dead body to sprout tendrils of darkness that rebuild any and all parts that had been mutilated and severed.\nYou must maintain physical contact with a corpse for the full 3 seconds of concentration when casting this spell. The corpse receives a \"Restore Corpse\" effect, which repairs or regrows any damaged or removed limbs or organs, and renders it able to receive \"Elixir\" effects. Undead affected by this potion will not regain HP, but they will regain the use of any lost or broken limbs and will look less visibly worn or damaged.\nRegularly using this spell on a corpse or undead can preserve it for years.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Zaafira's Tell-Tale Heart","tier":"Master","core":false,"delivery":"Touch","casting":"Special","call":"\"Bestow, Resist Death by Pain\" \"Resist by Pain\"","description":"Once this spell is cast, the individual whose heart was removed may \"Resist by Pain\" a single \"Death\" effect. When this happens, the removed heart withers and dies, though it simultaneously regenerates within their chest. Both of the heart's sudden death and its regeneration is painful, but does not restrict the use of any spells, skills, or abilities. At this point the spell may be cast again, if desired.\nThis spell lasts until either the effect is used, the heart is moved more than 3 feet from the individual, or until 3 days has passed, whichever comes first.\n\nSpecial: Once this spell is cast, if the heart is moved further than 3 feet from the individual receiving the spell, the spell ends and the heart withers, and they immediately take effect death. (They may take a life spell as normal).","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Commune with Spirit Realm","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Special","call":"\"Commune with the Spirit Realm\"","description":"You have cast your consciousness through the veils of the world into the spirit realm many times, this spell draws on that familiarity to seek the spirit that once inhabited a particular skull, calling it to communicate. The skull acts as a focus to find the spirit, but that skull does not actually speak: a voice will emanate from it, as spiritual winds carry words from the beyond.\nYou may only cast this spell with the involvement of Story Staff. You must have an intact skull from a body, which can still be intact, though there is no limit to the length of time the creature has been dead, and you must maintain physical contact with the skull for the entirety of this spell. You may ask the skull questions, and the spirit will answer verbally, meaning nearby creatures may hear it, though it is under no obligation or compulsion to answer truthfully or give you specific information. The voice of the spirit is carried from the spirit realm and echoes from seemingly nowhere, it is not being spoken physically through the skull. This spell lasts as long as you remain in contact with the skull and ends when you break physical contact.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Hand of Death","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Special","call":"\"Animate Arm\"","description":"This unusual spell applies the basic principles of undead animation to a more specific and limited field: an individual body part, still attached to a living person. If a person is willing to damage and mangle their arm enough to leave it still attached but dead, you can animate it with the grim, cold strength of the grave, letting it attack with extra power (and/or follow your commands) despite its still-living host.\nYou must spend at least 30 seconds role-playing ritualistically killing a creature's arm without severing it, then animating it independent of the rest of their body. You gain +1 Bestowed Damage with any weapon wielded in that arm only for 30 minutes. A weapon wielded with two hands benefits from having either arm targeted with this spell, assuming you keep both hands on the weapon for the entirety of the attack. When this spell ends, the affected arm dies as if targeted by a \"Destroy Limb\" effect, and is unusable until it receives a \"Restore Limb\" effect, or this spell is cast again.\nAn arm animated by this spell will follow the commands of the necromancer that animated it, just as a normal undead would. If the arm receives a command beginning with the word, \"Arm,\" it will obey it immediately to the best of its ability. In this way, an arm could be issued the command, \"Arm, kill your master,\" and it would attempt to attack the bearer of the arm, who may choose to wrestle with it using its other arm, or somehow attempt to fight back. Hand of Death may be cast again to refresh its duration. However, casting of Hand of Death cannot regrow or a limb destroyed by Hand of Death.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Imbue Dark Wrath","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Reanimate","call":"\"Imbue Wrath\"","description":"Contempt for the living can be difficult to avoid, as a necromancer, and this spell harnesses some of the power that can be found by indulging in one's rage against the frailties and stupidities of non-undead. As you raise one undead, you grant it a short-lived wrath that will let it strike with dark energy but also reduce its durability.\nYou may only cast this spell in conjunction with a spell that animates an Undead. The corpse that you are animating gains the ability to treat every strike as a Great Strike and call \"Darkness\" for any weapon they wield while animated. However, this spell reduces the total duration of the Animate spell to 30 seconds. This timer begins once all Animate spells, Imbues, and other spells related to the original Animate spell are complete.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Shadowbane","tier":"Grandmaster","core":false,"delivery":"Self","casting":"","call":"Summon Blade of Darkness","description":"Must deathblow someone to cast, which you remove and weaponize a creature's spine.  You get a weapon that swings 2 darkness.  Basicly conjure elemental weapon for necroYou may only cast this spell in conjunction with a spell that animates an Undead. The corpse that you are animating gains the ability to treat every strike as a Great Strike and call \"Darkness\" for any weapon they wield while animated. However, this spell reduces the total duration of the Animate spell to 30 seconds. This timer begins once all Animate spells, Imbues, and other spells related to the original Animate spell are complete.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"True Animation","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Reanimate","call":"\"Animate Dead\"","description":"This powerful animation spell is often considered the pinnacle and pride of a necromancer's art, as it can animate souls that are exceptionally powerful or in flux; it is often used by grandmaster necromancers instead of lesser effects, unless a specialty undead is required.\nYou must maintain concentration and physical contact with the corpse for the full casting of this spell. This spell lasts until for 30 minutes or until the creature dies, and a necromancer can only have 1 animated undead at a time. The undead created by this spell has the following stats, and this spell takes as long to cast as it does to communicate them:\n*Must follow all orders from the necromancer\n*20 Health Points, cannot be healed, dies when reduced to 0 Health\n*Fights at normal speed and possesses all the skills and abilities it had in life; any expended skills or abilities are refreshed, but items are not\n*Walks at normal speed but cannot run, may be Imbued with Speed\n*Attacks for the same damage it did in life using any items it possesses\n*May fight with basic strategy, can be imbued with Reason to use complex tactics or follow plans\n*Cannot speak, may be limbued with Speech\n*Possesses no memories of its previous life, possesses a rudimentary understanding of \"friend\" and \"foe\"\n*The corpse cannot receive \"Life\" effects after being animated","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Volker's Vice Grip","tier":"Grandmaster","core":false,"delivery":"Packet","casting":"Hurl","call":"\"Break Limb\"","description":"Originally created by the necromancer Sir Volker Reinhardt, this spell utilizes a packet filled with entropic and debilitating reagents to briefly but rapidly drain the energy and vitality from a limb, rendering it so fragile and brittle that it will snap under its own weight. This effect is temporary enough to leave the limb alive, but structurally ravaged until it can be healed by some external force.\nYou must specify the limb to be broken when you throw this packet, which produces a \"Break Limb\" effect when it hits any part of a creature's body, clothes, weapon, or shield. If you use this spell in conjunction with Weapon-Casting, you must follow all the rules of the Break Limb skill, including striking the limb to be broken, and being ineffective if it strikes a weapon or shield. You may only cast this spell once per 30 seconds.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Necromancy","name":"Zaafira's Embrace","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Special","call":"\"Deathblow [Describe]\" then \"Destroy Corpse\"","description":"Originally created by the necromancer Zaafira, this spell embraces the idea that, as a necromancer, you must learn to be unbothered by both the principle and the specifics of mortality. By touching another person or yourself-even if you are in a state of bleedout-you can let the peace accepted, welcomed death suffuse your spirit, sending you to the spirit realm with the calmness of peace.\nof an\nYou may only cast this spell on a target that is currently in Bleedout, which can be yourself. This is an exception to the rule that no skills or abilities can be used while in Bleedout. You must maintain physical contact with the target for the duration of this spell. You Deathblow the target with a description of your choice, then immediately destroy the corpse, leaving nothing behind, including any items not removed from the body beforehand. If the target is a Returned, they will report to NPC Camp and attempt to return from death as if they had -1 Corruption.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Bubble Speech*","tier":"Apprentice","core":false,"delivery":"Self","casting":"Special","call":"","description":"Speak underwater with bubbles, word by word.","note":"Requires Lore: Hydrology","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Elemental Blast 1","tier":"Apprentice","core":false,"delivery":"Packet","casting":"Hurl","call":"\"2 \u003cSpecify Element\u003e\"","description":"\"By hurling a spell packet at a target you unleash a set of chain reactions that, when connecting with its target, get unleashed to often destructive effects. Elemental Blast does 2 damage of an elemental type of your choosing.\nValid Elemental Types include; Fire, Ice, Note: Lightning, and Acid","note":"Valid Elemental Types include; Fire, Ice, Lightning, and Acid","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Elemental Strike","tier":"Apprentice","core":true,"delivery":"Touch","casting":"Imbue","call":"“Imbue [Fire, Ice, Lightning, OR Acid]”","description":"By quickly drawing upon your knowledge of Adelrune’s magicka as it connects to damaging elements, you can weave a temporary sheathe of elemental energy around a weapon, letting that weapon strike one blow with that power without damaging the weapon itself. The affected weapon will deal the Imbued element for its next attack; while this does not increase the numerical damage it deals, it may have special effects on anything weak against that particular element.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Harmonic Repel","tier":"Apprentice","core":false,"delivery":"Stone Ward","casting":"Hurl","call":"\"Repel\"","description":"Originally created by the sorcerer Lorrick Venethal, this spell established a new standard for exploratory research in Sorcery: it relies on the powerful ability of Warding's geometric lines to contain and magnify ambient magical energy, creating a \"harmonic\" system of sympathetic reinforcement that enables more efficient spellcasting.\nWhile standing fully within the boundaries of a ward shape comprised of 3 or more Ward Lines (any geometric shape with at least 3 connected sides), you may throw a packet that causes your target to take a Repel effect, which will cause your opponent to take 3 steps directly away from you. The ward shape does not need to be one that you created, and you may move in and out of the shape at will, but cannot cast this spell if any part of your body is currently outside the boundaries of the ward lines.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Painful Awakening","tier":"Apprentice","core":false,"delivery":"Packet","casting":"Hurl","call":"“1 \u003cSpecify Element\u003e, Awaken”","description":"“By hurling a spell packet at a target you unleash a set of chain reactions that, when connecting with its target, get unleashed to often destructive effects. Painful Awakening does 1 damage of an elemental type of your choosing, but also breaks enchanted sleep, awakening your target.”","note":"Valid Elemental Types include; Fire, Ice, Lightning, and Acid","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Purify Liquid","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Touch","call":"\"Remove Poison\"","description":"By drawing on your knowledge of how Adelrune's elements interact to form fire and water, you weave together a matrix of purifying heat at your fingertips that can seek out and boil away all impurities in a liquid, while leaving all other aspects of that liquid intact.\nYou must maintain contact with the liquid, or a constructed container that contains the liquid, for the full duration of this spell. You remove any substances that could cause the \"Poison\" effect from a liquid. If the liquid is not contained in a container, such as a pool, touching it may potentially expose you to a \"Poison\" effect before you can neutralize it (\"the ground\" does not count as a container that contains a liquid). The volume of liquid this spell can purify is at the sole discretion of Story Staff (it is unlikely to affect an entire ocean, etc.).\nIn addition to removing poison, it may (at Story Staff discretion) clear other elements from the chosen liquid. Unfortunately, it always ruins any liquors by negating all alcohol within them.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Sorcerous Light","tier":"Apprentice","core":true,"delivery":"Touch","casting":"Create","call":"“Create Light”","description":"By using your sorcerous knowledge of the different light-emitting elements of Adelrune, you are able to weave together a magic that will invest an object with the power to emit light. This allows you to use a light source that you carry with you, whether it is a glow stick, a mystic orb, a magical lantern, a light-up book, et cetera. Keep in mind that such lights should be dim, not much more luminous than a glowstick; consult the “Nighttime, Darkness, \u0026 Light Sources” section of chapter 6 of the Twin Mask Rulebook for more guidance on the recommended brightness of light sources.\nThis spell will last indefinitely, as long as your light source lasts. Every time you douse or turn off your light source, though, you must cast this spell again if you want to re-light it.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Sustained Elemental Blast","tier":"Apprentice","core":true,"delivery":"Packet","casting":"Hurl","call":"“1 [Fire, Ice, Lightning, OR Acid]”","description":"You take an extra moment, using your fundamental understanding of how the elements are woven into the components of Adelrune, to fold a weak burst of elemental energy into a spell component. When you throw the resulting spell packet, it unleashes a set of chain reactions that will cause minor elemental destruction when they impact their target. Because this spell relies on your skill rather than the force of your mind or will, it has the almost-unique property of not depleting your mana.\nNOTE: Unlike nearly all other spells, this spell costs 0 mana to cast.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"The Binding Spell","tier":"Apprentice","core":true,"delivery":"Packet","casting":"Hurl","call":"\"Bind\"","description":"By infusing a spell-component packet with elements that will catalyze sudden plant growth, you create and throw a component that will unleash complicated chain reactions when they hit a target. Suddenly, that target will act as a conduit for the energy, which courses into the ground and animates latent seeds or weeds to burst from underfoot and grow to wrap around the target’s feet, grappling them and locking them in place. The target takes an immediate “Bind” effect, meaning they are unable to move their feet for 3 seconds, though the rest of their body functions normally and they may continue to fight, cast spells, or use skills.\nNOTE: Targets cannot safely stop immediately if they are moving very quickly, but they should take the effect as soon as they are able to safely stop moving. Also, an affected person can use an ESCAPE effect to free themselves from this spell.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Cauterize","tier":"Journeyman","core":false,"delivery":"Packet","casting":"Hurl","call":"“Slow Bleeding, By Fire”","description":"“By using the element of fire, you can slow the rate at which someone bleeds to death. This is a painful process, but prolongs someone’s current bleed count by 3 minutes. This counts as a bestowed ability, and-therefore does not stack with itself, and cannot be used multiple times on the same target, even if cast by different sorcerers.”","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Decay Corpse","tier":"Journeyman","core":false,"delivery":"Touch","casting":"Discorporate","call":"\"Destroy Corpse\"","description":"This spell accelerates natural decay, destroying a corpse while nourishing the ground under it.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Dichotomous Blast","tier":"Journeyman","core":false,"delivery":"Packet","casting":"Hurl","call":"\"3 [Light or Darkness]\"","description":"By hurling a spell packet at a target, you unleash a set of chain reactions that, when connecting with its target, gets unleashed to often destructive effects. Dichotomous Blast does 3 damage of Light or Darkness.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Elemental Blast 2","tier":"Journeyman","core":true,"delivery":"Packet","casting":"Hurl","call":"“3 [Fire, Ice, Lightning, OR Acid]”","description":"Using your growing ability to command the elemental properties of Adelrune’s materials, you quickly weave together a more complex matrix of elemental-attuned energies into a spell component. When you throw the resulting spell packet, it unleashes a set of chain reactions that will cause significant elemental destruction when they impact their target.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Merewif's Subaqueus Respiration*","tier":"Journeyman","core":false,"delivery":"Touch","casting":"Touch","call":"\"Imbue water breathing\"","description":"This spell, fondly nicknamed \"Mr. Wiggle's Swim Time!\" imbues an individual with the ability to breath under water for 30 minutes.\nSpecial: This spell may be cast while under water.","note":"Requires Lore: Hydrology","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Patches' Last Laugh","tier":"Journeyman","core":false,"delivery":"Packet","casting":"Bleedout","call":"\"Lesser Death\"","description":"Originally created by the sorcerer Patches the Clown, Prince of Doldrum- Dreary, this spell allows you to harness the mortal energies (and inherent comedy) of your own impending death to visit one last burst of retaliatory punishment on somebody nearby. You collect threads of your own mortality and weave them into a spell packet, then let out a scream or laugh while throwing that packet, which can cause other people's life energies to similarly unravel.\nTo cast this spell, you must first scream or laugh, in an exception to the normal rule that you cannot talk above a whisper while in Bleedout. You throw a spell packet which creates a Lesser Death effect, instantly killing a Lesser creature, after which you immediately die and enter your Death Count. Your death is not a \"Death\" effect and cannot be resisted by anything that could normally prevent a Death effect. This Death happens regardless of whether the\npacket hits, or is resisted or countered.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Remove Poison","tier":"Journeyman","core":false,"delivery":"Touch","casting":"Touch","call":"\"Remove Poison\"","description":"This spell charges the water that runs in a target’s body, giving it a purifying quality removing all traces of a poison.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Repelling Spell","tier":"Journeyman","core":true,"delivery":"Packet","casting":"Hurl","call":"\"Repel\"","description":"By harnessing your understanding of the unseen forces that spring from and underlie Adelrune’s physical reality, you can weave together the elements of force and wind into a spell-component packet, then hurl it at a target. When it hits, the target will be blasted backward by concussive force, taking a “Repel” effect and being forced 3 steps away from you.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"The Attracting Spell","tier":"Journeyman","core":true,"delivery":"Packet","casting":"Hurl","call":"\"Attract\"","description":"By harnessing your understanding of the unseen forces that spring from and underlie Adelrune’s physical reality, you can weave together the elements of force and wind into a spell-component packet, then hurl it at a target. When it hits, it will generate a powerful vortex of air that will drag the target toward you, taking an “Attract” effect and being forced 3 steps in your direction.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Druid Kaelan's Ardent Wings","tier":"Master","core":false,"delivery":"Touch","casting":"Touch","call":"\"Bestow Leap\" or \"Bestow Enhanced Leap\"","description":"Originally created by Druid Kaelan Estelmer, this unique spell harnesses one of Sorcery's more esoteric disciplines: the ability to create effects that interact with the physical forces of the world. Just as a conjured sword can parry a strike, this spell creates a pair of shimmering wing-like shapes that are capable of briefly generating the force to propel a target off the ground and through the air. If the caster already has wings this spell will work in tandem with them, transforming those erstwhile vestigial appendages into a sparkling reminder of the glory of their original bloodline.\nYou must maintain physical contact with the target for the full duration of this spell. You allow the target to make a single Leap within 30 minutes, following all the normal restrictions for the Leap skill, which means no Heavy Armor and no Shields. If you cast this spell on yourself and you have phys-repped wings at least 36 inches across at their widest point, you may call \"Enhanced Leap,\" which allows you to take 6 Steps instead of 3.\nNote: As this is a bestow, this spell does not stack that hestow a Leap or with itself.","note":"Bestow Leap is touch, Bestow Enhanced Leap is self-only and you must have phys-rep wings equipped. Single use for either, 30min duration. The enhanced 6-step leap has a 30 second cooldown.","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Elemental Blast 3","tier":"Master","core":true,"delivery":"Packet","casting":"Hurl","call":"“4 [Fire, Ice, Lightning, OR Acid]”","description":"With a more complex understanding of how Adelrune’s materials and the elemental properties that exist within their metaphysics can be interwoven, you quickly weave together a system of elemental-attuned energies into a spell component. When you throw the resulting spell packet, those materials and elements will twist themselves into very powerful nexus of energies, causing serious elemental destruction when they impact their target.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Elemental Bow","tier":"Master","core":false,"delivery":"Self","casting":"Conjure","call":"\"I Conjure a Bow from [Fire, Ice, Lightning, OR Acid]\"","description":"Much like the more common Elemental Sword spell, this spell lets you catalyze, stabilize, and protect yourself from a matrix of elemental energy that takes the form of a weapon. In this case, you create a bow that, when drawn, will also create arrows made of whatever element you chose when you cast this spell.\nYou may only cast this spell if you are carrying a phys-rep of the bow you intend to summon, with a white ribbon tied around it to signify it is out-of- character. Choose Fire, Ice, Lightning, or Acid. You conjure a bow from that element, which takes as long as it takes you to remove the white ribbon, and which lasts for as long as you hold it. If you ever take your hand off the weapon, including being disarmed or dropped, the spell immediately ends. You are considered to have the skill necessary to wield the bow you summon. The weapon deals 1 damage of the element you have chosen and benefits from Archery skills which increase arrow damage. (As this bow creates its own arrows, during \"mods\" in which combat is handled via description rather than physical role-playing, using this spell will essentially grant you\nunlimited arrows to shoot.)\nNote: As this spell does not do direct numerical damage, and instead summons a weapon that is capable of doing damage, it does not benefit from Power Focus artifacts.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Elemental Weapon","tier":"Master","core":false,"delivery":"Self","casting":"Conjure","call":"\"I Conjure a Sword from [Fire, Ice, Lightning, OR Acid]\"","description":"This spell allows the caster to conjure an elemental weapon that lasts for as long as the caster holds onto it. If this weapon is ever set down, or disarmed, it is dispelled.~Note: This does not add damage, it simply makes an attack elemental instead of normal. This sword prop may be of any legal length and the caster is assumed to be proficient with it. The prop may be carried with them with a white headband tied around it. If the prop is not in the caster's possession they may not cast the spell.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Mist Form","tier":"Master","core":true,"delivery":"Self","casting":"Transform","call":"To begin: “My body turns to mist.”\nTo maintain:
