y spend 3 minutes role-playing food preparation at a Kitchen to produce any Cooking Dish that has a total skill level of 1 from the table below, or from any Cooking craft recipes you are attuned to. More specifically, you will spend 3 minutes at the location of your Kitchen, then set aside the ingredients you used to produce your food to turn in to Logistics later (you may cross off herb tags, but do not rip up single-use tags); when other people spend 30 seconds eating that food (within 30 minutes of it being created), you explain the food’s specific effects. You don’t need to have any other skills (such as LORE or MAGIC) related to the food you are cooking, no matter how strange or powerful it ends up being. You are also considered to have “LORE: COOKING,” though you cannot teach it as a LORE. (Note: Players that fail to return expended single-use tags to Logistics will be considered cheating and dealt with harshly.)","usage":"You may spend 3 minutes at a Kitchen role-playing to cook a dish from the Cooking chart or a craft recipe with a total Skill Level of 1; it takes 30 seconds to eat.","note":"unlike some crafted items, you do not need to attune to food. That would be silly."},{"category":"Crafting: Edible","name":"Cooking: Journeyman","cost":"6 CP","prerequisite":"Cooking: Apprentice","returnsWith":"—","call":"—","description":"You have progressed to Journeyman level as a cook. If you expend the necessary herbs, you may spend 3 minutes role-playing food preparation at a Kitchen to produce any Cooking Craft Food that has a total skill level of 2.","usage":"You may spend 3 minutes at a Kitchen role-playing to cook a dish from the Cooking chart or a craft recipe with a total Skill Level of 2; it takes 30 seconds to eat.","note":""},{"category":"Crafting: Edible","name":"Cooking: Master","cost":"6 CP","prerequisite":"Cooking: Journeyman","returnsWith":"—","call":"—","description":"You have progressed to Master level as a cook. If you expend the necessary herbs, you may spend 3 minutes role-playing food preparation at a Kitchen to produce any Cooking Craft Food that has a total skill level of 3.","usage":"You may spend 3 minutes at a Kitchen role-playing to cook a dish from the Cooking chart or a craft recipe with a total Skill Level of 3; it takes 30 seconds to eat.","note":""},{"category":"Crafting: Edible","name":"Cooking: Grandmaster","cost":"6 CP","prerequisite":"Cooking: Master","returnsWith":"—","call":"—","description":"You have progressed to Grandmaster level as a cook. If you expend the necessary herbs, you may spend 3 minutes role-playing food preparation at a Kitchen to produce any Cooking Craft Food that has a total skill level of 4.","usage":"You may spend 3 minutes at a Kitchen role-playing to cook a dish from the Cooking chart or a craft recipe with a total Skill Level of 4; it takes 30 seconds to eat.","note":""},{"category":"Crafting: Edible","name":"Grand Feast","cost":"6 CP","prerequisite":"Cooking: Grandmaster","returnsWith":"—","call":"Special","description":"Sharing food with other people is a fundamental part of what a community means: it is a kind of immutable, irreplaceable tradition that brings together an almost magical kind of power. By organizing an extended and large-scale meal for many people, you and up to 2 other cooks can harness that power to dramatically amplify the effect of any food that is cooked and consumed as part of that feast. You may spend at least 30 minutes hosting a feast; during that time, any food that you and your assistant chefs prepare—and that people eat during the event, as long as they stay the whole time—will have its numerical effects doubled, exactly like the function of the DRINKING SONG skill. 190","usage":"You spend 30+ minutes role-playing hosting a feast for any number of people. You and up to 2 other cooks you choose may cook any number of dishes from the COOKING tree as part of the feast. You should explain that any food cooked AND consumed during the event by a participant that is there for the full 30 minutes gains the benefit of DRINKING SONG. See the COOKING skill for which dishes DRINKING SONG applies to.","note":""},{"category":"Crafting: Edible","name":"Stable Alchemy: Apprentice","cost":"6 CP","prerequisite":"Lore: Alchemy","returnsWith":"—","call":"—","description":"Even without the spur of magical power, you are fascinated by the process of combining herbs, reagents, and complex liquids into powerful alchemical potions. This skill does not work like other Crafting skills: to make anything with STABLE ALCHEMY, you must have attuned to a spell scroll for a MAGIC: ALCHEMY spell (or an alchemical craft recipe). You are considered to know all the “Core Spells” for the appropriate level of Stable Alchemy and may use those as recipes, plus any other scrolls you have attuned to. See chapter 4’s Alchemy section for a list of Core Spells. Each one has a “crafting” list of herb properties, and if you are advanced enough in the art of STABLE ALCHEMY, you can combine the necessary herbs to make the potion described on the scroll—with the added feature that your STABLE ALCHEMY potion will last indefinitely until it is used, and it will often contain 5 “doses.” With this skill, you can spend 30 minutes role-playing the process of mixing materials in a Laboratory (and expend the necessary ingredients) to produce the potion described on a Circle 1 (Apprentice-level) scroll or craft recipe. More specifically, you will spend 30 minutes at the location of your Laboratory, then take the “Laboratory” Structure tag—along with the scroll/recipe and any herbs or other materials you are expending to make your potion—to Logistics, where you will turn in the herbs/materials and be given the resulting potion item card. You don’t need to have any other skills (beyond LORE: ALCHEMY) related to the potion you are creating, no matter how esoteric it might be. A character may only drink 3 Stable Alchemy “Heal” or “Restore Mana” doses per rest (note that a “dose” is usually 1/5 of a full potion tag).","usage":"You may spend 30 minutes at a Laboratory role-playing crafting a potion from an Alchemy scroll of 1st Circle or lower you’re attuned to (or an attuned craft recipe), then take your building tag and ingredients to Logistics.","note":"to consume a potion, characters must either drink an actual liquid you have prepared… or pantomime drinking from a prop bottle. If pantomimed, drinking the potion takes 3 seconds; if physically drinking a prepared liquid, they may finish faster. It is impossible to force-feed a potion to someone unless they are asleep, in Bleedout, or dead. A person (or corpse) needs an intact head and throat to ingest a potion. Unlike some crafted or magical items, you do not need to attune to a potion before drinking it."},{"category":"Crafting: Edible","name":"Stable Alchemy: Journeyman","cost":"6 CP","prerequisite":"Stable Alchemy: Apprentice","returnsWith":"—","call":"—","description":"You have progressed to Journeyman level as a practitioner of STABLE ALCHEMY. (See STABLE ALCHEMY: APPRENTICE for more details.) With this skill, you can spend 30 minutes role-playing the process of mixing materials in a Laboratory (and expend the necessary ingredients) to produce the potion described on a Circle 2 (Journeyman-level) Core Spell or scroll that you’re attuned to. Potions produced with STABLE ALCHEMY last indefinitely until they are used and generally contain 5 “doses.”","usage":"You may spend 30 minutes at a Laboratory role-playing crafting a potion from an Alchemy scroll of 2nd Circle or below that you’re attuned to (or an attuned craft recipe), then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Edible","name":"Stable Alchemy: Master","cost":"6 CP","prerequisite":"Stable Alchemy: Journeyman","returnsWith":"—","call":"—","description":"You have progressed to Master level as a practitioner of STABLE ALCHEMY. (See STABLE ALCHEMY: APPRENTICE for more details.) With this skill, you can spend 30 minutes role-playing the process of mixing materials in a Laboratory (and expend the necessary ingredients) to produce the potion described on a Circle 3 (Master-level) Core Spell or scroll that you’re attuned to. Potions produced with STABLE ALCHEMY last indefinitely until they are used and generally contain 5 “doses.”","usage":"You may spend 30 minutes at a Laboratory role-playing crafting a potion from an Alchemy scroll of 3rd Circle or below that you’re attuned to (or an attuned craft recipe), then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Edible","name":"Stable Alchemy: Grandmaster","cost":"6 CP","prerequisite":"Stable Alchemy: Master","returnsWith":"—","call":"—","description":"You have progressed to Grandmaster level as a practitioner of STABLE ALCHEMY. (See STABLE ALCHEMY: APPRENTICE for more details.) With this skill, you can spend 30 minutes role-playing the process of mixing materials in a Laboratory (and expend the necessary ingredients) to produce the potion described on a Circle 4 (Grandmaster-level) Core Spell or scroll that you’re attuned to. Potions produced with STABLE ALCHEMY last indefinitely until they are used and generally contain 5 “doses.”","usage":"You may spend 30 minutes at a Laboratory role-playing crafting a potion from an Alchemy scroll of 4th Circle or below that you’re attuned to (or an attuned craft recipe), then take your building tag and ingredients to Logistics. 192 CRAFTING —","note":""},{"category":"Crafting: Other","name":"Other Tailoring: Apprentice","cost":"6 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You are beginning to develop the art of working with fabric and leather, learning how to craft durable pieces that can flow and move as their wearers’ bodies do—and can, in the case of light armor, actually provide meaningful protection in a fight. If you expend the necessary materials, you may spend 30 minutes role-playing at a Work Table to produce any Tailoring Craft Item that has a total skill level of 1 from the table below, or from any Tailoring craft recipes you are attuned to. More specifically, you will spend 30 minutes at the location of your Craft Table, then take the “Craft Table” Structure tag—along with any tagged materials you are expending to make your clothing—to Logistics, where you will turn in the materials and be given the resulting clothing item card. You don’t need to have any other skills (such as LORE or MAGIC) related to the item you are creating, no matter how esoteric it might be. You are also considered to have “LORE: TAILORING,” though you cannot teach it as a LORE.","usage":"You may spend 30 minutes at a Worktable role-playing crafting an item from the Tailoring chart or a craft recipe with a total Skill Level of 1, then take your building tag and ingredients to Logistics.","note":"it is impossible to wear (and to benefit from) more than 1 “Armor” item at once. Note—some crafted items and magical items do not work immediately when you first get them; you must hold them for 30 minutes to let them attune to you. See Attunement in Chapter 5 for more details."},{"category":"Crafting: Other","name":"Tailoring: Journeyman","cost":"6 CP","prerequisite":"Tailoring: Apprentice","returnsWith":"—","call":"—","description":"You have progressed to Journeyman level as a tailor. If you expend the necessary materials, you may spend 30 minutes role-playing at a Work Table to produce any Tailoring Craft Item that has total skill level of 2 or less—or you can add Additional Properties (from the table below) to enhance an existing Tailoring Craft Item, up to a maximum total skill level of 2.","usage":"You may spend 30 minutes at a Worktable role-playing crafting an item from the Tailoring chart or a craft recipe with a total Skill Level of 2, then take your building tag and ingredients to Logistics.","note":"it is impossible to wear (and to benefit from) more than 1 “Armor” item at once."},{"category":"Crafting: Other","name":"Tailoring: Master","cost":"6 CP","prerequisite":"Tailoring: Journeyman","returnsWith":"—","call":"—","description":"You have progressed to Master level as a tailor. If you expend the necessary materials, you may spend 30 minutes role-playing at a Work Table to produce any Tailoring Craft Item that has total skill level of 3 or less—or you can add Additional Properties (from the table below) to enhance an existing Tailoring Craft Item, up to a maximum total skill level of 3.","usage":"You may spend 30 minutes at a Worktable role-playing crafting an item from the Tailoring chart or a craft recipe with a total Skill Level of 3, then take your building tag and ingredients to Logistics.","note":"it is impossible to wear (and to benefit from) more than 1 “Armor” item at once."},{"category":"Crafting: Other","name":"Tailoring: Grandmaster","cost":"6 CP","prerequisite":"Tailoring: Master","returnsWith":"—","call":"—","description":"You have progressed to Grandmaster level as a tailor. If you expend the necessary materials, you may spend 30 minutes role-playing at a Work Table to produce any Tailoring Craft Item that has total skill level of 4 or less—or you can add Additional Properties (from the table below) to enhance an existing Tailoring Craft Item, up to a maximum total skill level of 4.","usage":"You may spend 30 minutes at a Worktable role-playing crafting an item from the Tailoring chart or a craft recipe with a total Skill Level of 4, then take your building tag and ingredients to Logistics.","note":"it is impossible to wear (and to benefit from) more than 1 “Armor” item at once."},{"category":"Crafting: Other","name":"Fletching: Apprentice","cost":"6 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have not only learned how to make true-flying arrows—you have also learned how to infuse powerful magical charms into the quivers that hold those arrows, granting certain powers to any arrows that are drawn from them. If you expend the necessary materials, you may spend 30 minutes role-playing at a Work Table to produce any Fletching Craft Item that has a total skill level of 1 from the table below, or from any Fletching craft recipes you are attuned to. More specifically, you will spend 30 minutes at the location of your Work Table, then take the “Work Table” Structure tag—along with any tagged materials you are expending to make your arrows—to Logistics, where you will turn in the materials and be given the resulting “quiver” item card. You don’t need to have any other skills (such as LORE or MAGIC) related to the item you are creating, no matter how esoteric it might be. You are also considered to have “LORE: FLETCHING,” though you cannot teach it as a LORE.","usage":"You may spend 30 minutes at a Worktable role-playing crafting an item from the Fletching chart or a craft recipe with a total Skill Level of 1, then take your building tag and ingredients to Logistics.","note":"some crafted items and magical items do not work immediately when you first get them; you must hold them for 30 minutes to let them attune to you. See Attunement in Chapter 5 for more details."},{"category":"Crafting: Other","name":"Fletching: Journeyman","cost":"6 CP","prerequisite":"Fletching: Apprentice","returnsWith":"—","call":"—","description":"You have progressed to Journeyman level as a fletcher (crafter of arrows). If you expend the necessary materials, you may spend 30 minutes role-playing at a Work Table to produce any Fletching Craft Item that has total skill level of 2 or less—or you can add Additional Properties (from the table below) to enhance an existing Fletching Craft Item, up to a maximum total skill level of 2.","usage":"You may spend 30 minutes at a Worktable role-playing crafting an item from the Fletching chart or a craft recipe with a total Skill Level of 2, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Other","name":"Fletching: Master","cost":"6 CP","prerequisite":"Fletching: Journeyman","returnsWith":"—","call":"—","description":"You have progressed to Master level as a fletcher (crafter of arrows). If you expend the necessary materials, you may spend 30 minutes role-playing at a Work Table to produce any Fletching Craft Item that has total skill level of 3 or less—or you can add Additional Properties (from the table below) to enhance an existing Fletching Craft Item, up to a maximum total skill level of 3.","usage":"You may spend 30 minutes at a Worktable role-playing crafting an item from the Fletching chart or a craft recipe with a total Skill Level of 3, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Other","name":"Fletching: Grandmaster","cost":"6 CP","prerequisite":"Fletching: Master","returnsWith":"—","call":"—","description":"You have progressed to Grandmaster level as a fletcher (crafter of arrows). If you expend the necessary materials, you may spend 30 minutes role-playing at a Work Table to produce any Fletching Craft Item that has total skill level of 4 or less—or you can add Additional Properties (from the table below) to enhance an existing Fletching Craft Item, up to a maximum total skill level of 4.","usage":"You may spend 30 minutes at a Worktable role-playing crafting an item from the Fletching chart or a craft recipe with a total Skill Level of 4, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Other","name":"Engineering: Apprentice","cost":"6 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have begun to master the most literally “foundational” of all the crafting skills: the ability to plan and then actually perform the work needed to construct large-scale structures. Without your talents, your town would not be able to get very much done. If you expend the necessary materials, you may spend 30 minutes role-playing in an area of town to produce an Engineering Craft Structure from the table below, or from an Engineering craft recipe you are attuned to, with a total Skill Level of 1. That structure will remain usable for 4 years before it must be refurbished (that is, essentially rebuilt). More specifically, you will spend 30 minutes at the appropriate location, then take any tagged materials needed to build the structure to Logistics, where you will be given the resulting, blue “Structure” card. You don’t need any other skills (such as LORE or MAGIC) related to the item you are creating, no matter how esoteric it might be. You are also considered to have “LORE: ENGINEERING,” though you cannot teach it as a LORE.","usage":"You may spend 30 minutes at a location role-playing crafting an item from the Engineering chart or a craft recipe with a total Skill Level of 1, then take your ingredients to Logistics.","note":"When you first build any structure other than a ship, choose an unoccupied location for it on the Twin Mask campsite. You must provide some kind of physical representation of that structure. At the beginning of every subsequent game, you must choose a place for that structure to occupy, on a “first-come-first-served” basis. Once placed, your structure cannot be moved for the duration of the game. Structures cannot be stolen. Also, unlike other crafted items, you do not need to attune to structures before using them."},{"category":"Crafting: Other","name":"Engineering: Journeyman","cost":"6 CP","prerequisite":"Engineering: Apprentice","returnsWith":"—","call":"—","description":"You have progressed to Journeyman level as an engineer. If you expend the necessary materials, you may spend 30 minutes role-playing in an area of town to produce an Engineering Craft Structure from the table below, or from an Engineering craft recipe you are attuned to, with a Skill Level of 2. For more details about structures, see the ENGINEERING: APPRENTICE skill.","usage":"You may spend 30 minutes at a location role-playing crafting an item from the Engineering chart or a craft recipe with a total Skill Level of 2, then take your ingredients to Logistics.","note":""},{"category":"Crafting: Other","name":"Engineering: Master","cost":"6 CP","prerequisite":"Engineering: Journeyman","returnsWith":"—","call":"—","description":"You have progressed to Master level as an engineer. If you expend the necessary materials, you may spend 30 minutes role-playing in an area of town to produce an Engineering Craft Structure from the table below, or from an Engineering craft recipe you are attuned to, with a Skill Level of 3. For more details about structures, see the ENGINEERING: APPRENTICE skill.","usage":"You may spend 30 minutes at a location role-playing crafting an item from the Engineering chart or a craft recipe with a total Skill Level of 3, then take your ingredients to Logistics.","note":""},{"category":"Crafting: Other","name":"Engineering: Grandmaster","cost":"6 CP","prerequisite":"Engineering: Master","returnsWith":"—","call":"—","description":"You have progressed to Journeyman level as an engineer. If you expend the necessary materials, you may spend 30 minutes role-playing in an area of town to produce an Engineering Craft Structure from the table below, or from an Engineering craft recipe you are attuned to, with a Skill Level of 4. For more details about structures, see the ENGINEERING: APPRENTICE skill.","usage":"You may spend 30 minutes at a location role-playing crafting an item from the Engineering chart or a craft recipe with a total Skill Level of 4, then take your ingredients to Logistics.","note":""},{"category":"Crafting: Other","name":"Reconstruct","cost":"1 CP","prerequisite":"Any Crafting Skill: Apprentice","returnsWith":"—","call":"—","description":"Whether mending a tattered jacket, reforging a blunted sword, or dry-docking a leaky ship, you have learned how to refurbish something that has fallen into disrepair and make it new again. With this skill, you can take an expired crafted item tag and use it as a material when you create the same item tag again. The expired tag replaces a number of other materials equal to the item’s rank, of your choosing. For instance, a Master-level sword (made with the third rank of WEAPONSMITHING) with the “Silver” and “Crushing” properties could be remade with three fewer materials: perhaps two fewer Silver and one fewer Demon Blood, or without three particularly hard-to-find herbs. The newly created item must have all of the exact same properties as the expired item. An item with properties not in the current rulebook cannot be remade this way, nor can consumable items such as whetstones, potions, or cooked dishes. (Note: ENGINEERING items that are built upon other crafted structures do consider the initial item as an ingredient, so for example, you can count “Ship” as one crafting material for purposes of this skill toward refurbishing a “Warship.”)","usage":"You may remake a crafting item with the exact same, rulebook-legal properties listed on the original tag with one fewer listed ingredient of your choice per rank of the original item.","note":""},{"category":"Crafting: Other","name":"Inventor","cost":"2 CP","prerequisite":"Any Crafting Skill: Grandmaster, Research","returnsWith":"—","call":"—","description":"You are more than a master of your craft: with your long experience, you have also begun to see opportunities that nobody else has considered. Designing never-before-seen objects takes both creativity and practicality, and you have more than enough of both. With this skill, you have the ability to propose and do research on entirely new craft recipes.","usage":"You may pitch and invent new craft recipes using the rules for Researching New Craft Items in Chapter 4. 202 RESTRICTED HUMAN SKILLS Note that these skills do not require training… as long as you spend 30 minutes during game, role-playing the process of teaching them to yourself.","note":""},{"category":"Restricted: Human","name":"Unburdened","cost":"3 CP","prerequisite":"Must be Human","returnsWith":"—","call":"—","description":"As a human, you have a shorter memory than people of longer-lived races do, and you place greater emphasis on pushing to achieve what you can in the short term. This means that, as a Returned, your spirit is less weighed down by death and by your misdeeds—you find it easy to forgive yourself and to justify your actions. Taking this skill reduces your character’s “Corruption score” by 1. (See the CORRUPTED background flaw for more details on corruption as a game mechanic.)","usage":"Your Corruption decreases by 1.","note":"this skill can only ever be taken once."},{"category":"Restricted: Human","name":"Good Enough","cost":"4 CP","prerequisite":"Must be Human","returnsWith":"—","call":"—","description":"As a human, your sense of time is much narrower than that of other races, and you are therefore much more willing to put up with things that are merely “good enough” rather than perfect. If you have this skill, you may subtract 5 minutes (to a minimum of 10 minutes) from the time required to use any of the following skills: BLACKSMITHING, WEAPONSMITHING, ARMORSMITHING, SHIELDSMITHING, LOCKSMITHING, ENCHANTING, SCROLL SCRIBING, ARTIFICING, STABLE ALCHEMY, TAILORING, FLETCHING, or ENGINEERING. (That is, all crafting skills except for COOKING.)","usage":"You may reduce the crafting time of non-COOKING crafting skills by 5 minutes.","note":""},{"category":"Restricted: Human","name":"Pillar of the Community","cost":"2 CP","prerequisite":"Must be Human","returnsWith":"—","call":"—","description":"As a human, you have inherited a social drive that pushes you to think of culture as something that must be actively built and maintained rather than merely inherited or taken for granted. In order to use this skill, you must have a recognized, official position in the government or maintenance of Solace. The qualifying positions include (but are not limited to) Governor, Lieutenant Governor, Ambassador, Executioner, Herald, Town Cryer, and member of the Guard. Other official positions may also grant access to this skill, as specified when you receive that position. (Feel free to ask a Staff member for clarification.) At some point during each Twin Mask game session, you may report to Logistics to gain either 1 Academic Influence, 1 Economic Influence, 1 Political Influence, 1 Underworld Influence, or 1 Military Influence.","usage":"When you collect your Check-In Resources, receive 1 Influence card of your choice.","note":"positions of authority in independent guilds or organizations do not qualify as a sufficient for the use of this skill."},{"category":"Restricted: Human","name":"Force of Will","cost":"4 CP","prerequisite":"Must be Human","returnsWith":"Rest","call":"“Willpower”","description":"Humans are often, at a fundamental level, used to having the advantage of numbers. Extending beyond military contexts into social and emotional ones, it is deeply comforting and meaningful for a human to have the support of others. With backup, a human can resist the most terrifying things. This skill effectively grants you a more efficient version of the WILLPOWER skill, but it can only be used if you are close to—that is, within arm’s reach of—multiple other allies.","usage":"You may call “Willpower” if you are within arm’s reach of at least two other allies.","note":""},{"category":"Restricted: Human","name":"Pursuit of Knowledge","cost":"4 CP","prerequisite":"Must be Human","returnsWith":"—","call":"—","description":"Curiosity is one of the hallmarks of various human cultures: the wide world of Adelrune is so full of fascinating options and ideas that it can often seem very tempting indeed to learn as much as you can. With this skill, you may essentially acquire 3 different LORE or RESTRICTED LORE skills, covering different topics, for the price of 1.","usage":"You may purchase this skill, then write “0” for the CP cost of the next 3 LORE or RESTRICTED LORE skills that you learn. RESTRICTED EFFENDAL SKILLS Note that these skills do not require training… as long as you spend 30 minutes during game, role-playing the process of teaching them to yourself.","note":""},{"category":"Restricted: Effendal","name":"Effendal Senses","cost":"2 CP","prerequisite":"Must be Effendal","returnsWith":"—","call":"“Effendal Senses”","description":"As an Effendal, your sight, hearing, touch, taste, and smell are much keener than a human’s, particularly when you are focusing intently on the natural world. Along with the opportunity for some entertaining role-playing, this skill enhances your ability to pursue creatures and people when using the HUNTING skill to follow tracks. When you are using that function of HUNTING, you may also call “Effendal senses” to the Twin Mask Staff member who is attending your efforts, and you will receive more information than you otherwise would. You can track with no light source, you can tell the relative weights of anyone you are tracking, you can determine their speed with more accuracy, and so on. EFFENDAL SENSES also reduces the time needed to utilize the DETECT DISGUISE skill.","usage":"You may call “Bid: Effendal Senses” to a Twin Mask Story staff member to potentially gain additional information.","note":"in addition to this standard use of the EFFENDAL SENSES skill, you should be on the lookout for situations that may come up during “mods” away from the main space of the Twin Mask game. If you mention that you have the EFFENDAL SENSES skill during such an event, a Staff member may occasionally have the option to give you additional information based on your perceptions."},{"category":"Restricted: Effendal","name":"Effendal Agility","cost":"5 CP","prerequisite":"Must be Effendal","returnsWith":"Rest","call":"“Dodge”","description":"(or “Bid: Effendal Agility”) As an Effendal, you are light on your feet and can perform acrobatic maneuvers that would be impossible for people of any other race. The primary function of this skill is to function just like DODGE; you can use it to call “Dodge” and avoid any one attack that could be evaded by that defense. Your agility also has multiple other functions, though. It enhances your use of the LEAP skill: whenever you become Airborne with that skill, you may take 4 total steps to represent the distance of your jump, rather than just 3. When you are facing challenges that require agility and there is a Story Staff member present, you can call “Bid: Effendal Agility” to see if there is some way that your acrobatics or flexibility would be helpful in the situation. And, of course, this skill can simply serve as a catalyst for good role-playing.","usage":"You may call “Dodge” once to avoid anything that can be physically avoided; you take 4 steps in any one direction when you use LEAP; and you can call “Bid: Effendal Agility” to a Twin Mask Story staff member.","note":"in addition to this standard use of the EFFENDAL AGILITY skill, you should be on the lookout for opportunities that may come up during “mods” away from the main space of the Twin Mask game. If you run into a situation that might call for impressive agility, you should mention that you have the EFFENDAL AGILITY skill to the attending Staff member, and they will sometimes be able to give you additional options based on that fact."},{"category":"Restricted: Effendal","name":"Patience","cost":"4 CP","prerequisite":"Must be Effendal","returnsWith":"—","call":"—","description":"As an Effendal, you have extra time in which to focus on any crafts that you decide to learn. With this skill, you may choose to double the amount of time required to use any of the following skills: BLACKSMITHING, WEAPONSMITHING, ARMORSMITHING, SHIELDSMITHING, LOCKSMITHING, ENCHANTING, SCROLL SCRIBING, ARTIFICING, COOKING, STABLE ALCHEMY, TAILORING, FLETCHING, or ENGINEERING. (That is, all Crafting skills.) If you do, then you may use the appropriate skill as though you were 1 level more accomplished than you actually are, up to an effective level of Grandmaster. You must be of at least Apprentice level in a crafting skill in order to use PATIENCE to enhance that skill, and PATIENCE has no effect if you are already of Grandmaster level in the chosen skill.","usage":"You may multiply the base time required to perform a crafting skill by 2, then perform that crafting skill as though you were 1 rank higher.","note":"when this skill is combined with BLACKSMITHING items (or any effects that reduce the time required to use various crafting skills), the crafting time is first doubled by PATIENCE, then reduced by the amount that the time-reduction effect would normally save. (Often, this means that crafting will take 45 minutes, as the 30-minute base time is doubled to 1 hour, then reduced by 15 minutes.)"},{"category":"Restricted: Effendal","name":"Weapon Master","cost":"6 CP","prerequisite":"Must be Effendal","returnsWith":"—","call":"—","description":"As an Effendal, you have spent some of your long life practicing the ability to wield various weapons, with the result that your breadth of proficiency is well beyond what most humans ever achieve. This skill gives you the ability to use any weapon, although it does not grant any skill in two-weapon fighting. (That is, WEAPON MASTER is the equivalent of the following skills: SHORT WEAPONS, ONE-HANDED WEAPONS, TWO-HANDED WEAPONS, OVERSIZED WEAPON USE, THROWN WEAPONS, and BOW AND ARROW.)","usage":"You may function as though you had the skills SHORT WEAPONS, ONE-HANDED WEAPONS, TWO-HANDED WEAPONS, OVERSIZED WEAPON USE, THROWN WEAPONS, and BOW AND ARROW on your character sheet.","note":""},{"category":"Restricted: Effendal","name":"Scion of the Land","cost":"4 CP","prerequisite":"Must be Effendal","returnsWith":"Sunrise and Sunset","call":"“My Body Merges with the Tree”","description":"As an Effendal, you are the distant descendant of powerful, magical entities who have long been connected with the magical nature of Adelrune. By teaching yourself to accept and embrace your supernatural affinity for the living things of this world, you can quietly slip away from danger by stepping into the heart of a tree, protected and out of phase with the world outside, though retaining the ability to perceive it. It takes 30 seconds to initiate the merging, and you can stay in this strange and quiet state for up to 30 minutes before you step back out and re-engage with Adelrune. While you are merged with the tree, you are Out of Character but can still see and hear everything around you.","usage":"You may touch a tree for 30 uninterrupted seconds and call, “My Body Merges with the Tree.” You then place your hand on your head to signify that you are Out-of-Character and may remain this way for up to 30 minutes if you never move farther than arm’s reach from that tree. You see and hear everything as your character normally would during this time. You must call, “My Body Emerges from the Tree” at the end of the effect and immediately go back In-Character.","note":"A suitable tree for the purposes of this skill must be living, rooted, and at least six feet tall. You do not need to have your hand on the tree for the entire time, but you must remain within arm’s reach of the tree for as long as you remain merged, or the skill ends. 206 RESTRICTED FAE-BLOODED SKILLS Note that these skills do not require training… as long as you spend 30 minutes during game, role-playing the process of teaching them to yourself."},{"category":"Restricted: Fae-Blooded","name":"Slippery","cost":"7 CP","prerequisite":"Must be Fae-Blooded","returnsWith":"—","call":"“Escape”","description":"As a descendant of the Fae, you have inherited a facility for being elusive, such that it is near-impossible to capture or bind you. Whenever you use this skill, you call “escape” and instantly pull yourself free from any bonds or snares that were trapping your character (including Bind effects caused by, for instance, The Binding Spell). This lets you “Escape” from any character’s grip, even if they are using a Strength effect to hold you. You may use SLIPPERY as often as you wish.","usage":"You may call “Escape” as often as you wish, as per the ESCAPE skill.","note":""},{"category":"Restricted: Fae-Blooded","name":"Magic-Resistant","cost":"5 CP","prerequisite":"Must be Fae-Blooded","returnsWith":"Rest","call":"“Resist”","description":"As a descendant of the Fae, you have a natural affinity for the flow of magic in the world around you; by “leaning in” to that flow, you can cause any magical effect to slip past you with no effect. When you would be affected by any non-weapon attack, you may instead use this skill and call “Resist” to avoid suffering any effects from that attack.","usage":"You may call “Resist” against any non-weapon attack (any effect that could be countered by Willpower) or against any packet-delivered attack.","note":"remember that effects with the “Greater” modifier cannot be prevented in this way."},{"category":"Restricted: Fae-Blooded","name":"Charmed Misstep","cost":"3 CP","prerequisite":"Must be Fae-Blooded","returnsWith":"Rest","call":"“By My Gesture, Attract”","description":"or “By My Gesture, Repel” As a descendant of the Fae, you have inherited the ability to play upon the unconscious elements of people’s minds, using magical gestures to cause people to either stumble toward you or be pushed awkwardly away. When you use this skill, you make a “come hither” gesture at someone and call “By My Gesture, Attract,” which forces them to take an Attract effect, or a dismissive, forceful hand gesture and call “By My Gesture, Repel,” which forces them to take a Repel effect.","usage":"You may call “By My Gesture, Attract” or “By My Gesture, Repel.”","note":""},{"category":"Restricted: Fae-Blooded","name":"Glamour","cost":"7 CP","prerequisite":"Must be Fae-Blooded","returnsWith":"—","call":"—","description":"Like the magical tricksters from whom you descend, the magic of your bloodline gives you the ability to significantly change how you appear to others. Mechanically, this skill functions exactly like having both the DISGUISE and MASTER DISGUISE skills, with all the same limitations to your character.","usage":"You may disguise yourself as if you had the DISGUISE and MASTER DISGUISE skills. See those skills for more detail on the function of GLAMOUR.","note":""},{"category":"Restricted: Fae-Blooded","name":"Dominating Gesture","cost":"8 CP","prerequisite":"Must be Fae-Blooded","returnsWith":"Rest","call":"“By My Gesture, Lesser Dominate”","description":"As a descendant of the Fae, you have inherited the ability to influence the minds and bodies of those around you by manipulating the strands of reality. When you use this skill, you point at someone and call “by my gesture, lesser Dominate,” which means that the affected creature or person must do your bidding for 3 minutes. Keep in mind that, since this is a “Lesser” effect, it will not work on any Returned or other “major” characters.","usage":"You may call “By My Gesture: Lesser Dominate.” RESTRICTED CELESTIAL-BLOODED SKILLS Note that these skills do not require training… as long as you spend 30 minutes during game, role-playing the process of teaching them to yourself. Also, remember that Celestial-blooded characters have access to the Supernatural Strength skill.","note":""},{"category":"Restricted: Celestial-Blooded","name":"Rallying Cry","cost":"3 CP","prerequisite":"Must be Celestial-Blooded","returnsWith":"Rest","call":"“By My Voice, Remove Weakness”","description":"As a person with Celestial blood, you have inherited the ability to channel positive emotions through your voice, inspiring and invigorating those around you. When you use this skill, you call “by my voice, remove Weakness,” thereby producing a Remove Weakness effect on everyone within earshot.","usage":"You may call “By My Voice: Remove Weakness.”","note":""},{"category":"Restricted: Celestial-Blooded","name":"Healing Touch","cost":"6 CP","prerequisite":"Must be Celestial-Blooded","returnsWith":"Rest","call":"“Heal 10”","description":"As a person with Celestial blood, you have inherited the ability to channel positive energy through your hands, closing even the most grievous wounds with your touch. You may touch a person or creature and call “heal 10” once.","usage":"You may touch a character and call “Heal 10.”","note":""},{"category":"Restricted: Celestial-Blooded","name":"Resurrection","cost":"10 CP","prerequisite":"Must be Celestial-Blooded","returnsWith":"Rest","call":"“Life”","description":"As a person with Celestial blood, you have inherited the ability to reach after a person’s departing spirit and use a powerful burst of energy to pull them back into the world. To use this skill, you must touch a dead body, role-play a moment of painful exertion, and call “Life,” which returns your subject to their full Health Point total (although they must still endure a 3-minute Weakness count because of the shock of resurrection). Using this skill reduces your maximum Health Point total by 2 for the next 3 days; this reduction in maximum HP total cannot be healed through any normal means, and if you reduce your maximum HP total to 0 in this way, you immediately die.","usage":"You may touch a dead character and call “Life.” Your maximum HP decreases by 2 for the remainder of the current Twin Mask game.","note":""},{"category":"Restricted: Celestial-Blooded","name":"Rise Toward the Light","cost":"5 CP","prerequisite":"Must be Celestial-Blooded","returnsWith":"—","call":"“Bestow Light”","description":"As a person with Celestial blood, you can feel (even if only slightly) the call of the Golden Realms, where the stern Celestials connected to your heritage sing in constant radiance. With this skill, you can focus on that connection and temporarily let the light of those Realms flow through you, enabling you to smite your enemies with furious righteousness. Once per Twin Mask game, you may give a 3-second verbal proclamation about Celestial light and justice. Then, you may call “bestow light” on yourself… which begins a 3-minute period during which all your weapon attacks function as GREAT STRIKES. Additionally, all weapon attacks you make will be infused with the “light” element, enabling you to call “light” for each such attack in addition to damage. During this period, you should role-play a feeling of glorious ascendancy.","usage":"Once per game, you may loudly and verbally proclaim a 3-second phrase about light or righteousness and call “Bestow Light.” Your weapon attacks all function as GREAT STRIKES, and can add the “Light” element, for 3 minutes. 209 RESTRICTED DEMON-BLOODED SKILLS Note that these skills do not require training… as long as you spend 30 minutes during game, role-playing the process of teaching them to yourself. Also, remember that Demon-blooded characters have access to the Supernatural Strength skill.","note":""},{"category":"Restricted: Demon-Blooded","name":"Draining Touch","cost":"5 CP","prerequisite":"Must be Demon-Blooded","returnsWith":"—","call":"“Drain 1”","description":"As a person with Demon blood, you have inherited an affinity for draining the energy of those around you in subtle but persistent ways. To use this skill, you must touch a person or creature and call “Drain 1.” Unless this effect is negated, they lose 1 Health Point (regardless of armor) and you regain 1 Health Point. You can use this skill as often as you wish, but you must wait 30 seconds in between uses, and you can even use it while you are in Bleedout or suffering from a Weakness effect. This is an exception to the normal rule that you cannot use any skills while in Bleedout or suffering from Weakness.","usage":"You may touch a character and call “Drain 1” once every 30 seconds, even in Bleedout or Weakness.","note":""},{"category":"Restricted: Demon-Blooded","name":"Abhorrent Sign","cost":"3 CP","prerequisite":"Must be Demon-Blooded","returnsWith":"Rest","call":"“By My Gesture, Stun by Pain”","description":"As a person with Demon blood, you have inherited the ability to trace a hellish sigil in the air between you and an opponent, thereby rending their spirit and causing immense pain. To use this skill, you must gesture at your target and call “by my gesture, Stun by pain,” causing them to take a “Stun” effect and reel in agony for 3 seconds.","usage":"You may point at a character and call “By My Gesture: Stun by Pain”","note":""},{"category":"Restricted: Demon-Blooded","name":"Captivating Gaze","cost":"8 CP","prerequisite":"Must be Demon-Blooded","returnsWith":"Rest","call":"“By My Gaze, Lesser Dominate”","description":"As a person with Demon blood, you have inherited the ability to bend weak-willed people or creatures to your will, whether through raw domination or allure. To use this skill, you call “by my gaze, lesser Dominate,” producing a 3-minute Dominate effect on the creature or person. Keep in mind that, since this is a “lesser” effect, it will not work on any Returned or other “major” characters.","usage":"You may call “By My Gaze, Lesser Dominate.”","note":""},{"category":"Restricted: Demon-Blooded","name":"Sink Into Darkness","cost":"5 CP","prerequisite":"Must be Demon-Blooded","returnsWith":"—","call":"“Bestow Darkness”","description":"As a person with Demonic blood, you can feel (even if only slightly) the call of the Abyss, where the scheming and ravening demons connected to your heritage weave plots of deepest darkness. With this skill, you can focus on that connection and temporarily let the shadows of the Abyss flow through you, enabling you to cut down your enemies with terrifying, brutal effectiveness. Once per Twin Mask game, you may give a 3-second verbal proclamation about Demonic darkness and malice. Then, you may call “bestow darkness” on yourself… which begins a 3-minute period during which all of your weapon attacks will function as GREAT STRIKES. Additionally, all weapon attacks you make will be infused with the “darkness” element, enabling you to call “darkness” for each attack in addition to damage. During this period, you should role-play a feeling of malicious destructiveness.","usage":"Once per game, you may loudly and verbally proclaim a 3-second phrase about darkness or malice and call “Bestow Darkness.” Your weapon attacks all function as GREAT STRIKES, and can add the “Darkness” element, for 3 minutes. RESTRICTED DRAGON-BLOODED SKILLS Note that these skills do not require training… as long as you spend 30 minutes during game, role-playing the process of teaching them to yourself. Also, note that Dragon-blooded characters have access to the Supernatural Strength skill.","note":""},{"category":"Restricted: Dragon-Blooded","name":"Natural Armor","cost":"7 CP","prerequisite":"Must be Dragon-Blooded","returnsWith":"Rest","call":"—","description":"As a person with Draconic blood, you have inherited the scaled skin of your forebears, with the result that you are much more resistant to damage than people of other races. You have 5 points of Armor Value that stack with all other forms of armor. Just like normal armor, this NATURAL ARMOR is automatically restored to its full Armor Value whenever you Rest (spend 30 minutes with no combat or strenuous activity), and is also restored by FIELD REPAIR or other effects that restore your full Armor Value.","usage":"You have 5 points of armor that stack with all other armor.","note":"NATURAL ARMOR is not considered “armor” for purposes of skill restrictions or effects. That is, you can use it in tandem with skills that have an armor restriction, such as ARMORED FOREARMS, STEALTH ATTACK, and LEAP."},{"category":"Restricted: Dragon-Blooded","name":"Iron Stomach","cost":"4 CP","prerequisite":"Must be Dragon-Blooded","returnsWith":"Rest","call":"“Resist”","description":"As a person with Draconic blood, you have inherited the incredibly hardy and versatile digestive system of your draconic forebears, such that you can eat foods that weaker people would be unable to stomach, in addition to being able to handle more potions than others can. When you eat or otherwise ingest something (such as food, potions, herbs, poisons, etc.) and it turns out that the substance was harmful in any way, you may choose to call “Resist” and ignore those ill effects. This part of the IRON STOMACH skill can only be used once before you must rest and let it recover. Additionally, IRON STOMACH gives you the ability to eat expired food items, which are otherwise completely useless. This second part of the skill can be used as often as you wish. Thirdly, you may drink and benefit from 4 Stable Alchemy “Heal” or “Restore Mana” doses per rest, instead of the 3 that all other characters are limited to.","usage":"You may call “Resist” to one ingested effect, you may treat expired food tags as unexpired food tags, and you may drink 4 “Heal” or “Restore Mana” potion doses per rest.","note":"just because an expired food item is palatable and useful to you does not make it appetizing."},{"category":"Restricted: Dragon-Blooded","name":"Draconic Roar","cost":"4 CP","prerequisite":"Must be Dragon-Blooded","returnsWith":"Rest","call":"“By My Voice, Stun”","description":"As a person with Draconic blood, you have inherited the commanding presence and hardened vocal cords of your forebears; as a result, you can let out a roar that will temporarily knock everyone around you into a reeling, overwhelmed state. To use this skill, you must (loudly) call “by my voice, Stun,” which will make everyone within earshot incapable of using skills, attacking, or defending themselves for 3 seconds.","usage":"You may call “By My Voice: Stun.”","note":""},{"category":"Restricted: Dragon-Blooded","name":"Bones of the Earth","cost":"8 CP","prerequisite":"Must be Dragon-Blooded","returnsWith":"Rest","call":"“Resist”","description":"As a person with Draconic blood, you are surprisingly tough. It is not merely that your skin is scaled and hardened… it is also that you have a bone-deep connection to the resilience of Adelrune itself. With this skill, you have developed your ability to shrug off all kinds of attacks that might be lethal to others. Immediately after you are hit by an attack, you may call “Resist” to avoid suffering any effects from that attack.","usage":"You may call “Resist” to avoid any non-Greater effect.","note":"remember that effects with the “Greater” modifier cannot be prevented in this way. 212 SUPERNATURAL STRENGTH Note that this skill does not require training… as long as you spend 30 minutes during game, role-playing the process of teaching it to yourself."},{"category":"Supernatural Strength","name":"Supernatural Strength","cost":"10 CP","prerequisite":"Must be Celestial-Blooded, Demon-Blooded, or Dragon-Blooded","returnsWith":"—","call":"“Strength”","description":"As the scion of a race with the capability to manifest great physical strength, you can do things that mere humans or Effendal are absolutely incapable of. With this skill, you can produce Strength effects whenever you wish. See the “Other Effects” section of chapter 5 for specifics regarding the limits and possibilities of Strength effects. In addition to the “standard” uses of SUPERNATURAL STRENGTH, you should be on the lookout for creative opportunities to use your physical might: if you are near a Story Staff member, you can always propose an interesting use of your ability… and if that Staff member allows it, you can follow through on your idea in that particular instance. Similarly, opportunities for unusual Strength effects may come up during “mods” away from the main space of the Twin Mask game. If you mention that you have this skill during such an event, a Staff member may allow you to perform some truly impressive feats.","usage":"You may call “Strength” and describe the effect you are accomplishing. RESTRICTED NEWBORN DREAM SKILLS Note that these skills do not require training… as long as you spend 30 minutes during game, role-playing the process of teaching them to yourself.","note":""},{"category":"Restricted: Newborn Dream","name":"Grasp of the Waking","cost":"4 CP","prerequisite":"Must be a Newborn Dream","returnsWith":"—","call":"“Remove Sleep”","description":"You just woke up, yourself. Having sprung from the Dreaming, you have a natural ability to dispel the hold of sleep on living things with a touch, to instill them with a vibrant wakefulness that banishes drowsiness with the promise of a fresh day of action and heroics. Even if you are temporarily lost in sleep yourself, you can bring yourself back to the waking world, just as you did when you first sprang into existence. Once every 30 seconds, you may touch yourself or another person and dispel the Sleep condition. This is an exception to the normal rule that you cannot use any skills while asleep.","usage":"You may touch a character and call “Remove Sleep.” You may use this on yourself if you are under the influence of a Sleep effect. This ability may not be used more than once every 30 seconds.","note":""},{"category":"Restricted: Newborn Dream","name":"Method in Madness","cost":"4 CP","prerequisite":"Must be a Newborn Dream","returnsWith":"Rest","call":"Special","description":"As a creature of story, myth, and imagination, you are powerfully enmeshed with the idea of shared experience: after all, storytelling is the truest way to teach empathy. By maintaining contact with another person and delving into your “narrative nature” for long enough to share one of your vivid memories with them, you can gift them with some of your essence, allowing them to use your expertise and talent as though they were the protagonist of your story. The touched person may use one of your skills for 30 minutes as though they possessed it themselves. The process, though, is strangely unsettling and thrilling to you, as you temporarily give up a facet of yourself. For the same 30 minutes that the other person can use your skill, you will be deeply strange and alienated from your normal self in some way related to the memory you transferred, and you will be unable to use that same skill.","usage":"You may touch a willing character and role-play 30 seconds of describing a memory linked to one of your non-Bloodline skills that is immediately available for you to use (this skill cannot be currently recharging with Rest). You then call “Bestow [Skill Name]” to give the character use of that skill for the next 30 minutes. This counts as using the skill for purposes of “per rest,” “per sunrise/sunset,” or “per game” skills. You completely lose access to this skill, or one use of it (if it can be taken multiple times), for 30 minutes. You must roleplay some form of insanity for the next 30 minutes.","note":""},{"category":"Restricted: Newborn Dream","name":"Drawn to the Muse","cost":"3 CP","prerequisite":"Must be a Newborn Dream","returnsWith":"—","call":"—","description":"The Dreaming is a place where all the feelings, impressions, and arts of thinking creatures swirl into strange new configurations, unmoored from their original creators and given a strange kind of life. As a scion of that energy, you can respond more powerfully to artistic expression than almost anyone else, and you can draw deep inspiration from others’ efforts. Whenever you have the chance to experience music or poetry, or learn a new dance—via the SERENADE or DANCE LESSON skills—you gain double the benefits from that art.","usage":"When you are the target of the SERENADE or DANCE LESSON skill, you receive 2 uses of the bestowed skill per rest for the full game’s duration, instead of just 1.","note":""},{"category":"Restricted: Newborn Dream","name":"Infinite Possibility","cost":"4 CP","prerequisite":"Must be a Newborn Dream","returnsWith":"—","call":"“Bid Lore: [Subject]”","description":"Somebody must know the answer, right? And, if you think about it... that person might as well be you. Because you have sprung into existence “trailing clouds of glory” from the Dreaming—where all knowledge and ideas can swirl into new combinations—you have the ability to reach back into that chaotic well of information and hopefully draw out something useful. When you use this skill, you will be stunned for 30 seconds as your mind navigates the chaos of your birthplace, but then you will temporarily be able to draw upon knowledge relating to almost any subject at all, bidding a dizzying range of possible LORE. You may only use this skill once per game, and you cannot use it to use the RESEARCH skill: it is a burst of insight rather than lasting expertise.","usage":"Once per game, you may take a 30 second Stun effect, then call “Bid Lore: [Subject]” to ask a question using a LORE skill that you do not possess. You may NOT use this skill to access RESTRICTED LORES. If a Twin Mask Story Staff member is unsure whether a LORE is restricted or not, you must wait for an answer.","note":""},{"category":"Restricted: Newborn Dream","name":"Slumber Sight","cost":"6 CP","prerequisite":"Must be a Newborn Dream","returnsWith":"Rest","call":"“By My Gaze, Lesser Sleep”","description":"As a strange kind of link between Adelrune and the Dreaming, you have learned how to control and harness that connection. By letting your eyes glaze with power and emotion, you can make them appear like deep, still scrying pools, with the flickering dream-logic of sleep shining through them. Most people, if caught by that gaze, will immediately crumple into an enchanted Sleep.","usage":"You may call “By My Gaze, Lesser Sleep.” 215","note":""}],"spells":[{"category":"Alchemy","name":"Basic Arcane Pharmacology*","tier":"Apprentice","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"\"Heal 1\"","description":"As an alchemist, you know two things. One, that the line between magic and science is often a thin one. And two, when all else fails: improvise. If you have your tools and your wits, sometimes that is all you need. This type of alchemy as weak and incredibly unstable, but the dying rarely care about the technical aspects.\n\nThis spell requires great mental effort. You may cast this spell only up to 3 times every 30 minutes. Due to the extremely unstable nature of this aichemy this elixir becomes inert after 30 seconds.","note":"--Stable Alchemy Crafting Recipe-- Unstable Only\nSPECIAL NOTE:\nUnlike nearly all other spells, this spell costs 0 mana to cast.","recipe":"","source":"Spell Compendium"},{"category":"Alchemy","name":"Felicium (Impure)*","tier":"Apprentice","core":false,"delivery":"Elixir","casting":"Consumable","call":"Special","description":"This is a highly addictive form of Alchemy which can be combined into any edible substance including food and wine. (It can NOT however spike an already existing food or drink item.) This alchemy makes somehting more than just delicious... It makes EVERYTHING feel incredible. For 30 minutes, the world seems to make sense, wounds don't hurt, things the consumer touches feel fantastic, and joyous memories flood into their mind.\nWhen the 30 minutes end, they begin to feel withdrawal. Colors seem less vibrant, their body is wracked with pain, the world seems cruel, and memories of loss flood into their mind. For the next 30 minutes, an addict will do whatever it takes the make this pain go away. Common side effects include shakes, erratic behavior, and depression. Eventually, the only time an addict feels normal is when they partake in Felicium.\nNote: Highly Addictive. (It is up to the player consuming Felicium to determine how their character will react to the RP conditions, if at all. All conditions listed above are merely suggestions.)","note":"Crafting Only; makes 1 use only","recipe":"2 x Stimulant, 1 x Enhancement","source":"Spell Compendium"},{"category":"Alchemy","name":"Formaldehyde*","tier":"Apprentice","core":false,"delivery":"Elixir","casting":"As by Delivery","call":"Special","description":"This alchemy can be used to exend the expiration of an organ or limb preserved inside of the fluid by 6 month past the current date. At the end of this period of time, assuming the limb isn't past its expiration, the Formaldehyde may be replaced to continue preserving the limb or organ.","note":"Crafted Only.","recipe":"1x Rejuvenation, 1x Enchantment","source":"Spell Compendium"},{"category":"Alchemy","name":"Healing Draught 1","tier":"Apprentice","core":true,"delivery":"Elixir","casting":"Mixdrink","call":"Heal 2","description":"By unlocking the hidden properties within Adelrune’s materials, you can push a body to mend itself with amazing rapidity. This is the simplest version of a healing draught, often created by apprentice Alchemists to heal relatively minor wounds.","note":"Core","recipe":"1× Healing, 1× Rejuvenation","source":"Spell Compendium"},{"category":"Alchemy","name":"Lesser Elemental Paste","tier":"Apprentice","core":false,"delivery":"Weapon","casting":"Coat","call":"\"Imbue [Fire, Ice, Lightning, or Acid]\"","description":"By crushing and blending reagents that match an element you choose during casting, you create a thin paste that sizzles with that element's energy. By applying that paste to a weapon, you allow that weapon to strike one blow with that element, without damaging the weapon itself.\nwill Choose [Fire, Ice, Lightning, or Acid); the next attack with the weapon call that element along with its damage, which ends the Imbue effect. While this does not increase the numerical damage it deals, it may have special effects on anything weak against that particular element. Like all attacks, if the strike misses or is blocked (but not if it is stopped with a called defense such as \"Dodge\"), you retain this ability.","note":"STABLE ALCHEMY CRAFTING RECIPE- 1x Enchantment, 1× Entropic","recipe":"","source":"Spell Compendium"},{"category":"Alchemy","name":"Magic Draught 1","tier":"Apprentice","core":true,"delivery":"Elixir","casting":"Mixdrink","call":"“Restore 1 Mana","description":"The physical herbs and alchemical reagents found in Adelrune are linked to energies much larger than themselves, and by blending them properly, you can release a bit of that power, even to the point of aiding spellcasters in refocusing on the manipulation of magical energies. This is the simplest version of a mana-restoring draught, often created by apprentice Alchemists to prepare for days when they or others will have to exert their minds a bit more than normal.","note":"Core","recipe":"1× Enhancement, 1× Rejuvenation","source":"Spell Compendium"},{"category":"Alchemy","name":"Poison Slowing Draught","tier":"Apprentice","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"\"Slow Poison","description":"This Elixir slows how quickly a poison moves through a subject's body, adding 3 minutes to their poison count.\n\nNote: You may use this spell multiple times, to continue to delay a poison count.","note":"","recipe":"Sedation, Rejuvenation","source":"Spell Compendium"},{"category":"Alchemy","name":"Remove Weakness","tier":"Apprentice","core":true,"delivery":"Elixir","casting":"Mixdrink","call":"“Remove Weakness","description":"This potion, sometimes compared to smelling salts, invigorates and spurs to action whoever drinks it. Through the admixture of the magical essences of reagents associated with focused motivation, you can create a surge of activity in anyone whose energy has been depleted. It is excellent at removing hangovers or any other kind of temporary Weakness.","note":"Core","recipe":"2× Stimulant","source":"Spell Compendium"},{"category":"Alchemy","name":"Rook's Liquid Courage","tier":"Apprentice","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"Bestow 2 Health","description":"Originally created by the alchemist Rook Betancore, this potion suffuses the user with a rush of short-lived vitality and a feeling of (completely unwarranted) invincibility. Those who drink this concoction feel ready to take on anything and are prone to jumping headlong into danger.\nWhen you drink this potion, you are bestowed 2 Health for 3 minutes. As this is a bestow effect, it does not stack with other sources of bestowed Health or with itself. When you take HP damage, this health is removed first.","note":"---Stable Alchemy Crafting Recipe-- 1× Poison, 1× Rejuvenation\n\nPrior to 7.0 This used to be 0 poison heal 2 a delayed release healing spell which heals you for two health, 30 seconds after ingesting.","recipe":"1x poison, 1x rejuv","source":"Spell Compendium"},{"category":"Alchemy","name":"Sailors Tonic","tier":"Apprentice","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"\"Prevent Motion Sickness\"","description":"Originally created by the alchemist Esfir, and by using alchemical components that can suppress feelings of dizziness and bolster a person's sense of bodily orientation, this potion prevents all kinds of motion sickness for the next 3 hours\nThe potion can block dizziness and nausea corning from even the most vigorous motion, but it is not powerful enough to block any magical effects. As such, it cannot provide any mechanical benefit for either offense or defense.","note":"STABLE ALCHEMY CRAFTING RECIPE- 2× Sedative","recipe":"","source":"Spell Compendium"},{"category":"Alchemy","name":"Send Healing","tier":"Apprentice","core":false,"delivery":"Packet","casting":"Hurl","call":"Heal 1","description":"This spell consists of an alchemical balm that is designed to break upon impact delivering healing alchemy, healing 1 point of damage.","note":"Cannot be Crafted.","recipe":"","source":"Spell Compendium"},{"category":"Alchemy","name":"Stink Potion","tier":"Apprentice","core":false,"delivery":"Elixir","casting":"","call":"","description":"Repel","note":"","recipe":"","source":"Spell Compendium"},{"category":"Alchemy","name":"Vidrarun Lesser Metal Paste","tier":"Apprentice","core":false,"delivery":"Elixir","casting":"Coat","call":"Imbue \u003cMetal\u003e Strike","description":"This spell allows the caster to bestow a weapon temporarily breaking down and altering its physical composition to that of another metal (Gold, Silver, Iron.) This enchantment dissipates upon striking another object.","note":"","recipe":"1x entropic, 1x spiritual","source":"Spell Compendium"},{"category":"Alchemy","name":"Waking Potion","tier":"Apprentice","core":true,"delivery":"Elixir","casting":"Mixdrink","call":"“Remove Sleep","description":"Combining the inherent properties of bracing and vitalizing ingredients, this potion serves to wake anyone from magical or drugged slumber, bringing them back to full consciousness immediately. It also works to wake people from normal sleep.","note":"Core","recipe":"1× Enchantment, 1× Stimulant","source":"Spell Compendium"},{"category":"Alchemy","name":"Acid","tier":"Journeyman","core":true,"delivery":"Elixir","casting":"Mixdrink","call":"“Stealth 5 Acid\"","description":"Blended from a synergistic combination of powerfully caustic ingredients, this spell produces a powerful acid that could be used for various utilitarian purposes, but its small dose is probably best used as a stealthy attack: if you can convince anyone to drink it, they will suffer a major wound that bypasses most defenses and armor. Because of the acid’s reactive properties, it cannot be added to food or drink.","note":"Core","recipe":"3× Entropic","source":"Spell Compendium"},{"category":"Alchemy","name":"Antidote","tier":"Journeyman","core":true,"delivery":"Elixir","casting":"Mixdrink","call":"“Remove Poison","description":"Knowing the ways that poisonous reagents can interact with people’s bodies, you have the expertise needed to create a remedy that can neutralize them. This potion courses through the veins and tissues of whoever drinks it, scouring Poison from their body. It eliminates all common toxins, but certain exotic or unknown poisons might be beyond its power.","note":"Core","recipe":"1× Enhancement, 1× Entropy, 1× Stimulant","source":"Spell Compendium"},{"category":"Alchemy","name":"Corpse Dissolvent","tier":"Journeyman","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"Destroy Corpse","description":"This highly dangerous potion feeds off of dead flesh, and destroys any corpse at a rapid speed.","note":"","recipe":"Entropic, Stimulant, Poison","source":"Spell Compendium"},{"category":"Alchemy","name":"Enhanced Formaldehyde*","tier":"Journeyman","core":false,"delivery":"Elixir","casting":"As by Delivery","call":"Special","description":"This alchemy can be used to extend the expiration of an organ or limb preserved inside of the fluid by 1 year past the current date. At the end of this period of time, assuming the limb isn't past its expiration, the Formaldehyde may be replaced to continue preserving the limb or organ.","note":"Crafted Only","recipe":"1x rejuvenation, enchantment, enhancement","source":"Spell Compendium"},{"category":"Alchemy","name":"Finneus Locke's Lingering Life Elixir","tier":"Journeyman","core":false,"delivery":"Elixir","casting":"Inject","call":"Slow Death","description":"This is an alchemical injectable which slows the time it take a spirit to leave the body. Unlike most alchemy, this elixir does not need to be swallowed or administered through the mouth, and can be injected directly into an individual's blood stream. This spell may be applied to an individual who has received a death blow or even decapitated.","note":"","recipe":"Rejuvenation, rejuvenation, spiritual","source":"Spell Compendium"},{"category":"Alchemy","name":"Healing Draught 2","tier":"Journeyman","core":true,"delivery":"Elixir","casting":"Mixdrink","call":"“Heal 5","description":"With a greater understanding of how Adelrune’s materials are interlinked with energies that create and sustain life, you can brew a potion that will bring people back from the brink of death. This is the most commonly used version of a healing draught, often created by Alchemists of all skill levels to heal serious wounds.","note":"Core","recipe":"1× Healing, 1× Purification, 1× Rejuvenation","source":"Spell Compendium"},{"category":"Alchemy","name":"Lasting Elemental Paste","tier":"Journeyman","core":false,"delivery":"Elixir","casting":"Coat","call":"\"Imbue [Fire, Ice, Lightning, or Acid]\"","description":"By crushing, blending, and stabilizing reagents that match an element you choose during casting, you create a thin paste that will continue sizzling with that element's energy for some time. By applying that paste to a weapon, you allow that weapon to strike with that element for a duration. \n\nChoose [Fire, Ice, Lightning, or Acid]; for the next 3 minutes, you may call the Imbued element for each strike, along with its normal damage. While this does not increase the numerical damage it deals, it may have special effects on anything weak against that particular element.","note":"","recipe":"2x enchantment, 1x entropic","source":"Spell Compendium"},{"category":"Alchemy","name":"Magic 2 Draught","tier":"Journeyman","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"Restore Mana 2","description":"This is a commonly used version of the Magic Draught. This potion restores 2 mana when consumed.","note":"","recipe":"Rejuvenation, Enhancement, Enchantment","source":"Spell Compendium"},{"category":"Alchemy","name":"Moss's Mending","tier":"Journeyman","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"Set Bone by Pain","description":"This alchemical potion rapidly speeds up the body's natural healing process, mending a broken bone. Side Effect: The healing process is painful as the drinker's bones rapidly force themselves into the correct alignment.","note":"","recipe":"Enhancement, Healing, Stimulant","source":"Spell Compendium"},{"category":"Alchemy","name":"Poison Drink","tier":"Journeyman","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"Poison","description":"Its the poison potion (add text later)","note":"","recipe":"3x Poison","source":"Spell Compendium"},{"category":"Alchemy","name":"Remove Berserk by Basil and Joon","tier":"Journeyman","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"\"Remove Berserk\"","description":"Originally created by a collaboration between the alchemists Basil Wellverse of Ad Decimum and Yi Juyoung of Mandala, this spell functions by identifying and isolating the ingredients that can simultaneously calm a person's emotions and focus their will to reassert control over their anger, thus creating a potion that will allow them to break free of a magically- induced rage.\nThis elixir immediately removes the \"Berserk\" effect. A Berserked person is always \"unwilling,\" and thus you may only administer an Elixir to them if they are in Bleedout or asleep.","note":"","recipe":"1x sedative, 1x healing, 1x purification","source":"Spell Compendium"},{"category":"Alchemy","name":"Remove Dominate","tier":"Journeyman","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"Remove Dominate","description":"This potion is designed to awaken and unshackle the mind from outside influences. Once consumed, it 'removes dominate' effects and enchantments from the mind and body","note":"","recipe":"1x enchantment, 1x stimulant, 1x purification","source":"Spell Compendium"},{"category":"Alchemy","name":"Sleep Potion","tier":"Journeyman","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"Sleep","description":"This potion will cause its drinker to fall unconcious for 3 minutes. This is actually a very restful sleep.","note":"","recipe":"1x sedation, enchantment, poison","source":"Spell Compendium"},{"category":"Alchemy","name":"Torture's Tourniquet","tier":"Journeyman","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"Special","description":"This potion allows the consumer to be able to resist 'torture' ability effects for 3 hours. It is said that while under the effects of this potion, all of your senses are somewhat reduced.","note":"","recipe":"Sedation, Spiritual, Enchantment","source":"Spell Compendium"},{"category":"Alchemy","name":"Chaos Elixir","tier":"Master","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"\"Berserk\"","description":"This elixir preys on a subject's instinct for survival, and causes them to go into a rage, going 'Berserk' at those around them and perceived threats. Called the 'Chaos Elixir' it is often used by assassins to create diversions.","note":"","recipe":"1x Entropic, Spiritual, Enchantment, Enhancement","source":"Spell Compendium"},{"category":"Alchemy","name":"Concentrated Elemental Paste","tier":"Master","core":true,"delivery":"Elixir","casting":"Coat","call":"“[Damage] [Fire, Ice, Lightning, OR Acid]","description":"This magical paste is effervescent with energy, created by drawing out the properties of reagents matching an element that you choose during casting: Fire, Ice, Lightning, or Acid. When applied to a weapon, it enables a powerful blow that will strike with the properties of the chosen element. That attack counts as a GREAT STRIKE, as per the skill, dealing 2 extra damage and enabling any effects that GREAT STRIKE would normally trigger","note":"Core","recipe":"2× Enchantment, 1× Entropic, 1× Spiritual","source":"Spell Compendium"},{"category":"Alchemy","name":"Healing Draught 3","tier":"Master","core":true,"delivery":"Elixir","casting":"Mixdrink","call":"“Heal 10","description":"The elements of life are many and varied, with strange combinations working to maintain a healthy body in ways that most people would never expect. With your knowledge, you can combine your understanding of life’s strangeness with your mastery of alchemical ingredients to practically rebuild an entire living body. This is the most complex and powerful version of a standard healing draught, created by Alchemists to heal even the most grievous wounds.","note":"Core","recipe":"2× Healing, 1× Purification, 1× Rejuvenation","source":"Spell Compendium"},{"category":"Alchemy","name":"Holly's Kiss*","tier":"Master","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"Special","description":"This Elixir is medicine that works to cure disease elements which lower maximum health.\n\nNote: This medicine may also help with more complex diseases.","note":"Crafted Only","recipe":"1x purif, entropic, reju, blood (compatible)","source":"Spell Compendium"},{"category":"Alchemy","name":"Magic Draught 3","tier":"Master","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"Restore Mana 3","description":"This is a commonly used version of the Magic draught. This potion restores 3 mana when consumed.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Alchemy","name":"Vidrarun's Metal Paste","tier":"Master","core":false,"delivery":"Weapon","casting":"Coat","call":"\"Imbue [Iron, Silver, or Gold]\"","description":"By blending together increasingly magical components that can chemically transmute the material of a weapon for a brief while, you enable that weapon to strike with the properties of a different metal than its construction for a short while.\n\nChoose [Iron, Silver, or Gold] for the next 30 seconds, the weapon may call that element along with the damage. While this does not increase the numerical damage it deals, it may have special effects on anything weak against that particular metal.","note":"","recipe":"Entropic, Spiritual, Enchantment, Enhancement","source":"Spell Compendium"},{"category":"Alchemy","name":"Alchemist's Gambit*","tier":"Grandmaster","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"Special","description":"While poisoned whenever poison is refreshed heal 5 and while poisoned immune to movement altering effects such as stun, paralyze, slow, bind","note":"Unstable Only; Self Only","recipe":"Unstable only","source":"Spell Compendium"},{"category":"Alchemy","name":"An Elixir to Abate the Affliction of the Blood-Bound*","tier":"Grandmaster","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"\"Remove Vampirism\"","description":"This potion will remove the effects of vampirism on a returned individual. It will have no effect on individuals that are not vampires, nor on individuals that are not Returned. This potion must be mixed in BRIGHT SUNLIGHT. it is not possible to craft this potion at night, inside, or on an overcast day.","note":"Stable Only","recipe":"1x celestial blood, 10 Purification herbs, 1 Vial of the blood from the master vampire that altered the subject","source":"Spell Compendium"},{"category":"Alchemy","name":"Belladonna Extract","tier":"Grandmaster","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"\"Lesser Death\"","description":"Originally created by the alchemist Reonna Moss, this formula extracts the essence of one of the most deadly herbs known to Adelrune and compounds it with other toxins, creating a poison that transcends the boundaries of normal poisons.\nWhen you drink this potion you immediately suffer a \"Lesser Death\" effect. The ingredients of this potion are far too toxic to organic matter to be mixed into food, drink, or other consumables; you must drink it directly. You can only force-feed a creature this potion if they are asleep or in bleedout.\nNote: (In general, if you are trying to surprise somebody with this elixir, you will need to be relatively nearby to be able to call \"Lesser Death\" when they drink it.)","note":"Prior to 7.0 was poison lesser death by elixir","recipe":"1x Belladonna Herb, 2x Entropic, 2x Poison","source":"Spell Compendium"},{"category":"Alchemy","name":"Berserker's Draught","tier":"Grandmaster","core":false,"delivery":"Elixir","casting":"Mixdrink Special","call":"\"Stun by Pain, Bestow +1 Weapon Damage\"","description":"Double Dose: While under the effects of this spell, you may drink another Berserker's Draught (using mana or tags as appropriate) to increase the duration of the currently active effect from 3 minutes to 30 minutes.\nBy combining
