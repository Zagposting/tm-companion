 herbs and reagents that are capable of unnaturally increasing a person's strength while also inciting raw anger, you create a potion that will amplify the damage of their weapon attacks.\nUpon drinking this potion, you take a 30 second Stun by Pain,\" after which you receive +1 damage to all weapon attacks. This effect is a \"bestow\" and thus does not stack with other bestowed sources of weapon damage.\n(This potion is mildly addictive, while also causing high blood pressure and extreme shortness of temper.)","note":"Prior to 7.0 was Swing base 2 dmg now its a whetstone bestow +1 which is far superior","recipe":"1x Demon's Blood, 1x Enhancement, 2x Stimulant","source":"Spell Compendium"},{"category":"Alchemy","name":"Breath of Life*","tier":"Grandmaster","core":false,"delivery":"Elixir","casting":"Inject","call":"\"Life\"","description":"A variation of the Tears of Life potion, it grants life to the recently killed. Unlike Channeling, the victim must not have been delivered a killing blow, as the circulatory system must be fully intact. This alchemy is delivered in the form of an injectable elixir administered straight to the heart, which is also why it immediately deals 10 damage to the individual after 'Life' has been restored. It required additional training to use properly.\nSPECIAL: Administering this alchemy required \"Lore Anatomy\".\n\nNote: A damaged body may become eligible if it is repaired through surgery or other means (Surgery usually takes 3 minutes per repaired limb.).\nSIDE EFFECT: This alchemy causes a euphoric effect and brief (but severe) light sensitivity. It is not addictive.","note":"Crafted Only; only 1 use is made.","recipe":"Celestial Blood, Ritual Component, 1x (Herb) Stimulat, (Herb) Purification, (Herb) Rejuvenation","source":"Spell Compendium"},{"category":"Alchemy","name":"Concentrated Acid","tier":"Grandmaster","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"\"Stealth 10 Acid\"","description":"Acid can be used for many things, however this small dosage has its limits. Though this must be consumed, it deals 10 acid damage straight to the target's life, bypassing armor. This potion may not be combined with food or drink.\n\nNote: This potion, once consumed may not be stopped by parry, willpower, or evade. It may however be stopped by other augmentations or abilities that block magic, or are resistant to Acid.","note":"","recipe":"5x entropic","source":"Spell Compendium"},{"category":"Alchemy","name":"Deadly Poison Paste","tier":"Grandmaster","core":false,"delivery":"Weapon","casting":"Coat","call":"Imbue Poison","description":"Your next attack made with the affected weapon wll let you call \"Poison\", (meaning anyone hit by that strike will die after 3 minutes) which ends the Imbue effect. Note that this strike will do no damage outside of the Poison call, and thus this attack can be countered with skills such as Poison Resist and Poison Immunity in addition to normal defenses such as Dodge and Parry. Like all attacks, if the strike misses or is blocked (but not if it is stopped with a called defense such as Dodge), you retain this ability.","note":"Used to be Poison lesser death in 30 seconds prior t o7.0 now simply poison death in 3 minutes","recipe":"5 x Poisonous","source":"Spell Compendium"},{"category":"Alchemy","name":"Elixir of Corpus Inviolate","tier":"Grandmaster","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"Bestow Deathblow Resist","description":"A creature can only benefit from this potion ONCE per game. An alchemist can only cast or craft ONE per game (and a stable variant produces 1 use). When consumed, you may call \"Resist\" to any deathblows you recieve for the next 3 minutes.","note":"","recipe":"1 x Zye Scarab, 2 x Rejuvenation, 1 x Healing, 1 x Enchantment","source":"Spell Compendium"},{"category":"Alchemy","name":"Juyoung's Restoration of Limb","tier":"Grandmaster","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"\"Regrow [Chosen Limb] by Pain\"","description":"Originally created by the alchemist Yi Juyoung, this potion combines powerful reagents with healing properties to let a body's innate sense of its own proper form regenerate a specific, missing limb or organ.\n\nWhen your drink this potion, your regrow one limb or organ of your choice in an extremely painful process. This spell only works on living creatures, and can only regrow limbs or organs that were originally part of your body; it cannot grow extra limbs or vestigial attachments.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Alchemy","name":"Magic Draught","tier":"Grandmaster","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"Restore Mana 4","description":"This is the most powerful version of the Magic Draught. This potion restores 4 mana when consumed.","note":"","recipe":"Rejuvenation, Enhancement, Enchantment, Spiritual, Purification","source":"Spell Compendium"},{"category":"Alchemy","name":"Mortician's Elixir","tier":"Grandmaster","core":false,"delivery":"Elixir","casting":"Inject","call":"Regenerate Corpse","description":"This spell allows the alchemist to near instantly regenerate all damage done to a dead body (not to be confused with an undead.) This includes reattaching severed heads, hearts, and what not. This spell does not allow an alchemist to make one corpse into more, it only works on body parts that are present, reconnecting them as needed. if this spell is used on an undead, it may repair the creature's broken limb, and also superficial tears in the creature's flesh if it has any left, but it does not restore hit points. Casting this spell regularly on a corpse or undead can preserve it for years to come.","note":"","recipe":"bone, 1x purif, 1x healing, 1x enchantment, 1x spiritual","source":"Spell Compendium"},{"category":"Alchemy","name":"Potion of the Spirit Walker","tier":"Grandmaster","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"Special","description":"Can create a twin potion of Life which can only be used on a Spirit Walker.\nCan be used to Spirit Walk into the Death Realms with Story Staff oversight, the length of time limited by your Death Count. This spell cannot be cast without Story Staff involvement.\n\nSide Effect: This potion is highly addictive, it has also been known to, in some cases, and with frequent use, cause the spirit walker to lose their grip on reality. Note: Being asleep, and allowing this potion to take hold, are very different things. The drinker must accepts death to die.","note":"","recipe":"1 x Hallucination, 2 x Spiritual, 2 x Poison","source":"Spell Compendium"},{"category":"Alchemy","name":"Protean Panacea*","tier":"Grandmaster","core":false,"delivery":"Elixir","casting":"This recipe cannot be cast and can only be crafted.","call":"Special","description":"This marvelous elixir shifts, shimmers, and fluoresces with nearly every color imaginable, often simultaneously. In some cultures, it is considered a gift from benevolent higher powers. In others, it is an untrustworthy eldritch aid. In all, it possesses a reputation for providing exactly what you need, precisely when you need it. The most proficient of practitioners understand it to be simply an almost pure manifestation of the power of true alchemical transmutation.\n\nThis potion provides one of 5 effects when consumed, decided by the person drinking or administering the potion at the time of use. Each use of the potion following call and associated effect:\n\n*\"Heal 10\" to restore 10 health.\n*\"Bestow Great Strike\" to bestow a single Great Strike for 30 minutes.\n*\"Poison\" to cause the target to take the Poison condition.\n*\"Remove Poison\" to purify the target's body of any Poison condition.\n*ONE of \"Remove Sleep,\" \"Remove Dominate\", or \"Remove Berserk\" to cleanse any negative status effecting the target.","note":"Stable Only. Recipe: 1x Soft Pelt, 1x Healing, 1x Enhancement, 1x Poisonous, 1x Purification","recipe":"","source":"Spell Compendium"},{"category":"Alchemy","name":"Rupidrandali's Ravishing Regenerative Rejuvenating Returned Remedy","tier":"Grandmaster","core":false,"delivery":"Elixir","casting":"Mixdrink","call":"Special","description":"Based on years of studying the regenerative properties of tolls, this potion was originally created by the alchemist Rupidrandali Gonzagalino, who describes it as \"The greatest healing potion any living soul can experience.\" It delivers a burst of healing capable of restoring even the heartiest of individuals to perfect health, although this only expends most of its magical potential; it then lies dormant in the body for a short time, able to deliver a second burst of heal if the user experiences a life-threatening injury.\n\nYou may only drink this potion after casting it yourself. When you drink this elixir, you immediantly take a \"Heal 10\" effect. For the next 3 minutes, the first time you drop into Bleedout, you may call \"Self Heal 1\" after being in Bleedout for at least 30 seconds.\n\nDouble Dose: If you consume this elixir a second time before the initial 3 minutes have elapsed, you instead call \"Heal 10, Remove Weakness,\" after being in Bleedout for at least 30 seconds. This does not reset the original 3-minute timer.","note":"Unstable Only","recipe":"1x healing, 1x purif, 1x poison, 1x stim, 1x Blood Root","source":"Spell Compendium"},{"category":"Alchemy","name":"Temperment of Fraybees","tier":"Grandmaster","core":false,"delivery":"Elixir","casting":"Stable","call":"Special","description":"Unlike most forms of alchemy, instead of an elixir, crafting the Temperment of Fraybees creates a bar of soap. Upon washing one's self with the soap an individual is cleansed from any pollens that are on their body. (And makes your feel clean!) This was originally created to counter a specific form of alchemy carried on pollen but can potentially be used to cleans a body from other forms of skin related irritants as well. (At the story team's discretion.)","note":"","recipe":"honey, 1x stim, enhancement, purif, healing","source":"Spell Compendium"},{"category":"Alchemy","name":"Vanya Cuil","tier":"Grandmaster","core":false,"delivery":"Elixir","casting":"Stable","call":"Special","description":"This Elixir is medicine that works to cure disease elements which cause Effendal to go into a blood rage. It may have lesser, but still beneficial effects on other creatures effected by similar diseases.","note":"","recipe":"1x purif, 1x healing, 1x stim, 1x spiritual, 1x Eucalyptus","source":"Spell Compendium"},{"category":"Blood Magic","name":"Bladethirst","tier":"Apprentice","core":true,"delivery":"Weapon","casting":"Strike","call":"“Drain 1”","description":"One of the most fundamental arts of a blood mage, this spell works to transfer the life energy of blood spilled with a bladed weapon. It strikes directly at the life of your target, ignoring their armor completely and restoring your own life energy. (You regain your mana if your attack is blocked by a shield or weapon, though, and no transfer of health occurs if this attack is countered with Dodge, Parry, or Resist.)","note":"Core","recipe":"New","source":"Spell Compendium"},{"category":"Blood Magic","name":"Congeal Other's Blood","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Bleed, Touch","call":"Slow Bleeding","description":"Your mastery over blood can now slow a person's blood loss, extending their bleed count by 3 minutes.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Congeal Self","tier":"Apprentice","core":true,"delivery":"Self","casting":"Bleedout","call":"“Slow Bleeding”","description":"As a blood mage, your control over your own blood gives you a unique ability to halt your own progress toward death, thickening your blood and slowing the loss of your most vital element, giving yourself more time to find healing before death claims you.\nUnlike most spells, you may cast this spell while in bleedout—but you may only cast it once every 30 minutes. You immediately add 3 minutes to your current bleedout timer.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Finneus's Frontline Flank Failsafe","tier":"Apprentice","core":false,"delivery":"Self","casting":"Special","call":"\"Self Stun\"","description":"Self Stun for 30 seconds, even if Berserked or Dominated.\n\nOriginally developed by Finneus Locke, this otherwise simple spell demonstrates the blood mage's subtle, inherent mastery over blood and pain, especially their own. Using even a fleeting moment of clarity, the caster can magically ravage their own internal viscera in such a way as to plunge themselves into an incomprehensible amount of agaony, so debilitating that it will render the body useless even if it is not currently under their control.\n\nWhen you cast this spell, you call and take a 30-second \"Self Stun.\" This stun is unbearably painful, and should be role-played as such. You may use this spell even if you are the the effects of a \"Dominate\" or \"Berserk\" effect, though this spell does not end the Dominate or Berserk; once the 30 seconds have elapsed, the Dominate or Berserk effect will resume if it is still active, though this spell may be cast again. You may only cast this spell within 3 seconds of coming under the effect of a Dominate or Berserk effect. You cannot cast this spell a second time for the same instance of Berserk or Dominate.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Preservative Torpor*","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Bleedout","call":"“Slow Bleeding”","description":"As a blood mage, your first lessons were not in the letting of blood but in the staunching of bleeding. In needful times, you find a reserve of hidden strength to preserve your life.\n\nCall \"Slow Bleeding\" and immediately add +3 minutes to your bleedout timer. This spell stacks with other sources of \"Slow Bleeding\" but not with itself.\nUnlike most spells, you may cast this spell while in bleedout. You may cast this spell no more than once every 30 minutes.","note":"SPECIAL NOTE:\nUnlike nearly all other spells, this spell costs 0 mana to cast.\n*Self Only Spell","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Seize Limb","tier":"Apprentice","core":true,"delivery":"Gesture","casting":"Bleed","call":"“By My Gesture, Stun [Specify Limb] by Pain”","description":"By forcing the blood in an enemy’s limb to writhe and squeeze against itself, you can incapacitate it briefly. The named limb (which must be a specific arm, leg, or tail) will be Stunned for 3 seconds, making it mostly useless for the duration. This spell doesn’t require the affected person to drop anything they were holding","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Transfer Poison","tier":"Apprentice","core":true,"delivery":"Touch","casting":"Bleed, Touch","call":"\"Transfer Poison\"","description":"By magically delving into the contents of a person’s blood and modifying the toxins there, you can either remove the “Poison” condition from a creature and transfer it to yourself, or you can remove the “Poison” condition from yourself and transfer it to the creature you touch.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Blood Healing","tier":"Journeyman","core":true,"delivery":"Touch","casting":"Bleed","call":"“Heal Self 2 by Pain”","description":"Through your mastery of the circulatory system and the magical energy of fresh blood, you can force your body or another’s to close a small wound. This process is very painful.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Blood Mark: Blood Strike","tier":"Journeyman","core":false,"delivery":"Self","casting":"Blood Mark","call":"[Weapon Damage]","description":"Blood Mark: When your Health (not armor) is damaged, may activate within 3 seconds to cause your next weapon attack to be a Great Strike. Returns with Rest. Blood Mage Exclusive Spell.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Blood Stunning Spell","tier":"Journeyman","core":false,"delivery":"Gesture","casting":"Bleed","call":"\"By My Gesture. Stun by Pain\"","description":"By increasing your mastery of the medium of blood, you can reach out through the air and agitate another person's blood directly, giving them an incredibly uncanny and painful sensation that will stun them for a few seconds, preventing them from doing anything useful.\n\nYou must point or gesture at a creature with your hand or weapon and call the effect, at which point they will take a \"Stun\", preventing them from fighting or using skills and abilities for 3 seconds.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Drain Life 1","tier":"Journeyman","core":true,"delivery":"Gesture","casting":"Bleed","call":"“By My Gesture, Drain 1”","description":"An advanced approach to the fundamental art of a blood mage, this spell uses the magical properties of spilled blood to transfer life energy, even at long distance, from a target to the caster. It strikes directly at the life of your target, ignoring armor completely, and restores your own life energy. (This spell restores no Health if it is countered with a Willpower or Resist.)","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Remove Poison","tier":"Journeyman","core":false,"delivery":"Touch","casting":"Bleed, Touch","call":"\"Remove Poison by Pain\"","description":"While touching a person, this spell lets your mind delve more deeply into the coursing of their blood, to the point that you can feel any toxins in that stream. Then - with a sudden, painful, wrenching sensation - you can forcibly burn any such poisons out of their bloodstream.\nYou touch a creature, which can be yourself, and end all active \"Posion\" effects on them. This spell has no effect on inanimate objects or targets that are not creatures.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Transfer Berserk","tier":"Journeyman","core":true,"delivery":"Gesture","casting":"Bleed","call":"“By My Gesture, Remove Berserk”; \"Berserk\"","description":"By opening up your own blood to the madness of rage coursing through another person, you can transfer any Berserk effect they are suffering to yourself.\nWhen you cast this spell, you MUST immediately take an unresisted Berserk effect after calling “Remove Berserk.” If you do not take the Berserk effect, or it is prevented in any way, you may not cast this spell on the target and MUST NOT call “Remove Berserk.” This Berserk effect can be removed normally after it is taken.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Bladethirst 2","tier":"Master","core":true,"delivery":"Weapon","casting":"Strike","call":"“Drain 2”","description":"A more powerful version of a blood mage’s most fundamental art, this spell works to transfer the life energy of blood spilled with a bladed weapon. It strikes directly at the life of your target, ignoring their armor completely and restoring your own life energy. (You regain your mana if the attack is blocked by a shield or weapon, though, and no transfer of health occurs if this attack is countered with Dodge, Parry, or Resist.)","note":"Core","recipe":"New","source":"Spell Compendium"},{"category":"Blood Magic","name":"Blood Healing 2","tier":"Master","core":false,"delivery":"Touch","casting":"Bleed","call":"“Heal Self 3 by Pain” or “Heal 1 by pain”","description":"Through your mastery of the circulatory system and the magical energy of fresh blood, you can force your body or another’s to close a small wound. This process is very painful.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Cecil's Disdain","tier":"Master","core":false,"delivery":"Gesture","casting":"Bleed","call":"\"By my Gesture, Repel by Pain\"","description":"Originally created by the blood mage Ritari Cecil of Kaelin, this spell takes advantage of the fact that blood travels through every inch of people's limbs, acting as a liquid skeleton within them. By twisting and redirecting that blood, however briefly, you can force a target's legs to involuntarily stagger them away from you. \n\nYou must point or gesture at a creature with your hand or weapon and call the effect, at which point they will take a \"Repel\", meaning they must take 3 steps directly away from you.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Cecil's Draining Sigil","tier":"Master","core":false,"delivery":"Self","casting":"Blood Mark","call":"\"Drain 2\"","description":"Blood Mark: You may have one active Blood Mark per rank of Blood Magic you possess. Each Blood Mark must be in a different bodily location. Valid locations are left/right leg, left/right arm, torso, neck, and face (if veins are not visible, make a good faith effort). You may only apply each Blood Mark to one location at a time. Each individual Blood Mark returns with Rest.\n\nAs an example of the ancient sanguinary art of the Blood Mark, this spell uses the vital power of another creature's heart's-blood to fill your veins with dark power for a few days. When you are injured, some of the empowered blood will burst from you, magically closing a few small wounds while also blasting you back toward safety in a grisly and painful shower of gore.\n\nWhen you take at least 1 point of Health damage (damage to armor will not trigger a Blood Mark) you may activate this Blood Mark within 3 seconds to use' a Drain 2 which must be delivered with melee weapon attack. This ability returns with Rest...","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Ki's Trails of Blood","tier":"Master","core":false,"delivery":"Self","casting":"Bleed","call":"\"Blood Leap\"","description":"Originally created by the blood mage Ki, this spell allows you to grant your own legs incredible vigor by filling your blood with an element of desperate strength. Beware the cornered hunteress, with that strength, you can leap directly over your foes and find better footing for the fight. \n\nYou perform a Leap that functions exactly as, and follows all the normal rules for, the Leap skill, including restrictions on armor, number of steps, and landing. You must call the \"Blood Leap\" within 3 seconds of drawing blood as part of casting this spell.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Lord Ezreal's Beckoning","tier":"Master","core":false,"delivery":"Gesture","casting":"Bleed","call":"\"By my Gesture, Attract by Pain\"","description":"This spell painfully manipulates the blood in a victim's muscles, forcing them to approach.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Mend Limb","tier":"Master","core":false,"delivery":"Touch","casting":"Bleed, Touch","call":"\"Mend Limb by Pain\"","description":"Your mastery over blood allows you to manipulate the body letting you mend a broken limb repairing it to normal. This works exactly like the set broken bone talent.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Strength of Blood","tier":"Master","core":false,"delivery":"Self","casting":"Bleed","call":"\"Bestow Strength\"","description":"Bestow Strength immediantly. Lasts 3 seconds.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"The Blood Paralysis Spell","tier":"Master","core":true,"delivery":"Gesture","casting":"Bleed","call":"“By My Gesture, Paralyze by Pain”","description":"By magically reaching through the air to seize and rench the blood and flesh of your target, you can force them to halt all movements for 3 seconds as they struggle to manage the pain that you have suddenly poured into their body.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Blood Healing 3","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Bleed, Touch","call":"“Heal Self 5 by pain” or “Heal 3 by pain”","description":"With a grandmaster's proficiency in manipulating a person's blood, you are able to bend the blood in and around their wounds to not only slither back inside of them but also pull gaping holes closed behind it, healing the person both impressively and excruciatingly.\nYou touch a creature, which can be yourself, and heal them for 5 HP.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Blood Mark: Blood Exaltation","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Blood Mark","call":"\"Leap\" \"Heal 1 by Pain\"","description":"Blood Mark: When your Health (not armor) is damaged, may activate within 3 seconds to use a Leap followed by Healing 1. THIS MAY BE ACTIVATED IN BLEEDOUT. Returns with Rest.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Blood Mark: Blood Signature","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Blood Mark","call":"\"[Spell Call]\"","description":"Blood Mark: When your Health (not armor) is damaged, may activate within 3 seconds to use another BM spell at no cost. Returns with Rest.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Blood Parasite","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Special","call":"\"Heal 1\"","description":"Cast while Bleeding Out: Kill another person in Bleedout, heal self 1","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Blood Regeneration","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Bleed, Touch","call":"\"Restore Limb by Pain\"","description":"You touch a creature, which can be yourslef, concentrate for 4 seconds, and regrow one limb or organ of your choice in an extremely painfil process. This spell only works on living creatures, and can only regrow limbs or organs that were originally part of your body, it cannot grow extrra limbs or vestigal attachments.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Drain Life 2","tier":"Grandmaster","core":false,"delivery":"Gesture","casting":"Bleed","call":"\"By My Gesture, Drain 2\"","description":"A truly incredible display of one's mastery of the fundamental art of a blood mage, this spell uses the magical properties of spilled blood to let you transfer a serious amount of raw life energy, even at long distance, from another person to yourself.\nYou must point or gesture at a creature with your hand or weapon and call the effect, at which point they will suffer a \"Drain 2\", which strikes directly at the life of your target, ignoring armor completely, and restores your own Health. (This spell restores no Health if it is countered with a Willpower or Resist).","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Icarus' Arbitration","tier":"Grandmaster","core":false,"delivery":"Special","casting":"Casting","call":"Special","description":"You can only cast this spell once per Twin Mask game. You must spend at least 3 minutes roleplaying the process of ritualistically drawing blood from two Willing creatures and mixing or otherwise incorporating it together. You must then spend at least 3 minutes writing a formalized contract or agreement in the two Willing creatures' blood on a piece of paper or other physical medium. Both Willing parties must agree to the terms and sign the contract. This cannot be forged or done under any sort of magical compulsion. This contract remains valid for 3 days. If either party breaks the terms of the contract, they will immediately suffer a reduction of -2 to their Maximum Health Points that will last for 3 days. This reduction of Maximum Health cannot be removed or mitigated by any means. If this reduction brings your Maximum Health to 0, you immediately die. There is no required, visible physical manifestation of this Health Point loss, assuming it does not bring you to 0 Maximum Health.\nNote: If there is a dispute about whether a contract has been violated, players should resolve this between themselves. Staff members should not be called away from their duties to arbitrate agreements created via this spell.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Lord Ezreal's Exhaustion","tier":"Grandmaster","core":false,"delivery":"Gesture","casting":"Bleed","call":"\"By My Gesture, Lesser Weakness\"","description":"Originally created by the blood mage Lord Ezreal Lymere, this spell allows you to concentrate on your ability to manipulate the internals of others, and focus it to a razor-sharp point on the interaction between the sanguine and the visceral. Though you can only exert this control over those with spirits too weak to fend you off, you rapidly leech the ability of a creature's lifeblood to deliver vitality to the rest of its body, causing no damage but instantly depriving its muscles and organs of anything needed to function. This renders the creature unable to exert itself in any capacity whatsoever until it can recirculate the nutrients and minerals required. \n\nYou must point or gesture at a creature with your hand or weapon and call the effect, at which point they will take a \"Weakness\" effect that only affects Lesser creatures. This prevents them from moving quickly, fighting, or using skill and abilities for 3 minutes.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Rupi's Righteous Relentless Ruthless Ravaging Rathful Rage","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Bleed","call":"\"Rage\"","description":"Originally created by the by the blood mage Rupiance Ameelio Tremaine, This spell allows you to override your body's own built-in mechanisms for restraint and push it far past its normal limits for combat prowess, albeit briefly. The massive amount of magical energy you flood your blood and muscles with can only be sustained for a few seconds without causing permanent damage, but during those seconds you become a bloodied berserker, able to strike as hard as the mightiest barbarians. \n\nWhen you cast this spell, you may call \"Rage\" to activate the Battle Rage skill. Exactly as if you had purchased it. This begins a 10-second period in which all your weapon attacks function as Great Strikes. Just as with the skill, you must roleplay a state of intense anger and destructive impulse during this time. You may only cast this spell once every 3 minutes.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Rupidrandali Tremaine's Sensational Sanguine Spectacle","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Spectacle","call":"Special","description":"Reduce max HP by 2 for 3 days; next 30 minutes, can use Bladethirst 2 once every 30secs for no mana\n\nOriginally created by the blood mage Rupidrandali Tremaine, this spell is a gruesome reminder that while magic is often tightly controlled by the mage wielding it, you can sometimes draw too greedily upon the power it offers for great benefit, equally great detriment. By inflicting a profound and nearly mortal wound upon oneself, you heighten your sensitivity to and deepen your own bloodlust. \nTo cast this spell, you must spend 3 seconds dramatically causing yourself a grievous wound, such as impaling yourself through the torso or some other grand display of fore. Although this act deals no Health Point damage, you should roleplay your body being wracked with pain and an unquenchable thirst to heal what cannot be healed for 30 minutes. When you cast this spell, your max Health Points are lowered by -2 for 3 days. This Health Point reduction cannot be reduced or removed by any means. For 30 minutes, you may cast the Core Spell \"Blade Thirst 2\"\" without spending mana once every 30 seconds. You must meet all other criteria for casting Bladethirst 2, and may cast it additional times by spending mana as normal.","note":"Only copy is soulbound to Cecil","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Spell of Lesser Death","tier":"Grandmaster","core":false,"delivery":"Gesture","casting":"Bleed","call":"\"By My Gesture, Lesser Death\"","description":"Among the principle reasons Blood Magic is feared by both common people and great warriors alike, this terrifying spell, rather than drawing a person's blood to flow outside them, lets you strike directly at the heart of a weaker person, stopping it from pumping blood entirely and leading to an excruciating death. \n\nYou must point or gesture at a creature with your hand or weapon and call the effect, at which point they will take a \"Lesser Death\" effect. This will only affect Lesser creature, but will immediately drop them into Death Count.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"The Commandment of Blood","tier":"Grandmaster","core":false,"delivery":"Gesture","casting":"Bleed","call":"\"By My Gesture, Lesser Dominate\"","description":"You must point or gesture at a creature with your hand or weapon and call the effect, at which point they will take a \"Lesser Dominate\" effect. This will only affect Lesser creatures, but will give you control of their body - but not mind - for 3 minutes, during which time they must follow your verbal commands.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Blood Magic","name":"Vhynndication","tier":"Grandmaster","core":false,"delivery":"Gesture","casting":"Bleed","call":"\"By My Gesture, Break Limb\"","description":"You must point or gesture at a creature with your hand or weapon and call the effect, at which point they will take a \"Break Limb\" effect. You must specify the limb to be broken, such as 'Right Leg' or 'Shield Arm'. This will render the limb useless until it can be healed by a \"Set Bone\" effect. You may only cast this spell once every 30 seconds.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Awaken","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Touch","call":"\"Remove Sleep\"","description":"You remove the \"Sleep\" condition on the target, or wake a target that is sleeping non-magically. This spell may be ineffective on other effects that render a target unconscious.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Detect \u0026 Transfer Poison","tier":"Apprentice","core":true,"delivery":"Touch","casting":"Detect","call":"“Detect Poison” and/or \"Transfer Poison\"","description":"By opening your life energy enough to get a magical taste of a potentially dangerous or poisoned person or object, you can determine whether there are toxins present. If this spell is used on an object, you should inform a nearby Story Staff member that you are casting this spell; they will tell you if the touched subject contains toxins that could cause the Poison effect. Additional information may be available at their discretion.\n\nIf this spell is used on a creature, the person playing that creature must (OOC) tell you whether they are suffering from the “Poison” Condition. At that point, you can touch another willing entity and remove the Poison effect from the first subject, granting Poison to the touched entity (or yourself). This “resets” the 3-minute duration of the Poison effect.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Druid Kaelan's Blessing","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Touch","call":"\"Bestow 1 Maximum Health\"","description":"This spell bestows +1 maximum health for as long as the gifted plant (from the caster) is in physical contact, in plain sight, and exposed to air, with the person receiving the bestowment. This spell functions much like a ward, and will last for as long as the plant fulfills these conditions, and is also instantly lost if the plant is removed, (even momentarily).","note":"","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Gaeden's Grim Grasp*","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Touch","call":"\"Deathblow, Drain Life Into the Earth\"","description":"You must remain in physical contact with both the earth and the target for the full duration of this spell. The target must be a valid target for a deathblow, or this spell fails. After concentrating for at least 1 second, you may call \"Deathblow, Drain Life Into the Earth,\" at which point the target will die unless this effect is somehow prevented.","note":"Note: Simply maintaining physical contact with an unaware target does not qualify them as a valid target for this deathblow.\n\nUnlike nearly all other spelis, this spell costs 0 mana to cast.","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Invoke Idyllic Grove","tier":"Apprentice","core":false,"delivery":"Self","casting":"Grove Keeper","call":"\"Create Idyllic Grove\" then \"Heal Self 1\" every 30 sec.","description":"While you are in your Grove and it is actively providing its benefit, you may call \"Heal Self 1\" every 30 seconds. This spell will designate the location for your Idyllic Grove. You must place a distinct, unique phys-rep that incorporates, or appears to incorporate living plant life in some way to mark the central point of your Grove. This phys-rep can be of any size, but must be able to rest securely on the ground under its own power and must at least come up to your knees. This can be anything from a small, decorated tree, midsummer pole adorned top-to-bottom with greenery, or large, vine-covered crystal. The area of your grove will extend up to a 5-foot radius from this central phys-rep, and this is the area in which you are considered \"in your Grove.\" You are encouraged to further decorate the area to represent the increased flowering and flourishing of plants and flowers. Your grove requires peace and tranquility, and thus follows the same rules as \"Rest,\" meaning any visible or audible combat will stop it from providing its benefits for 30 seconds. Channeler Exclusive Spell","note":"","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Selfless Rescue*","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Touch","call":"\"Heal 1\"","description":"As a channeler, you have a strong affinity for the low of vital forces of all kinds. You have learned to control the flow of these energies with the expenditure of your mana. However, there is one pool of life force that a channeler has more control over, their own. Through concentrating and the use of this pool, you may heal even when your inana has failed you. When you cast this spell your life force is the obligate source. As you call the effect you simultaneously take the effect Drain 1. This damage cannot be prevented in any way and the process is very painful.","note":"Unlike nearly all other spelis, this spell costs 0 mana to cast.","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Slow Poison","tier":"Apprentice","core":true,"delivery":"Touch","casting":"Channel","call":"“Slow Poison”","description":"By drawing out some of the toxicity present in a person’s body and directing it to diffuse into another location, you can delay the death that would normally come from that poison. This spell postpones the final effect of the Poisoned status by 3 minutes, and you can cast it multiple times to make a “Poison count” last even longer. If you cast this spell to direct the poison into a person rather than a plant or the earth, that person should roleplay discomfort and mild illness for 30 minutes, although that roleplaying will not have any mechanical effects.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"The Mending Spell 1","tier":"Apprentice","core":true,"delivery":"Touch","casting":"Channel","call":"“Heal 1” (and/or “Drain 1”)","description":"By opening yourself as a conduit for life energy and using your magical skill to make that energy flow, you can heal yourself or anyone you touch by drawing health from the ground (or a tree, etc.). If you are drawing energy from an entity with Health Points, you should instead call “Drain 1” to signify that they are losing HP. To do so, you must touch them in a way that they can feel; the Drain can work through armor, but they must know they are being affected. Unlike other Drain effects, it is possible for somebody other than you to gain the HP that is Drained; in that case, you should also say “Heal 1” to notify them.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Transfer Life","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Touch","call":"Special","description":"You can transfer hit points from one willing subject to another.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Transfer Magic","tier":"Apprentice","core":true,"delivery":"Touch","casting":"Transfer","call":"“Transfer Mana, [Specify Amount]”","description":"By connecting to the well of ambient magicka within living things, you allow mana to flow from one source to another. This spell can only be used to channel mana from a willing source, and that source must possess mana. It will lose an amount of mana that you specify, and the other touched entity will gain that same amount of mana. (You will lose 1 mana from casting this spell, in any case.) The source entity cannot give more mana than it currently possesses, and the recipient cannot take more mana than it has capacity for.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Transfer Weakness","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Touch","call":"Special","description":"You can transfer weakness from one subject to another.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Cecil's Remove Maim","tier":"Journeyman","core":false,"delivery":"Touch","casting":"Touch","call":"\"Remove Maim\"","description":"You concentrate for 2 seconds while touching both raw earth or stone (or a living entity such as a creature or tree) and the target to be healed, then call the effect.\\","note":"Completed (Dec 2025) - Cecil","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Mend Bone","tier":"Journeyman","core":true,"delivery":"Touch","casting":"Touch","call":"\"Mend Bone\"","description":"This spell heals broken bones. This works exactly how the set bone talent works.","note":"This is a somewhat painful spell to cast.","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Personal Mending*","tier":"Journeyman","core":false,"delivery":"Self","casting":"Channel","call":"\"Heal 5\"","description":"Often, as a channeler, you are a conduit. You allow energy to flow through your body from where it exists to where it is needed, taking none for yourself. This spell, however, takes advantage of your long experience with drawing energy from the earth... to let you simply heal yourself. Rather than restoring other people or draining power from them, you just connect with Adelrune, take a sip of its vitality, and let that life energy spread throughout your body, closing wounds and repairing your essence.\nThis spell can only be cast on yourself. You restore 5 Health. This spell cannot drain health from another creature, it only works by drawing energy from a source such as a tree, the earth, or a Living Artifact.","note":"Self-cast only","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Remove Poison","tier":"Journeyman","core":false,"delivery":"Touch","casting":"Channel","call":"\"Remove Poison\"","description":"You must remain in constant contact with both the target and the ground or tree for the duration of this spell. This spell removes all active *Poison\" conditions from the target. This is not a \"transfer\" effect and may not use another creature as a living source; you must transfer into the earth, tree, or similar.","note":"Note: This spell has no effect on alcohol, and certain exotic or extremely powerful poisons may be beyond its power.","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Remove Weakness","tier":"Journeyman","core":true,"delivery":"Touch","casting":"Touch","call":"\"Remove Weakness\"","description":"By connecting your own life energy briefly with that of a weakened person, you can infuse them with vigor, restoring their ability to move and fight under their own power. This spell has no effect on a person in bleedout—although that state has similarities to Weakness, they are distinct conditions.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"The Mending Spell 2","tier":"Journeyman","core":true,"delivery":"Touch","casting":"Channel","call":"“Heal 3” (and/or “Drain 3”)","description":"By opening yourself as a more powerful conduit for life energy and using your magical skill to make that energy flow, you can heal yourself or anyone you touch by drawing significant amounts of health from the ground (or a tree, etc.).\nIf you are drawing energy from an entity with Health Points, you should instead call “Drain 3” to signify that they are losing HP. To do so, you must touch them in a way that they can feel; the Drain can work through armor, but they must know they are being affected. Unlike other Drain effects, it is possible for somebody other than you to gain the HP that is Drained; in that case, you should also say “Heal 3” to notify them.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Drystan's Spell of Calming","tier":"Master","core":false,"delivery":"Touch","casting":"Touch","call":"\"Remove Berserk\"","description":"After maintaining Concentration and unbroken physical contact with the target for 3 seconds, you may call \"Remove Berserk\" to end any active Berserk conditions on the target.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Grove of Arcane Reverie","tier":"Master","core":false,"delivery":"Touch","casting":"Grove Keeper","call":"","description":"Grove Keeper. You may set up a phys-rep of an item that signifies a connection with nature or the earth (such as a visually distinct plant, overgrown midsummer pole, or similar) and designate a 5-foot radius area around that object as your Grove by casting \"Invoke Idyllic Grove.\" The Idyllic Grove follows all the same rules as \"Rest,\" meaning being in visual or auditory range of any combat will disable its ability to actively provide its benefit for 30 seconds.\n\nThis spell, when combined with the first-circle spell Invoke Idyllic Grove, can enhance your connection to the grove it produces. Many channelers theorize that there is a strong distinction between magicka and life energy, but this spell enables the serenity of your grove to help power your spellcasting in addition to your vitality. By meditating on your connection with those plants and to Adelrune, you can occasionally cast powerful Channeling magic without even needing to draw on your personal reserve of magical energy.\n\nYou may only cast this spell while within your Idyllic Grove, and only while the Grove is actively providing its benefit. You upgrade your Idyllic Grove for the remainder of the current Twin Mask game, unless it is moved or destroyed. Now, if you are within your Idyllic Grove and the grove is actively providing its benefit, you may cast any Channeling spell once for 0 mana, following all other requirements of the spell as normal. This ability returns with Rest. Channeler Exclusive Spell.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Marrow \u0026 Elowyn's Barken Skin","tier":"Master","core":false,"delivery":"Self","casting":"Channel","call":"\"Self Bestow 4 Armor\"","description":"You channel the hardness of plant life into your own skin. Making yourself much more durable.\n\nYou must maintain physical contact with the living plant for the full 3 seconds of concentration to cast this spell. The 4 armor is self-only and lasts for 30 minutes. As this is a bestow effect it does not stack with itself or other bestows.\n\nOnce per Rest, you may cast this spell within your Grove without paying its mana cost.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Reattach Limb","tier":"Master","core":false,"delivery":"Touch","casting":"Touch","call":"\"Restore \u003cLimb\u003e\"","description":"Using yourself as a conduit between them, you can re-bind the disconnected essence of a person's body by bridging the gap between their core... and the altered \"signature\" of a limb that was once part of them.\nYou must remain in constant contact with the person and the limb for the duration of this spell. You may reattach a severed limb by holding it up to the point from which it was severed, then casting this spell; it will have no effect if the limb cannot make contact with the point from which it was lost. The limb must be relatively fresh (removed within the current Twin Mask game), or otherwise preserved in some way, and cannot have suffered further deterioration or damage beyond being removed.","note":"This is a somewhat painful spell to cast.","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Remove Dominate","tier":"Master","core":true,"delivery":"Touch","casting":"Touch","call":"\"Remove Dominate\"","description":"Through your growing mastery of life energies, you are able to clear various magical influences from a person’s mind by fortifying their natural will. You must maintain contact with the target for 3 full seconds before producing this effect, which can be challenging if they are resisting your efforts.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"The Mending Spell 3","tier":"Master","core":true,"delivery":"Touch","casting":"Channel","call":"“Heal 5” (and/or “Drain 5”)","description":"By opening yourself as a strong conduit for life energy and using your magical skill to make that energy flow, you can heal yourself or anyone you touch by drawing impressive amounts of health from the ground (or a tree, etc.).\nIf you are drawing energy from an entity with Health Points, you should instead call “Drain 5” to signify that they are losing HP. To do so, you must touch them in a way that they can feel; the Drain can work through armor, but they must know they are being affected. Unlike other Drain effects, it is possible for somebody other than you to gain the HP that is Drained; in that case, you should also say “Heal 5” to notify them.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Vorandiel's Reminder","tier":"Master","core":false,"delivery":"Touch","casting":"Touch - Special","call":"","description":"You may only cast this spell on a creature once every 3 days. You cause a target to regain a memory of approximately 3 seconds long. Whether they choose to narrate or share this memory is entirely at the discretion of the player receiving this spell. Further, you may not choose the theme, content, or any other details of the memory, it is entirely \"random\" and the details should be invented by the player receiving the spell. While this spell may recover some brief memories lost to Fractured Memory or Fading Memory, no amount of magic or any other effect can restore all of those memories, as part of the effect of those memory flaws, those memories are truly lost forever.","note":"Note: If you have no memory flaw, this spell has no effect.","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Aspect of the Beast","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Touch - Special","call":"\"Bestow +1 Damage by Fury\"","description":"You bestow +1 weapon damage on a creature for 30 minutes. This bestowed (damage applies to any weapon(s) they wield during this time. As this is a bestow effect, it does not stack with other bestowed sources of damage or itself. While a creature is under the effect of Aspect of the Beast, they may not prevent \"Berserk\" effects by any means, as they are subsumed by primal fury, though Berserk effects may be removed as normal once they take hold. A creature can choose to end this effect on themselves at any time.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Chalice of Life","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Chalice of Life","call":"\"Heal 10, Restore Body\"","description":"This spell only works on living creatures. You heal almost all damage and remove almost all negative effects from a target with this spell. At the end of 30 seconds:\n• The target is healed for 10 Health.\n• The target is cleansed of all Poison effects. \n• The target is healed of all diseases. (Some rare poisons or diseases may be too virulent or potent to be removed by this spell, at Story Staff discretion)\n• The target has any missing limbs or organs regrown, and any broken limbs repaired. These limbs are not considered \"maimed.\"\n• The target receives a \"Remove Weakness\" effect.","note":"Note: This spell is painful for the assistants, but does not damage them in any lasting way.","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Druid Kaelin's Enchanting Kiss","tier":"Grandmaster","core":false,"delivery":"Gesture","casting":"Concentration - Gesture","call":"\"By my gesture, Dominate\"","description":"This spell only works on someone that is currently benefit from the spell\"Druid Kaelan's Blessing.\" If you are not certain that they are currently under that spells effects, or cannot actively see that spells required phys rep (a small plant attachd to them0 this spell may not be used.\"","note":"NOT COPYABLE","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Marlow's Resurrection","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Touch","call":"\"Life\" *newly returned only*","description":"You must quietly verify Out-of-Character whether the character you are attempting to resurrect is still considered a \"New Player\" (no older than their third Iwin Mask game as that character), which can be done as part o! your 4 seconds of concentration. After you successfully deliver a \"Life\" call. you must take a 30 second \"Stun by Pain\" which cannot be mitigated by any means, though this spell causes no other lasting harmful effects.","note":"Note: You are encouraged to roleplay the excruciating nature of this stun, as piercing the veil of death taxes your spirit, even if it does not cause any lasting harm.","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Reave the Self","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Pain","call":"\"Restore 20 Mana\"","description":"You may only cast this spell once per Twin Mask game, and this spell costs 0 mana to cast. You immediately regain 20 Mana. This cannot increase your mana past its maximum. Immediately upon taking this effect, you cannot walk quickly or run until the next sunrise/sunset. This inability to walk quickly or run cannot be removed by any means. Beyond the inability to move quickly this spell has no lasting negative mechanical effect.","note":"Note: Attempting to circumvent the movement speed restriction will be considered a Violation of the Rules and dealt with harshly.","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Regenerate Limb","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Channel","call":"\"Restore Limb by Pain\"","description":"You must remain in constant contact with both the target and the ground or tree for the full duration of this spell. You regrow one limb or organ of your choice in an extremely painful process for both the caster and the recipient. This spell only works on living creatures, and can only regrow limbs on organs that were originally part of your body; it cannot grow extra limbs or vestigial attachments.","note":"Note: This spell cannot be used to \"harvest\" body parts in any way organs involved in this process cannot serve any function (including commerce or magical rituals) beyond their intended physiological purpose.","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Rootway Passage","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Treefriend","call":"\"I meld into this Tree\"","description":"Upon completing the casting of this spell, you go out of character. You have 3 minutes in that out-of-character state to walk (or run) to another Greensage Tree that has named you Tree-Friend. You then describe your body emerging from that second tree. You then return to being in-character next to that second Greensage Tree. If you fail to complete this process in 3 minutes, you will immediately die. Your dead body then reappears in-character wherever you happen to be.\nYou must have a blue tag that indicates you are a Tree-Friend of both the starting and destination Greensage Trees. If you cast this spell and only have one Tree-Friend, you will die in 3 minutes.\nAfter casting this spell, you may not cast it again until you have completed a Rest.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"The Mending Spell 4","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Channel","call":"\"Heal 10\" or \"Drain 10\"","description":"By opening the floodgates that previously kept your life energy separate from the things and people you touch, and by using your magical skill to make that energy flow rapidly, you can heal yourself or anyone you touch by drawing impressive amounts of health from the ground (or a tree, etc.).","note":"If you are drawing energy from an entity with Heath Points, you should instead call \"Drain 10\" to signify that they are losing HP. To do so, you must touch them in a way that they can feel; the Drain can work through armor, but they must know they are being affected. Unlike other Drain effects, it is possible for somebody other than you to gain the HP that is Drained; in that case, you should also say \"Heal 10\" to notify them.","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"The Touch of Death","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Touch","call":"\"Lesser Death\"","description":"You must remain in physical contact with the target for the full duration of this spell. As this spell is almost exclusively used on an active combatant, you must exercise caution that you do not cause actual harm to yourself or others or create an unsafe situation in the casting of this spell, and you may not physically impede or restrain anyone during the course of casting. After maintaining Concentration and unbroken physical contact with the target for 4 seconds, you may call \"Lesser Death\" to instantly kill a Lesser creature.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Channeling","name":"Transfer Death","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Touch","call":"\"Death\" then \"Life\"","description":"Rather than merely letting health and vigor flow through the magical, bodily pathways you have explored and developed as a grandmaster channeler... this spell transfers the very essence of life and death. Through one hand, you draw the life from a person who is willing to die; through the other hand, you pour that life into a dead body, returning it to full vitality and consciousness.\n\nYou must remain in constant contact with both the corpse and the willing target for the duration of this spell. For the purposes of this spell, a creature who is unconscious or in bleedout is considered a willing target. Successfully bringing a creature back to life in this way reduces you Maximum Health (HP) by -2 for 3 days. This HP reduction cannot be prevented or removed in any way, and if your maximum HP reaches 0, you immediately die.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Comprehend Mortal Languages","tier":"Apprentice","core":false,"delivery":"Self","casting":"Comprehend","call":"\"Comprehend Language\"","description":"By projecting your mind into the web of intentionality surrounding a person’s words — that is, the way they understand their own speech rather than the actual noises they make — you gain the ability to understand a language you normally cannot.\n\nThis spell lets you understand a language you are currently hearing provided you are the only person within earshot who does not speak that language. You gain no ability to speak the language or perform any other acts of interpretation beyond a relatively accurate translation of the words being spoken. If another creature who does not speak the language being translated moves within earshot while this spell is in effect, the spell immediately ends and you take a “Stun” effect.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Divinatory Light","tier":"Apprentice","core":true,"delivery":"Touch","casting":"Create","call":"“Create Light”","description":"By calling upon Divination’s link to revelation, you are able to produce one of revelation’s visible aspects: light. This allows you to use a light source that you carry with you, whether it is a glow stick, a mystic orb, a magical lantern, a light-up book, et cetera. Keep in mind that such lights should be dim, not much more luminous than a glowstick; consult the “Nighttime, Darkness, \u0026 Light Sources” section of chapter 6 of the Twin Mask Rulebook for more guidance on the recommended brightness of light sources. This spell will last indefinitely, as long as your light source lasts. Every time you douse or turn off your light source, though, you must cast this spell again if you want to re-light it.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Foretell Danger","tier":"Apprentice","core":true,"delivery":"Self","casting":"Augur","call":"[None]","description":"Sifting through vague portents of the future, you seek to find common threads that could suggest when immediate danger is approaching. This is the most fundamental (and weakest) of the divinatory spells that peer into possible futures. You are able to determine if you or your surroundings (that is, the town around you) will be subject to large-scale danger within the next 30 minutes or so, and you can often get some indication of how fearsome that danger might be.\nOften, a Story Staff member will not be immediately available to provide you with the resulting information; at those times, “the divinatory vision is unclear in its meaning,” and you must “ponder the signs.” When you have an opportunity, seek out a Story Staff member to get that information.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Light of Knowledge*","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Create","call":"\"Create Light\"","description":"As a diviner, you know that most of the guidance that people need has nothing to do with seeing the future. Most of the time people only need to be shown the light to find their own way. You have become well acquainted with the light. This allows you to use a light source that you carry with you. Keep in mind that such lights should be dim, not much more luminous than a glowstick.\n\nThis spell will last indefinitely as long as it is in your possession. It may not be left unattended, but may be passed to a willing recipient. If passed off in this way, explain that the duration becomes 30 minutes and that if the duration expires a good faith effort should be made to completely conceal light. You may not cast this spell again for 30 minutes or until it is returned.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Sense Aura","tier":"Apprentice","core":false,"delivery":"Self","casting":"Perceive","call":"\"Sense Emotion\"","description":"This spell allows the diviner to sense if a particular emotion is tied to an object. This spell does not work on living creatures as their emotions are in such constant flux","note":"SPECIAL NOTE\nUnlike nearly all other spells, this spell costs 0 mana to cast.","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Sense the Arcane","tier":"Apprentice","core":true,"delivery":"Self","casting":"Perceive","call":"\"Sense Magic\"","description":"This fundamental spell, crucial for various efforts of magical scholarship, allows you to understand the flow of magic and gather information about how various magics are currently affecting a person or thing. If that person or thing is radiating or being influenced by magic, this spell will confirm it, and sometimes (at Staff discretion) you may gain additional information about the specific types and strengths of magic involved. This spell will not generally be helpful in determining a person’s heritage or bloodline.\nOften, a Story Staff member will not be immediately available to provide you with the resulting information; at those times, “the divinatory vision is unclear in its meaning,” and you must “ponder the signs.” When you have an opportunity, seek out a Story Staff member to get that information.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Strike of Light","tier":"Apprentice","core":true,"delivery":"Touch","casting":"Imbue","call":"“Imbue Light”","description":"Through your ability to delve into the magical metaphysics related to light (revelation, banishing darkness, blinding, et cetera), you can temporarily invest some of that energy into a weapon. The affected weapon will deal Light damage for its next attack; while this does not increase the numerical damage it deals, it may have special effects on anything weak against Light. The weapon does not need to be capable of lighting up in any way; this spell’s magical properties are not necessarily tied to visible light.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Cecil's Comprehend Cute Critters","tier":"Journeyman","core":false,"delivery":"Self","casting":"Pet","call":"\"Comprehend Animalistic Intent\"","description":"This spell allows you to understand, but not speak to, animals. Upon casting you gain understanding of the basic motivation, drive, desire, and goals of a nearby animal.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Cecil's Herbiverbal","tier":"Journeyman","core":false,"delivery":"Touch","casting":"Sense","call":"Special","description":"Originally created by Ritari Cecil of Kaelin, this spell reaches further into the twisting web of perception-versus-reality that all living thing share, to glean some minor amount of information from something that would not normally be viewed as sentient. Many things you cannot converse with nonetheless have knowledge that can be uncovered, if you\nknow how to look.\nThis spell requires the caster to have the Lore: Nature skill in order to successfully cast. You may cast this spell within 3 seconds of casting \"Sense Passage\" while touching a living plant. If the creature you specify in your Sense Passage casting has passed through the area, you may ask a single, specific follow-up questions that a plant may be able to answer based on its very limited perception. At staff discretion, the plant's answers may be unclear. Example questions include, but are NOT limited to:\n*Did the creature stop here?\n*How long was the creature in this area? \n*Which direction did the creature go? \n*Did the creature leave any liquids behind?\n*This spell may only be cast once every 30 minutes.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Defensive Portent","tier":"Journeyman","core":true,"delivery":"Touch","casting":"Augur, Bestow","call":"“Imbue 3 Armor”","description":"By peering into the possible future as it swirls around a particular individual (or yourself), you are able to provide a magical warning that will protect that person from some amount of physical harm. You should explain to the target that this bestowed armor will last for 30 minutes or until used. Bestowed armor cannot stack with other bestowed armor, but it does stack with normal armor and, for instance, the armor produced by the Warding spell “Warded Armor.” In such combinations, damage must punch through the Defensive Portent before dealing damage to other armor types.","note":"Core","recipe":"New","source":"Spell Compendium"},{"category":"Divination","name":"Hiero's Damning Revelation","tier":"Journeyman","core":false,"delivery":"Gaze","casting":"Concentrate","call":"\"By my Gaze, 1 Light\"","description":"By gazing into the often-terrible future, your eyes begin to burn with a searing light. Those caught in your gaze are scorched by that terrifying revelation.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Hiero's Precient Ploy","tier":"Journeyman","core":false,"delivery":"Self","casting":"Reaction","call":"\"Feint\"","description":"The majority of a Diviner's craft relies on careful manipulation of the energies of magic coupled with their own calm, trained mental focus, to peer across the strands of time and fate to see potential futures or glimpse that which is hidden. Sometimes, however, that power can manifest itself in more unstructured and immediate ways. This spell allows a diviner to grab a glimpse of actions mere moments into the future and use that knowledge to avoid over-committing to an attack that their opponent was sure to counter, leaving the opponent at a disadvantage as they expend their energy in vain.\n\nWhen an opponent calls \"Dodge\" or \"Parry\" to cancel a Melee or Touch Attack you make, you may immediately cast this spell to call \"Feint,\" retaining the use of any skills or abilities used in making your Melee or Touch Attack. This follows all the rules and has all the same restrictions as the Feint skill, meaning you may only use One-Handed or Short Weapons, and you must have your other hand completely empty.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Predict Danger","tier":"Journeyman","core":true,"delivery":"Self","casting":"Augur","call":"[None]","description":"By sifting and weighing the threads of possible futures, you are able to delve more deeply into a vision you received from the Foretell Danger spell, investigating its specifics more closely. This spell can only be cast in conjunction with Foretell Danger—it allows you to follow up on that spell by asking a simple, yes-or-no question about any dangers it foretold. You may cast this spell multiple times after a single casting of Foretell Danger, asking a different question each time.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Sense Function","tier":"Journeyman","core":false,"delivery":"Touch","casting":"Perceive","call":"\"Sense Function\"","description":"This spell allows the diviner to sense the basic purpose that the object being touched was designed for. This has no effect on living creatures or once living corpses.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Sense of the Seas","tier":"Journeyman","core":false,"delivery":"Self","casting":"Augur","call":"","description":"Using techniques developed by the sages and diviners of seafaring cultures, you establish a mental link to a body of water or portion of the sea. Its waves, ripples, and currents are all threads in a complex story, and you can read disturbances in them to gain a general sense of what has been happening in the chosen area.\n\nThis spell can only be cast with the involvement of Story Staff, and gives you a vague sense of what is happening in a region of water. This information is never specific, such as locating specific people or objects, but can reveal ship movements, details about the state of the water, or other large-scale disturbances, but cannot give you information below the surface. The actual information provided is always at the discretion of Staff. Additional information may be provided if you use a bowl of water in place of your Divination Focus when casting this spell.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Sense Passage","tier":"Journeyman","core":true,"delivery":"Touch","casting":"Perceive","call":"\"Sense Passage\"","description":"By reading the auras and the dim awareness of living plants in an area, you gain general information about what kinds of creatures, people, or objects passed through the area most recently, with more emphasis given to large, disruptive, or noteworthy events. You can direct your investigation to determine if something specific has passed through the area, as well. Sometimes (at Staff discretion), you may also be able to discern other information that the plants have picked up on.\nOften, a Story Staff member will not be immediately available to provide you with the resulting information; at those times, “the divinatory vision is unclear in its meaning,” and you must “ponder the signs.” When you have an opportunity, seek out a Story Staff member to get that information.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Sense Possession","tier":"Journeyman","core":false,"delivery":"Self","casting":"Perceive","call":"\"Sense Possession\"","description":"The spell allows the diviner to sense if an individual or object is possessed by a spirit.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Cecil's Detect Identity","tier":"Master","core":false,"delivery":"Touch","casting":"Touch","call":"\"Detect Identity\"","description":"After successfully removing someone's disguise, touch the target for 30 seconds and call \"Detect Identity\". Target must reveal their name and identity to you. Does not work on greater beings to discover \"True Names\".","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Cecil's Guardian Angel","tier":"Master","core":false,"delivery":"Special","casting":"Extended Bestow","call":"\"Imbue Guard Parry\"","description":"Originally created by Ritari Cecil of Kaelin, this unassuming spell pivots the diviner's ability to use glimpses of their own future to narrowly avoid harm, and refracts it externally. By going through a slow, methodical process of reading a creature's fortune (using tarot, palm reading, casting lots, or some other process) the diviner can tune their vision of what could be to a unique end: not an instance of protecting the creature from harm, but an instance where they, in turn, protect another.\n\nA character may only benefit from this effect once per game. You must spend at least 3 minutes performing a role-played fortune telling, using the method of your choice. As part of this reading, you describe a potential future in which the character intervenes in the death of another. After the 3 minutes have elapsed, you may call, \"Bestow Guard Parry.\" You must explain as part of this fortune telling that this spell grants a single use of \"Guard Parry\" that may not be used on yourself under any circumstances, you must explain the mechanics of the Guardian skill, and you must explain that this guard parry lasts until used, or until the next sunrise / sunset, whichever comes first. Finally, you must explain that they may not benefit from this spell again during this Twin Mask game.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Eyes of the Stars","tier":"Master","core":true,"delivery":"Gaze","casting":"Stare","call":"“By My Gaze, Stun by Light”","description":"Even without perfect mastery of the mind-rending chaos that the art of Divination must peer through in order to draw useful information from the tangled weave of time… You can still inflict that same confusion on other people. By letting the secrets of the universe spill from your eyes, you can create an invisible lance of revelatory energy that strikes an enemy and Stuns them for 3 seconds.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Meditative Defense","tier":"Master","core":true,"delivery":"Self","casting":"Meditate","call":"“Self Imbue Parry”","description":"By exploring the weave of possible near futures that might befall you, and focusing your Divinatory powers on potential combat and harm, you can gain the insight to block one particularly dangerous blow that will be directed at you. You Imbue upon yourself one use of the PARRY skill; it will last for 30 minutes or until used.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Meditative Wounding Strike","tier":"Master","core":false,"delivery":"Self","casting":"Meditate","call":"Imbue Great Strike","description":"After meditating on the weave and all possible futures, you gain one use of a Great Strike till used, or until 30 mnutes have expired. This skill functions as normal.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Sense Final Moment","tier":"Master","core":false,"delivery":"Touch","casting":"Touch","call":"Sense Last Action","description":"This spell allows the diviner to sense the last action that an object was used to do. Spells of this nature are dangerous however, as seeing into the past is a violation of nature. When casting this spell, the diviner takes 3 damage to their eyes. Corpses are considered objects for the purpose of this spell, however seeing the last action of the corpse will never reveal their killer, though it may reveal how they were killed.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Block Divination","tier":"Grandmaster","core":false,"delivery":"","casting":"","call":"","description":"","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Cecil and Piroska's Will of the Ancestors","tier":"Grandmaster","core":false,"delivery":"Bestow","casting":"Self","call":"","description":"","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Eyes of the Void","tier":"Grandmaster","core":false,"delivery":"Gaze","casting":"Reflexive","call":"Resist, By My Gaze 3 Darkness","description":"When targeted by a Gaze Attack you may resist it then immediately retaliate with a gaze attack of your own.  This spell allows one to look into the void and take a bit of it into their eyes. The next time that an opponent would target you with a gaze attack, they gaze into the void instead, and it retaliates in kind.\"","note":"","recipe":"","source":"Spell Compendium"},{"category":"Divination","name":"Glimpse the Future","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Augur","call":"","description":"You may glimpse into the future and partake in a vision of what might come should forces continue as they are. You cannot control what you see, and side effects are common such as temporary loss of sight, madness, etc. Some diviners are reluctant to cast this spell as they may see their own deaths.\nNote: If a staff member is not available, the answer to the divin
