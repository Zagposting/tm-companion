Specify Field)","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"“Bid – Lore: (Specify Field)”","description":"This skill functions exactly like LORE: (Specify Field), except that a RESTRICTED LORE cannot be taught by players to other players or NPCs under any circumstances. These LORES can only be taught or signed off by Twin Mask Story Staff members. (See the “Training” section in chapter 5 for more information about learning new skills.)","usage":"You may call “Bid Lore: (Subject)” and ask a question of a nearby Twin Mask Story Staff member. This question may be as simple as, “Do I know anything about this?” or as specific as you like.","note":""},{"category":"Knowledge","name":"Research","cost":"6 CP","prerequisite":"Non-Illiterate","returnsWith":"—","call":"—","description":"By tracking down obscure records of interviews, cross-checking possible errors, and searching through dusty tomes, you have developed your ability to draw a great deal of useful information from various secondary and tertiary sources of knowledge, as long as you have a little help. In order to use this skill, you must 1) have access to a Library item tag or a properly-tagged “Research Object: [Name of Subject]” for your intended field of study; 2) have a LORE skill (which includes possible RESTRICTED LORE or NATIVE LORE skills) that corresponds to the subject you want to study; and 3) have at least 2 “research assistants” to aid you in your efforts. Although those assistants do not need to have any particular skills in order to help, they must be present and engaged during the entire duration of the RESEARCH skill, and their fields of expertise might augment your results. If those conditions are met, then—once per game—you can spend 30 uninterrupted minutes role-playing the process of using the Library or Research Object to investigate your subject (generally, by reading and taking notes, making charts to track correspondences, discussing the subject with your assistants, etc.). It is wise to spend some of this time on deciding exactly what questions you would like to ask Twin Mask Staff members (and perhaps to write those specific questions down)! At the end of that 30-minute period, you may have your assistants sign their names on the provided lines on the back of your character sheet, then take the Library or Research Object item tag to Logistics, where (if you are lucky) you can pose your questions directly to the Story Staff member on duty. More frequently, you will instead write down the LORE skills involved in the research, and your name, on a log sheet that will let a Staff member answer your question later. At the Staff member’s discretion, the additional LORE (or NATIVE LORE, or BARDIC KNOWLEDGE) skills of your assistants may come into play, producing additional insight. For more straightforward uses of RESEARCH, though—generally, progressing along a Research Track (like researching a new spell) or uncovering the properties of a “researchable item”—you will not have to fill out any forms at Logistics.","usage":"Once per game, you may spend 30 minutes role-playing researching a specific topic with at least 2 research assistants. You then bring your character sheet (with the signatures of your research assistants on the back) and your Library building tag or tagged Research Object to Logistics. You then fill out either an Open-Ended Research Form for your topic, or have a Staff member on duty sign off on an active research tag. Restriction: must have a “Library” or “Research Object” tag matching your LORE skill","note":""},{"category":"Knowledge","name":"Alchemical Examination","cost":"3 CP","prerequisite":"Lore: Alchemy","returnsWith":"—","call":"“Detect Alchemy”","description":"You have studied alchemy, and you have used that knowledge to develop tests that can detect alchemical tampering with various foods and materials. When you use this skill, you must spend at least 30 seconds studying something that you suspect of harboring alchemical additives (a category that includes poisons). You can use this skill to investigate foods, drinks, surfaces (like door handles), people, dead bodies, body parts, and so on. After the 30-second investigation period, you may find a Twin Mask Staff member and ask for information about any alchemical effects that influenced your subject. The Staff member may dictate that additional investigation time is needed to determine the answer to your question—but, after that added time, they will provide you with the relevant information.","usage":"You may spend 30 seconds role-playing studying an object, then ask a nearby Twin Mask Story Staff member what you learned about the object in question using ALCHEMICAL EXAMINATION. INFLUENCE To fully understand how this set of skills will function in game, consult Appendix 1: Influence. In short, they represent your character’s ability to affect the world of Adelrune beyond the scope of what Twin Mask can simulate during a game session. They allow you to collect interpersonal influence, in the form of a number of Influence Cards of varying types, which can then be spent to recruit particular kinds of allies and to prompt those allies to perform various tasks for you.","note":""},{"category":"Influence","name":"Academic Standing: Rank 1","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have begun to make influential contacts with various scholars, teachers, religious leaders, writers, and experts in many fields. At some point during each Twin Mask game session, you may report to Logistics to gain 1 Academic Influence Card. Generally speaking, you can spend this card to aid in various fields of research, develop new spells and items, gather hidden information, hire spellcasters and scholars to further your concerns, and so on. Consult Appendix 1: Influence for details on how to use Influence cards.","usage":"When you collect your Check-In Resources, you receive 1 Academic Influence card.","note":"this skill does not give you any official standing in any academic groups."},{"category":"Influence","name":"Academic Standing: Rank 2","cost":"4 CP","prerequisite":"Academic Standing: Rank 1","returnsWith":"—","call":"—","description":"This skill is effectively identical to ACADEMIC STANDING: RANK 1, except that you gain 2 Academic Influence Cards during each game instead of 1. This skill supersedes all lower-ranked versions of ACADEMIC STANDING (that is, with multiple ACADEMIC STANDING skills, you will only gain cards equal to the highest rank you have achieved).","usage":"When you collect your Check-In Resources, you receive 2 Academic Influence cards.","note":""},{"category":"Influence","name":"Academic Standing: Rank 3","cost":"4 CP","prerequisite":"Academic Standing: Rank 2","returnsWith":"—","call":"—","description":"This skill is effectively identical to ACADEMIC STANDING: RANK 1, except that you gain 3 Academic Influence Cards during each game instead of 1. This skill supersedes all lower-ranked versions of ACADEMIC STANDING (that is, with multiple ACADEMIC STANDING skills, you will only gain cards equal to the highest rank you have achieved).","usage":"When you collect your Check-In Resources, you receive 3 Academic Influence cards.","note":""},{"category":"Influence","name":"Academic Standing: Rank 4","cost":"4 CP","prerequisite":"Academics Standing: Rank 3","returnsWith":"—","call":"—","description":"This skill is effectively identical to ACADEMIC STANDING: RANK 1, except that you gain 4 Academic Influence Cards during each game instead of 1. This skill supersedes all lower-ranked versions of ACADEMIC STANDING (that is, with multiple ACADEMIC STANDING skills, you will only gain cards equal to the highest rank you have achieved).","usage":"When you collect your Check-In Resources, you receive 4 Academic Influence cards.","note":""},{"category":"Influence","name":"Economic Standing: Rank 1","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have begun to make influential contacts with merchants, trading consortiums, and purveyors of specialty goods. At some point during each Twin Mask game session, you may report to Logistics to gain 1 Economic Influence Card. Generally speaking, you can spend this card to make arrangements with NPC merchants, purchase specific types of goods or equipment, repair objects, gather information, and so on. Consult Appendix 1: Influence for details on how to use Influence cards.","usage":"When you collect your Check-In Resources, you receive 1 Economic Influence card.","note":"this skill does not give you any official standing in any economic groups."},{"category":"Influence","name":"Economic Standing: Rank 2","cost":"4 CP","prerequisite":"Economic Standing: Rank 1","returnsWith":"—","call":"—","description":"This skill is effectively identical to ECONOMIC STANDING: RANK 1, except that you gain 2 Economic Influence Cards during each game instead of 1. This skill supersedes all lower-ranked versions of ECONOMIC STANDING (that is, with multiple ECONOMIC STANDING skills, you will only gain cards equal to the highest rank you have achieved).","usage":"When you collect your Check-In Resources, you receive 2 Economic Influence cards.","note":""},{"category":"Influence","name":"Economic Standing: Rank 3","cost":"4 CP","prerequisite":"Economic Standing: Rank 2","returnsWith":"—","call":"—","description":"This skill is effectively identical to ECONOMIC STANDING: RANK 1, except that you gain 3 Economic Influence Cards during each game instead of 1. This skill supersedes all lower-ranked versions of ECONOMIC STANDING (that is, with multiple ECONOMIC STANDING skills, you will only gain cards equal to the highest rank you have achieved).","usage":"When you collect your Check-In Resources, you receive 3 Economic Influence cards.","note":""},{"category":"Influence","name":"Economic Standing: Rank 4","cost":"4 CP","prerequisite":"Economic Standing: Rank 3","returnsWith":"—","call":"—","description":"This skill is effectively identical to ECONOMIC STANDING: RANK 1, except that you gain 4 Economic Influence Cards during each game instead of 1. This skill supersedes all lower-ranked versions of ECONOMIC STANDING (that is, with multiple ECONOMIC STANDING skills, you will only gain cards equal to the highest rank you have achieved).","usage":"When you collect your Check-In Resources, you receive 4 Economic Influence cards.","note":""},{"category":"Influence","name":"Political Standing: Rank 1","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have begun to make influential contacts with various governors, courtiers, community leaders, diplomats, and other people connected to the political processes of various nations, (sometimes) all the way up to the top. At some point during each Twin Mask game session, you may report to Logistics to gain 1 Political Influence Card. Generally speaking, you can spend this card to gather politically-relevant information, make contact with influential people, organize parties and other gatherings, send messages, learn proper diplomatic protocols, and so on. Consult Appendix 1: Influence for details on how to use Influence cards.","usage":"When you collect your Check-In Resources, you receive 1 Political Influence card.","note":"this skill does not give you any official standing in any political groups."},{"category":"Influence","name":"Political Standing: Rank 2","cost":"4 CP","prerequisite":"Political Standing: Rank 1","returnsWith":"—","call":"—","description":"This skill is effectively identical to POLITICAL STANDING: RANK 1, except that you gain 2 Political Influence Cards during each game instead of 1. This skill supersedes all lower-ranked versions of POLITICAL STANDING (that is, with multiple POLITICAL STANDING skills, you will only gain cards equal to the highest rank you have achieved).","usage":"When you collect your Check-In Resources, you receive 2 Political Influence cards.","note":""},{"category":"Influence","name":"Political Standing: Rank 3","cost":"4 CP","prerequisite":"Political Standing: Rank 2","returnsWith":"—","call":"—","description":"This skill is effectively identical to POLITICAL STANDING: RANK 1, except that you gain 3 Political Influence Cards during each game instead of 1. This skill supersedes all lower-ranked versions of POLITICAL STANDING (that is, with multiple POLITICAL STANDING skills, you will only gain cards equal to the highest rank you have achieved).","usage":"When you collect your Check-In Resources, you receive 3 Political Influence cards.","note":""},{"category":"Influence","name":"Political Standing: Rank 4","cost":"4 CP","prerequisite":"Political Standing: Rank 3","returnsWith":"—","call":"—","description":"This skill is effectively identical to POLITICAL STANDING: RANK 1, except that you gain 4 Political Influence Cards during each game instead of 1. This skill supersedes all lower-ranked versions of POLITICAL STANDING (that is, with multiple POLITICAL STANDING skills, you will only gain cards equal to the highest rank you have achieved).","usage":"When you collect your Check-In Resources, you receive 4 Political Influence cards.","note":""},{"category":"Influence","name":"Underworld Standing: Rank 1","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have begun to make influential contacts with various smugglers, crime lords, assassins, informants, spies, and resistance groups. At some point during each Twin Mask game session, you may report to Logistics to gain 1 Underworld Influence Card. Generally speaking, you can spend this card to arrange for chances to assassinate people, cause damage and distractions, buy illegal or smuggled goods, have spies gather information for you, and so on. Consult Appendix 1: Influence for details on how to use Influence cards.","usage":"When you collect your Check-In Resources, you receive 1 Underworld Influence card.","note":"this skill does not give you any official standing in any criminal or underworld groups."},{"category":"Influence","name":"Underworld Standing: Rank 2","cost":"4 CP","prerequisite":"Underworld Standing: Rank 1","returnsWith":"—","call":"—","description":"This skill is effectively identical to UNDERWORLD STANDING: RANK 1, except that you gain 2 Underworld Influence Cards during each game instead of 1. This skill supersedes all lower-ranked versions of UNDERWORLD STANDING (that is, with multiple UNDERWORLD STANDING skills, you will only gain cards equal to the highest rank you have achieved).","usage":"When you collect your Check-In Resources, you receive 2 Underworld Influence cards.","note":""},{"category":"Influence","name":"Underworld Standing: Rank 3","cost":"4 CP","prerequisite":"Underworld Standing: Rank 2","returnsWith":"—","call":"—","description":"This skill is effectively identical to UNDERWORLD STANDING: RANK 1, except that you gain 3 Underworld Influence Cards during each game instead of 1. This skill supersedes all lower-ranked versions of UNDERWORLD STANDING (that is, with multiple UNDERWORLD STANDING skills, you will only gain cards equal to the highest rank you have achieved.)","usage":"When you collect your Check-In Resources, you receive 3 Underworld Influence cards.","note":""},{"category":"Influence","name":"Underworld Standing: Rank 4","cost":"4 CP","prerequisite":"Underworld Standing: Rank 3","returnsWith":"—","call":"—","description":"This skill is effectively identical to UNDERWORLD STANDING: RANK 1, except that you gain 4 Underworld Influence Cards during each game instead of 1. This skill supersedes all lower-ranked versions of UNDERWORLD STANDING (that is, with multiple UNDERWORLD STANDING skills, you will only gain cards equal to the highest rank you have achieved).","usage":"When you collect your Check-In Resources, you receive 4 Underworld Influence cards.","note":""},{"category":"Influence","name":"Military Standing: Rank 1","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have begun to make influential contacts with military administrators, mercenary leaders, commanders, and soldiers in the field. At some point during each Twin Mask game session, you may report to Logistics to gain 1 Military Influence Card. Generally speaking, you can spend this card to recruit and train soldiers and knights, help carry out military maneuvers in the field, hire mercenaries, and so on. Consult Appendix 1: Influence for details on how to use Influence cards.","usage":"When you collect your Check-In Resources, you receive 1 Military Influence card.","note":"this skill does not give you any official standing in any military groups."},{"category":"Influence","name":"Military Standing: Rank 2","cost":"4 CP","prerequisite":"Military Standing: Rank 1","returnsWith":"—","call":"—","description":"This skill is effectively identical to MILITARY STANDING: RANK 1, except that you gain 2 Military Influence Cards during each game instead of 1. This skill supersedes all lower-ranked versions of MILITARY STANDING (that is, with multiple MILITARY STANDING skills, you will only gain cards equal to the highest rank you have achieved).","usage":"When you collect your Check-In Resources, you receive 2 Military Influence cards.","note":""},{"category":"Influence","name":"Military Standing: Rank 3","cost":"4 CP","prerequisite":"Military Standing: Rank 2","returnsWith":"—","call":"—","description":"This skill is effectively identical to MILITARY STANDING: RANK 1, except that you gain 3 Military Influence Cards during each game instead of 1. This skill supersedes all lower-ranked versions of MILITARY STANDING (that is, with multiple MILITARY STANDING skills, you will only gain cards equal to the highest rank you have achieved).","usage":"When you collect your Check-In Resources, you receive 3 Military Influence cards.","note":""},{"category":"Influence","name":"Military Standing: Rank 4","cost":"4 CP","prerequisite":"Military Standing: Rank 3","returnsWith":"—","call":"—","description":"This skill is effectively identical to MILITARY STANDING: RANK 1, except that you gain 4 Military Influence Cards during each game instead of 1. This skill supersedes all lower-ranked versions of MILITARY STANDING (that is, with multiple MILITARY STANDING skills, you will only gain cards equal to the highest rank you have achieved).","usage":"When you collect your Check-In Resources, you receive 4 Military Influence cards.","note":""},{"category":"Gathering","name":"Mining: Rank 1","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have begun to learn, develop, and master efficient ways to extract precious stones and metals from the earth, and you devote some of your time to delving into caves and mines in order to do so. At some point during each Twin Mask game session, you may report to Logistics to gain 1 “Mining Point” to spend on gaining materials from the table below. You cannot save these points between different Twin Mask games—so, for instance, the only way to get Obsidian (a 4-point item) is to have MINING: RANK 4 and then choose to spend all 4 of your resulting points, all 154 at once, to receive Obsidian ×1. With this skill at Rank 1, you can get either Coal ×1, Salt ×1, or Stone ×1.","usage":"When you collect your Check-In Resources, you receive 1 point of resources from the MINING list.","note":"in addition to this standard use of the MINING skill, you should be on the lookout for situations related to mining that may come up during “mods” away from the main space of the Twin Mask game. If you mention that you have the MINING skill during such an event, a Staff member may occasionally have the option to let you acquire extra materials or excavate certain areas. 1 Point: Coal, Salt, or Stone 2 Points: Iron, Quartz, Copper, or Marble 3 Points: Mercury, Sulfur, Silver, or Manganese 4 Points: Obsidian, Gold, a Soul Gem, or a Spell Crystal"},{"category":"Gathering","name":"Mining: Rank 2","cost":"4 CP","prerequisite":"Mining: Rank 1","returnsWith":"—","call":"—","description":"This skill is effectively identical to MINING: RANK 1, except that you gain 2 “Mining Points” to spend during each game instead of 1. This skill supersedes all lower-ranked versions of MINING (that is, you only get a total of 2 points’ worth of materials, rather than a cumulative sum of all your MINING skills). With this skill, you can get either a single 2-point material (such as iron ×1) or two 1-point materials (such as stone ×2).","usage":"When you collect your Check-In Resources, you receive 2 points of resources from the MINING list.","note":""},{"category":"Gathering","name":"Mining: Rank 3","cost":"4 CP","prerequisite":"Mining: Rank 2","returnsWith":"—","call":"—","description":"This skill is effectively identical to MINING: RANK 1, except that you gain 3 “Mining Points” to spend during each game instead of 1. This skill supersedes all lower-ranked versions of MINING (that is, you only get a total of 3 points’ worth of materials, rather than a cumulative sum of all your MINING skills). With this skill, you can get a single 3-point material, such as mercury ×1, or some combination of less valuable materials.","usage":"When you collect your Check-In Resources, you receive 3 points of resources from the MINING list.","note":""},{"category":"Gathering","name":"Mining: Rank 4","cost":"4 CP","prerequisite":"Mining: Rank 3","returnsWith":"—","call":"—","description":"This skill is effectively identical to MINING: RANK 1, except that you gain 4 “Mining Points” to spend during each game instead of 1. This skill supersedes all lower-ranked versions of MINING (that is, you only get a total of 4 points’ worth of materials, rather than a cumulative sum of all your MINING skills). With this skill, you can get either a single 4-point material, such as obsidian ×1, or some combination of less valuable materials.","usage":"When you collect your Check-In Resources, you receive 4 points of resources from the MINING list.","note":""},{"category":"Gathering","name":"Herbalism: Rank 1","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have learned which plants in the surrounding area have value as alchemical reagents and crafting materials, and therefore you spend time ranging through the countryside to find them. At some point during each Twin Mask game session, you may report to Logistics to gain 1 Herb item tag (which contains 5 uses of that particular herb). These herbs are useful for making potions using the STABLE ALCHEMY skill, creating foods with the COOKING skills, and crafting various other objects with other skills. Each herb tag will have one of the following 11 properties, which you should specify when you request your herb tag: Enchantment, Enhancement, Entropic, Hallucination, Healing, Poisonous, Purification, Sedative, Spiritual, Stimulant, and Rejuvenation. While not able to be gained via check-in, specific named herbs may exist within the Twin Mask gamespace that function identically to the ones listed here.","usage":"When you collect your Check-In Resources, you receive 1 herb with (at least) one property you specify.","note":"in addition to this standard use of the HERBALISM skill, you should be on the lookout for herb-gathering opportunities that may come up during “mods” away from the main space of the Twin Mask game. If you mention that you have the HERBALISM skill during such an event, a Staff member may occasionally have the option to let you acquire extra materials."},{"category":"Gathering","name":"Herbalism: Rank 2","cost":"4 CP","prerequisite":"Herbalism: Rank 1","returnsWith":"—","call":"—","description":"This skill is effectively identical to HERBALISM: RANK 1, except that you get 2 herb tags each game instead of 1. This skill supersedes all lower-ranked versions of HERBALISM (that is, you only get a total of 2 herbs, rather than a cumulative sum based on all of your HERBALISM skills).","usage":"When you collect your Check-In Resources, you receive 2 herbs, each with (at least) one property you specify.","note":""},{"category":"Gathering","name":"Herbalism: Rank 3","cost":"4 CP","prerequisite":"Herbalism: Rank 2","returnsWith":"—","call":"—","description":"This skill is effectively identical to HERBALISM: RANK 1, except that you get 3 herb tags each game instead of 1. This skill supersedes all lower-ranked versions of HERBALISM (that is, you only get a total of 3 herbs, rather than a cumulative sum based on all of your HERBALISM skills).","usage":"When you collect your Check-In Resources, you receive 3 herbs, each with (at least) one property you specify.","note":""},{"category":"Gathering","name":"Herbalism: Rank 4","cost":"4 CP","prerequisite":"Herbalism: Rank 3","returnsWith":"—","call":"—","description":"This skill is effectively identical to HERBALISM: RANK 1, except that you get 4 herb tags each game instead of 1. This skill supersedes all lower-ranked versions of HERBALISM (that is, you only get a total of 4 herbs, rather than a cumulative sum based on all of your HERBALISM skills).","usage":"When you collect your Check-In Resources, you receive 4 herbs, each with (at least) one property you specify.","note":""},{"category":"Gathering","name":"Woodcutting: Rank 1","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You know how to properly fell trees and saw them into useable planks of wood, and you spend time working through the surrounding woodlands in order to do so. At some point during each Twin Mask game session, you may report to Logistics to gain 1 random, valuable Wood item tag. These planks of wood are useful for crafting various goods and materials, as listed in the crafting skills later in this chapter. Below, there is a representative sample of various different kinds of wood you can get with this skill—there are many more kinds of wood than these. Each plank, however, will consistently have one or more of the following 5 properties: Dense, Durable, Flexible, Lightweight, and Strong.","usage":"When you collect Check-In Resources, you receive 1 random “Wood” tagged item.","note":"if a craft recipe calls for wood that has a combination of properties (such as “Wood (Strong + Durable)”), you can technically use two or more different pieces of wood—one that is Strong and another that is Durable, for instance—to fulfill that requirement. When recipes call for specific wood properties, too, you may also use wood that has additional properties; it is fine to “go over” the minimum requirements. Along with standard uses of the WOODCUTTING skill, you should be on the lookout for wood-gathering opportunities that may come up during “mods” away from the main space of the Twin Mask game. If you mention that you have the WOODCUTTING skill during such an event, a Staff member may occasionally have the option to let you acquire extra materials. Ash Dense, Durable, Flexible, Strong Blackwood Dense, Durable, Strong Chestnut Durable Fig Flexible Oak Dense, Durable, Strong Pear Dense Pine Flexible, Lightweight Sycamore Dense, Lightweight, Strong Willow Flexible, Lightweight"},{"category":"Gathering","name":"Woodcutting: Rank 2","cost":"4 CP","prerequisite":"Woodcutting: Rank 1","returnsWith":"—","call":"—","description":"This skill is effectively identical to WOODCUTTING: RANK 1, except that you get 2 random Wood item tags during each game instead of 1. This skill supersedes all lower-ranked versions of WOODCUTTING (that is, you only get a total of 2 planks of wood, rather than a cumulative sum based on all of your WOODCUTTING skills).","usage":"When you collect Check-In Resources, you receive 2 random “Wood” tagged items.","note":""},{"category":"Gathering","name":"Woodcutting: Rank 3","cost":"4 CP","prerequisite":"Woodcutting: Rank 2","returnsWith":"—","call":"—","description":"This skill is effectively identical to WOODCUTTING: RANK 1, except that you get 3 random Wood item tags during each game instead of 1. This skill supersedes all lower-ranked versions of WOODCUTTING (that is, you only get a total of 3 planks of wood, rather than a cumulative sum based on all of your WOODCUTTING skills).","usage":"When you collect Check-In Resources, you receive 3 random “Wood” tagged items.","note":""},{"category":"Gathering","name":"Woodcutting: Rank 4","cost":"4 CP","prerequisite":"Woodcutting: Rank 3","returnsWith":"—","call":"—","description":"This skill is effectively identical to WOODCUTTING: RANK 1, except that you get 4 random Wood item tags during each game instead of 1. This skill supersedes all lower-ranked versions of WOODCUTTING (that is, you only get a total of 4 planks of wood, rather than a cumulative sum based on all of your WOODCUTTING skills).","usage":"When you collect Check-In Resources, you receive 4 random “Wood” tagged items.","note":""},{"category":"Gathering","name":"Hunting: Rank 1","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You are at home in the woods and fields: silent enough to ambush your prey, lethal enough to bring tough animals down, and dogged enough to follow wounded prey if necessary. The HUNTING skill has two distinct functions. The first is somewhat conditional: it lets you follow the tracks of animals and people when you are heading out of Port Frey. If you are on a “mod” away from the main Twin Mask game space—or on the way to such an adventure—and are accompanied by a Staff member, you can remind that Staff member that you have HUNTING, then ask to look for tracks and possibly follow them. (If you are following a fleeing person or animal in this way, you must begin tracking them within 30 minutes of their leaving in order to have any chance of catching up.) To use this ability at night, you will need some kind of light source. The second function of HUNTING is more clear-cut: at some point during each Twin Mask game session, you may report to Logistics to gain 1 “Hunting Point” to spend on gaining materials from the table below. You cannot save these points between different Twin Mask games—so, for 158 instance, the only way to get Fae Blood (a 4-point item) is to have HUNTING: RANK 4 and then choose to spend all 4 of your resulting points, all at once, to receive Fae Blood ×1. With this skill at Rank 1, you can get either Bone ×1, Feathers ×1, Honey ×1, or Food ×1.","usage":"When you collect your Check-In Resources, you receive 1 point of resources from the HUNTING list. You can also inform a Twin Mask Story Staff member on a mod that you would like to track a person or animal using HUNTING.","note":"when you come across situations in which your skill as a hunter would logically be productive, feel free to ask any Staff members if HUNTING can provide you with any extra information or materials. If you kill a foe (such as a giant wolf) that could be skinned, for instance, a Staff member might have the option to let you acquire a pelt or hide. 1 Point: Bone, Feathers, Honey, or Food (with 1-month expiration) 2 Points: Soft Pelt or Demon Blood 3 Points: Large Hide or Celestial Blood 4 Points: Fae Blood"},{"category":"Gathering","name":"Hunting: Rank 2","cost":"4 CP","prerequisite":"Hunting: Rank 1","returnsWith":"—","call":"—","description":"This skill is effectively identical to HUNTING: RANK 1, except that you gain 2 “Hunting Points” to spend during each game instead of 1. This skill supersedes all lower-ranked versions of HUNTING (that is, you only get a total of 2 points’ worth of materials, rather than a cumulative sum of all your HUNTING skills). With this skill, you can get either a single 2-point material (such as a soft pelt ×1) or two 1-point materials (such as feathers ×2).","usage":"When you collect your Check-In Resources, you receive 2 points of resources from the HUNTING list.","note":""},{"category":"Gathering","name":"Hunting: Rank 3","cost":"4 CP","prerequisite":"Hunting: Rank 2","returnsWith":"—","call":"—","description":"This skill is effectively identical to HUNTING: RANK 1, except that you gain 3 “Hunting Points” to spend during each game instead of 1. This skill supersedes all lower-ranked versions of HUNTING (that is, you only get a total of 3 points’ worth of materials, rather than a cumulative sum of all your HUNTING skills). With this skill, you can get a single 3-point material, such as celestial blood ×1, or some combination of less valuable materials.","usage":"When you collect your Check-In Resources, you receive 3 points of resources from the HUNTING list.","note":""},{"category":"Gathering","name":"Hunting: Rank 4","cost":"4 CP","prerequisite":"Hunting: Rank 3","returnsWith":"—","call":"—","description":"This skill is effectively identical to HUNTING: RANK 1, except that you gain 4 “Hunting Points” to spend during each game instead of 1. This skill supersedes all lower-ranked versions of HUNTING (that is, you only get a total of 4 points’ worth of materials, rather than a cumulative sum of all your HUNTING skills). With this skill, you can get a single 4-point material, such as Fae Blood ×1, or some combination of less valuable materials.","usage":"When you collect your Check-In Resources, you receive 4 points of resources from the HUNTING list.","note":""},{"category":"Gathering","name":"Mercantile: Rank 1","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have learned where to get excellent prices on your purchases, where to sell different kinds of goods, and whom to talk to when you have to exchange currency or track a shipment. At some point during each Twin Mask game session, you may report to Logistics to gain 1 “Mercantile Point” to spend on gaining materials from the table below. You cannot save these points between different Twin Mask games—so, for instance, the only way to get a Ritual Component (a 4-point item) is to have MERCANTILE: RANK 4 and then choose to spend all 4 of your resulting points, all at once, to receive a Ritual Component ×1. With this skill at Rank 1, you can get either Cloth ×1, Postage ×1, Paper ×1, or Food ×1.","usage":"When you collect your Check-In Resources, you receive 1 point of resources from the MERCANTILE list.","note":"in addition to this standard use of the MERCANTILE skill, you should be on the lookout for mercantile opportunities that may come up during “mods” away from the main space of the Twin Mask game. If you mention that you have the MERCANTILE skill during such an event, a Staff member may occasionally have the option to let you acquire extra materials. 1 Point: Cloth, 5 Postage (Domestic), Paper, or Food (with 1-month expiration) 2 Points: Glass, Blood Ink, or 5 Postage (Overseas) 3 Points: Sanctified Water 4 Points: Ritual Component"},{"category":"Gathering","name":"Mercantile: Rank 2","cost":"4 CP","prerequisite":"Mercantile: Rank 1","returnsWith":"—","call":"—","description":"This skill is effectively identical to MERCANTILE: RANK 1, except that you gain 2 “Mercantile Points” to spend during each game instead of 1. This skill supersedes all lower-ranked versions of MERCANTILE (that is, you only get a total of 2 points’ worth of materials, rather than a cumulative sum of all your MERCANTILE skills). With this skill, you can get either a single 2-point material (such as blood ink ×1) or two 1-point materials (such as paper ×2).","usage":"When you collect your Check-In Resources, you receive 2 points of resources from the MERCANTILE list.","note":""},{"category":"Gathering","name":"Mercantile: Rank 3","cost":"4 CP","prerequisite":"Mercantile: Rank 2","returnsWith":"—","call":"—","description":"This skill is effectively identical to MERCANTILE: RANK 1, except that you gain 3 “Mercantile Points” to spend during each game instead of 1. This skill supersedes all lower-ranked versions of MERCANTILE (that is, you only get a total of 3 points’ worth of materials, rather than a cumulative sum of all your MERCANTILE skills). With this skill, you can get a single 3-point material (sanctified water ×1) or some combination of less valuable materials.","usage":"When you collect your Check-In Resources, you receive 3 points of resources from the MERCANTILE list.","note":""},{"category":"Gathering","name":"Mercantile: Rank 4","cost":"4 CP","prerequisite":"Mercantile: Rank 3","returnsWith":"—","call":"—","description":"This skill is effectively identical to MERCANTILE: RANK 1, except that you gain 4 “Mercantile Points” to spend during each game instead of 1. This skill supersedes all lower-ranked versions of MERCANTILE (that is, you only get a total of 4 points’ worth of materials, rather than a cumulative sum of all your MERCANTILE skills). With this skill, you can get a single 4-point material (ritual component ×1) or some combination of less valuable materials.","usage":"When you collect your Check-In Resources, you receive 4 points of resources from the MERCANTILE list.","note":""},{"category":"Gathering","name":"Black Market: Rank 1","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have made several contacts in the underworld; as a result, you can access a thriving system of trade that operates outside of legal channels, acquiring new materials regularly and with relatively little risk to yourself. At some point during each Twin Mask game session, you may report to Logistics to gain 1 “Black Market Point” to spend on gaining materials from the table below. You cannot save these points between different Twin Mask games—so, for instance, the only way to get Zye Blood Parasites (a 4-point item) is to have BLACK MARKET: RANK 4 and then choose to spend all 4 of your resulting points, all at once, to receive Zye Blood Parasites ×1. With this skill at Rank 1, you can only get Bone ×1. And, of course, since making contact with this kind of illicit marketplace is often against the law of the land, there may possibly be in-game consequences for characters who are known to do so.","usage":"When you collect your Check-In Resources, you receive 1 point of resources from the BLACK MARKET list. 161","note":"in addition to this standard use of the BLACK MARKET skill, you should be on the lookout for mercantile opportunities that may come up during “mods” away from the main space of the Twin Mask game. If you mention that you have the BLACK MARKET skill during such an event, a Staff member may occasionally have the option to let you acquire extra materials. 1 Point: Bone 2 Points: Blood Ink or Demon Blood 3 Points: Zye Scarab or Celestial Blood 4 Points: Zye Blood Parasites, Fae Blood, Child’s Tears*, or Any 2-Point Item from MINING, HUNTING, or MERCANTILE *player action has temporarily made this item unavailable"},{"category":"Gathering","name":"Black Market: Rank 2","cost":"4 CP","prerequisite":"Black Market: Rank 1","returnsWith":"—","call":"—","description":"This skill is effectively identical to BLACK MARKET: RANK 1, except that you gain 2 “Black Market Points” to spend during each game instead of 1. This skill supersedes all lower-ranked versions of BLACK MARKET (that is, you only get a total of 2 points’ worth of materials, rather than a cumulative sum of all your BLACK MARKET skills). With this skill, you can get either a single 2-point material (demon blood ×1) or two 1-point materials (bone ×2).","usage":"When you collect your Check-In Resources, you receive 2 points of resources from the BLACK MARKET list.","note":""},{"category":"Gathering","name":"Black Market: Rank 3","cost":"4 CP","prerequisite":"Black Market: Rank 2","returnsWith":"—","call":"—","description":"This skill is effectively identical to BLACK MARKET: RANK 1, except that you gain 3 “Black Market Points” to spend during each game instead of 1. This skill supersedes all lower-ranked versions of BLACK MARKET (that is, you only get a total of 3 points’ worth of materials, rather than a cumulative sum of all your BLACK MARKET skills). With this skill, you can get a single 3-point material (such as sanctified water ×1) or some combination of less valuable materials.","usage":"When you collect your Check-In Resources, you receive 3 points of resources from the BLACK MARKET list.","note":""},{"category":"Gathering","name":"Black Market: Rank 4","cost":"4 CP","prerequisite":"Black Market: Rank 3","returnsWith":"—","call":"—","description":"This skill is effectively identical to BLACK MARKET: RANK 1, except that you gain 4 “Black Market Points” to spend during each game instead of 1. This skill supersedes all lower-ranked versions of BLACK MARKET (that is, you only get a total of 4 points’ worth of materials, rather than a cumulative sum of all your BLACK MARKET skills). With this skill, you can get a single 4-point material (such as child’s tears ×1) or some combination of less valuable materials.","usage":"When you collect your Check-In Resources, you receive 4 points of resources from the BLACK MARKET list. 162 CRAFTING —","note":""},{"category":"Crafting: Metalworking","name":"Metalworking Blacksmithing: Apprentice","cost":"6 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have begun to master the art of working the forge—not in a flashy way, to make shining swords or shields or jewelry, but rather to make things that people need in their everyday lives. A blacksmith helps everyone else do their jobs better. If you expend the necessary materials, you may spend 30 minutes role-playing at a Forge to produce any Blacksmith Craft Item that has a total skill level of 1 from the table below, or from any Blacksmithing craft recipes you are attuned to. More specifically, you will spend 30 minutes at the location of your Forge, then take the “Forge” Structure tag—along with any tagged materials you are expending to make your item—to Logistics, where you will turn in the materials and be given the resulting item card. You don’t need to have any other skills (such as LORE or MAGIC) related to the item you are creating, no matter how esoteric it might be. You are also considered to have “LORE: BLACKSMITHING,” though you cannot teach it as a LORE.","usage":"You may spend 30 minutes at a Forge role-playing crafting an item from the Blacksmithing chart or a craft recipe with a total Skill Level of 1, then take your building tag and ingredients to Logistics.","note":"some crafted items and magical items do not work immediately when you first get them; you must hold them for 30 minutes to let them attune to you. See Attunement in Chapter 5 for more details."},{"category":"Crafting: Metalworking","name":"Blacksmithing: Journeyman","cost":"6 CP","prerequisite":"Blacksmithing: Apprentice","returnsWith":"—","call":"—","description":"You have progressed to Journeyman level as a blacksmith. If you expend the necessary materials, you may spend 30 minutes role-playing at a Forge to produce any Blacksmith Craft Item that has total skill level of 2 or less—or you can add Additional Properties (from the table below) to enhance an existing Blacksmith Craft Item, up to a maximum total skill level of 2.","usage":"You may spend 30 minutes at a Forge role-playing crafting an item from the Blacksmithing chart or a craft recipe with a total Skill Level of 2, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Metalworking","name":"Blacksmithing: Master","cost":"6 CP","prerequisite":"Blacksmithing: Journeyman","returnsWith":"—","call":"—","description":"You have progressed to Master level as a blacksmith. If you expend the necessary materials, you may spend 30 minutes role-playing at a Forge to produce any Blacksmith Craft Item that has total skill level of 3 or less—or you can add Additional Properties (from the table below) to enhance an existing Blacksmith Craft Item, up to a maximum total skill level of 3.","usage":"You may spend 30 minutes at a Forge role-playing crafting an item from the Blacksmithing chart or a craft recipe with a total Skill Level of 3, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Metalworking","name":"Blacksmithing: Grandmaster","cost":"6 CP","prerequisite":"Blacksmithing: Master","returnsWith":"—","call":"—","description":"You have progressed to Grandmaster level as a blacksmith. If you expend the necessary materials, you may spend 30 minutes role-playing at a Forge to produce any Blacksmith Craft Item that has total skill level of 4 or less—or you can add Additional Properties (from the table below) to enhance an existing Blacksmith Craft Item, up to a maximum total skill level of 4.","usage":"You may spend 30 minutes at a Forge role-playing crafting an item from the Blacksmithing chart or a craft recipe with a total Skill Level of 4, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Metalworking","name":"Weaponsmithing: Apprentice","cost":"6 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have begun to dedicate your time to the art of building weapons, learning how to work your forge in a way that will produce truly original, powerful swords and spears and axes—weapons with enough individuality that they deserve personalized names. If you expend the necessary materials, you may spend 30 minutes role-playing at a Forge to produce any Weaponsmith Craft Item that has a total skill level of 1 from the table below, or from any Weaponsmithing craft recipes you are attuned to. More specifically, you will spend 30 minutes at the location of your Forge, then take the “Forge” Structure tag—along with any tagged materials you are expending to make your weapon—to Logistics, where you will turn in the materials and be given the resulting weapon item card. You don’t need to have any other skills (such as LORE or MAGIC) related to the item you are creating, no matter how esoteric it might be. You are also considered to have “LORE: WEAPONSMITHING,” though you cannot teach it as a LORE.","usage":"You may spend 30 minutes at a Forge role-playing crafting an item from the Weaponsmithing chart or a craft recipe with a total Skill Level of 1, then take your building tag and ingredients to Logistics.","note":"some crafted items and magical items do not work immediately when you first get them; you must hold them for 30 minutes to let them attune to you. See Attunement in Chapter 5 for more details."},{"category":"Crafting: Metalworking","name":"Weaponsmithing: Journeyman","cost":"6 CP","prerequisite":"Weaponsmithing: Apprentice","returnsWith":"—","call":"—","description":"You have progressed to Journeyman level as a weaponsmith. If you expend the necessary materials, you may spend 30 minutes role-playing at a Forge to produce any Weaponsmith Craft Item that has total skill level of 2 or less—or you can add Additional Properties (from the table below) to enhance an existing Weaponsmith Craft Item, up to a maximum total skill level of 2.","usage":"You may spend 30 minutes at a Forge role-playing crafting an item from the Weaponsmithing chart or a craft recipe with a total Skill Level of 2, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Metalworking","name":"Weaponsmithing: Master","cost":"6 CP","prerequisite":"Weaponsmithing: Journeyman","returnsWith":"—","call":"—","description":"You have progressed to Master level as a weaponsmith. If you expend the necessary materials, you may spend 30 minutes role-playing at a Forge to produce any Weaponsmith Craft Item that has total skill level of 3 or less—or you can add Additional Properties (from the table below) to enhance an existing Weaponsmith Craft Item, up to a maximum total skill level of 3.","usage":"You may spend 30 minutes at a Forge role-playing crafting an item from the Weaponsmithing chart or a craft recipe with a total Skill Level of 3, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Metalworking","name":"Weaponsmithing: Grandmaster","cost":"6 CP","prerequisite":"Weaponsmithing: Master","returnsWith":"—","call":"—","description":"You have progressed to Grandmaster level as a weaponsmith. If you expend the necessary materials, you may spend 30 minutes role-playing at a Forge to produce any Weaponsmith Craft Item that has total skill level of 4 or less—or you can add Additional Properties (from the table below) to enhance an existing Weaponsmith Craft Item, up to a maximum total skill level of 4.","usage":"You may spend 30 minutes at a Forge role-playing crafting an item from the Weaponsmithing chart or a craft recipe with a total Skill Level of 4, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Metalworking","name":"Armorsmithing: Apprentice","cost":"6 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have begun to learn the art of crafting beautiful and functional armor, pushing the forge to produce heavy armors that will be fit for true heroes. If you expend the necessary materials, you may spend 30 minutes role-playing at a Forge to produce any Armorsmith Craft Item that has a total skill level of 1 from the table below, or from any Armorsmithing craft recipes you are attuned to. More specifically, you will spend 30 minutes at the location of your Forge, then take the “Forge” Structure tag—along with any tagged materials you are expending to make your armor—to Logistics, where you will turn in the materials and be given the resulting armor item card. You don’t need to have any other skills (such as LORE or MAGIC) related to the item you are creating, no matter how esoteric it might be. You are also considered to have “LORE: ARMORSMITHING,” though you cannot teach it as a LORE.","usage":"You may spend 30 minutes at a Forge role-playing crafting an item from the Armorsmithing chart or a craft recipe with a total Skill Level of 1, then take your building tag and ingredients to Logistics.","note":"it is impossible to wear (and to benefit from) more than 1 “Armor” item at once. Note—some crafted items and magical items do not work immediately when you first get them; you must hold them for 30 minutes to let them attune to you. See Attunement in Chapter 5 for more details."},{"category":"Crafting: Metalworking","name":"Armorsmithing: Journeyman","cost":"6 CP","prerequisite":"Armorsmithing: Apprentice","returnsWith":"—","call":"—","description":"You have progressed to Journeyman level as an armorsmith. If you expend the necessary materials, you may spend 30 minutes role-playing at a Forge to produce any Armorsmith Craft Item that has total skill level of 2 or less—or you can add Additional Properties (from the table below) to enhance an existing Armorsmith Craft Item, up to a maximum total skill level of 2.","usage":"You may spend 30 minutes at a Forge role-playing crafting an item from the Armorsmithing chart or a craft recipe with a total Skill Level of 2, then take your building tag and ingredients to Logistics.","note":"it is impossible to wear (and to benefit from) more than 1 “Armor” item at once."},{"category":"Crafting: Metalworking","name":"Armorsmithing: Master","cost":"6 CP","prerequisite":"Armorsmithing: Journeyman","returnsWith":"—","call":"—","description":"You have progressed to Master level as an armorsmith. If you expend the necessary materials, you may spend 30 minutes role-playing at a Forge to produce any Armorsmith Craft Item that has total skill level of 3 or less—or you can add Additional Properties (from the table below) to enhance an existing Armorsmith Craft Item, up to a maximum total skill level of 3.","usage":"You may spend 30 minutes at a Forge role-playing crafting an item from the Armorsmithing chart or a craft recipe with a total Skill Level of 3, then take your building tag and ingredients to Logistics.","note":"it is impossible to wear (and to benefit from) more than 1 “Armor” item at once."},{"category":"Crafting: Metalworking","name":"Armorsmithing: Grandmaster","cost":"6 CP","prerequisite":"Armorsmithing: Master","returnsWith":"—","call":"—","description":"You have progressed to Grandmaster level as an armorsmith. If you expend the necessary materials, you may spend 30 minutes role-playing at a Forge to produce any Armorsmith Craft Item that has total skill level of 4 or less—or you can add Additional Properties (from the table below) to enhance an existing Armorsmith Craft Item, up to a maximum total skill level of 4.","usage":"You may spend 30 minutes at a Forge role-playing crafting an item from the Armorsmithing chart or a craft recipe with a total Skill Level of 4, then take your building tag and ingredients to Logistics.","note":"it is impossible to wear (and to benefit from) more than 1 “Armor” item at once."},{"category":"Crafting: Metalworking","name":"Fortify Armor","cost":"3 CP","prerequisite":"Armorsmithing: Apprentice or Tailoring: Apprentice","returnsWith":"—","call":"“Bestow (Number) Armor”","description":"You have spent so much time working with armor that you know secret tricks and techniques that can temporarily improve its resistance to damage, perhaps to prepare for a hard weekend. If you have the TAILORING: APPRENTICE skill, you can spend 3 minutes role-playing the process of stitching, tightening, and reinforcing a piece of light armor. You must do so at a Work Table; after those 3 minutes, you may call “Bestow 2 Armor” to improve that light armor’s base Armor Value by 2 for the next 3 days. During those days, whenever that armor is restored through rest or FIELD REPAIR, it will return to the new value rather than the old one. If you have the ARMORSMITHING: APPRENTICE skill, you can spend 3 minutes role-playing the process of hammering, re-articulating, and reinforcing a piece of heavy armor. You must do so at a Forge; after those 3 minutes, you may call “Bestow 4 Armor” to improve that armor’s base Armor Value by the stated amount for the next 3 days. During those days, whenever that armor is restored through rest or FIELD REPAIR, it will return to the new value rather than the old one. This skill may be used any number of times per day, but remember that bestow effects will not stack on the same piece of armor. You can use this skill to fortify armor that is still being worn by someone, as long as that person can stay still (at your Forge or Work Table) long enough for you to fulfill FORTIFY ARMOR’s requirements.","usage":"You may spend 3 minutes at a Worktable (Light) or a Forge (Heavy) role-playing reinforcing a set of armor, then call “Bestow 2 Armor” (Light) or “Bestow 4 Armor” (Heavy). You should explain that this bestowed armor lasts the entire weekend and is restored with rest or FIELD REPAIR.","note":""},{"category":"Crafting: Metalworking","name":"Field Repair","cost":"2 CP","prerequisite":"Fortify Armor or Repair Shield","returnsWith":"Sunrise and Sunset","call":"“Restore Armor”","description":"or “Restore Shield” You have worked on armor or shields so much that, even in a battlefield situation, you can find and shore up the specific weak spots that are hindering an armor or shield’s performance, or repair intentional damage. To use this skill, you must role-play the process of repairing a character’s armor or shield for at least 30 seconds, using tools that are appropriate to the job at hand. You must have FORTIFY ARMOR if you want to repair armor, and you must have REPAIR SHIELD if you want to repair shields. You can do so even if somebody is still wearing that suit of armor or holding that shield, as long as they do not move around too much during the process. Once you have spent the necessary 30 seconds, you may call “restore armor” to restore the Armor Value of that suit of armor (or clothing) to its full, maximum total… or “restore shield” to repair a shield that has been broken by BREAK SHIELD. This skill can only be used on any given suit of armor or shield once every 30 minutes.","usage":"You may spend 30 seconds role-playing repairing a set of armor or a shield that you have the relevant crafting skill for, then call “Restore Armor” or “Restore Shield.”","note":"players who consistently fail to spend 30 seconds using this skill, or who cannot role-play the process in a convincing way, will not be allowed to use this skill."},{"category":"Crafting: Metalworking","name":"Shieldsmithing: Apprentice","cost":"6 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"As an apprentice in the art of making shields, you have started a journey toward deflecting more dangerous things than mere swords. If you expend the necessary materials, you may spend 30 minutes role-playing at a Forge to produce any Shieldsmithing Craft Item that has a total skill level of 1 from the table below, or from any Shieldsmithing craft recipes you are attuned to. More specifically, you will spend 30 minutes at your Forge, then take the “Forge” Structure tag—along with any tagged materials you are expending to make your shield—to Logistics, where you will turn in the materials and be given the resulting shield item card. You don’t need to have any other skills (such as LORE or MAGIC) related to the item you are creating, no matter how esoteric it might be. You are also considered to have “LORE: SHIELDSMITHING,” though you cannot teach it as a LORE.","usage":"You may spend 30 minutes at a Forge roleplaying crafting an item from the Shieldsmithing chart or a craft recipe with a total Skill Level of 1, then take your building tag and ingredients to Logistics.","note":"it is impossible to equip (and to benefit from) more than 1 “Shield” item at once. That is, a shield strapped to your back won’t provide any benefits whatsoever; you need to be holding it in your hand. Note—some crafted items and magical items do not work immediately when you first get them; you must hold them for 30 minutes to let them attune to you. See Attunement in Chapter 5 for more details."},{"category":"Crafting: Metalworking","name":"Shieldsmithing: Journeyman","cost":"6 CP","prerequisite":"Shieldsmithing: Apprentice","returnsWith":"—","call":"—","description":"You have progressed to Journeyman level as a shieldsmith. If you expend the necessary materials, you may spend 30 minutes role-playing at a Forge to produce any Shieldsmith Craft Item that has total skill level of 2 or less—or you can add Additional Properties (from the table below) to enhance an existing Shieldsmith Craft Item, up to a maximum total skill level of 2.","usage":"You may spend 30 minutes at a Forge roleplaying crafting an item from the Shieldsmithing chart or a craft recipe with a total Skill Level of 2, then take your building tag and ingredients to Logistics.","note":"it is impossible to equip (and to benefit from) more than 1 “Shield” item at once. That is, a shield strapped to your back won’t provide any benefits whatsoever; you need to be holding it in your hand."},{"category":"Crafting: Metalworking","name":"Shieldsmithing: Master","cost":"6 CP","prerequisite":"Shieldsmithing: Journeyman","returnsWith":"—","call":"—","description":"You have progressed to Master level as a shieldsmith. If you expend the necessary materials, you may spend 30 minutes role-playing at a Forge to produce any Shieldsmith Craft Item that has total skill level of 3 or less—or you can add Additional Properties (from the table below) to enhance an existing Shieldsmith Craft Item, up to a maximum total skill level of 3.","usage":"You may spend 30 minutes at a Forge roleplaying crafting an item from the Shieldsmithing chart or a craft recipe with a total Skill Level of 3, then take your building tag and ingredients to Logistics.","note":"it is impossible to equip (and to benefit from) more than 1 “Shield” item at once. That is, a shield strapped to your back won’t provide any benefits whatsoever; you need to be holding it in your hand."},{"category":"Crafting: Metalworking","name":"Shieldsmithing: Grandmaster","cost":"6 CP","prerequisite":"Shieldsmithing: Master","returnsWith":"—","call":"—","description":"You have progressed to Grandmaster level as a shieldsmith. If you expend the necessary materials, you may spend 30 minutes role-playing at a Forge to produce any Shieldsmith Craft Item that has total skill level of 4 or less—or you can add Additional Properties (from the table below) to enhance an existing Shieldsmith Craft Item, up to a maximum total skill level of 4.","usage":"You may spend 30 minutes at a Forge roleplaying crafting an item from the Shieldsmithing chart or a craft recipe with a total Skill Level of 4, then take your building tag and ingredients to Logistics.","note":"it is impossible to equip (and to benefit from) more than 1 “Shield” item at once. That is, a shield strapped to your back won’t provide any benefits whatsoever; you need to be holding it in your hand."},{"category":"Crafting: Metalworking","name":"Repair Shield","cost":"3 CP","prerequisite":"Shieldsmithing: Apprentice","returnsWith":"—","call":"“Restore Shield”","description":"You have spent enough time working with shields to know how to repair any damage they may have taken, in a fraction of the time it would take to make that shield anew. To use this skill, you must have access to a Forge. After 3 minutes of role-playing the process of fixing a broken shield at the Forge, you may restore it to its full function. (This skill is generally used to reverse the BREAK SHIELD skill’s Break effect.) REPAIR SHIELD may be used any number of times per day.","usage":"You may spend 3 minutes at a Forge roleplaying the process of repairing a shield, then call “Restore Shield.”","note":""},{"category":"Crafting: Metalworking","name":"Locksmithing: Apprentice","cost":"6 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have started to learn the skills necessary to work on some of the most demanding and complex tools that smiths can make: locks and keys. If you expend the necessary materials, you may spend 30 minutes role-playing at a Work Table to produce any Locksmith Craft Item that has a total skill level of 1 from the table below, or from any Locksmithing craft recipes you are attuned to. More specifically, you will spend 30 minutes at your Work Table, then take the “Work Table” Structure tag—along with any tagged materials you are expending to make your lock—to Logistics, where you will turn in the materials and be given the resulting lock item card. You don’t need to have any other skills (such as LORE or MAGIC) related to the item you are creating, no matter how esoteric it might be. You are also considered to have “LORE: LOCKSMITHING,” though you cannot teach it as a LORE.","usage":"You may spend 30 minutes at a Work Table roleplaying crafting an item from the Locksmithing chart or a craft recipe with a total Skill Level of 1, then take your building tag and ingredients to Logistics.","note":"unlike most crafted or magical items, items produced with LOCKSMITHING can be used without having to attune to a person."},{"category":"Crafting: Metalworking","name":"Locksmithing: Journeyman","cost":"6 CP","prerequisite":"Locksmithing: Apprentice","returnsWith":"—","call":"—","description":"You have progressed to Journeyman level as a locksmith. If you expend the necessary materials, you may spend 30 minutes role-playing at a Work Table to produce any Locksmith Craft Item that has total skill level of 2 or less—or you can add Additional Properties (from the table below) to enhance an existing Locksmith Craft Item, up to a maximum total skill level of 2.","usage":"You may spend 30 minutes at a Work Table role-playing crafting an item from the Locksmithing chart or a craft recipe with a total Skill Level of 2, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Metalworking","name":"Locksmithing: Master","cost":"6 CP","prerequisite":"Locksmithing: Journeyman","returnsWith":"—","call":"—","description":"You have progressed to Master level as a locksmith. If you expend the necessary materials, you may spend 30 minutes role-playing at a Work Table to produce any Locksmith Craft Item that has total skill level of 3 or less—or you can add Additional Properties (from the table below) to enhance an existing Locksmith Craft Item, up to a maximum total skill level of 3.","usage":"You may spend 30 minutes at a Work Table role-playing crafting an item from the Locksmithing chart or a craft recipe with a total Skill Level of 3, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Metalworking","name":"Locksmithing: Grandmaster","cost":"6 CP","prerequisite":"Locksmithing: Master","returnsWith":"—","call":"—","description":"You have progressed to Grandmaster level as a locksmith. If you expend the necessary materials, you may spend 30 minutes role-playing at a Work Table to produce any Locksmith Craft Item that has total skill level of 4 or less—or you can add Additional Properties (from the table below) to enhance an existing Locksmith Craft Item, up to a maximum total skill level of 4.","usage":"You may spend 30 minutes at a Work Table roleplaying crafting an item from the Locksmithing chart or a craft recipe with a total Skill Level of 4, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Arcane","name":"Arcane Enchanting: Apprentice","cost":"6 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have learned how to work with the leather, wire, gems, molten metals, and paper that are the raw materials of many ornaments and curios… but, more importantly, you have also begun to learn the best ways that strands of magic can be coaxed to flow through and around such materials in useful patterns. These are items that can be worn: they will produce magical benefits as long as they are visibly displayed by their bearers. If you expend the necessary materials, you may spend 30 minutes role-playing at a Work Table to produce any Enchanting Item that has a total skill level of 1 from the table below, or from any Enchanting craft recipes you are attuned to. More specifically, you will spend 30 minutes at the location of your Work Table, then take the “Work Table” Structure tag—along with any tagged materials you are expending to make your enchanted item—to Logistics, where you will turn in the materials and be given the resulting item card. You don’t need to have any other skills (such as LORE or MAGIC) related to the item you are creating, no matter how esoteric it might be. You are also considered to have “LORE: ENCHANTING,” though you cannot teach it as a LORE.","usage":"You may spend 30 minutes at a Work Table role-playing crafting an item from the Enchanting chart or a craft recipe with a total Skill Level of 1, then take your building tag and ingredients to Logistics.","note":"some crafted items and magical items do not work immediately when you first get them; you must hold them for 30 minutes to let them attune to you. See Attunement in Chapter 5 for more details."},{"category":"Crafting: Arcane","name":"Enchanting: Journeyman","cost":"6 CP","prerequisite":"Enchanting: Apprentice","returnsWith":"—","call":"—","description":"You have progressed to Journeyman level as a crafter of magical items. If you expend the necessary materials, you may spend 30 minutes role-playing at a Work Table to produce any Enchanting Item that has total skill level of 2 or less—or you can add Additional Properties (from the table below) to enhance an existing Enchanting Item, up to a maximum total skill level of 2.","usage":"You may spend 30 minutes at a Work Table role-playing crafting an item from the Enchanting chart or a craft recipe with a total Skill Level of 2, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Arcane","name":"Enchanting: Master","cost":"6 CP","prerequisite":"Enchanting: Journeyman","returnsWith":"—","call":"—","description":"You have progressed to Master level as a crafter of magical items. If you expend the necessary materials, you may spend 30 minutes role-playing at a Work Table to produce any Enchanting Item that has total skill level of 3 or less—or you can add Additional Properties (from the table below) to enhance an existing Enchanting Item, up to a maximum total skill level of 3.","usage":"You may spend 30 minutes at a Work Table role-playing crafting an item from the Enchanting chart or a craft recipe with a total Skill Level of 3, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Arcane","name":"Enchanting: Grandmaster","cost":"6 CP","prerequisite":"Enchanting: Master","returnsWith":"—","call":"—","description":"You have progressed to Grandmaster level as a crafter of magical items. If you expend the necessary materials, you may spend 30 minutes role-playing at a Work Table to produce any Enchanting Item that has total skill level of 4 or less—or you can add Additional Properties (from the table below) to enhance an existing Enchanting Item, up to a maximum total skill level of 4.","usage":"You may spend 30 minutes at a Work Table role-playing crafting an item from the Enchanting chart or a craft recipe with a total Skill Level of 4, then take your building tag and ingredients to Logistics. 179","note":""},{"category":"Crafting: Arcane","name":"Scroll Scribing: Apprentice","cost":"6 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"Through study and practice in the magical arts, you have begun to develop your ability to write and copy the scrolls that are necessary for all spellcasters to produce magical effects. To use this skill, you must spend 30 minutes role-playing the painstaking process of copying a magical scroll at a Laboratory. After that 30-minute period, you may expend 1 vial of blood ink to produce a copy of any 1st-circle (Apprentice) spell scroll in your possession (or spend the costs to make a 1st-level Scribing craft recipe). More specifically, you will spend 30 minutes at the location of your Laboratory, then take the “Laboratory” Structure tag—along with the blood ink and the scrolls to be copied—to Logistics, where you will turn in the blood ink and get the resulting scrolls. You don’t need any other skills (such as LORE or MAGIC) to scribe a scroll; you can copy a scroll even without being able to read it. You are also considered to have “LORE: SCROLL SCRIBING,” though you cannot teach it as a LORE.","usage":"You may spend 30 minutes at a Laboratory role-playing copying any 1st-circle spell scroll or Scribing craft recipe, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Arcane","name":"Scroll Scribing: Journeyman","cost":"6 CP","prerequisite":"Scroll Scribing: Apprentice","returnsWith":"—","call":"—","description":"You have progressed to Journeyman level as a scribe of scrolls. To use this skill, you must spend 30 minutes role-playing the painstaking process of copying a magical scroll at a Laboratory. After that 30-minute period, you may expend 2 vials of blood ink to produce a copy of any 2nd-circle (Journeyman) spell scroll in your possession (or spend the costs to make a 2nd-level Scribing craft recipe). You don’t need any other skills (such as LORE or MAGIC) to scribe a scroll; you can copy a scroll even without being able to read it.","usage":"You may spend 30 minutes at a Laboratory roleplaying copying any 2nd-circle spell scroll or Scribing craft recipe, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Arcane","name":"Scroll Scribing: Master","cost":"6 CP","prerequisite":"Scroll Scribing: Journeyman","returnsWith":"—","call":"—","description":"You have progressed to Master level as a scribe of scrolls. To use this skill, you must spend 30 minutes role-playing the painstaking process of copying a magical scroll at a Laboratory. After that 30-minute period, you may expend 3 vials of blood ink to produce a copy of any 3rd-circle (Master) spell scroll in your possession. You don’t need any other skills (such as LORE or MAGIC) to scribe a scroll; you can copy a scroll even without being able to read it.","usage":"You may spend 30 minutes at a Laboratory roleplaying copying any 3rd -circle spell scroll or Scribing craft recipe, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Arcane","name":"Scroll Scribing: Grandmaster","cost":"6 CP","prerequisite":"Scroll Scribing: Master","returnsWith":"—","call":"—","description":"You have progressed to Grandmaster level as a scribe of scrolls. To use this skill, you must spend 30 minutes role-playing the painstaking process of copying a magical scroll at a Laboratory. After that 30-minute period, you may expend 4 vials of blood ink to produce a copy of any 4th-circle (Grandmaster) spell scroll in your possession. You don’t need any other skills (such as LORE or MAGIC); you can copy a scroll even without being able to read it.","usage":"You may spend 30 minutes at a Laboratory roleplaying copying any 4th-circle spell scroll or Scribing craft recipe, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Arcane","name":"Recipe Scribing","cost":"2 CP","prerequisite":"Scroll Scribing: Apprentice","returnsWith":"—","call":"—","description":"Although your specialty has generally been the complex, arcane tangle of words and symbols that make up spell scrolls... you have certainly built up the skills necessary to copy other complex writings, too. With this skill, by following the normal process of SCROLL SCRIBING, you may copy a craft recipe. The difference lies in the ingredients required to make the copy: you must expend 1 feather, plus 1 paper per crafting level of the recipe to be copied, instead of the normal vials of blood ink.","usage":"You may use SCROLL SCRIBING to copy craft recipes (but not rituals). The cost is 1 Feather + 1 Paper per level of the recipe. You must bring the recipe, Laboratory tag, and ingredients to Logistics, just as you do with a scroll.","note":""},{"category":"Crafting: Arcane","name":"New Edition","cost":"3 CP","prerequisite":"Scroll Scribing: Apprentice","returnsWith":"—","call":"—","description":"The process of copying magical writings is laborious and sometimes illogical. It is clearly not possible to simply repeat the exact same strokes of a pen, since there is a ritualistic element involving blood ink that must be followed to instill the spirit of the original writing into the new copy. Through long practice, though, you have become adept at a kind of linguistic necromancy, or perhaps “channeling”—you can transfer a scroll’s weak or damaged spirit into another copy of 183 itself, rejuvenating its physical form in the process. By spending the same time that a new scroll would require, you can use this skill to make a new copy of an existing spell scroll, expending only 1 blood ink (and the original scroll, which can be almost unrecognizably damaged). This skill cannot be used to copy a stolen scroll.","usage":"You may use SCROLL SCRIBING to make a replacement copy of a damaged, non-stolen scroll for a single blood ink, regardless of level. You must bring (and surrender) the damaged scroll to Logistics along with the Laboratory tag and ingredients, just like making a new scroll.","note":""},{"category":"Crafting: Arcane","name":"Artificing: Apprentice","cost":"6 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have begun to understand the complex ways in which arcane energies can twine, shift, and be magnified through the physical structures and geometric patterns of wands, orbs, books, statuettes, and other arcane implements. These are items that must be held: they will only produce their magical benefits if they are physically in your hand. (The hand is still considered “open,” though, as long as you’re not holding a weapon or shield on that arm.) If you expend the necessary materials, you may spend 30 minutes role-playing at a Laboratory to produce any Artificing Craft Item that has a total skill level of 1 from the table below, or from any Artificing craft recipes you are attuned to. More specifically, you will spend 30 minutes at the location of your Laboratory, then take the “Laboratory” Structure tag—along with any tagged materials you are expending to make your artifact—to Logistics, where you will turn in the materials and be given the resulting item card. You don’t need to have any other skills (such as LORE or MAGIC) related to the item you are creating, no matter how esoteric it might be. You are also considered to have “LORE: ARTIFICING,” though you cannot teach it as a LORE.","usage":"You may spend 30 minutes at a Laboratory role-playing crafting an item from the Artificing chart or a craft recipe with a total Skill Level of 1, then take your building tag and ingredients to Logistics.","note":"some crafted items and magical items do not work immediately when you first get them; you must hold them for 30 minutes to let them attune to you. See Attunement in Chapter 5 for more details."},{"category":"Crafting: Arcane","name":"Artificing: Journeyman","cost":"6 CP","prerequisite":"Artificing: Apprentice","returnsWith":"—","call":"—","description":"You have progressed to Journeyman level as a worker of magically-infused artifacts. If you expend the necessary materials, you may spend 30 minutes role-playing at a Laboratory to produce any Artificing Craft Item that has total skill level of 2 or less—or you can add Additional Properties (from the table below) to enhance an existing Artificing Craft Item, up to a maximum total skill level of 2.","usage":"You may spend 30 minutes at a Laboratory role-playing crafting an item from the Artificing chart or a craft recipe with a total Skill Level of 2, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Arcane","name":"Artificing: Master","cost":"6 CP","prerequisite":"Artificing: Journeyman","returnsWith":"—","call":"—","description":"You have progressed to Master level as a worker of magically-infused artifacts. If you expend the necessary materials, you may spend 30 minutes role-playing at a Laboratory to produce any Artificing Craft Item that has total skill level of 3 or less—or you can add Additional Properties (from the table below) to enhance an existing Artificing Craft Item, up to a maximum total skill level of 3.","usage":"You may spend 30 minutes at a Laboratory role-playing crafting an item from the Artificing chart or a craft recipe with a total Skill Level of 3, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Arcane","name":"Artificing: Grandmaster","cost":"6 CP","prerequisite":"Artificing: Master","returnsWith":"—","call":"—","description":"You have progressed to Grandmaster level as a worker of magically-infused artifacts. If you expend the necessary materials, you may spend 30 minutes role-playing at a Laboratory to produce any Artificing Craft Item that has total skill level of 4 or less—or you can add Additional Properties (from the table below) to enhance an existing Artificing Craft Item, up to a maximum total skill level of 4.","usage":"You may spend 30 minutes at a Laboratory role-playing crafting an item from the Artificing chart or a craft recipe with a total Skill Level of 4, then take your building tag and ingredients to Logistics.","note":""},{"category":"Crafting: Edible","name":"Edible Cooking: Apprentice","cost":"6 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"More than merely enjoying food, you have begun to learn how to combine ingredients, preparation methods, and cooking times into truly flavorful dishes, unlocking the mystical properties of various edible substances by both experimenting and following recipes. If you expend the necessary ingredients, you ma
