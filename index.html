bs touching the ground (most people will do a “superhero landing” with 2 feet and 1 hand on the ground). While you are taking your 3 steps with your hands raised, you cannot take any actions, make any attacks, call any defenses except “Willpower” or “Resist,” use any skills, or carry anything particularly heavy, such as a person—but you also cannot be affected by any attacks or spells that can be physically dodged (that is, attacks that could be canceled by the DODGE skill). Additionally, attacks modified by Stealth will not hit you while you are Airborne. You can still be affected, however, by attacks delivered by voice, gaze, gesture, or ward.","usage":"You may raise your hands above your head, call “Leap,” and take 3 steps in any direction, during which time you are Airborne and cannot be affected by anything that could be countered by the DODGE skill. You must land with at least 3 limbs touching the ground before you can move again. Restriction: no heavy armor, no shields","note":""},{"category":"The Assassin's Arts","name":"Leap Attack","cost":"3 CP","prerequisite":"Leap","returnsWith":"—","call":"(normal attack call)","description":"You have continued training your acrobatic skills, but with a focus on actual combat: you have learned how to use your momentum and height to make an attack in the midst of your incredible leaps. With this skill, whenever you use the LEAP skill, you may make 1 basic melee attack (or use one skill that produces a single melee attack, such as GREAT STRIKE or DISARM) during the time you spend Airborne.","usage":"You may make a single melee weapon attack during the 3 steps you take as part of LEAP.","note":""},{"category":"The Assassin's Arts","name":"Deathly Vault","cost":"4 CP","prerequisite":"Leap, Stealth Attack","returnsWith":"—","call":"“Leap”","description":"You don’t get to be a well-known assassin if you only manage one kill before getting caught or killed yourself. Fortunately, you have found ways to use the surge of confidence that comes with a successful strike to make your escape: after cutting somebody down, you can launch yourself into an acrobatic leap that can help you get clear of the consequences of your actions. When you kill a target with a deathblow, you have a 30-second window in which to take a free LEAP ability, becoming Airborne to help escape anyone pursuing you.","usage":"Within 30 seconds of performing a deathblow on a target you personally put into Bleedout, you may call “Leap” without expending a use of the LEAP skill and take three steps in any one direction, during which time you may not be affected by any attacks that could be countered by a DODGE. This ability may not be used more than once every 30 seconds.","note":""},{"category":"The Assassin's Arts","name":"Rope Use","cost":"3 CP","prerequisite":"—","returnsWith":"—","call":"Special","description":"You have learned the properties of various kinds of rope, and you have mastered the art of using knots to bind people in a legitimately secure way. Without this skill, any effort that you make to bind somebody with ropes will be shaky at best, and that person will be able to escape if they push themselves to do so (people untrained in ROPE USE should probably use shackles for this purpose). If you have this skill, though, you can spend 3 seconds role-playing the process of tying a person up, using a physical representation of a rope or rope-like object (such as an actual rope, a belt, a long strip of cloth, etc.)—and if you do, those bonds will appropriately restrict the subject’s movement as though they were truly restrained. This means that, if their legs are bound together, they will not be able to separate them; if their arms or hands are bound, they will be unable to do anything requiring freedom of movement in their arms (such as, for instance, retrieving weapons they may have stashed with the HIDDEN WEAPON skill). The only ways to escape one’s bonds are to use the ESCAPE skill, to spend 3 seconds cutting your bonds (if your hands are free and you can wield a bladed weapon), or to have somebody else spend 3 seconds cutting your bonds with a bladed weapon. When you use this skill, while you are role-playing the 3 seconds of binding your subject, you should briefly explain how it works.","usage":"You may role-play binding a character with a rope phys-rep for 3 seconds while explaining how ROPE USE works. They may not escape these bindings without a use of ESCAPE, or a bladed weapon wielded by themselves or others.","note":"in addition to this standard use of the ROPE USE skill, you should be on the lookout for situations related to rope that may come up during “mods” away from the main space of the Twin Mask game. If you mention that you have the ROPE USE skill during such an event, a Staff member may occasionally have the option to let you take advantage of extra opportunities. 121 THE HONORED PATH OF THE BERSERKER Although the tradition of battle-raging berserkers is often derided by “civilized” nations as thoughtless “savagery,” old and primal cultures such as the Ko’aat give a great deal of respect and honor to those who are capable of stepping beyond the bounds of courtly combat. Because of their way of embracing the primeval element of anger and staying in touch with the intensity of nature, berserkers are sometimes seen as barbaric knights, “holy warriors” of the natural order, red in tooth and claw."},{"category":"The Honored Path of the Berserker","name":"Battle Rage","cost":"7 CP","prerequisite":"—","returnsWith":"Rest","call":"“Rage”","description":"You have mastered the art of accepting your anger as it courses through you, giving you the ability to strike with more ferocity than other people are capable of. To use this skill, you must first let loose a powerful scream of fury, then officially call “rage.” This starts a 10-second period during which all of your attacks function as if they were Great Strikes. During this period, you should role-play being in a state of unreasoning anger, with very little control over your own destructive impulses.","usage":"You may call “Rage” and start a 10-second timer during which all weapon attacks function as Great Strikes.","note":"players who consistently fail to role-play the anger of BATTLE RAGE sufficiently will not be allowed to use this skill."},{"category":"The Honored Path of the Berserker","name":"Enduring Rage","cost":"6 CP","prerequisite":"—","returnsWith":"—","call":"“Heal Self 2”","description":"You are a warrior who has learned to draw inspiration, or perhaps just fuel for the fire of your rage, from the defeat and death of your enemies: whenever you ceremoniously kill an enemy in combat, you give yourself some motivation (in the form of Health Points) to help keep you going. To use this skill, you should take roughly 3 seconds to speak to an enemy that you personally put into a helpless or bleeding-out state, either to taunt them or to say a few words to honor them. If you do, and then administer a deathblow to them, you may call “heal self 2.” Although the game treats this as a normal healing effect, you should role-play it as adrenaline instead: your wounds have not closed or vanished, but you are still pushing forward to fight.","usage":"You must speak for 3 seconds to a character you have put into Bleedout, perform a deathblow, and then may call, “Heal Self 2.” This skill does not work if you did not perform the attack that put the character into Bleedout.","note":"players who consistently fail to role-play the process of properly taunting or praising their enemies will not be allowed to use this skill."},{"category":"The Honored Path of the Berserker","name":"Hatred","cost":"4 CP","prerequisite":"Battle Rage","returnsWith":"—","call":"“Remove Weakness, Rage!”","description":"Your drive to wade into combat is so strong, and your anger is such a powerful force, that you can rely on that instinct to pull you to your feet for one last push, even if you are suffering from extreme weakness. To use this skill, you must role-play some kind of wild self-motivation effort—for instance, letting out a howl or screaming and hitting yourself in the chest. If you do, you gain the opportunity to immediately use the BATTLE RAGE skill and, if you do, to remove any Weakness effects currently affecting you. This is an exception to the normal rule that you cannot use any skills while suffering from Weakness. (If you do not have any more uses of BATTLE RAGE available, then HATRED has no effect.)","usage":"You must role-play a moment of rage and motivation, after which you may call “Remove Weakness, Rage!” and immediately begin an available use of your BATTLE RAGE skill. If you have no available uses of BATTLE RAGE, this skill cannot be used.","note":"although Bleedout causes characters to suffer from many of the same effects as Weakness, it is not the same, and this skill cannot negate the Weakness-like effects of bleeding out."},{"category":"The Honored Path of the Berserker","name":"Berserker","cost":"10 CP","prerequisite":"Hatred","returnsWith":"—","call":"“Berserker!”","description":"You have finally reached the pinnacle of ferocious combat, gaining the ability to shrug off even the deadliest wounds through the sheer force of your rage. You may only use this skill once per game—and, to do so, you must have entered a Bleedout state within the last 30 seconds. (This is an exception to the normal rule that you cannot use any skills while suffering from Bleedout or Weakness.) If you choose to use this skill during that time, you call “Berserker!”, which immediately causes the following effects: 1) you are healed to your normal, maximum Health Point total, which ends your Bleedout condition; 2) you end any Weakness effects that are affecting you; 3) you gain the Berserk effect, which means that you will attack whoever is closest to you, friend or foe, in a blind rage for 3 minutes; 4) all weapon attacks you make during the Berserk effect will deal +1 damage, in a way that stacks with any other effects; and 5) all skills, bestowed items, crafted items, and similar effects that “Return With: Rest” are immediately refreshed. When the Berserk effect ends in any way—or is canceled before it starts—you automatically lose all of your current HP and drop into Bleedout again. (Start a new Bleedout count, rather than continuing the previous one.)","usage":"Once per game, you may call “Berserker!” within 30 seconds of entering Bleedout to enter a Berserk state (See “Effects” in chapter 5 for more details). You heal to your current maximum HP, all your strikes deal +1 damage for the 3-minute duration of the Berserk effect, and all your “Returns With: Rest” abilities are refreshed. When your Berserk effect ends, you immediately drop to 0 HP and enter Bleedout.","note":""},{"category":"The Honored Path of the Berserker","name":"Break Limb","cost":"5 CP","prerequisite":"—","returnsWith":"Rest","call":"“Break Arm”","description":"or “Break Leg” You have mastered the art of summoning up a lot of strength and unleashing it on a single foe—not just to cause indiscriminate damage, but to specifically snap a bone in their arm or leg and ruin their ability to fight or move around. When you use this skill, you make a melee weapon attack and call “Break Arm” or “Break Leg.” If you hit your enemy on any part of the named limb, then you have broken that specific arm or leg, and they will be unable to use that limb until the bone can be set.","usage":"You may call “Break Arm” or “Break Leg” instead of weapon damage.","note":""},{"category":"The Honored Path of the Berserker","name":"Break Shield","cost":"5 CP","prerequisite":"Break Limb, Two-Handed Weapons","returnsWith":"—","call":"“Break Shield”","description":"You have developed the ability to summon up your strength and unleash it on a single, well-defended foe—specifically, to shatter their shield and open them up to other attacks. This skill modifies your use of the BREAK LIMB skill, enabling a new option. Now, when you use any instance of BREAK LIMB, you may instead choose to call “Break Shield,” striking your enemy’s shield and rendering it useless. This Break Shield effect only works if you are wielding a two-handed weapon (that is, a weapon that is longer than 48 inches from pommel to tip), wielding the weapon in both hands, and if you actually make contact with the targeted shield. The shield will be unusable until it can be repaired by a smith. If a player cannot drop their shield to the ground immediately, they can simply hold that shield off to the side rather than using it.","usage":"You may expend a use of BREAK LIMB and call “Break Shield” while wielding a TWO-HANDED WEAPON in both hands and striking a shield. Restriction: melee weapons longer than 48 inches","note":""},{"category":"Mundane Healing","name":"Examine Wounds","cost":"2 CP","prerequisite":"—","returnsWith":"—","call":"“Examine Wounds”","description":"You have basic training in the medical arts, such that you can look at a person and get a fairly accurate sense of just how injured they are in specific terms. You have the ability to call “examine wounds” whenever you are within arm’s reach (roughly 3 feet) of a chosen person. They must tell you if they are living, bleeding out, or dead—and if they are not bleeding out or dead, they should also tell you exactly how damaged they are, in numerical terms. (For instance, “I am missing 4 HP.”)","usage":"You may call “Examine Wounds” within 3 feet of another character. They must tell you whether they are “Down x HP,” “Bleeding Out,” or “Dead.” If they give you a different answer than one of these options, you should explain that they must give one of those three answers.","note":""},{"category":"Mundane Healing","name":"Detect Poison","cost":"2 CP","prerequisite":"Examine Wounds","returnsWith":"—","call":"“Detect Poison”","description":"You have some significant training in the medical arts, and can determine if a person has been Poisoned. You have the ability to call “detect Poison” whenever you are within arm’s reach (roughly 3 feet) of a chosen person. They must tell you if they are suffering from a Poison. This skill only works when it is used on people: you cannot use DETECT POISON to determine if a food, drink, or residue contains Poison (see the ALCHEMICAL EXAMINATION skill). If you are involved in an investigation of possible poisons, though, you should mention that your character has the DETECT POISON skill, since Twin Mask Staff members might decide to give you some extra information as a result.","usage":"You may call “Detect Poison” within 3 feet of another character. They must tell you, in yes or no terms, whether they are suffering from the “Poison” condition.","note":""},{"category":"Mundane Healing","name":"Administer Antidote","cost":"2 CP","prerequisite":"Detect Poison","returnsWith":"Rest","call":"“Remove Poison”","description":"Broken bones and lacerations are far from the worst things that can afflict a person’s body. With advanced training in the medical arts and the healing properties of various compounds, you have the ability to create and administer a potion or poultice that can neutralize and leach even very virulent poisons from a person’s system. You should role-play the process of treating a person’s Poisoned condition, then call “Remove Poison” to prevent them from dying.","usage":"You may spend 30 seconds role-playing administering an antidote to a player that is suffering from the “Poison” condition, then call “Remove Poison.”","note":""},{"category":"Mundane Healing","name":"Detect Disease","cost":"2 CP","prerequisite":"Examine Wounds","returnsWith":"—","call":"“Detect Disease”","description":"You have some significant training in the medical arts, such that you can determine if a person is suffering from a disease. You have the ability to call “detect disease” whenever you are within arm’s reach (roughly 3 feet) of a chosen person. They must tell you if they have any diseases—but they cannot tell you the specific effects of any diseases they may be suffering from. This skill only works when it is used on people: you cannot use DETECT DISEASE to determine if a food or drink harbors a disease. If you are involved in an investigation of possible diseases, though, you should mention that your character has the DETECT DISEASE skill, since Twin Mask Staff members might decide to give you some extra information as a result.","usage":"You may call “Detect Disease” within 3 feet of another character. They must tell you, in yes-or-no terms, whether they are suffering from a disease.","note":""},{"category":"Mundane Healing","name":"Apply Pressure","cost":"1 CP","prerequisite":"Examine Wounds","returnsWith":"—","call":"“Slow Bleeding”","description":"You have some significant training in the medical arts, and you can apply the first-aid pressure needed to stop a person from bleeding out immediately. With this skill, you have the ability to call “slow bleeding” whenever you are touching a person who is in Bleedout. As long as you maintain physical contact with them, you can halt their Bleedout count—but you can only use APPLY PRESSURE in this way for up to 3 minutes. Afterward, their Bleedout count will continue from where you paused it. For each person, you only get 3 minutes of APPLY PRESSURE per time they are placed in Bleedout, even if that 3 minutes is broken up into smaller periods of contact; that is, there is no way to “reset” a subject’s Bleedout count with this skill.","usage":"You may make physical contact with a character, call “Slow Bleeding,” and explain that their Bleedout count is paused for 3 minutes. If you stop making physical contact with the character, you must inform them that their Bleedout counter has resumed. You can do this for 3 minutes total per character per time they are in Bleedout.","note":""},{"category":"Mundane Healing","name":"Set Bone","cost":"3 CP","prerequisite":"Apply Pressure","returnsWith":"—","call":"“Set Bone, Stun by Pain”","description":"You have advanced medical training; you can determine how a person’s bone is broken, then shift it back into its proper position to let it heal. You may call “set bone” whenever you are touching a person who has a broken limb. You should role-play the process of wrenching the limb into place, and the subject should role-play an enormous amount of pain. In fact, whenever you use this ability, you should call “Stun by pain” immediately afterward calling the basic “Set Bone” effect. After a limb is repaired in this way, it still cannot be used immediately; for the next 3 minutes, that limb is considered “maimed,” which means that it cannot be used for anything even slightly strenuous.","usage":"You may make physical contact with a character and call “Set Bone, Stun by Pain.” Often, you should explain that the limb is “maimed” for 3 minutes and may not be used.","note":""},{"category":"Mundane Healing","name":"Bandage","cost":"4 CP","prerequisite":"Set Bone","returnsWith":"—","call":"“Heal 1”","description":"You have advanced training in the medical arts, such that you can apply bandages to wounded people with enough skill to significantly improve their health. With this skill, you have the ability to tie a strip of cloth around a person, then call “heal 1” to restore 1 of their Health Points. You can do this as often as you want if you have enough bandages, but you may only use this skill once every 30 seconds, regardless of how many different people you are bandaging. There is a limit on how many bandages a person can simultaneously benefit from: each person has 5 total “slots” for bandages, consisting of their 2 arms, their torso, and their 2 legs. (The neck does not count as part of the torso; you may wish to bring some longer bandages, if you anticipate having to bandage someone’s torso.) Each zone cannot have more than one bandage applied to it at any one time. Once applied, a bandage ought stay wrapped around the affected area for at least 3 minutes—if a bandage is removed before that duration has elapsed, the person will suffer 1 damage as their wound re-opens. This skill works on any living subject, but you must remember 126 to actually tie a strip of fabric around your patient, and you may find that people are bad at getting your bandages back to you later.","usage":"You may tie a bandage around a character’s arm, leg, or torso that does not already have a bandage and call “Heal 1.” You can use this skill once every 30 seconds. You should inform them they ought to keep the bandage tied on for at least 3 minutes or they will suffer 1 damage when it is removed.","note":"although the only props necessary to use this skill are strips of fabric to serve as bandages, you are strongly encouraged to also use props representing healing herbs, poultices, or medicinal tonics."},{"category":"Mundane Healing","name":"Trauma Patch","cost":"4 CP","prerequisite":"Bandage","returnsWith":"Rest","call":"“Heal 4”","description":"Your highly advanced training in the medical arts has been augmented by the pressure of active combat or other life-threatening hazards: sometimes, you need to get people back in fighting shape quickly. By combining your bandages with more immediate and high-impact herbs, poultices, and emergency medical techniques, you can restore much more vitality. To use this “super-bandage” skill, you should follow the normal procedure for using a BANDAGE (explained above), but also use role-playing and/or props to suggest that this is an extraordinary effort, then call “Heal 4” to restore the person you are bandaging. Just as with the BANDAGE skill, if they remove the bandage before 3 minutes have passed, they will take 1 damage.","usage":"You may tie a bandage around a character’s arm, leg, or torso that does not already have a bandage and call “Heal 4.” You should inform them they ought to keep the bandage tied on for at least 3 minutes or they suffer 1 damage if it is removed.","note":"although the only props necessary to use this skill are strips of fabric to serve as bandages, you are strongly encouraged to also use props representing healing herbs, poultices, or medicinal tonics."},{"category":"Mundane Healing","name":"Surgery","cost":"5 CP","prerequisite":"Bandage, Lore: Anatomy","returnsWith":"—","call":"“Remove Weakness”","description":"You have master-level training in the medical arts, such that you can perform a wide range of complex surgical procedures without permanently damaging your subjects. At the most immediate level, SURGERY improves the functionality of your BANDAGE and TRAUMA PATCH skills: whenever you use one of those skills to heal a person, you can also call “Remove Weakness” to get them back on their feet immediately. Beyond that, SURGERY is something of a catch-all skill—any kind of high-difficulty medical procedures (such as reattaching limbs, removing invasive parasites, or grafting materials into a subject’s body) fall under its purview, and the range of such procedures is limited only by your imagination and the opportunities that occur within the game. SURGERY is often best used alongside healing magic of some variety; for instance, simply using this skill to reattach a severed limb will not make that limb useable unless healing magic can restore its functionality. To use this skill, you must have props representing a doctor’s implements, such as (for example) a needle and thread, a sharp knife, and a magnifying glass. The amount of time required to perform a given surgery can vary by its complexity (ask a Twin Mask Staff member for details)… but, absent a Staff member’s guidance, it will take 3 minutes of intensive role-playing. Additionally, the SURGERY skill can be used to reconnect a 127 decapitated corpse’s head (to allow others to successfully deliver potions—which require ingestion and a digestive system—to that corpse), to drain blood from dead (or wounded) creatures or people, or to harvest useful parts of the bodies of various unusual creatures if you begin the surgical process soon after their deaths.","usage":"When you use BANDAGE or TRAUMA PATCH to heal someone, you can call “Remove Weakness” on them immediately afterward. You may also spend 3 minutes role-playing performing a surgical procedure, using appropriate props as necessary. This is usually done under the purview of Twin Mask Story Staff. If done to repair a deathblow, you should state that the surgery is complete, and the body may accept Elixir-delivered effects again. If done to simply perform a surgical action for role-play, you may describe the procedure and any actions that you are taking as a result. SPECIAL APPLICATION: FIELD SURGERY With your expertise as a healer—specifically, the ability to literally stitch and mend people back together—you can also act as an incredibly effective combat surgeon. As long as you have the resources of a Healer’s Tent available to you, you can spend 3 minutes and fix nearly any amount of tissue damage to your patient, healing their HP fully. Usage: You may spend 3 minutes inside a Healer’s Tent role-playing performing surgery to repair a living character’s wounds and injuries. At the end of 3 minutes, you may call “Restore Health,” healing them to their current maximum HP.","note":"If the character was at 0 Health Points before you began FIELD SURGERY, they must still continue their Bleedout counter unless it is paused by a skill such as APPLY PRESSURE or similar. The surgeon performing FIELD SURGERY may not simultaneously use APPLY PRESSURE. If a character is at 0 hp when you complete FIELD SURGERY, they enter Weakness normally upon being healed."},{"category":"Mundane Healing","name":"Battlefield Medicine","cost":"2 CP","prerequisite":"Surgery","returnsWith":"—","call":"—","description":"As an intensely practiced healer and combat surgeon, you are no stranger to life-threatening conflict. Over and over, you have seen terrible things done to the flesh of the people around you, and it has been your responsibility to pull them back together before they die. That has a way of sharpening your skills, pushing you to work ever faster. With this skill, your use of the SURGERY skill to heal others through Field Surgery speeds up dramatically, taking only 2 minutes.","usage":"You perform the FIELD SURGERY application of the SURGERY skill in 2 minutes instead of 3. 128 RELIGIOUS WORSHIP As discussed in the Religions section of chapter 2, the gods of Adelrune—and the other powerful entities that accept worship in return for power—have a lot of impact on the world. In order to shape that impact and draw benefits from the divine, you need strength of will and training in distinct religious traditions, which are represented by the skills below. To understand how these skills work in the context of game, read the Divine Magic section of chapter 4.","note":""},{"category":"Religious Worship","name":"Prayer","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have learned how to focus your mind and soul into a quiet, engaged stillness that can help your thoughts, words, and actions echo outward into the realm of the divine. You gain a single “PRAYER action” to use during any given Twin Mask game session: by spending 30 minutes in seeking connection with the gods, you can establish a connection—however small—with spiritual forces beyond your comprehension. Generally, this means that you will spend your 30-minute PRAYER to contribute to (and benefit from) one of the various Rites that are explained in the Divine Magic section of chapter 4. The more people gathered together for a Rite, the more powerful benefits you will be able to draw from that Rite, as long as you are working with a religious leader who has taken at least one version of each of the PRIESTHOOD and RITE MASTERY skills, listed below. Anyone can help contribute to a Rite that matches their faith; with the PRAYER skill, you can actually draw benefits from that Rite. To learn this skill, you will need instruction from somebody with PRAYER who shares your faith (or spend 1 Influence to use the INSTRUCTION Influence Action).","usage":"Once per game, you may spend 30 minutes participating in a religious rite led by a priest of your faith and then choose one of the available benefits of that rite based on priest rank and number of attendees.","note":""},{"category":"Religious Worship","name":"Secondary Prayer","cost":"4 CP","prerequisite":"Priesthood: Rank 2","returnsWith":"—","call":"—","description":"By training yourself in the rites and patterns associated with your god and your overall faith, you have found a deeper connection to the ineffable energies of the divine. With this skill, you get a second “PRAYER action” that works exactly as your first one (from the actual PRAYER skill) does. Notably, you cannot use two PRAYER actions during the same Rite… so you will want to involve yourself in two different Rites during a Twin Mask game session in order to make use of this expanded capability. To learn this skill, you will need instruction from somebody with SECONDARY PRAYER who shares your faith (or spend 1 Influence to use the INSTRUCTION Influence Action).","usage":"You may perform PRAYER twice per game instead of once.","note":""},{"category":"Religious Worship","name":"Tertiary Prayer","cost":"4 CP","prerequisite":"Priesthood: Rank 4","returnsWith":"—","call":"—","description":"By delving as deeply as you can into the mysteries and incalculable powers of your god and your overall faith, you have arrived at a depth of devotion, and a connection to the divine, that is almost unmatched among mortals. With this skill, you get a third “PRAYER action” that works exactly as your other ones do. Notably, you cannot use more than one PRAYER action during the same Rite… so you will want to involve yourself in at least three different Rites during a Twin Mask game session in order to make use of this expanded capability. To learn this skill, you will need instruction from somebody with TERTIARY PRAYER who shares your faith (or spend 1 Influence to use the INSTRUCTION Influence Action).","usage":"You may perform PRAYER three times per game.","note":""},{"category":"Religious Worship","name":"Priesthood: Rank 1","cost":"6 CP","prerequisite":"Prayer","returnsWith":"—","call":"—","description":"Most people acknowledge the gods and give them… enough respect, using relatively casual prayers to propitiate the divine beings that hold sway over their day-to-day lives. For you, though, such a laissez-faire connection with that holy power seems woefully insufficient. As such, you have pledged yourself to begin to learn the best ways to make connections with the gods, to channel their energies to make your life—and the lives of your fellow worshippers—better. This skill does nothing on its own; in combination with at least one RITE MASTERY skill, though, it allows you to enact Level 1 religious ceremonies that match a Rite you have learned. In order to enact any Rites, you will have to have a Shrine dedicated to your faith. Additionally, it is very wise to pick up the LORE skill that corresponds to your faith (or your god in particular), since other people are likely to ask you for details about your religion. To learn this skill, you will need instruction from somebody with PRIESTHOOD: RANK 1 who shares your faith (or spend 1 Influence to use the INSTRUCTION Influence Action).","usage":"You may use any known RITE MASTERY skills to perform religious rites for your faith at Level 1. See the Divine Magic section of Chapter 4.","note":"if you ever decide to renounce your religious faith and convert to worshipping a new faith, you do not lose your PRIESTHOOD and RITE MASTERY skills… but you must endure a 6-month moratorium on using those skills, while you build trust with your new god and re-learn the specifics of how to worship."},{"category":"Religious Worship","name":"Priesthood: Rank 2","cost":"6 CP","prerequisite":"Priesthood: Rank 1","returnsWith":"—","call":"—","description":"As you delve beyond the most obvious words and trappings of your religion, you start to understand the deeper purposes of the god and the faith that you serve, and as a result you can involve more people in successfully channeling stronger effects into the world. This skill combines with RITE MASTERY skills to allow you to enact Level 2 religious ceremonies that match a Rite you have learned. In general, a Level 2 Rite requires you to gather 3 people of the same religion together. To learn this skill, you will need instruction from somebody with PRIESTHOOD: RANK 2 who shares your faith (or spend 1 Influence to use the INSTRUCTION Influence Action).","usage":"You may use any known RITE MASTERY skills to perform religious rites for your faith at Level 2. See the Divine Magic section of Chapter 4.","note":"to enact any Rites, you need to have a Shrine dedicated to your faith."},{"category":"Religious Worship","name":"Priesthood: Rank 3","cost":"6 CP","prerequisite":"Priesthood: Rank 2","returnsWith":"—","call":"—","description":"Drawing ever closer to the holy font of power that you can feel in your god’s and your faith’s presence beyond Adelrune, you have mastered more profound ways to build metaphorical bridges to the divine realms, such that more people can experience what you have. This skill combines with RITE MASTERY skills to allow you to enact Level 3 religious ceremonies that match a Rite you have learned. In general, a Level 3 Rite requires you to gather 6 people of the same religion together. To learn this skill, you will need instruction from somebody with PRIESTHOOD: RANK 3 who shares your faith (or spend 1 Influence to use the INSTRUCTION Influence Action).","usage":"You may use any known RITE MASTERY skills to perform religious rites for your faith at Level 3. See the Divine Magic section of Chapter 4.","note":"to enact any Rites, you need to have a Shrine dedicated to your faith."},{"category":"Religious Worship","name":"Priesthood: Rank 4","cost":"6 CP","prerequisite":"Priesthood: Rank 3","returnsWith":"—","call":"—","description":"Near the pinnacle of mortal connection to the divine, you have mastered the most powerful known ways of drawing godly energy to resonate with and flow through a large group of worshippers. This skill combines with RITE MASTERY skills to allow you to enact Level 4 religious ceremonies that match a Rite you have learned. In general, a Level 4 Rite requires you to gather 9 people of the same religion together. To learn this skill, you will need instruction from somebody with PRIESTHOOD: RANK 4 who shares your faith (or spend 1 Influence to use the INSTRUCTION Influence Action).","usage":"You may use any known RITE MASTERY skills to perform religious rites for your faith at Level 4. See the Divine Magic section of Chapter 4.","note":"to enact any Rites, you need to have a Shrine dedicated to your faith."},{"category":"Religious Worship","name":"Rite Mastery: (Specify Domain)","cost":"4 CP","prerequisite":"Prayer","returnsWith":"—","call":"—","description":"The gods are, in a way, embodiments of ideas: just as much as they are actual, thinking entities with goals and motivations, they are also symbols for some of the deepest principles that constitute mortal existence. Within a faith, then, there is room for a wide variety of different kinds of ceremonies, each focused on a different aspect of the divine, and each producing a different kind of effect. Each time you take this skill, you learn the holy words and ideas that make up one of the 10 different non-universal Rites listed in the Divine Magic section of chapter 4: Absolution, Community, Death, Guidance, Life, Mysticism, Nature, Prosperity, Protection, or War. You now have access to that avenue of power, and—as long as you have some ranks of the PRIESTHOOD skill—you can lead religious ceremonies at a Shrine to enact that Rite. (All priests may use the Universal Rites.) The level of these Rites is limited by your ranks of PRIESTHOOD… and the number of people who share your religion that you can get together. See chapter 4’s Divine Magic section for more details on the Rites’ effects. To learn this skill, you will need instruction from somebody with RITE MASTERY who shares your faith (or spend 1 Influence to use the INSTRUCTION Influence Action).","usage":"Choose one of the 10 non-Universal rites in the Divine Magic section of Chapter 4. You may perform this rite using PRIESTHOOD with 30 minutes of role-play at a Shrine to your faith. You choose a new rite from the 10 available every time you take this skill.","note":"if you ever decide to renounce your religious faith and convert to worshipping a new faith, you do not lose your PRIESTHOOD and RITE MASTERY skills… but you must endure a 6-month moratorium on using those skills, while you build trust with your new god and re-learn the specifics of how to worship."},{"category":"Religious Worship","name":"Repentance","cost":"2 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have recognized the depth of the mistakes you made in the past, and all you wish is to be understood and forgiven as a person seeking redemption. In order to take this skill, you must role-play deep and sincere repentance for your character’s evil actions in the past. Taking this skill reduces your character’s “Corruption score” by 1. (See the CORRUPTED background flaw for more details on Corruption as a game mechanic.) Of course, you must also continue to role-play an active desire to make up for your previous actions, and if you ever again do something evil enough to warrant gaining a point of Corruption, you will receive 1 additional Corruption as a kind of punishment.","usage":"If you have +1 Corruption as a result of evil actions performed during gameplay, you receive -1 Corruption. If you ever gain +1 Corruption from performing evil actions while you have this skill, you instead gain +2 Corruption.","note":"this skill can only ever be taken once, and it can only remove Corruption that was accrued through evil actions. The “standard” Corruption that characters receive when they die cannot be affected by this skill. 132 THE BARDIC ARTS Being a bard isn’t just about inspiring the crowd… it’s also about being the best, and letting everyone know it. Bards can channel sonic energy and a crowd’s attention to produce various effects: the Bardic Arts have the power to inspire, to center people’s minds, and even to make other people shut up when you need them to. While the people listening to a bard may certainly garner some advantages, make no mistake: the bard is always the center of attention."},{"category":"The Bardic Arts","name":"Commanding Presence","cost":"3 CP","prerequisite":"—","returnsWith":"Rest","call":"“By My Voice, Stun”","description":"As a bard, you are used to commanding the attention of both good and bad audiences… and you have therefore developed the expertise needed to crash directly into the auditory awareness of everyone around you. To use this skill, you must spend 3 seconds loudly commanding people to be quiet; immediately following those 3 seconds, you may call “by my voice, Stun!” as loudly as you wish. (Stunned people cannot use skills, attack, or defend themselves for 3 seconds.) Importantly, this skill may not be used in combat: if weapons have been drawn and brandished in the vicinity, or if combat skills have already been used, you may not use COMMANDING PRESENCE until the conflict dies down again.","usage":"You may call “By My Voice: Stun” after role-playing 3 seconds of trying to get people to quiet down. This may not be used in combat.","note":""},{"category":"The Bardic Arts","name":"Serenade","cost":"8 CP","prerequisite":"Willpower","returnsWith":"Rest","call":"“Bestow Willpower”","description":"You are excellent and talented, yes… but you are not the only one who matches that description! Indeed, you make a habit of surrounding yourself with the very finest people, and you have developed your bardic talents in such a way as to help fortify those individuals with a proper sense of their own resilience and self-worth. To use this skill, you must spend at least 3 minutes performing a song, inspirational speech, or other bardic talent intended to uplift and inspire a particular person within earshot—and you must have at least 3 spectators, not including the person being serenaded, during your performance. Immediately after your performance, you may call “bestow Willpower” to grant that person AND yourself the use of a “Willpower” effect for the next 3 days. Additionally, this Willpower effect gains the “Returns With: Rest” property. This means that, for most intents and purposes, both of you can act as though you had gained one use of the WILLPOWER skill for the rest of the current Twin Mask game session. (You cannot use it as a prerequisite for taking other skills, of course.)","usage":"You may perform a 3-minute bardic talent in front of an audience of at least 4 characters, then call “Bestow Willpower” on one of those characters and yourself. You must explain that this Willpower lasts for the entire game and Returns with Rest.","note":"see Bestowed Effects in chapter 5 for more information on how this skill interacts with others."},{"category":"The Bardic Arts","name":"Dance Lesson","cost":"8 CP","prerequisite":"Dodge","returnsWith":"Rest","call":"“Bestow Dodge”","description":"By focusing special attention on how you (and other people) move to music, you have gained the ability to translate such movements into graceful and evasive maneuvers that can be helpful even in combat. To use this skill, you must dance with another person for at least 3 minutes; immediately afterward, you may call “bestow Dodge” to grant that person AND yourself the use of a “Dodge” effect for the next 3 days. Additionally, this Dodge effect gains the “Returns With: Rest” property. This means that, for most intents and purposes, both of you can act as though you had gained one use of the DODGE skill for the rest of the current Twin Mask game session. (You cannot use it as a prerequisite for taking other skills, of course.) Importantly, the DANCE LESSON skill does not work unless some kind of music is being played for the full 3-minute duration of your dance—but you may provide the music yourself, perhaps by singing or drumming while you dance.","usage":"You must dance to music with another character for 3 minutes, then you may call “Bestow Dodge” on that character and yourself. You must explain that this Dodge lasts for the entire game and Returns with Rest.","note":"see Bestowed Effects in chapter 5 for more information on how this skill interacts with others."},{"category":"The Bardic Arts","name":"True Greatness","cost":"4 CP","prerequisite":"—","returnsWith":"Sunrise and Sunset","call":"“Remove Weakness”","description":"You have learned how to understand the true, glorious nature of your own importance: when audiences praise you and your arts, they are not just indulging in flattery. They are simply acknowledging your greatness, and it would be foolish not to believe them. To use this skill, you must spend at least 3 minutes performing a song or other bardic talent that you consider to be among the very finest acts in your repertoire—and you must have at least 3 spectators during your performance. For the 3 hours immediately following your performance, you gain the benefits of a state of “bardic confidence.” While in this state, whenever you receive a verbal compliment of any type, you may immediately call “remove Weakness” on yourself. (This, naturally enough, is an exception to the normal rule that you cannot use any skills while suffering from Weakness.) A fitting compliment can be any kind of positive reinforcement, whether it is directed at your performance, yourself, your hairstyle, your clothes, etc.","usage":"You may perform a 3-minute bardic talent in front of at least 3 characters. For 3 hours afterward, you may call “Remove Weakness” on yourself whenever you receive a verbal compliment.","note":"although Bleedout causes characters to suffer from many of the same effects as Weakness, it is not the same, and this skill cannot negate the Weakness-like effects of bleeding out. Compliments will not put any blood back into your body, and you will remain incapacitated."},{"category":"The Bardic Arts","name":"Drinking Song","cost":"6 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have learned the songs, the rhythms, and the attitude needed to draw vigor and intensity from the rowdy energy of a crowd indulging in food and drink. To use this skill, you must spend at least 3 minutes performing a song or other bardic act that is fitting for a celebration, feast, or drinking session—and you must have at least 3 spectators during your performance. You may use this skill as often as you wish. During the 3 minutes immediately following your performance, the first food item (that is, an item produced by the use of a COOKING skill) you consume will have all its effects doubled in intensity for their full duration. Note that DRINKING SONG only changes the intensity of a food item’s effects; it cannot influence the duration of those effects. As such, it will not affect any bonus duration produced by the “Long-Lasting” property near the top of the Cooking Craft Food Table.","usage":"You may perform a 3-minute bardic talent in front of at least 3 characters. For 3 minutes afterward, the first applicable COOKING skill item you consume will have its numerical values doubled. See the COOKING skill for which dishes this skill applies to.","note":""},{"category":"The Bardic Arts","name":"Meditative Song","cost":"10 CP","prerequisite":"Mana Focus ×3","returnsWith":"—","call":"“Restore 3 Mana”","description":"You have developed the ability to immerse yourself in the stimulating, flowing precision of music (or dance) to such an impressive extent that you can even refresh your connection to arcane energies through it. To use this skill, you must sing a song (or publicly display some other kind of bardic talent) for at least 3 minutes; immediately afterward, you may call “restore 3 mana” for yourself. After doing so, you may not use this skill again for the next 30 minutes. (Other than this restriction, you may use this skill as often as you wish.) Note that, unlike many bardic skills, MEDITATIVE SONG does not require your performance to have any spectators.","usage":"You may perform a 3-minute bardic talent and call “Restore 3 Mana” on yourself. This may not be used more than once every 30 minutes.","note":""},{"category":"The Bardic Arts","name":"Hymn","cost":"2 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have studied—or perhaps naturally intuited—various sacred rhythms, gestures, melodies, or words that can call the attention of the gods themselves to the people of Adelrune. Or, in more stereotypically “bardic” terms: your talent has become so divine that even the gods wish to witness your greatness. This skill is used to aid people who are using the PRAYER skill to connect with their gods. To use HYMN, you must spend at least 3 minutes during the beginning of a PRAYER action to perform a song or other bardic display that is dedicated to the particular god or gods that are being invoked. You must personally embrace (on your character sheet) the faith of the invoked god(s). For the HYMN to work, too, your performance must have at least 3 other spectators, which can include anyone involved in the larger prayer. Once you have performed for at least 3 minutes, the total time needed to complete the communal PRAYER action is reduced by 10 minutes. Note that this skill cannot stack with itself; there is no way to use HYMN to reduce a PRAYER’s duration by more than 10 minutes, even if multiple bards choose to perform. If you have both PRIESTHOOD and HYMN, though, you can actually use this skill as part of your use of PRIESTHOOD, with your 3-minute HYMN serving “double duty” as both prayer and song at the same time. (This is an exception to the normal rule that you cannot perform two different skills at the same time.)","usage":"You may perform a 3-minute bardic talent in front of at least 3 characters during the first 3 minutes of a PRAYER—dedicated to a god of your faith—and reduce the duration of the PRAYER from 30 minutes to 20 minutes.","note":""},{"category":"The Bardic Arts","name":"Requiem","cost":"3 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have honed your skills to such a height that even the spirits of the dead are drawn to the edges of death’s veil to witness your art. To use this skill, you must spend at least 3 minutes performing a song or other bardic act at a funeral, wake, or other memorial to the recently deceased. You may use this skill as often as you wish, but each such performance must have at least 3 spectators to qualify as an effective use of REQUIEM. After your performance is complete, the spirit of the dead person being honored will be able to hear all words spoken for the full duration of the funeral. While this does not provide any direct mechanical benefits to mourners or the departed, it can be invaluable in helping to provide closure as people say their farewells.","usage":"You may perform a 3-minute bardic talent in front of at least 3 characters during a funeral or wake to allow the spirit of the dead character in question to hear everything said beyond that point in the ceremony. 136 THE MAGICAL ARTS A “magical art” (also known as a “school of magic”) is an individual discipline of spellcasting. In Twin Mask, there is no “generalist” path for a spellcaster to follow: as your character gains more skills, you must specify the magical arts that they have chosen to develop. Given enough time, characters can advance their skills in two or more magical arts, but training in one art does not provide any help in learning the others. One of the few things that is shared between the different magical arts is the pool of energy that spellcasters get from purchasing the MANA FOCUS skill—mana, which replenishes at dawn and dusk, is necessary to cast spells. New players only have access to Sorcery, Channeling, Alchemy, Warding, and Divination, but other magical arts are available in game (if your character can find a teacher). For more information about the magical arts, see Chapter 4: Magic.","note":""},{"category":"The Magical Arts","name":"Mana Focus","cost":"1 CP","prerequisite":"Magical Aptitude","returnsWith":"Sunrise and Sunset","call":"—","description":"You have developed your ability to sense, and to work with, the invisible threads of magical energy that infuse the world around you. Every time you take the MANA FOCUS skill, your character’s maximum mana capacity goes up by 1. That is, if you have taken the MANA FOCUS skill 5 times, then you have a maximum mana capacity of 5. Every spell you cast depletes your mana by an amount of mana equal to that spell’s level, between 1 and 4 (see chapter 4 for more details). Your mana is replenished to its maximum at sunrise and sunset—and you should always mentally keep track of how much mana you still have available.","usage":"You increase your maximum mana by 1.","note":""},{"category":"The Magical Arts","name":"Apprentice Magic: (Specify Magical Art)","cost":"6 CP","prerequisite":"Mana Focus ×5, Lore: (Same Magical Art)","returnsWith":"—","call":"—","description":"Through study and focus, you have learned the basics of a particular magical art (such as Sorcery or Channeling) and can now call up simple effects associated with that art, as long as you have the appropriate scrolls. That is, you can cast 1st-Circle spells of that magical art. Once you have 5 instances of MANA FOCUS, you can purchase this skill multiple times… but each time, you must choose a different magical art (for which you have learned the corresponding LORE skill).","usage":"You may cast 1st-Circle spells of one of the available magic schools. You gain access to the 1st-Circle spells of a different magic school every time you purchase this skill.","note":"1st-Circle spells are also called “apprentice-level” and “first-level.”"},{"category":"The Magical Arts","name":"Journeyman Magic: (Specify Magical Art)","cost":"6 CP","prerequisite":"Mana Focus ×10, Apprentice Magic: (Same Magical Art)","returnsWith":"—","call":"—","description":"By standing atop the building blocks of a particular magical art (such as Warding or Alchemy) you have learned how to produce that art’s more complex effects, so long as you have the appropriate scrolls. That is, you can cast 2nd-Circle spells of that magical art. Once you have 10 instances of MANA FOCUS, you can purchase this skill multiple times… but each time, you must choose to learn a different magical art (that you have already learned at the Apprentice level).","usage":"You may cast 2nd-Circle spells of one of the available magic schools. You gain access to the 2nd-Circle spells of a different magic school every time you purchase this skill.","note":"2nd-Circle spells are also called “journeyman-level,” “second-level,” and (occasionally) “adept.”"},{"category":"The Magical Arts","name":"Master Magic: (Specify Magical Art)","cost":"6 CP","prerequisite":"Mana Focus ×15, Journeyman Magic: (Same Magical Art)","returnsWith":"—","call":"—","description":"By delving even deeper into the mysteries and practical challenges of a particular magical art, you have begun to harness some of the fundamentally powerful aspects of that art—as long as you have the appropriate scrolls. That is, you can cast 3rd-Circle spells of that magical art. Once you have 15 instances of MANA FOCUS, you can purchase this skill multiple times… but each time, you must choose a different magical art (that you have already learned at the Journeyman level).","usage":"You may cast 3rd-Circle spells of one of the available magic schools. You gain access to the 3rd-Circle spells of a different magic school every time you purchase this skill.","note":"3rd-Circle spells are also called “master-level” and “third-level.”"},{"category":"The Magical Arts","name":"Grandmaster Magic: (Specify Magical Art)","cost":"6 CP","prerequisite":"Mana Focus ×20, Master Magic: (Same Magical Art)","returnsWith":"—","call":"—","description":"Whether through intensive study or powerful intuition, you have passed the limits of your teachers’ knowledge of a magical art and are now capable of delving into its most arcane depths… as long as you have the appropriate scrolls. That is, you can cast 4th-Circle spells of that magical art. Once you have 20 instances of MANA FOCUS, you can purchase this skill multiple times… but each time, you must choose a different magical art (that you have already learned at the Master level).","usage":"You may cast 4th-Circle spells of one of the available magic schools. You gain access to the 4th-Circle spells of a different magic school every time you purchase this skill.","note":"4th-Circle spells are also called “grandmaster-level” and “fourth-level.”"},{"category":"The Magical Arts","name":"Weapon Casting","cost":"8 CP","prerequisite":"Magical Aptitude","returnsWith":"—","call":"—","description":"Same as spell You have blended martial discipline and arcane focus into a powerful ability: you can make the magical effects of your spells flow through the weapon you are wielding. With this skill, any spell you can cast that would normally be delivered by packet can instead be delivered with a swing (or throw or shot) of your weapon, with the effect of the spell replacing the damage of your attack. You must still spend the mana for the spell, along with spending the amount of time casting the spell would normally take (so, for instance, casting spells that require multiple seconds of concentration in this way can be tricky). Unlike spells that are delivered by packet, though, spells delivered this way will not work if they hit an opponent’s shield or weapon. (If you hit a shield or weapon and your spell produces no effect, you will keep the mana you tried to spend on your spell.) This skill can be used in concert with THROWN WEAPONS or a BOW AND ARROW to produce normally packet-delivered spell effects at range without a packet.","usage":"You may deliver a packet spell via a melee or ranged weapon. You must follow all requirements and make the call exactly as you would when delivering it by packet, with the exception that you may add the “Stealth” modifier if you meet all the requirements.","note":"spells cast in this way can benefit from any Artificing items (see the ARTIFICING skills for more details) that you may be holding in your other hand."},{"category":"The Magical Arts","name":"Elemental Flourish","cost":"4 CP","prerequisite":"Apprentice Magic: Sorcery, Great Strike","returnsWith":"—","call":"Special","description":"As a Sorcerer, you have wrapped your mind around the most effective elements for combat, with the feel of each of them living like a memory in your fingers. By blending that art with your expertise in combat, you can let a surge of elemental energy flow along with your weapon, whenever you make a truly serious effort to deal a powerful blow. Whenever you use a Great Strike, you may choose one of Sorcery’s classic elements—Fire, Ice, Acid, or Lightning—and have your attack take on that element.","usage":"Whenever you perform a GREAT STRIKE, you may add Fire, Ice, Acid, or Lightning to that attack in addition to its normal damage.","note":""},{"category":"The Magical Arts","name":"Armored Casting","cost":"6 CP","prerequisite":"Magical Aptitude","returnsWith":"—","call":"—","description":"Through long training and discipline, you have learned how to draw on mana even with the hardened barrier of armor dulling your connection to the world’s magic, or with a shield interfering with your dexterity. You may cast spells while wearing armor or wielding a shield.","usage":"You may ignore restrictions from armor and shields when casting spells.","note":""},{"category":"The Magical Arts","name":"Combat Mimic","cost":"4 CP","prerequisite":"Weapon Casting","returnsWith":"Rest","call":"“Mimic – (repeat call to be copied)”","description":"You have developed the hard-to-explain ability to feel the ‘energy swirls’ that are caused by powerful or unusual melee attacks used in close proximity to you. By using your familiarity with WEAPON CASTING, you can watch an enemy closely and mimic any weapon-delivered melee attack they perform against you, even if that attack is far beyond your normal capabilities. Within the 3 seconds after an enemy attempts to strike you with an attack, if you are wielding a melee weapon, you may call “mimic” as you make an attack against them or another target, followed by the exact same call that the enemy used for their attack. (The only weapon-based melee attacks that you cannot mimic are those that use the “Greater” modifier.) If you have multiple uses of COMBAT MIMIC, you can make multiple such attacks in a row, all based on the initial attack against you.","usage":"You may repeat the call of a non-Greater melee weapon attack targeted at you within the last 3 seconds. Restriction: must be actively wielding a melee weapon","note":""},{"category":"The Magical Arts","name":"Internal Reserves","cost":"4 CP","prerequisite":"Mana Focus ×10","returnsWith":"—","call":"“Restore 10 Mana”","description":"As a spellcaster, you have learned how to tap into your inner wells of magical power, and, in times of great need, you can even pour an unhealthy amount of your strength into your magical arts. Whenever you choose to use this ability, you must meditate (remaining motionless, with your eyes closed) for 30 seconds. If you do, you can reduce your maximum Health Point total by 1 for the next 3 days in order to immediately call “restore 10 mana” (thereby regaining 10 mana). This reduction in maximum HP total cannot be healed through any normal means, and if you reduce your maximum HP total to 0 in this way, you immediately die.","usage":"You may meditate for 30 seconds, then call “Restore 10 mana.” You reduce your maximum HP by 1 for the remainder of the weekend.","note":""},{"category":"The Magical Arts","name":"Arcane Tutelage","cost":"10 CP","prerequisite":"Grandmaster Magic: (Any Magical Art), Research","returnsWith":"—","call":"“Bestow 10 Mana”","description":"After so much time spent doing magical research and perfecting the art of your spellcasting, you have accumulated a great deal of useful information and advice to share with your fellow magic-users. Once per game, you can spend 30 minutes role-playing through a “magic class” with as many spellcasters as are interested in participating, thereby bestowing on them a special, long-lasting boon of 10 additional mana. The 30-minute ARCANE TUTELAGE class itself can focus on any magic-related or scholarly activities, including lectures or moderated discussions (on abstract magical theory, cosmology, recent arcane events, etc.) or possibly field excursions (involving packet-throwing, healing, herbalism, leylines, etc.). At the end of the class, you may call “bestow 10 mana” to affect all other characters (that is, everyone but you) that were involved in the full duration of the class. If an ARCANE TUTELAGE session is interrupted by unplanned combat, the class does not need to restart—as long as you return to class with a gap of no more than 3 minutes after the end of combat, you can resume the class where you left off. Importantly, the extra 10 mana bestowed by ARCANE TUTELAGE lasts for 3 full days, with the added bonus that it will replenish at sunrise and sunset, just as normal mana generated by the MANA FOCUS skill does. In order to gain any benefit from ARCANE TUTELAGE, a character must be a “spellcaster,” which means that they must have taken at least 1 APPRENTICE MAGIC skill. This must be a formal class; merely engaging in casual conversation about magic-related subjects is not sufficient to meet this skill’s requirements. Twin Mask Staff encourages players who take this skill to use visual aides and require their students to take notes, or perhaps even to make their students do “homework.”","usage":"You may perform a 30-minute presentation on magic, then call “Bestow 10 mana.” You must explain to everyone present that this mana works like maximum mana and returns with sunrise/sunset, just like mana on their character sheet.","note":"see Bestowed Effects in chapter 5 for more information on how this skill interacts with others."},{"category":"The Magical Arts","name":"Arcane Reflection","cost":"4 CP","prerequisite":"Arcane Tutelage","returnsWith":"—","call":"—","description":"You have wrestled with the complexities of the magical arts for long enough that you have become an authority and a teacher on the subject—but, as they say, the best way to learn something is to teach it. While instructing others on the finer points of your art, you have been forced to examine your own biases and secret pockets of ignorance. Every time you do so, you realize just a little bit more of your own potential, even if only temporarily. With this skill, when you use the ARCANE TUTELAGE skill, you also gain the 10 bestowed mana you grant students.","usage":"You receive the benefit of your own Arcane Tutelage.","note":""},{"category":"The Magical Arts","name":"Spellwright","cost":"2 CP","prerequisite":"Grandmaster Magic: (Any Magical Art), Research","returnsWith":"—","call":"—","description":"You have spent enough time steeped in the arcane arts—both their broad theories and their specific applications—that you have started to put some novel ideas together about how their principles could be combined. With this skill, you gain the ability to pursue original spell research. It make take a lot of work, after your initial brainstorm… but innovation is worth it.","usage":"You may pitch and invent new spells using the rules for Researching New Spells in Chapter 4.","note":""},{"category":"Skullduggery","name":"Disguise","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"You have learned enough about the art of disguise to be able to truly convince others of your assumed identity. Players in Twin Mask often play multiple characters, and they mark those characters with different costumes, so it can often be hard to tell if a costume change means that your friend is playing a truly different character, or just the same character dressed up to look different! To clear up this confusion, all Twin Mask players have the option—at ANY time—to briefly go out of character, raise a loose fist above their heads, and quietly ask another player, “CLARIFY, is this [character name] in different clothing, or a different person?” Without this skill, that player must answer truthfully. (Failure to do so is a form of cheating.) With the DISGUISE skill, though, you have the option of lying, which will make your character’s newly assumed identity infinitely more convincing! Using this skill has two primary requirements. First, you must change your costuming significantly, to the point of being unrecognizable as your character while disguised. Do not simply change out one piece of your costume and call it a disguise, placing the burden on other characters to pretend not to recognize you. Second, you cannot successfully disguise yourself as another specific existing character, even another one that you play.","usage":"You may don a disguise and attempt to appear unrecognizable as your character without changing your race. If asked OOC by other characters if you are your PC, you may answer “yes” or “no” at your option. You may answer this way both IC and OOC.","note":"if a character knows that you are wearing a disguise (by using the DETECT DISGUISE skill or similar abilities), they may remove the disguise by role-playing the process for 30 uninterrupted seconds. Of course, if you can interrupt them and therefore foil this process, you are free to do so: this means that the disguise-removal process can only work on people who are tied up, unconscious, asleep, bleeding to death, simply not trying, and so on."},{"category":"Skullduggery","name":"Master Disguise","cost":"6 CP","prerequisite":"Disguise","returnsWith":"—","call":"—","description":"You have mastered the art of appearances, allowing you to masquerade as a member of a different bloodline (as long as that bloodline appears in this rulebook). If you are a human, for example, you’ve learned how to acquire or create advanced prosthetics that can mimic the horns of a Dragon-Blooded, or the ears of an Effendal. Or perhaps you are a Celestial-Blooded who has found special ways to hide your wings and dim any supernatural glow. This skill works exactly like DISGUISE, except that you may disguise yourself as another bloodline; a human, for instance, could disguise themselves as a dragon-blooded. You will still have to supply your own costume pieces if you want your character to use them, and you still cannot disguise yourself as another specific existing character, even another one you play. This skill does not give you the ability to disguise yourself as non-playable bloodlines or species.","usage":"You may don a disguise and attempt to appear unrecognizable as your character with the ability to change your race. If asked OOC by other characters if you are your PC, you may answer “yes” or “no” at your option. You may answer this way both IC and OOC.","note":"As with a regular disguise, other people can remove your disguise by role-playing that process for 30 uninterrupted seconds, as explained in the DISGUISE skill above."},{"category":"Skullduggery","name":"Detect Disguise","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"“Detect Disguise”","description":"You are keenly observant and can spot things that seem out of place with greater ease. As long as you have stayed within 3 feet (arm’s reach) of an individual for 3 uninterrupted minutes, you may call “detect disguise,” and that person is required to truthfully state whether or not they are wearing a disguise, even if they have the DISGUISE or MASTER DISGUISE skills. While this skill will tell you whether or not the person is wearing a disguise, it doesn’t let you see beneath: you must still role-play ignorance of their true identity unless or until that disguise is removed. (See the note in the DISGUISE skill for details about how to remove the disguise and reveal their identity.) You may use this skill as often as you wish, so long as you spend the requisite 3 minutes each time.","usage":"You must spend 3 uninterrupted minutes within arm’s reach of a character, then may call “Detect Disguise.” They must answer truthfully whether they are in disguise. Special—the EFFENDAL SENSES skill reduces the time it takes to use DETECT DISGUISE by 60 seconds, to a total of 2 uninterrupted minutes.","note":""},{"category":"Skullduggery","name":"Escape","cost":"3 CP","prerequisite":"—","returnsWith":"Rest","call":"“Escape”","description":"You are an escape artist, with the practice needed to squirm your way out of any kinds of ropes, chains, shackles, or grappling holds that others might use to try to pin you down. When you use this skill, you call “escape” and may instantly pull yourself free from any kinds of bonds or snares that were trapping your character (including any Bind effects). You can similarly pull yourself out of any character’s grip, even if they are using a Strength effect to hold you.","usage":"You may call “Escape” and remove yourself from any effect that physically restricts your movement, like ROPE USE, Bind, shackles, or SUPERNATURAL STRENGTH.","note":"this skill, just like DODGE and WILLPOWER, will not work on any effects that have the “Greater” modifier."},{"category":"Skullduggery","name":"Poison Resistance","cost":"2 CP","prerequisite":"—","returnsWith":"Rest","call":"“Resist”","description":"You have been exposed to poisons enough that you have started to develop a tolerance to their effects. When you use this skill, you call “Resist” and immediately end all Poison effects that are currently affecting your character. This call may be made at any point during a Poison count.","usage":"You may call “Resist” and prevent or end all Poison effects currently affecting you, regardless of time remaining.","note":""},{"category":"Skullduggery","name":"Poison Immunity","cost":"4 CP","prerequisite":"Poison Resistance ×3","returnsWith":"—","call":"“No Effect”","description":"After constant exposure to poisons, whether as the result of an organized effort on your part or simply through bad luck, you have built up a complete immunity to their effects. Whenever a Poison would affect you, you may instead call “no effect.”","usage":"You may call “No Effect” to prevent any Poison effects from affecting you.","note":""},{"category":"Skullduggery","name":"Lockpicking: Apprentice","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"—","description":"As a student of the art of larceny, you have also begun to develop the art of picking locks. To use this skill, you must role-play the process of picking a lock (using an actual TAGGED lockpick prop; see the LOCKSMITHING skill) for 3 minutes. Immediately afterward, you may open that lock if it is crafted at an “Apprentice” skill level. (The skill level of any given lock should be listed on its item tag.)","usage":"You may spend 3 minutes role-playing picking a lock with a tagged lockpick prop to open an Apprentice-level lock.","note":""},{"category":"Skullduggery","name":"Lockpicking: Journeyman","cost":"4 CP","prerequisite":"Lockpicking: Apprentice","returnsWith":"—","call":"—","description":"You have continued to develop the art of picking locks. To use this skill, you must role-play the process of picking a lock (using an actual TAGGED lockpick prop; see the LOCKSMITHING skill) for 3 minutes. Immediately afterward, you may open that lock if it is crafted at a “Journeyman” skill level. (The skill level of any given lock should be listed on its item tag.)","usage":"You may spend 3 minutes role-playing picking a lock with a tagged lockpick prop to open a Journeyman-level lock.","note":""},{"category":"Skullduggery","name":"Lockpicking: Master","cost":"4 CP","prerequisite":"Lockpicking: Journeyman","returnsWith":"—","call":"—","description":"You have become truly adept at the art of picking locks. To use this skill, you must role-play the process of picking a lock (using an actual TAGGED lockpick prop; see the LOCKSMITHING skill) for 3 minutes. Immediately afterward, you may open that lock if it is crafted at a “Master” skill level. (The skill level of any given lock should be listed on its item tag.)","usage":"You may spend 3 minutes role-playing picking a lock with a tagged lockpick prop to open a Master-level lock.","note":""},{"category":"Skullduggery","name":"Lockpicking: Grandmaster","cost":"4 CP","prerequisite":"Lockpicking: Master","returnsWith":"—","call":"—","description":"You have truly mastered the art of picking locks. To use this skill, you must role-play the process of picking a lock (using an actual TAGGED lockpick prop; see the LOCKSMITHING skill) for 3 minutes. Immediately afterward, you may open that lock if it is crafted at a “Grandmaster” skill level. (The skill level of any given lock should be listed on its item tag.)","usage":"You may spend 3 minutes role-playing picking a lock with a tagged lockpick prop to open a Grandmaster-level lock.","note":""},{"category":"Skullduggery","name":"Gambling","cost":"2 CP","prerequisite":"—","returnsWith":"Sunrise and Sunset","call":"“Gambling”","description":"You have developed a knack (or perhaps the manual dexterity) for getting dice or cards to fall in your favor. When you are playing an in-character game of chance, you may use this skill to re-draw one hand of cards dealt to you, or re-roll one set of rolled dice that you have thrown. You cannot use the GAMBLING skill again on that hand or that roll of the dice: you are stuck with the new results, even if they are worse. Additionally, GAMBLING can also sometimes prove useful on “mods” that occur away from the main space of the Twin Mask game.","usage":"You may call “Gambling” and re-draw one hand of cards dealt to you, or re-roll one set of dice that you threw, which cannot be modified further. You must take the new result no matter the outcome.","note":""},{"category":"Skullduggery","name":"Torture","cost":"2 CP","prerequisite":"—","returnsWith":"Sunrise and Sunset","call":"“Torture”","description":"You are good at gathering information—and in the process, you have gotten enough practice to avoid killing people while still causing them excruciating pain. To use this skill, you must role-play the process of torturing a helpless, captive character for 3 minutes. The torture can consist of any kind of pain-inducing actions you can think of, as long as they would not kill the subject or make that subject unable to speak. In order to be considered “helpless and captive,” a character must be physically restrained, unable to escape or make any attacks. After the 3 minutes of role-playing, you may call “Torture” followed by a single, yes-or-no question. The subject then has a chance to call “Resist” or “no effect” (if they have the TORTURE RESISTANCE or TORTURE IMMUNITY skill), but otherwise they must answer the question truthfully. Every time you use TORTURE, you must spend another 3 minutes role-playing before asking your question.","usage":"You spend 3 minutes role-playing torturing a character, then may call “Torture” and ask one “yes” or “no” question. You should briefly explain, out of character, that they need only give you a single truthful “yes” or “no” answer.","note":"enough use of the TORTURE skill, or even just exposure to the use of it, can eventually increase your “Corruption score,” particularly if the torture is very brutal or used against innocent subjects. Any increases in “Corruption” will be the result of an individual assessment by a Story Staff team member."},{"category":"Knowledge","name":"Lore: (Specify Field)","cost":"4 CP","prerequisite":"—","returnsWith":"—","call":"“Bid – Lore: (Specify Field)”","description":"Whether deep in the library or gathering data in the wider world, you have spent much time studying a particular subject. This entry for the LORE skill actually represents an enormous spread of different possible LORE skills, one for each available field of study—you can choose any of the religions, races, magical arts, creatures, trades, or other categories of Adelrune. (You may not, however, acquire LORE skills related to the cultures listed in chapter 2. The NATIVE LORE background feature fills that role.) To use this skill, you call “Bid – Lore: Poisons”—or “Bid – Lore: Leylines,” for example, filling in the field you have chosen—to a Twin Mask Staff member, and that Staff member will provide you with whatever immediately relevant information your character would know about the matter at hand. For example: if you have LORE: DEMONS, you could ask a Staff member about the demon you just encountered, to gather information pertinent to that specific demon. (You could not ask Staff members generic questions about Demons during game; a Staff member might, at their discretion, give you access to a Lore document about Demons between Twin Mask game sessions.) In general, the depth of your character’s knowledge scales with the narrowness of the field that you choose. KNOWLEDGE: ANIMALS will give you a good amount of broad knowledge, but KNOWLEDGE: 146 BURROWING MAMMALS will give you a lot of very specific knowledge about those particular animals. Additionally, you can use a LORE skill to appraise the monetary value of anything related to your subject. The approved LORE skills that can be taken at character creation are listed in the following table. Other LOREs must be learned in-game. You will need training for each LORE skill… the “skills that you have already learned” exception does not apply here.","usage":"You may call “Bid Lore: (Subject)” and ask a question of a nearby Twin Mask Story Staff member. This question may be as simple as, “Do I know anything about this?” or as specific as you like.","note":"keep in mind that certain LORE skills serve as prerequisites for other skills. In order to take APPRENTICE MAGIC: ALCHEMY, for instance, you must first take LORE: ALCHEMY (and the equivalent is true for the other Magical Arts); in order to take SURGERY, you must first take LORE: ANATOMY. Starting LORES Below, you will find listed all of the specific fields of study that are available for new Twin Mask characters’ LORE skills. There are huge numbers of other LORE subjects available in Adelrune, but you will need to find somebody to teach them to you during normal gameplay. Taking one of these LORE skills at character creation means that your character has extensively studied (or lived) the subject matter; it should, therefore, make sense with your backstory. Magic Creatures Religion History Miscellaneous LORE: Alchemy LORE: Celestials LORE: The Blood Cauldon LORE: War of Wine LORE: Rules of Society LORE: Blood Magic LORE: Demons LORE: The Celestine Faith LORE: Purges LORE: Nature LORE: Channeling LORE: Fae LORE: Church of Chorus LORE: The First Crusade LORE: Anatomy LORE: Divination LORE: Dragons LORE: Demon Faiths LORE: The War of Radiance LORE: Medicine LORE: Dream Magic LORE: Undead LORE: Dragon Worship LORE: The Second Crusade LORE: Knighthood LORE: Necromancy LORE: The Lady of the Mists LORE: The War of Giants LORE: Sorcery LORE: the Nameless Faith LORE: Summoning LORE: Old Ways LORE: Warding LORE: Trahazi Zodiac LORE: Ritual Magic"},{"category":"Knowledge","name":"Restricted Lore: (
