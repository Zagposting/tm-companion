 “My body is mist.”\nTo end: “My body re-forms from mist.”","description":"By manipulating and transforming the elemental energies present in your own body, you can briefly cause your form to become insubstantial, rendering yourself near-impervious to most weapons. You gain the “Mistform” condition.\nNon-elemental weapon and touch attacks cannot affect you while in Mistform. Weapon or touch attacks with Fire, Ice, Lightning, Acid, Light, Darkness, or Greater modifiers affect you normally, as do non-weapon effects such as gaze, voice, gesture, and packets. While in Mistform, you are effectively under a Slow effect. You cannot run, speak, fight, call defenses except “Willpower” or “Resist,” actively use any skills, or cast any other spells. This spell lasts for 30 seconds, during which time you must hold your hands above your head and repeat “My body is mist” every few seconds. You may re-cast this spell without exiting it by spending the mana again.\nNote: Mistform does not allow you to fit anywhere, or travel across any surfaces, that you would not normally be able to. Your weight and other physical traits remain the same.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Moridaine's Mystical Stoneskin","tier":"Master","core":false,"delivery":"Self","casting":"Transform","call":"\"My Body is Stone\"","description":"This spell allows the caster to take the form of a Stone Statue. While in this form you cannot voluntarily move, except to repeat the words \"My Body is Stone\" as a mantra. For the next 3 minutes while in this state you are given an additional 100 armor that stacks with everything. The caster may optionally spend 3 mana to refresh the spells duration. However doing it this way does not refresh the armor value. When this spell ends be it by the duration ending or by the armor value being destroyed, the caster takes the effect stun.","note":"While this spell is active, no object on your person can be removed. In addition, if you are holding someone when you turn to stone, vour body effectively becomes a pair of shackles, and someone is held under the same rules. See Shackles under the Blacksmithing skill.) Life damage and drain life effects bypass armor.","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Poison","tier":"Master","core":false,"delivery":"Packet","casting":"Hurl","call":"\"Poison\"","description":"Bly blending together various magical elements that are inimical to life, you are able to weave a spell-component packet that will deliver a terrible cocktail of toxins to its target.\n\nYou throw a packet and call \"Poison\" when you connect with any part of an enemy's body, clothes, weapon, or shield. This afflicts them with the Poison condition, meaning that they will die in 3 minutes if the Poison is not somehow neutralized.\n\nNote: As this is a packet-based spell, it must be countered with a \"Dodge\" or \"Resist\".","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Disarming Spell","tier":"Grandmaster","core":false,"delivery":"Packet","casting":"Hurl","call":"“Disarm”","description":"“By hurling a spell packet at a target you unleash a set of chain reactions that, when connecting with its target, temporarily engulf a target’s weapon or shield in flame. The weapon is disarmed and may not be touched by anyone for 3 seconds.”","note":"(You may specify what weapon or shield if you'd like.)","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Elemental Blast 4","tier":"Grandmaster","core":false,"delivery":"Packet","casting":"Hurl","call":"\"5 \u003cSpecify Element\u003e","description":"\"By hurling a spell packet at a target you unleash a set of chain reactions that, when connecting with its target, get unleashed to often destructive effects. Elemental Blast does 5 damage of an elemental type of your choosing.\"","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Greater Elemental Bow","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Conjure","call":"\"I Conjure a Bow from [Fire, Ice, Lightning, OR Acid]\"","description":"As Elemental Bow, +1 dmg","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Greater Elemental Weapon","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Conjure","call":"\"I Conjure a Sword from [Fire, Ice, Lightning, OR Acid]\"","description":"With your incredible mastery of the interactions of Adelrune's elements, you are able to weave together an arcane focus to distill one particular element from the ambient magicka and stabilize it into a shape roaring with elemental power; then, you employ other energies to make your body immune to damage from contact with that shape.\nYou may only cast this spell if you are carrying a phys-rep of the weapon you intend to summon, with a white ribbon tied around it to signify that it is out-of-character. Choose Fire, Ice, Lightning, or Acid. You conjure a hand- held, non-ranged weapon from that element, which takes as long as it takes you to remove the white ribbon, and which lasts for as long as you hold it. If you ever take your hand off the weapon, including being disarmed or dropped, the spell immediately ends. You are considered to have the skill necessary to wield the weapon you summon, regardless of type. The weapon deals 2 damage of the element you have chosen. Note: As this spell does not do direct numerical damage, and instead summons a weapon that is capable of doing damage, it does not benefit from Power Focus artifacts.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Greater Mist Form","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Transform","call":"“Our Bodies turns to Mist”","description":"This spell allows the caster-to turn themselves and one willing individual: into mist. While in this form, neither party can affect, or be affected by anything physical. Physical attacks pass through you both, however magical attacks affect you both like normal. Weapons with an elemental qualifier such as “Fire, Ice, Acid,” etc, effect both people normally. Neither person can do anything but move and observe, this includes not being able to speak. You are under effect ‘slow,’ and must keep your hands raised above your head at all times. This spell lasts for 30 Seconds. You may recast it however without ever taking a physical form, by spending 4 mana and saying “Our bodies are Mist.” This refreshes the spell for an additional 30 seconds. To maintain you may say “Our bodies are Mist” When you return you must say “Our bodies forms from Mist”","note":"You may not go anywhere you normally cannot while in this form, such as sliding under doors, or floating up in the sky. Your speed and other characteristics also do not change, lf you lose contact with the person you brought with you, they instantly become tangible again.","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Jolt","tier":"Grandmaster","core":false,"delivery":"Packet","casting":"Hurl","call":"\"Paralyze\"","description":"Originally created by Karidan Silni, this spell allows a sorcerer to re- purpose their mastery over the element of lightning to carefully shape and direct it. Instead of a deadly, unmitigated blast of electricity that burns and harms the target, this packet delivers a measured jolt of electricity that causes bodies and limbs to seize, locking a target in place for a few seconds.\nYou throw a packet which produces a Paralyze effect, which will freeze a creature's body in place, when you connect with any part of an enemy's body, clothes, weapon, or shield.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Lesser Death","tier":"Grandmaster","core":false,"delivery":"Packet","casting":"Hurl","call":"\"Lesser Death\"","description":"By hurling a spell packet at a target you unleash a deadly set of chain reaction that will kill anyone who is weak of body and mind.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"The Wall Walking Spell","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Transform","call":"“I Walk through the Wall”","description":"This spell allows the caster to briefly turn insubstantial and take up to 3 steps, past a door or wall.","note":"You may still take damage from attacks, or defensive wards or spells.","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Vizlo's Shadow Form","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Transform (Night)","call":"My Body is Shadow","description":"Originally created by the sorcerer Vizlo, this spell lets you replace some of your physical form with the elemental principle of darkness, rendering you insubstantial and near-impervious to most attacks. You gain a condition similar to \"Mistform,\" but with significant defensive upgrades.\nWhile you are in Shadow Form, you are essentially immune to any weapon, touch attack, or numerical damage that does not have the Light, Drain, or Greater modifier. You can still be affected by voice, gaze, gesture, and other negative effects that do not deal numerical damage. While in Shadow Form, you are effectively under a Slow effect. You cannot run, speak, fight, call defenses except \"Willpower\" or \"Resist,\" actively use any skills, or cast any other spells. This spell lasts for 30 seconds, during which time you must hold your hands above your head and repeat \"My body is shadow\" every few seconds. You may re- cast this spell without exiting it by spending an additional 4 mana.\nNote: Shadow Form does not allow you to fit anywhere, or travel across any surfaces, that you would not normally be able to. Your weight and other physical traits remain the same.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Sorcery","name":"Wigle's Cold Shoulder*","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Touch","call":"\"10 Ice\"","description":"Deal 10 Ice to a target you're touching for 4 seconds.","note":"Requires Lore: Hydrology","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Bee Spirit","tier":"Apprentice","core":true,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of a Bee, granting you the following ability.\nThe ability costs mana equal to its level whenever you use it.\n• Level 1: “Stun” effect delivered via packet. You may not use this ability more than once per 10 seconds.","note":"Core","recipe":"While possessed by this Spirit and for 30 minutes afterward, you crave sweets. (This has no effect on game mechanics.)","source":"Spell Compendium"},{"category":"Summoning","name":"Commune with Spirits","tier":"Apprentice","core":true,"delivery":"Self","casting":"If there is a spirit nearby and it is willing to speak with you, you may call this effect and begin speaking with it.","call":"“Commune With Spirit”","description":"By blurring your vision and magically attuning your senses to engage with points where the spirit world interacts with Adelrune, you may commune with a nearby, willing spirit through the medium of words. This spell cannot be cast on a living target. Only the spirits of the dead, or those that reside within objects (or are otherwise separated from the normal energy of life), can be communicated with through the power of this spell.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Cooperative Summoning*","tier":"Apprentice","core":false,"delivery":"Self","casting":"Special Summon","call":"[None]","description":"As a summoner, you know that your greatest asset does not have anything to do with the abilities a Spirit might impart. It is the bonds you form and the lessons they teach you. You have made yourself a vessel and a simple spirit might occasionally need no more than a simple welcome, command, or cajoling to take up residence.\nYou may cast this spell only once within 30 minutes.","note":"SPECIAL NOTE:\nUnlike nearly all other spells, this spell costs O mana to cast.","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Detect Possession","tier":"Apprentice","core":true,"delivery":"Touch","casting":"Detect","call":"“Detect Possession”","description":"Using your basic connection to the world of spirits, you are able to feel the pulses and drafts of energy that accompany the habitation of a spirit. You can tell if the touched person or object is possessed by a spirit… but you cannot learn any information about any such spirits you might detect, other than their presence or absence.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Firefly Spirit","tier":"Apprentice","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of a Firefly, granting you the following ability. The ability costs mana equal to its level whenever you use it.\n• Level 1: ”Create Light\"","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Flower Spirit","tier":"Apprentice","core":true,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of a Flower, granting you the following ability. The ability costs mana equal to its level whenever you use it.\n• Level 1: ”Remove Weakness” delivered by touch","note":"Core","recipe":"While possessed by this Spirit and for 30 minutes afterward, anything and everything makes you happy. (This has no effect on game mechanics.)","source":"Spell Compendium"},{"category":"Summoning","name":"Imp Spirit","tier":"Apprentice","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of an Imp, granting you the following ability. The ability costs mana equal to its level whenever you use it.\n• Level 1: ”Imbue Fire\"","note":"Bleed: itchy","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Invoke Spirit","tier":"Apprentice","core":false,"delivery":"Touch","casting":"","call":"","description":"Summon the spirit of an item","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Moments of Calm","tier":"Apprentice","core":false,"delivery":"Self","casting":"Calm","call":"\"Suspend Berserk\"","description":"The first thing that a summoner learns is how to control their actions. With this spell, even while under the effects of \"Berserk\" the Summoner can temporarily remove the Berserk effect for up to 3 seconds. This takes considerable effort and strain and ought be role-played as such. During this time, the Caster is consider the be 'concentrating' and may not cast any other spell (Such as spells that remove Berserk.) They may however use skills, drink potions, and use magical items. \nAfter the 3 seconds have expired, the original effect resumes as normal. Also, if anything happens which breaks concentration, (such as take damage) this spell ends early. Note: Maintaining this spell takes an incredible amount of concentration and mental strain and should be role-played appropriately.\n\nSpecial: This spell can be cast while under the effect of Berserk.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Rabbit Spirit","tier":"Apprentice","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"Escape","note":"","recipe":"You feel a need to constantly be moving","source":"Spell Compendium"},{"category":"Summoning","name":"Rat Spirit","tier":"Apprentice","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of a Rat, granting you the following ability. The ability costs mana equal to its level whenever you use it.\n• Level 1: Gain the skill \"Stealth Attack\" for 30 minutes,","note":"Greed","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Sparrow Spirit","tier":"Apprentice","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"Lvl 1: Feint (As the skill, including weapon style restrictions)","note":"Bleed: You don't like being inside. (No mechanical effect)","recipe":"You don't like being indoors","source":"Spell Compendium"},{"category":"Summoning","name":"Spectral Torture","tier":"Apprentice","core":false,"delivery":"Special","casting":"Summon","call":"\"Torture Spirit\"","description":"This is a highly limited spell that works much like the torture talent however it can only be used on entities trapped within objects, such as spirit masks or filled soul gems. Reworded the spell scroll to be clear that it takes 3 full minutes akin to the torture skill. Clarified that it can only torture the soul within an object.\n○ Made it clear that repeated, excessive, and/or nonchalant use of this spell, as with the torture skill, may lead to an increase in your Corruption score.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Turtle Spirit","tier":"Apprentice","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"Shield proficiency","note":"Lazy","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Voluntary Possession","tier":"Apprentice","core":false,"delivery":"Self","casting":"Invite","call":"","description":"This spell is particularly dangerous one for the caster as it allows the spirit unlimited control over their form. If the spirit is trustworthy, it will leave when it has finished doing what is has come to do, however if it is untrustworthy, it will refuse to leave. Spirits which refuse to leave will be banished upon the Summoner being brought down to their bleeding count.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Ancestor Spirit","tier":"Journeyman","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of Your Ancestor, granting you the following abilities. Each ability costs mana equal to its level whenever you use it.\n• Level 1: You gain the Slow Death skill for the next 30 minutes. This skill ends if you dismiss this spirit before 30 minutes has elapsed.\n• Level 2: You use a special version of the Sudden Inspiration skill that can only be used on yourself, once. This skill can be used in Weakness.\n\n-Bleed-\nNone, though remember that you are possessed by a spirit, and thus you must role-play having a different personality than your character's.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Bear Spirit","tier":"Journeyman","core":true,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of a Bear, granting you the following abilities. Each ability costs mana equal to its level whenever you use it.\n• Level 1: You call “Stun” for your next melee weapon attack instead of damage You may not use this ability more than once per 10 seconds.\n• Level 2: Your next melee weapon attack is a GREAT STRIKE, dealing +2 damage that does not stack with other Great Strikes","note":"Core","recipe":"While possessed by this Spirit and for 30 minutes afterward, you are always hungry and actively crave food and drink. (This has no effect on game mechanics.)","source":"Spell Compendium"},{"category":"Summoning","name":"Bored Spirit","tier":"Journeyman","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of a Bored Entity, granting you the following abilities. Each ability costs mana equal to its level whenever you use it.\n\n• Level 1: You may throw a packet and call \"Bind\" once.\n• Level 2: You may throw a packet and call \"Paralyze\" once. You may not use this ability more than once per 10 seconds.\n\nYou may cancel this spell at any time, at which point you take a \"Stun\" effect for 3 seconds. You can only be possessed by 1 Spirit at a time, but you can have any number of \"Bleed\" effects active.\n\nBleed: While possessed by this Spirit and for 30 minutes afterward, you feel extremely bored and lethargic, and everything asked of you by others feels like a waste of time. (This has no effect on game mechanics.)","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Crow Spirit","tier":"Journeyman","core":true,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of a Crow, granting you the following abilities. Each ability costs mana equal to its level whenever you use it.\n• Level 1: You may call “Sense Death” to determine if something is alive or not, delivered by touch\n• Level 2: You touch a recent corpse with intact face and lungs, call “Speak with Dead,” and may ask the corpse questions. It will answer based on whatever the spirit of the dead person remembers.","note":"Core","recipe":"While possessed by this Spirit and for 30 minutes afterward, you are easily captivated by shiny objects. (This has no effect on game mechanics.)","source":"Spell Compendium"},{"category":"Summoning","name":"Snake Spirit","tier":"Journeyman","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"Level 1: You may use the \"Resist Poison\" skill once.\nLevel 2: Your next strike is a Great Strike that may call \"\"Acid\"\" in addition to damage.\n\n-Bleed-\nYou get joy out of exerting your power over the weak.","note":"","recipe":"You like exerting your power over the weak","source":"Spell Compendium"},{"category":"Summoning","name":"Spider Spirit","tier":"Journeyman","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"Level 1: Foretell Danger (You can tell if there is eminent danger with the next 30 minutes or so.)\nLevel 2: Predict Danger (You may ask 1 'Yes' or 'No' question about the danger foretold using the 1st ability.)\n\n-Bleed-\nYou like to keep secrets. (No Mechanical effect)","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Stag Spirit","tier":"Journeyman","core":true,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of a Stag, granting you the following abilities. Each ability costs mana equal to its level whenever you use it.\n• Level 1: You use the ESCAPE skill\n• Level 2: You use the LEAP skill. You may not use this ability more than once per 10 seconds.\n\nYou are constantly paranoid about being hunted and/or eaten. Additionally, this fear drives you to be adverse to danger. Mechanical effect: When there is no active combat, you will not make the first attack against someone.","note":"","recipe":"While possessed by this Spirit and for 30 minutes afterward, you are constantly paranoid about being eaten. (This has no effect on game mechanics.)","source":"Spell Compendium"},{"category":"Summoning","name":"Strands of Freedom","tier":"Journeyman","core":false,"delivery":"Self","casting":"Maintain","call":"\"Suspend Dominate”","description":"Your magic has taught you what it means to have free will-countless spirits not your own have come into contact with yours, enlarging your view of desire and motivation. When you are magically bound to follow an order, then... you see the threads of your willpower suspended by that effect, and you know how to reach for them, giving yourself a moment of truth.\nYou may cast this spell while under the effect of a Dominate. You suppress any active Dominate effects on yourself for up to 3 seconds. Although you\nspend the mana at the start of this 3-second period, you must still Concentrate for the entirety of the 3 seconds this spell lasts. This means you may not use skills or spells, drink potions or use magic items, you are under a \"Slow\" effect, and any damage you take ends your Concentration. You may, however, move and speak, perhaps to inform your allies that you are Dominated, or allow them to use their own spells, potions, or items to assist you. You may cast this spell multiple times in a row by continuing to spend mana and maintain concentration.\nNOTE: Maintaining this spell takes an incredible amount of concentration and mental strain and should be role-played appropriately.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Tree Spirit","tier":"Journeyman","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"• Level 1: Bind (using spell packets)\n• Level 2: Sense Passage. Though a tree has no eyes, you can learn if someone or something has passed through the given region. This does not allow you to track.\n\n-Bleed-\nYou take twice as much damage from fire-based attacks.","note":"","recipe":"Double damage from fire","source":"Spell Compendium"},{"category":"Summoning","name":"Wolf Spirit","tier":"Journeyman","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"Level 1: Gain Tracking for 30 minutes (self only)\nLevel 2: After howling for 3 seconds you may call, \"By my voice, remove weakness.\"","note":"","recipe":"No betrayal","source":"Spell Compendium"},{"category":"Summoning","name":"Child Spirit","tier":"Master","core":true,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of a Child, granting you the following abilities. Each ability costs mana equal to its level whenever you use it.\n• Level 1: You use the SHIN KICK skill\n• Level 2: “Heal 1” delivered by touch\n• Level 3: “Life” delivered by touch, but you also immediately die; this Death cannot be prevented in any way, although you can still benefit from Life effects as normal","note":"Core","recipe":"Summoning this Spirit is mildly addictive. Also, while possessed by this Spirit and for 30 minutes afterward, you are afraid of the dark and will not go willingly into dark places. (This has no strict effect on game mechanics.)","source":"Spell Compendium"},{"category":"Summoning","name":"Crone Spirit","tier":"Master","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"• Level 1: You may deal \"2\" damage of an elemental type of your choice (Fire, Ice, Lightning, or Acid) by spell packet.\n• Level 2: You may brew a \"Sleep\" potion. This potion lasts for 30 minutes or until used.\n• Level 3: You may brew a \"Heal 10\" potion. This potion lasts for 30 minutes or until used.","note":"Bleed: You can't run (because you're old and it hurts to move.)","recipe":"Can't run","source":"Spell Compendium"},{"category":"Summoning","name":"Hero Spirit","tier":"Master","core":true,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of a Hero, granting you the following abilities. Each ability costs mana equal to its level whenever you use it.\n• Level 1: You use the INSPIRATIONAL SPEECH skill\n• Level 2: For the next 30 minutes, you may act as though you had the skills SHORT WEAPONS, ONE-HANDED WEAPONS, TWO-HANDED WEAPONS, THROWN WEAPONS, and GUARDIAN\n• Level 3: You use the PARRY skill (which can be combined with GUARDIAN) but may not use this ability again for 30 seconds\n\nWhile possessed by this spirit and for 30 minutes afterward, you may not ignore any cries for help that you hear; you must do everything you can reasonably do to help.\n\nSummoner Exclusive Spell","note":"Core","recipe":"Summoning this Spirit is mildly addictive. Also, while possessed by this Spirit and for 30 minutes afterward, you may not ignore any cries for help that you hear. (This has no strict effect on game mechanics.)","source":"Spell Compendium"},{"category":"Summoning","name":"Impoverished Gambler","tier":"Master","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"• Level 1: Gain \"Hidden Weapon\" for 30 minutes.\n• Level 2: Gain \"Sand in the Eye\" (Packet delivered Stun).\n• Level 3: Gain \"Witty Repartee\" for 30 minutes.\n\nYou are addicted to gambling, and will bet at every opportunity (No mechanical effect).","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Murderer Spirit","tier":"Master","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of a Murderer, granting you the following abilities. Each ability costs mana equal to its level whenever you use it. \n• Level 1: You gain the Stealth skill for 30 minutes. You lose this skill if you dismiss the spirit before 30 minutes has elapsed.\n• Level 2: You gain the Disguise skill for 30 minutes. You lose this skill if you dismiss the spirit before 30 minutes has elapsed. You must actually wear a disguise to use this ability.\n• Level 3: You may use the skill 10-Damage Strike once. You must not be wearing Heavy Armor or wielding a melee weapon longer than 24\" to use this ability. This ability has a 30-second cooldown.\nYou may cancel this spell at any time, at which point you take a \"Stun\" effect for 3 seconds. You can only be possessed by 1 Spirit at a time, but you can have any number of \"bleed\" effects active.\n- BLEED-\nSummoning this spirit is mildly addictive. While possessed by this Spirit and for 30 minutes afterward, ou must brutally deathblow every target you put into bleedout and any target you see enter bleedout.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Remove Dominate","tier":"Master","core":false,"delivery":"Touch","casting":"3 seconds","call":"Remove Dominate","description":"This spell allows a summoner to tap into an individual's strength of will and allow them to regain control of their actions, removing the effects of domination.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Storm Spirit","tier":"Master","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of a Storm, granting you the following abilities. Each ability costs mana equal to its level whenever you use it.\n• Level 1: You may throw a packet and call \"Stun\" once.\n• Level 2: You may cast the Foretell Danger spell once, which allows you to seek Story Staff to ask if there is imminent danger within the next 30 minutes.\n• Level 3: You may throw a packet and call \"4 Lightning\" once.\n\nBleed: While possessed by this Spirit and for 30 minutes afterward, you may not cast any spell that calls an element other than Lightning. (Including Fire, Ice, Acid, Light, or Darkness).","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Troll Spirit","tier":"Master","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"By concentrating for 3 seconds, and interacting with an object connected with the spirit, you can invoke the spirit. Whenever invoking a spirit, or recalling it back to the object it is tethered to, the Summoner becomes stunned and confused for 3 seconds. In addition, the Summoner is affected by any bleed effects as applicable. Bleed effects last while the Summoner is possessed and for 30 minutes after the spirit is recalled.\nAbilities:\n(Each ability costs I mana per level of the ability each time you wish to use it.) \nLvl 1: Gain \"Tracking\" for the next 30 minutes.\nLvl 2: \"Heal 3\" (Self Only)\nLvl 3: Break Limb (You may use this ability once every 30 seconds.)\n\nBleed:\nThese effects last while the Summoner is possessed by a spirit and for 30 Minutes after a Summoner has ended their spell.) You are thoroughly enchanted by music. You must head to the source of the music. You may defend yourself. SIDE EFFECT: Summoning this spirit is mildly addictive.\nNote: While you can only be actively possessed by one spirit at a time, you can suffer from multiple bleed effects at the same time.","note":"","recipe":"Mesmered by music","source":"Spell Compendium"},{"category":"Summoning","name":"Caradoc's Surprise","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"\"You are possessed by an Unknowable Spirit, granting you the following abilities. Each ability costs mana equal to its level whenever you use it. \n\n• Level 1: You may cast the Pass Ward spell once, allowing you to bypass a single Ward Line by Concentrating for 1 second\n• Level 2: You may cast the Speak With Dead spell once, allowing you to touch a corpse with an intact head and lungs and speak to it.\n• Level 3: You may cast the Reattach Limb spell once, allowing you to call \"\"Restore Limb\"\" if you hold the severed limb to its point of origin\n• Level 4: You may cast The Wall-Walking Spell once, allowing you to walk through a wall or door after a brief moment of role-playing\nYou may cancel this spell at any time, at which point you take a \"\"Stun\"\" effect for 3 seconds. You can only be possessed by 1 Spirit at a time, but you can have any number of \"\"bleed\"\" effects active. \n\n-BLEED-\nSummoning this Spirit is addictive. Once this spell ends, you immediately and permanently forget everything that happened while you were possessed by this spirit. No spell, ability, or mechanic can ever recover these memories.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Celestial Avenger","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of a Celestial Avenger, granting you the following abilities. Each ability costs mana equal to its level whenever you use it.\n• Level 1: Repel by Light.\n• Level 2: Your next attack is a Great Strike and may call \"Light\" in addition to damage. This ability can be use once every 3 seconds. \n• Level 3: You may touch a target and call \"Life,\" but you immediately die. This death cannot be prevented or resisted in any way.\n• Level 4: You may deliver a \"Heal 10\" by touch once.\n\nSummoning this Spirit is addictive. Also, while possessed by this Spirit and for 30 minutes afterward, you cannot summon this spirit if you have invoked a demon spirit within the last three days. While possessed by this Spirit and for 30 minutes afterwards you are driven to aid\nothers.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Demon Lord Spirit","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of a Demon Lord, granting you the following abilities. Each ability costs mana equal to its level whenever you use it.\n• Level 1: You may throw a packet and call \"Attract by Pain\" once.\n• Level 2: Your next attack is a Great Strike and may call \"Darkness\" in addition to damage. This ability can be use once every 3 seconds. \n• Level 3: You may call \"By My Gaze, Lesser Berserk\" once.\n• Level 4: You may throw a packet once and call ?? damage of Fire, Ice, Lightning, or Acid.\n\nSummoning this Spirit is addictive. Also, while possessed by this Spirit and for 30 minutes afterward, you cannot summon this spirit if you have invoked a Celestial spirit within the past 3 days. While possessed by this spirit and for 30 minutes afterward you are more easily persuaded\nby demons. Additionally, you cannot call a defense to “by pain” effects.","note":"Bleed: You become extremely jealous and cannot summon spirits other than this one.","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Dragon Spirit","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"• Level 1: You may call \"Stun\" for your next melee weapon attack once. (This can only be used once every 10 seconds).\n• Level 2: While you are under the effects of ‘Berserk’ you may spend 2 mana to call “Resist” to any physical hit once per 30 seconds.\n• Level 3: You may use the Supernatural Strength skill once, this ability has a 30 second cooldown.\n• Level 4: You may use the Battle Rage skill once.","note":"Bleed: Summoning this Spirit is addictive. Also, while possessed by this Spirit and for 30 minutes afterward, you treat all \"Lesser Berserk\" effects as \"Berserk\" effects, you may not use skills or abilities that prevent \"Berserk\" effects, and you must speak in the third person (may only refer to yourself by name or by using your pronouns).","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Fae Trickster Spirit","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"You are possessed by the Spirit of a Fae Trickster, granting you the following abilities. Each ability costs mana equal to its level whenever you use it. \n• Level 1: You may call \"By My Gesture, Bind\" once.\n• Level 2: You may call \"By My Gesture, Repel\" once.\n• Level 3: You may call \"By My Gesture, Attract\" once.\n• Level 4: You may call \"By My Gesture, Lesser Dominate\" once.\n- BLEED-\nSummoning this spirit is addictive. You like mischief want to experience new sensations. You cannot intentionally tells lies. Once this spell ends, your memory, however these memories return if you receive a Torture effect.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Gaze of Freedom","tier":"Grandmaster","core":false,"delivery":"Gaze","casting":"Gaze","call":"\"By My Gaze, Remove Dominate\"","description":"As a summoner of the highest order, you have touched magic and spirits that have called your very existence into question, exploring complex relationships between willpower, existence, volition, and identity. With the answers you have found to such questions, you can use this spell to transmit your hard-won sense of self through your eyes into another person, letting them spring free of magical dominations and compulsion.\nWith your eyes directed toward your target, you remove a Dominate effect affecting them. If the enemy is not facing you, or if it is too dark to easily see where your gaze is directed, it is helpful to point at your target, or call them out by name or description before calling the effect.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Marrow's Tranquil","tier":"Grandmaster","core":false,"delivery":"Gaze","casting":"Gaze","call":"\"By My Gaze, Remove Berserk\"","description":"As a seasoned summoner, you have learned to calm your mind amidst a myriad of voices and hone your will into a powerful defense. With a piercing gaze, your will is able to bolster the minds of others. Eyes locked, the tempest within dissipates, replaced by the gentle stillness of a tranquil mind and freeing them from a berserked state.\nYou must make eye contact with a target to cast this spell. You call \"Remove Berserk,\" which ends any active Berserk effects on the target. If an enemy is not facing you, or it is too dark to see their eyes, you may not use\nthis spell.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Rupi's Spiritual Liberdacian*","tier":"Grandmaster","core":false,"delivery":"Touch","casting":"Special","call":"\"Remove Lesser Possession\"","description":"Originally created by the Summoner Rupidrandali Gonzagalino, this esoteric and dangerous spell allows a summoner to attempt to exert the same control over a spirit in a different vessel that they normally impose on their own tethered spirits. While some spirits are beyond the power of the spell, a weaker possessing spirit may be forced out of the body it has invaded.\n\nAfter at least 30 seconds of Concentration, which must consist of both an audible, verbal component such as constant chanting or calling to the spirit of person possessed, and a visual component such as waving a dedicated to object tied to the person possessed, you may call \"Remove Lesser Spirit' to attempt to remove the spirit possessing a body. The effectiveness of this spell i at the discretion of Story Staff, inay be ineffective against spirits of any type at the discretion of Story Staff, and may have additional consequences for the\nperson possessed.\nNote: This spell cannot be used to remove a summoned spirit from another Summoner.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Spirit of Death","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"• Level 1: \"Drain 1 Life\" (by touch only)(Note: Touch attacks cannot be used once combat has been initiated, therefore this ability is primarily for use outside of combat, or to initiate combat.)\n• Level 2: \"Destroy Corpse\" (by touch).\n• Level 3: You become immune to magical attacks that deal \"Death\" effects. (not to be confused with killing blows.)(Self Only).\n• Level 4: \"Lesser Death\" (by spell packet.)\n- BLEED-\nImmune to \"Life\" effects. (If you go to your death count, you cannot be saved.)\nSide Effect: Summoning this spirit is addictive.","note":"Immune to Life","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Spirit Walk","tier":"Grandmaster","core":false,"delivery":"Special","casting":"Special","call":"Special","description":"This strange and dangerous spell allows you to leave your body entirely behind, seeking along roads of air and darkness for a spirit who can give you the wisdom that you seek. By letting your body fall away from you into death, you achieve a lightness of being that lets you search for a spirit who can tell you information you could not find anywhere else.\n\nAfter maintain Concentration for 4 seconds, the caster may choose to die, at which point they immediately enter Death Count and enter the spirit realm by going Out-of-Character and finding a Story Staff member to facilitate the Spirit Walk. Their Death Count continues to progress during the entirety of the Spirit Walk, including any time spent searching for staff, and must be tracked. If their Death Count expires before they choose to return to their body, which they can do at any time by returning to the point where their body was left behind, the Spirit Walk immediately ends and they turn to mist. For this reason it is highly recommended to coordinate with a staff member ahead of time before performing a Spirit Walk.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"Twisted Abomination Spirit","tier":"Grandmaster","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"• Level 1: 30 s roleplay harvesting corpse, bestow +1 max HP. 30 minutes. Can stack. Max +5. Each use refreshes the bestow.\n• Level 2: Self only. Once per 30s, tie bandage around limb, call Heal 4. If bandage falls off, the limb is destroyed.\n• Level 3: Your next weapon attack is a Great Strike with Fire, Ice, Lightning, or Acid.\n• Level 4: Your next weapon attack may call 'Paralyze', once every 3 seconds.\n- BLEED-\nSummoning this Spirit is addictive. These effects last while the Summoner is possessed by a spirit and for 30 Minutes after a Summoner has ended their spell.) You cannot be magically healed.","note":"Cannot magically heal","recipe":"","source":"Spell Compendium"},{"category":"Summoning","name":"The Void Spirit","tier":"Paragon","core":false,"delivery":"Self","casting":"Summon","call":"“[Spirit’s Name], I Invoke Thee”","description":"?","note":"In Black Council's Files","recipe":"","source":"Spell Compendium"},{"category":"Warding","name":"Detect Ward","tier":"Apprentice","core":false,"delivery":"Special","casting":"Detect","call":"\"Detect Ward\"","description":"With your increasing familiarity with the ways that wards and glyphs inscribed on surfaces- or stretching between Ward Stones--can route energy, you can read the magic flowing through them and determine the general function and strength of any such warding effects.\n\nYou may only cast this spell with the involvement of Story Staff. You determine the presence and general function of a Ward or Glyph on an object you are investigating The information you gain will be vague and non-specific, for example, \"this is a powerful glyph that is aligned in a way that will unleash very damaging, acid-based magic when triggered.\" The information gained is at the sole discretion of the Story Staff member.\nIf a Story Staff member is not be immediately available to provide you with the resulting information from casting this spell, you should say something similar to \"the magic within the ward is strangely complex,\" and you must \"ponder its function\" until you can locate the appropriate Story Staff member to get any relevant information about the object.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Warding","name":"Dichotomous Ward 1","tier":"Apprentice","core":false,"delivery":"Stone Ward","casting":"Place","call":"\"Ward 2 [Light OR Darkness]\"","description":"Originally created by the warden Randr, this elemental ward line expands your ability to harness the elemental magic inherent in Adelrune's nature... to include more abstract energies. By using an innovative system of energy-focusing patterns, you can make your ward deal out small blasts of darkness or light.\n\nYou may place between two and your maximum number of Ward Stones to form this line or shape, and then select either Light or Darkness to call each time a creature's body or piece of equipment crosses the pattern. You may call only this element until you re-cast the ward line. While not required, it is helpful to point at anyone crossing the line as you make the call, as they may not otherwise know they have crossed a ward line.\n\nIf a ward stone is ever moved or disturbed, you may make one final call against the creature that disturbed the line, after which the whole pattern is dispelled. If you wish to continue using it, the spell will have to be re-cast.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Warding","name":"Dismiss Ward","tier":"Apprentice","core":false,"delivery":"Touch","casting":"Disrupt","call":"\"Dismiss Ward\"","description":"This spell allows you to dismiss a ward of any level. This spell has no effect on glyphs.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Warding","name":"Elemental Ward 1","tier":"Apprentice","core":true,"delivery":"Stone Ward","casting":"Place","call":"“Ward 2 [Fire, Ice, Lightning, or Acid]”","description":"One of the most fundamental weapons in a Warden’s arsenal, this simple elemental ward line harnesses the latent elemental magic that makes up the shapes and patterns of nature and expels it upward to damage those who cross it. You may place between two and your maximum number of Ward Stones to form this line or shape, and then select one element from Fire, Ice, Lightning, or Acid to call each time a creature's body or piece of equipment crosses the pattern. You may call only this element until you re-cast the ward line. While not required, it is helpful to point at anyone crossing the line as you make the call, as they may not otherwise know they have crossed a ward line. If a ward stone is ever moved or disturbed, you may make one final call against the creature that disturbed the line, after which the whole pattern is dispelled. If you wish to continue using it, the spell will have to be re-cast.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Warding","name":"Halting Ward","tier":"Apprentice","core":true,"delivery":"Stone Ward","casting":"Place","call":"\"Ward Lesser Stun\"","description":"By drawing on a small fraction of the energy present in ley lines and sites of natural power, this ward line can create a churning wall of invisible energy that disrupts and disorients creatures with weaker spirits, rendering them stunned for a short time. You may place between two and your maximum number of Ward Stones to form this line or shape, then call the effect each time a creature’s body or piece of equipment crosses the pattern, Stunning them for 3 seconds. This Stun only affects Lesser creatures and will not work on your fellow Returned or stronger foes. If a ward stone is ever moved or disturbed, you may make one final call against the creature that disturbed the line, after which the whole pattern is dispelled. If you wish to continue using it, the spell will have to be re-cast.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Warding","name":"Pass Ward","tier":"Apprentice","core":true,"delivery":"Special","casting":"Bypass","call":"“Pass Ward”","description":"You, as a Warden, can use your inherent understanding of the magic present in symbols and ley lines to temporarily unmoor yourself from the synchronicity with nature that those same symbols rely on to function. While slightly out of phase with the natural order in this way, you may simply pass through many magical deterrents as if they weren’t there. While you are concentrating, you may call “Pass Ward” to bypass a single ward line or glyph. If there are multiple lines in a ward pattern, you may cast this spell an additional time per line you need to bypass by maintaining concentration after the initial call. *You may potentially bypass various other magical barriers or traps as well, at Story Staff discretion.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Warding","name":"Power of the Threshold*","tier":"Apprentice","core":false,"delivery":"Stone Ward","casting":"Place Special","call":"“Ward 1 [Fire, Ice, Lightning, or Acid]”","description":"As a warder, you know that there is a magic older than thought in one's place of power. That place is not necessarily a physical location, but is instead often a frame of mind. By taking a moment to define your space, you can offer protection to those within it.\n\nYou may place between two and your maximum number of Ward Stones to form this line or shape, and then select Fire, Ice, Lightning or Acid to call each time a creature's body or piece of equipment crosses the pattern. You may call only this element until you re-cast the ward line. While not required, it is helpful to point at anyone crossing the line as you make the call, as they may not otherwise know they have crossed a ward line.\nIf a ward stone is ever moved or disturbed, you may make one final call against the creature that disturbed the line, after which the whole pattern is dispelled. If you wish to continue using it, the spell will have to be re-cast.","note":"SPECIAL NOTE:\nUnlike nearly all other spells, this spell costs 0 mana to cast.","recipe":"","source":"Spell Compendium"},{"category":"Warding","name":"Repulsor Ward","tier":"Apprentice","core":false,"delivery":"Self Ward","casting":"Draw","call":"\"Self Repel\"","description":"Self cast only. Once per rest, when you enter bleedout, call \"Self Repel\" to repel yourself away from the enemy who put you in bleedout. Warder Exclusive Spell","note":"","recipe":"","source":"Spell Compendium"},{"category":"Warding","name":"Sanguine Ward","tier":"Apprentice","core":true,"delivery":"Skin Ward","casting":"Draw","call":"","description":"By slowing and constricting the flow of vital life essence within the body in response to physical trauma, this ward slows the rate at which a creature approaches death after being struck down. This ward adds +3 minutes to the affected person’s bleedout timer and stacks with other effects that increase bleedout (but not with itself). You may draw this ward on a target that is currently in bleedout to extend their timer.","note":"Core","recipe":"","source":"Spell Compendium","wardSymbol":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAL0AAAEECAAAAABYDmrlAAAUNElEQVR42u2dabBVxbXH/929D5dJBhkFUVBEAWc0PpwwAUf0CQ5ReSJqQFCLxLmMQ5wjkYj6THwJPH2mgsRZHGIocQAcI04RUDCAKIIIAmLAK3d39/99OHc4w97n7qH39abqnk8UVez9Y+3Vq1evqQXxb/yTaKFvoW+hb6FvoW+hb6FvoW+hb6FvoW/4edk+npZSAsD65Z99smztxi3fbUTHS69Vws3jBbNEhwKw6cN3P1j22frav9xxwvj+zt6QGT2tkMDWd+YtWPQ1AEApq7HzuZN6O3xJNvR5qX/10jNvrAYgJSykBob87KddYIRs1vTWesDGFx6bvwkQipaQwqDqxAtGSBgpmrXsDRT8ebOeXw8o0AKQwqDH2eP3gmN25/S0UmDVwzOXAAqWACCkwW4XntMdlsq9ijr8WZ/kq2PbA7LeJiqg3z1bSG3o/ueQ3mhy20PDAHj161IKdJ2yhfQt2YzpjU/yqzv2AETBVuQBE1aTOht2V/TakHz7qh6AKtBtIbH33MzkTpIuVq2FxLLHZ78DKNoCF8ri4intXZsZx6vWavKV09sAKPZeFNrPJDWz/KWm1+QbI4tWah38rguzVBoX9FZz/URZtFLr4PdeRZ9szvSGfGIXiPJdSGHw2uzh09Fr1kwOPCJI9Pq0CeCZ5nRi1JdnzVfU5e6HyD3aV2d88El5tjJq6UnLPR103DQ3HubnmuBkmNzeG7Xs6NXB8HbgBypTM59a9katPGa1qoMXCmDdViVwZSvdFPCJZU9+e8TiesnXPkUKS0Cw4z+7UTTjmAKNd14DvLSYPHDNkvc+BxStNIOaCD6pp6A5DbkG495hNklunXPujoCqEmMydhBS2nvDj1oXnD96LWSN72uSa6buCeCM5k2v7Qioevj+H+V3Jqs1Wf3QcOxL24zpNZ+qh5fovaJhW7U+ybd+vK2J8JPYHFIfvEiaPDw7LNi3cFulFXLVTlXNN45pvGc/VKb2+GRmFcFDKNi+zTmGLHln3YqV+oYTfK9sr20q+gSaY9TCQ5D/Z8ocMd8o97bdMpqjkUD2xMzauJJgmxnCvUNjKSNKJD49vepnYGtV5Io9tfP8hZFi0QIfzGSv1XxDiFq3pve3xrlp9LnoBIVRJkrsLYHs8VK94lyyg3WtN8abOfR5K1/YLJmF5ki8mv+qwnQ6h671xqipY7d6wvZon4neU25blKdXGNXdOqbX6uarlNASQ6qMyIIen2/IL1qL01wH/7V3yw2eJYifZeMha/4t/18W6LDesTvj8y4oASgMtZEC5glk/2WeXuKAbm7XrPbuvlTlUxY3RdtFE+htTd3pdQCcugS+94c8vDKjjjYqI/p6ee/kVudz0y9U+XNx26nMaq9t2ASr3KrNjIl5tVH26v4RbZmML/mOyCBL6nv/e4HMw+t9rjIyMw+5Xd0ftrhUmxkTJAlAwPtjFURm9DvWLda1cGRyqL1pF+ThIc3lQ7XKKiJi+GlrCAAS+zlKLlifU+oSL1L02Bjd84tNb/l9P0g ise know they have crossed a ward line. If a ward stone is ever moved or disturbed, you may make one final call against the creature that disturbed the line, after which the whole pattern is dispelled. If you wish to continue using it, the spell will have to be re-cast.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Warding","name":"Lesser Paralysis Ward","tier":"Journeyman","core":false,"delivery":"Stone Ward","casting":"Place","call":"\"Ward Lesser Paralysis\"","description":"This spell allows you to cause a lesser paralysis effect to anyone passing your ward.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Warding","name":"Minor Sight Ward","tier":"Journeyman","core":true,"delivery":"Skin Ward","casting":"Draw","call":"\"Resist\"","description":"By relying on the sympathetic magic underlying the function of the eyes, you set up a ward that can redirect and absorb energies that are communicated through a person’s gaze, disrupting such attacks once before overloading the ward and requiring some time to recharge. The person bearing this ward may call “Resist” to prevent a single gaze-delivered effect. This Resist call must be made as soon as possible after the gaze attack. This effect returns with Rest. This ward stacks with other sources of “Resist” but not with itself.","note":"Core","recipe":"","source":"Spell Compendium"},{"category":"Warding","name":"Resilient Spirit Ward","tier":"Journeyman","core":false,"delivery":"Skin Ward","casting":"Draw","call":"\"Resist\"","description":"Can only be applied to a newly Returned in their first 3 gatherings. You may call \"resist\" against any single effect, regardless of type. Does not work against \"Greater\" effects.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Warding","name":"Ward of the Clenched Fist","tier":"Journeyman","core":false,"delivery":"Skin Ward","casting":"Draw","call":"Special","description":"You may call \"resist\" against a single disarm effect. ow wards and glyphs hold and distribute the magic present in symbols and ley lines, which has given you insight into how to temporarily unmoor yourself-and another person!-- from the way that those symbols attach themselves to the world's magic. While slightly out of phase with the natural order in this way, you and another person in contact with you may simply pass through many magical deterrents as if they weren't there.\nWhile you are concentrating, you may call \"Pass Ward\" to allow yourself and another person touching you to bypass a single ward line or glyph. If bringing a second person, they must cross one arm over their chest, and use the other hand to maintain physical contact with you. If there are multiple lines in a ward pattern, you may cast this spell an additional time per line you need to bypass by maintaining concentration after the initial call and spending the mana again. Neither person may engage in any significant actions (like picking up objects) other than stepping past the wards. Warder Exclusive Spell.\n*You may potentially bypass various other magical barriers or traps as well, at Story Staff discretion.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Warding","name":"Kenrin's Arcanum","tier":"Master","core":false,"delivery":"Touch","casting":"Triangulate","call":"\"Bestow +1 Spell Damage\"","description":"Originally created by the archmage Kenrin Arakai, this spell applies highly abstract principles to create a new possibility in the field of Warding: the establishment of temporary enchantments. By using the physical presence of three spellcasters as a kind of impromptu \"runic circle,\" and by using their connection to magicka to reinforce a new pattern of magical flow within an object, you create an enchantment- like structure that can maintain itself for a short span of time before dissipating.\nYou may only apply this spell to a physical item. The item then provides +1 Bestowed Damage to spells that do direct numerical damage (spells that contain a number in their \"Call\" field) for the next 30 minutes, after which the Bestow effect ends. This is functionally and mechanically identical to having an ARTIFICING \"Power-Focus\" item from the Twin Mask rulebook, except that it can be applied to items that are both worn and held. This spell does not affect \"Drain\" spells and effects. This spell does not stack with Power-Focus artifacts, other sources of Bestowed Spell Damage, or itself.","note":"","recipe":"","source":"Spell Compendium"},{"category":"Warding","name":"Pointing Ward","tier":"Master","core":false,"delivery":"Skin Ward","casting":"Draw","call":"\"Resist\"","description":"This spell protects you from enchantments carried by gesture but your physical sensations are slightly numbed. You may call \"Resist\" against a single Gesture delivered spell or effect. This ward may not be used again until after 30 minutes of rest within a calm environment.","note":"","recipe":"","source":"Spell Compendium","wardSymbol":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAK8AAAEECAAAAAB7VTswAAAYpElEQVR42u1deZgU1bX/nXvvzADDjIAEEEEZRARDBNSo4IaiSUxiNJLgEhX1JRoTnyIazcvzGaPRRBOjJnFfYtzijnFHY9wVEXFjUdydyPKxKPvM1L33vD+6q+pWV1V3Tc/00H7f9Pf5h3R1za9O/c65Z72XGF+qj0A33m683Xi78Xbj7cbbjbcbbzfebrzlf1QHfstGARtfm7v4zWWtqBs4pmnXXfvBsqwkXirfXzcS9qn7nnrf+achk6ftB+ZKvjQu82MMb7xmHAAIKYiIhJQE4FuzmDVX7FMuXs18+2hAqIgsSRLw3QWsbXXhtZoXHATIhBcvBRquqpyIy8JrmK9uSEQLABI4fj171YNX84ZpQLoZIIkxL1cIMMqB+58JUFTcStbdUhnAKAPu/OElzbYkXFURwCgD7lYZVhmSuLoSgNFuVWsekmlRJIkHKmAl2rm+Ma046DWls3kmjfOarNis/g7btoMzwoWlL443zJt1Pdb8S9S0w5f6daczol18MPK13WEz/4KoZtGwTnZ+2nU3wmkG2R+QResVZfl/bLThjvNB8z+SVzWhpBBCSYoJuHezNeX4UqkfeV72p0bLD7+Ii5ck2DIzW449jWqp39+0kxBsZdt9D68eLpk65q8becV0aWKytcD4Pb++NbUseOGZtYheIOxWi3sztTMKePicN4Gjbk+2hdl9SPvFIBJxZ0wc/ax/yacXDwVR9Os727XKGcvLjgdkD/GNZFpkx+vxH2Lvmwh7vcjMnqe19gzzyukARfyIb7Bpj1vN1w+GECTlnA7itXbt1oXiFcA5mnVwY+sx/6POlTBRr08yA9bMrx4ASEDiDylah+zi/VOh3yDROJNt5L62jR8g104oXGG9rML9/IxaSAIkDktjETKLd+OIAvFKDHqVvc e,” then the effect, trying to make it as obvious as possible which person you are focused on. (Players sometimes point with a finger, just to make their gaze’s direction more obvious.) This method is only supposed to affect one individual; if multiple people believe that they were being focused on, they should default to taking the effect, just to be conscientious… but the intended effect is on just one person. Unless specified in the effect description, the target does not need to meet your eyes, so looking away or averting your eyes will do nothing to defend against these effects."},{"group":"Delivery Methods","name":"Touch","description":"You touch the target and call the effect. There is no need to call “by my touch.” Your hand (or other body part) must be bare in order to successfully touch your target, but skin-to-skin contact is not strictly required, so you may touch your target’s clothing (but not armor) to produce this effect. While typically your hands are used for this method, technically any part of your body could be used—but you must be respectful of the target’s preferences. You should default to touching a target on the arm or shoulder, but if you are going to touch the target in any suggestive or non-standard way, you should first ask “consent to physical role-play” and give them some idea of your intentions."},{"group":"Delivery Methods","name":"Ward","description":"When anyone crosses a “warding line” (or touches/moves one of the stones establishing that line), you may choose to call the effect by saying “ward, [effect].” It is often wise to point at the person or otherwise get their attention, so that they know to take the effect. Activating a warding line in this way counts as casting a Warding spell, even though it costs no mana, so (for instance) you would need the ARMORED CASTING skill to do so, if you were wearing armor at the time. Note that holding an item (such as a sword) over a line counts as crossing it."},{"group":"Delivery Methods","name":"Packet","description":"You throw a small bag of birdseed at the target and simultaneously call the effect; you should not wait to see if the packet hits before you make this call. If the packet hits a person’s body, armor, shield, weapons, or other gear, it counts as a hit and they should take the effect. If you miss, you retain the mana used to cast the spell. There is no need to call “by my packet.” Your hand can still be “free” with spell packets in it."},{"group":"Delivery Methods","name":"Gesture","description":"You point directly at the target, then call “by my gesture” and the effect, trying to make it as obvious as possible which person you are focused on. In order to use this delivery method, you need an open hand—not wielding a weapon or shield, although spell packets and ARTIFICING items are fine—to gesture with; any exceptions to this restriction will be noted in the text of the specific effect. Additionally, gesture-delivered effects are only supposed to affect one individual; if multiple people believe that they were being focused on, they should default to taking the effect, just to be conscientious… but the intended effect is on just one person."},{"group":"Delivery Methods","name":"Voice","description":"You call “by my voice” and then the effect, as loudly or as quietly as you wish. As soon as the call begins, anyone (other than yourself) in earshot will be affected; people cannot clap their hands over their ears halfway through the call, to try to avoid the effect. If a person did not hear the details of your call, though, perhaps because they were involved in a heated conversation, they should default to not taking the effect (since they would only be guessing at its specifics). Keep in mind that people inside a Wooden or Stone Fortified Building will not be affected by Voice calls made outside that building."},{"group":"Delivery Methods","name":"Elixir","description":"As somebody drinks (or pantomimes drinking) the potion you made, you call the effect. Alternatively, THEY can call the effect, as long as you have explained to them exactly what the elixir's call should be, or if they have an item card detailing that information. A person must have an intact head and throat to imbibe a potion. There is no need to call “by my elixir.” It is possible to administer a potion to a person who is dead, in Bleedout, or unconscious… but if they were killed by a Deathblow, you will need to perform SURGERY or use a Repair Corpse effect to enable them to take the potion."},{"group":"Delivery Methods","name":"Weapon","description":"As you strike at your target with a weapon, you call out the effect. This replaces the damage (or other effects) that a normal blow of your weapon would cause. If the blow is blocked by a shield or weapon, or if you miss, the effect does not take effect, but you also don’t expend that effect. There is no need to call “by my weapon.” Weapons cannot “push past” shields to hit; weapon attacks that hit any blocking surface before hitting their targets are considered blocked."},{"group":"3-Second Effects","name":"Stun","description":"You are unable to fight, use skills, or defend yourself for 3 seconds. You may move, although you must do so in a stumbling way."},{"group":"3-Second Effects","name":"Disarm","description":"Your weapon is, essentially, Stunned and knocked to the ground for 3 seconds, during which time nobody can touch or use it. Disarm can affect whatever hand-held object it impacts, including two-handed weapons, random objects such as books, and even shields. (Of course, many shields are actually strapped to one’s arm, so they do not fall to the ground, but one cannot use the affected shield to defend oneself during the duration of the Disarm, and any attacks that hit the shield must be taken as if they had hit your body.) If a Disarm effect hits a person’s body and they are not wielding a weapon or shield, they must choose a single object they are holding to be Disarmed. If you are holding a prop that is delicate or important, you do not have to drop it directly to the ground; you can crouch and place it on the ground nearby, perhaps in a relatively safe location, though you must do this quickly and without going out of character."},{"group":"3-Second Effects","name":"Paralyze","description":"You are unable to do anything or move for 3 seconds. (If you were moving when you became Paralyzed, you will probably fall to the ground; please choose a safe method of doing so, even if it means less “realism.”)"},{"group":"3-Second Effects","name":"Bind","description":"Your feet are locked in place for 3 seconds. You may not take steps or move from your current position, although the rest of your body continues to function normally and you may fight, cast spells, or perform any other actions that do not require moving."},{"group":"3-Second Effects","name":"Command","description":"You are forced to follow a single order, spoken along with the Command call, for the next 3 seconds. If the Commanded action takes less than 3 seconds to perform, though—such as “kneel”—you can instead end the effect (for example) as soon as you have dropped to one knee. This effect is similar to Dominate (below), in that it only controls physical actions and cannot force the affected person to divulge information. They are distinct effects, though: anything that blocks or modifies “Dominate” effects will not apply to Commands."},{"group":"3-Minute Effects","name":"Sleep","description":"You fall to the ground, unconscious and helpless, for 3 minutes. You will not wake up under any circumstances, even if attacked."},{"group":"3-Minute Effects","name":"Slow","description":"You can only move and attack at half speed for 3 minutes. In general, this makes it very easy for enemies to block or evade your attacks."},{"group":"3-Minute Effects","name":"Berserk","description":"You are compelled to attack whoever is closest to you, friend or foe, for 3 minutes. You should role-play extreme anger and hatred during this time. If you have no means of doing damage and cannot easily acquire one (for example, by picking up a nearby sword), you should simply be loud and disruptive as the rage consumes you. You should not pantomime punching or otherwise engaging in actual physical combat with others, as that could lead to injury or safety concerns."},{"group":"3-Minute Effects","name":"Weakness","description":"You cannot cast spells, use skills, fight, run, or even walk quickly for 3 minutes. You are also essentially under the influence of a Slow effect during this time."},{"group":"3-Minute Effects","name":"Petrify","description":"You are turned to stone: essentially Paralyzed for 3 minutes, with the added feature that you cannot be harmed or physically damaged by any effect during that time."},{"group":"3-Minute Effects","name":"Poison","description":"Your body is powerfully affected with a lethal toxin or venom: you know you have been poisoned, and after 3 minutes of role-playing increasing pain and discomfort, you will die. (This does not count as a “Death effect” and cannot be countered by things that would stop those effects.) Even if it is delivered by a weapon attack, Poison is a status ailment and thus bypasses armor."},{"group":"3-Minute Effects","name":"Death","description":"You are legitimately dead: unconscious, immobile, and essentially immune to damage that is not based on mutilation. All temporary negative status effects such as Berserk or Dominate are removed. At the end of your Death Count you turn to mist, and it is no longer possible to use Life effects to revive you."},{"group":"3-Minute Effects","name":"Dominate","description":"Dominate gives the caster control over the target’s body, but not its mind, for 3 minutes. • You are, essentially, being “puppeteered” by whoever called the effect. • A Dominated creature can take NO actions except following the orders of the caster, including moving, speaking, using items, or casting spells. If a Dominated creature has not been given an order, they must simply stand motionless. • The caster may only give a single action as a command at a time, such as, “Kill that person” or “Bring me that sword.” A complex command such as, “Search the town for the Sword of Steve Stabbing, then stab Steve with it,” would be invalid and should not be followed. • A Dominated creature is aware of what is happening at all times while it is Dominated, retains full memory of the time spent Dominated, and knows which creature is giving it commands. • A Dominated creature must follow the commands of the caster to the best of their ability but cannot be compelled to reveal information or perform tasks that reveal information. Dominate does not grant the caster access to the target’s mind, thoughts, or memories. For example, if you were ordered to, “Tell me where the treasure is buried,” you would simply parrot, “Where the treasure is buried.” If you are ordered to take the caster somewhere unknown to them, you may simply take them anywhere, as they could not possibly direct your body to the location in question using the information they possess. • A Dominated creature cannot be compelled to use specific skills. For instance, you cannot be ordered to, “Make a potion that heals me,” or, “lockpick this door,” but if you are ordered to “kill the rest of your party” you should use skills as necessary to accomplish that goal, including damaging spells if necessary. • You should never attempt to use “meta” information such as “these aren’t my friends, and so a command to kill my friends is invalid.” Many commands are shorthand to represent the control the caster has over the Dominated creature’s body, and you should always act in good faith. Attempts to circumvent Dominate in this way are considered a violation of the rules. • A character can not be affected by a second Dominate effect while the first is still active; any attempts to do so will fail."},{"group":"Step-Based Effects","name":"Repel","description":"You are forced to take 3 steps directly away from the source of this effect. If you cannot do so without endangering yourself (rather than your character), you should move as far as you safely can, then take a Stun effect. Repel effects also work on bodies in Bleedout or death count, but not on objects."},{"group":"Step-Based Effects","name":"Attract","description":"You are forced to take 3 steps directly toward the source of this effect. If you cannot do so without endangering yourself (rather than your character), you should move as far as you safely can, then take a Stun effect. Attract effects also work on bodies in Bleedout or death count, but not on objects."},{"group":"Other Effects","name":"Drain","description":"Drain takes Health Points (HP) from the target and heals the caster for the same amount, although you may not go above your maximum Health Point total in this way. If you are hit with a “Drain” call and take the effect, you have lost that many Health Points, ignoring any armor value you may have. It is possible, but extremely rare, to have “Drain [Resource]” calls that do not specifically target Health. If the call is not followed by a specific resource, though, the “Drain” call always takes Health Points and gives them to the caster."},{"group":"Other Effects","name":"Break Limb and Break Shield","description":"Your affected limb or shield is unusable until it is repaired. Limbs can be healed with the SET BONE skill, and shields can be fixed with the REPAIR SHIELD or FIELD REPAIR skills. Even after a broken limb has been repaired with a SET BONE effect, it is considered “maimed,” and you cannot use that limb for 3 full minutes as it recovers. A broken limb may not be actively used in any way, including attacking or blocking with a weapon or shield, using an ARTIFICING item, feeding yourself or another person a potion, or delivering a gesture or touch-based spell. You do not need to drop anything held in the hand of a broken arm, but those objects cannot be used. If an attack strikes a weapon or shield held in a broken arm, you must treat it as though it hit your body. You may not run or LEAP on a broken leg, though you may drag it slowly behind you at a walking pace. If you have mobility issues, you may also choose to simply “post” on a broken leg (keeping it immobile but still using it to support you)."},{"group":"Other Effects","name":"Break Item","description":"It is possible for your foes to break things other than arms, legs, and shields. Whenever a non-shield item is broken, it cannot be used until it has been repaired. If that type of item could theoretically be researched or built through the use of any of the “Crafting” skills, then a person with the appropriate crafting skill (of at least APPRENTICE level) may spend the standard amount of time (exactly as though they were making a craft item of Skill Level 1) to repair it. They need not spend any materials to repair the item. If the type of item does not correspond to any of the crafting skills, consult a Story Staff member about the requirements for repairing it."},{"group":"Other Effects","name":"Life","description":"You are able to return a dead body to life, as long as this effect is applied within a limited amount of time after that death occurs. (Usually, this “window” is 3 minutes after a person dies; once a person’s Death Count is up, they will turn into mist [if they are Returned], or they will simply not respond to this effect.) When a person is affected by Life, they are automatically healed to their current maximum HP total, and all temporary negative status effects such as “Berserk” and “Dominate” are removed, but they will be disoriented and suffer from Weakness for the following 3 minutes."},{"group":"Other Effects","name":"Cursed","description":"For the duration of this effect, you cannot be healed by any means and cannot be affected by Life effects. If you take damage or die, there is no way to recover. The default duration of this effect is 30 minutes, although different durations will generally be specified whenever this condition is applied. If the Cursed effect is attached to an item (such as a sword), then anyone bearing that item will be Cursed while they bear it, and if they die, the item cannot simply be removed from their body to end the effect."},{"group":"Other Effects","name":"Stealth","description":"When this modifier is applied to an attack, that attack cannot be negated by Parry, Dodge, or Willpower effects, and it bypasses all armor to do damage directly to Health Points (HP)."},{"group":"Other Effects","name":"Torture","description":"You must truthfully answer the next yes-or-no question posed to you during the duration of the Torture. You need only truthfully answer a single yes/no question to fulfill the requirements of a Torture effect. Only the TORTURE RESISTANCE and TORTURE IMMUNITY skills can prevent this effect."},{"group":"Other Effects","name":"Destroy","description":"When you call “Destroy,” you must also name a target for the effect. Assuming that the target is not defended in some way, this effect permanently destroys it. Typically, this effect targets corpses or spirits."},{"group":"Other Effects","name":"Suppress","description":"“Suppress” is a call that prevents the use of certain specified abilities, interpreted somewhat strictly. A call of “suppress magic,” for instance, would stop you from casting spells… but you could still activate/trigger skin wards and crafted items. “Suppress melee attacks” would only prevent you from making melee attacks; you could still use melee weapons to block attacks, and so on. Suppress has a default duration of 30 seconds, but any call that produces a Suppress effect can instead specify a longer duration and/or a highly varied area of effect."},{"group":"Other Effects","name":"Strength","description":"When you call “Strength,” you can do things that require physical might beyond the scope of human physiology. • If you have SUPERNATURAL STRENGTH, you gain these benefits automatically, without needing to actively call “Strength!”: • You may run at full speed while (in-character) carrying a person. • When describing a deathblow you administer, you may include acts of crushing strength. • You may ignore the “no armor, no shields” restriction on the LEAP skill. Make sure to be cautious, though, in doing your post-LEAP “hero landing” while in heavy armor: it’s easy to accidentally injure yourself OOC with heavy plate! • The following pre-approved effects can be performed as long as you accompany them with a “Strength” call: • You can throw a person who is willing, incapacitated, or dead. That person will act out their flight by taking 3 steps in the direction you indicate, stopping if another person or obstacle blocks their way. This movement does not emulate the LEAP skill; the tossed person is not immune to any damage or effects, although they will not be technically touching any environmental hazards (like a pit of acid) on the ground. • You can hold a person (or thing) very securely. That person cannot pull themselves out of your grip unless they 1) make their own Strength call, 2) are aided by somebody who makes a Strength call, or 3) use the ESCAPE skill. This type of Strength effect should not be used in combat: it is intended exclusively for role-playing purposes, not for taking an enemy out of the fight by bear-hugging them or grappling their shield."},{"group":"Defensive Effects","name":"Dodge","description":"You may negate any successful attack against you that can be physically avoided: weapon attacks, touch attacks, and packet-delivered effects. Note that Greater effects cannot be negated in this way."},{"group":"Defensive Effects","name":"Willpower","description":"You may negate any successful attack against you that is delivered in a way that cannot be physically avoided: that is, effects delivered by gaze, ward, gesture, voice, or elixir. Note that Gr
