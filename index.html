    dream: '<path d="M20 14a8 8 0 1 1-9.5-9.8A6.5 6.5 0 0 0 20 14Z"/>',
    blood: '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11Z"/>',
    necro: '<circle cx="12" cy="9" r="6"/><path d="M8 20h8M10 9h.01M14 9h.01"/>',
    summon: '<path d="m12 3 2.5 6.5H21l-5 4 2 7-6-4.2L6 20.5l2-7-5-4h6.5L12 3Z"/>',
    divine: '<path d="M12 2v20M6 8h12"/>',
    offensive: '<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5L12 3Z"/>',
    defensive: '<path d="M12 3 5 6v5c0 4.2 2.9 7.6 7 9 4.1-1.4 7-4.8 7-9V6l-7-3Z"/>',
    specific: '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>',
    bestow: '<path d="M12 8V4M8 8h8l-1 12H9L8 8ZM10 4h4"/>',
    default: '<circle cx="12" cy="12" r="8"/>'
  };

  function catIcon(name) {
    var n = (name || "").toLowerCase();
    var map = [
      ["weapon prof", "weapon"], ["armor", "armor"], ["general combat", "combat"],
      ["archery", "archery"], ["officer", "officer"], ["duel", "duel"],
      ["suffering", "suffer"], ["assassin", "assassin"], ["berserker", "berserk"],
      ["mundane healing", "heal"], ["religious", "religion"], ["bardic", "bard"],
      ["magical arts", "magic"], ["skullduggery", "skull"], ["knowledge", "knowledge"],
      ["influence", "influence"], ["gathering", "gathering"], ["crafting", "craft"],
      ["blacksmith", "anvil"], ["weaponsmith", "weapon"], ["armorsmith", "armor"],
      ["shieldsmith", "defensive"], ["locksmith", "lock"], ["enchant", "magic"],
      ["artific", "gear"], ["cooking", "pot"], ["tailor", "needle"],
      ["fletch", "archery"], ["engineering", "building"],
      ["restricted", "restricted"],
      ["alchemy", "alchemy"], ["channel", "channel"], ["divination", "divination"],
      ["sorcery", "sorcery"], ["warding", "warding"], ["dream", "dream"],
      ["blood", "blood"], ["necromancy", "necro"], ["summoning", "summon"], ["divine", "divine"],
      ["offensive", "offensive"], ["general", "offensive"], ["defensive", "defensive"],
      ["specific", "specific"], ["bestow", "bestow"]
    ];
    for (var i = 0; i < map.length; i++) if (n.indexOf(map[i][0]) !== -1) return ICONS[map[i][1]];
    return ICONS.default;
  }

  function iconSvg(inner) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
  }

  /* Sleek, differentiated icon palette (muted jewel tones on dark). */
  var PALETTE = [
    [214, 165, 92],   [110, 150, 240],  [80, 200, 170],
    [224, 110, 100],  [170, 130, 240],  [86, 190, 214],
    [150, 200, 90],   [230, 130, 180],  [235, 150, 70]
  ];
  function paletteRGB(i) {
    return PALETTE[((i % PALETTE.length) + PALETTE.length) % PALETTE.length];
  }
  function icoStyle(i) {
    var c = paletteRGB(i);
    return 'color:rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ');' +
      'background:rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.14);' +
      'border-color:rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.34)';
  }
  function cardStyle(i) {
    var c = paletteRGB(i);
    return '--ico-soft:rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.30)';
  }

  /* Distinct colors for spell tiers and ward delivery types. */
  var TIER_COLORS = {
    Apprentice: [96, 196, 165], Journeyman: [122, 156, 240], Master: [178, 142, 240],
    Grandmaster: [224, 164, 88], Paragon: [224, 119, 107]
  };
  var DELIVERY_COLORS = {
    "Skin Ward": [230, 130, 180], "Stone Ward": [212, 165, 92], "Self Ward": [140, 176, 240]
  };
  function rgb(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
  function deliverySpan(d) {
    var c = DELIVERY_COLORS[d];
    if (!c) return esc(d);
    return '<span style="color:' + rgb(c) + ';font-weight:600">' + esc(d) + '</span>';
  }

  /* Gathering-point colors (1-4) mirror the spell tier scheme. */
  var POINT_COLORS = { 1: [96, 196, 165], 2: [122, 156, 240], 3: [178, 142, 240], 4: [224, 164, 88] };
  var POINT_LABEL = { 1: "Apprentice", 2: "Journeyman", 3: "Master", 4: "Grandmaster" };
  var NEUTRAL_COLOR = [150, 160, 178];   // property-based (Wood/Herb)
  var UNKNOWN_COLOR = [122, 128, 142];   // crafted / not gathered

  function normMat(name) {
    var n = String(name || "").replace(/\u2019/g, "'").replace(/\([^)]*\)/g, "");
    n = n.replace(/^\s*\d+\s+/, "").replace(/\s+/g, " ").trim().toLowerCase();
    if (/s$/.test(n) && !/ss$/.test(n)) n = n.replace(/s$/, "");
    return n;
  }
  function matInfo(name) {
    var m = DATA.materials ? DATA.materials[normMat(name)] : null;
    if (!m) return { known: false };
    return { known: true, points: m.points || null, propertyBased: !!m.propertyBased, sources: m.sources || [], display: m.display || name };
  }
  function matColor(info) {
    if (info.known && info.points) return POINT_COLORS[info.points] || UNKNOWN_COLOR;
    if (info.known && info.propertyBased) return NEUTRAL_COLOR;
    return UNKNOWN_COLOR;
  }
  function matChip(m) {
    var info = matInfo(m.name), c = matColor(info);
    return '<button class="mat-chip" data-material="' + esc(m.name) + '" style="color:' + rgb(c) +
      ';background:rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.14);border-color:rgba(' +
      c[0] + ',' + c[1] + ',' + c[2] + ',0.34)">' + esc(m.name) +
      '<span class="mat-x">\u00d7' + m.qty + '</span></button>';
  }

  /* ---- Tab configuration ---- */
  var TABS = {
    skills:  { items: DATA.skills,        catKey: "category", type: "skill",  label: "Skill",  title: "Skills",         sub: "Browse skills by category" },
    spells:  { items: DATA.spells,        catKey: "category", type: "spell",  label: "Spell",  title: "Spells & Magic", sub: "Browse spells by discipline" },
    crafting:{ items: DATA.crafting,      catKey: "table",    type: "crafting", label: "Craft", title: "Crafting", sub: "Craftable items by skill" },
    status:  { items: DATA.statusEffects, catKey: "group",    type: "status", label: "Status", title: "Status Effects", sub: "In-game effects and calls" }
  };

  /* ---- State ---- */
  var state = { tab: "skills", category: null, query: "", expanded: {}, wardFilter: "all" };

  var WARD_FILTERS = [
    { id: "all", label: "All Wards", color: null, match: function () { return true; } },
    { id: "stone", label: "Stone Wards", color: [212, 165, 92], match: function (it) { return it.delivery === "Stone Ward"; } },
    { id: "skin", label: "Skin Wards", color: [230, 130, 180], match: function (it) { return it.delivery === "Skin Ward" || it.delivery === "Self Ward"; } },
    { id: "other", label: "Other", color: [140, 176, 240], match: function (it) { return it.delivery !== "Stone Ward" && it.delivery !== "Skin Ward" && it.delivery !== "Self Ward"; } }
  ];

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  function slug(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }
  function entryId(type, item) {
    var cat = item.category || item.group || item.table || "";
    return type + "__" + slug(cat) + "__" + slug(item.name);
  }

  /* Ordered unique categories preserving first-seen order */
  function categoriesOf(items, key) {
    var order = [], seen = {}, counts = {};
    items.forEach(function (it) {
      var c = it[key] || "Other";
      if (!seen[c]) { seen[c] = true; order.push(c); counts[c] = 0; }
      counts[c]++;
    });
    return order.map(function (c) { return { name: c, count: counts[c] }; });
  }

  /* ============================================================
     Rendering
     ============================================================ */

  function render() {
    Object.keys(TABS).forEach(function (t) {
      document.getElementById("view-" + t).classList.toggle("active", state.tab === t && !state.query);
    });
    var searchView = document.getElementById("view-search");
    searchView.classList.toggle("active", state.tab === "search" || !!state.query);

    document.querySelectorAll(".tab").forEach(function (b) {
      var active = b.dataset.tab === state.tab && !state.query;
      if (state.query && b.dataset.tab === "search") active = true;
      b.classList.toggle("active", active);
    });

    if (state.query) { renderSearch(); return; }
    if (state.tab === "search") { renderSearch(); return; }

    var cfg = TABS[state.tab];
    var view = document.getElementById("view-" + state.tab);
    if (!state.category) view.innerHTML = renderCategoryGrid(cfg);
    else view.innerHTML = renderEntryList(cfg, state.category);
  }

  function renderCategoryGrid(cfg) {
    var cats = categoriesOf(cfg.items, cfg.catKey);
    var total = cfg.items.length;
    var html = '<div class="crumbs"></div>';
    html += '<div class="view-title">' + esc(cfg.title) + '</div>';
    html += '<p class="view-sub">' + esc(cfg.sub) + ' &middot; ' + total + ' entries</p>';
    if (!cats.length) {
      return html + emptyState("Nothing here yet", "Data for this section will appear once loaded.");
    }
    html += '<div class="cat-grid">';
    cats.forEach(function (c, i) {
      html += '<button class="cat-card" data-cat="' + esc(c.name) + '" style="' + cardStyle(i) + '">' +
        '<div class="cat-ico" style="' + icoStyle(i) + '">' + iconSvg(catIcon(c.name)) + '</div>' +
        '<div class="cat-name">' + esc(c.name) + '</div>' +
        '<div class="cat-count">' + c.count + ' ' + (c.count === 1 ? "entry" : "entries") + '</div>' +
        '</button>';
    });
    html += '</div>';
    return html;
  }

  function renderEntryList(cfg, category) {
    var items = cfg.items.filter(function (it) { return (it[cfg.catKey] || "Other") === category; });
    var isWarding = cfg.type === "spell" && category === "Warding";
    if (isWarding) {
      var f = WARD_FILTERS.filter(function (x) { return x.id === state.wardFilter; })[0] || WARD_FILTERS[0];
      items = items.filter(f.match);
    }
    var html = '<div class="crumbs"><button class="back-btn" data-back="1">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6 9 12l6 6"/></svg>' +
      esc(cfg.title) + '</button></div>';
    html += '<div class="view-title">' + esc(category) + '</div>';
    html += '<p class="view-sub">' + items.length + ' ' + (items.length === 1 ? "entry" : "entries") + '</p>';
    if (cfg.type === "crafting") html += craftLegend();
    if (isWarding) {
      html += '<div class="ward-filter">';
      WARD_FILTERS.forEach(function (x) {
        var style = x.color ? ' style="--chip:' + rgb(x.color) + '"' : "";
        html += '<button class="ward-chip' + (state.wardFilter === x.id ? " active" : "") +
          '" data-wardfilter="' + x.id + '"' + style + '>' + esc(x.label) + '</button>';
      });
      html += '</div>';
    }
    html += '<div class="entry-list">';
    if (!items.length) {
      html += emptyState("No matches", "No wards match this filter.");
    } else {
      items.forEach(function (it) { html += renderEntry(cfg.type, it); });
    }
    html += '</div>';
    return html;
  }

  function craftLegend() {
    var dots = "";
    [1, 2, 3, 4].forEach(function (p) {
      var c = POINT_COLORS[p];
      dots += '<span class="lg-item"><span class="lg-dot" style="background:' + rgb(c) + '"></span>' + p + ' pt</span>';
    });
    dots += '<span class="lg-item"><span class="lg-dot" style="background:' + rgb(NEUTRAL_COLOR) + '"></span>property</span>';
    dots += '<span class="lg-item"><span class="lg-dot" style="background:' + rgb(UNKNOWN_COLOR) + '"></span>other</span>';
    return '<div class="craft-legend"><span class="lg-label">Gathering cost</span>' + dots + '</div>';
  }

  function metaFor(type, it) {
    if (type === "skill") {
      var bits = [];
      if (it.cost) bits.push(it.cost);
      if (it.prerequisite && it.prerequisite !== "\u2014") bits.push("Req: " + it.prerequisite);
      return bits.join(" \u00b7 ");
    }
    if (type === "spell") {
      var b = [];
      if (it.tier) b.push(it.tier + (it.core ? " \u00b7 Core" : ""));
      if (it.delivery) b.push(it.delivery);
      return b.join(" \u00b7 ");
    }
    return "";
  }

  function pillFor(type, it) {
    if (type === "skill" && it.cost) return '<span class="pill">' + esc(it.cost) + '</span>';
    if (type === "spell" && it.tier) {
      var c = TIER_COLORS[it.tier] || [124, 107, 255];
      return '<span class="pill" title="' + esc(it.tier) + '" style="color:' + rgb(c) +
        ';background:rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.16);border-color:rgba(' +
        c[0] + ',' + c[1] + ',' + c[2] + ',0.34)">' + esc(tierAbbr(it.tier)) + '</span>';
    }
    if (type === "crafting") {
      var lvl = it.level ? ("Lvl " + it.level) : "Base";
      return '<span class="pill">' + esc(lvl) + '</span>';
    }
    return "";
  }

  function metaHtml(type, it) {
    if (type === "spell") {
      var parts = [];
      if (it.tier) parts.push(esc(it.tier + (it.core ? " \u00b7 Core" : "")));
      if (it.delivery) parts.push(deliverySpan(it.delivery));
      return parts.join(" \u00b7 ");
    }
    if (type === "crafting") {
      var b = [];
      b.push(it.level ? ("Skill Level " + it.level) : "Base item");
      if (it.kind === "Property") b.push('<span class="craft-kind">Property</span>');
      return b.join(" \u00b7 ");
    }
    return esc(metaFor(type, it));
  }

  function tierAbbr(t) {
    return { Apprentice: "App", Journeyman: "Jou", Master: "Mas", Grandmaster: "GM", Paragon: "Par" }[t] || t;
  }

  function renderEntry(type, it, hl) {
    var id = entryId(type, it);
    var open = !!state.expanded[id];
    var name = hl ? highlight(it.name, hl) : esc(it.name);
    var meta = metaHtml(type, it);
    return '<div class="entry' + (open ? " open" : "") + '" id="' + id + '">' +
      '<div class="entry-head" data-toggle="' + id + '">' +
        '<div class="entry-title"><div class="entry-name">' + name + '</div>' +
          (meta ? '<div class="entry-meta">' + meta + '</div>' : '') + '</div>' +
        pillFor(type, it) +
        '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>' +
      '</div>' +
      '<div class="entry-body"><div class="entry-body-inner"><div class="entry-content">' +
        detailHtml(type, it, hl) +
      '</div></div></div>' +
    '</div>';
  }

  function kv(label, val) {
    if (!val || val === "\u2014") return "";
    return '<span class="kv"><b>' + esc(label) + ':</b> <span class="v">' + esc(val) + '</span></span>';
  }

  function detailHtml(type, it, hl) {
    var h = "";
    if (type === "skill") {
      var fields = kv("Cost", it.cost) + kv("Prerequisite", it.prerequisite) +
        kv("Returns With", it.returnsWith) + kv("Call", it.call);
      if (fields) h += '<div class="field">' + fields + '</div>';
      if (it.description) h += '<div class="prose">' + para(it.description, hl) + '</div>';
      if (it.usage) h += '<div class="callout"><span class="label">Usage</span>' + para(it.usage, hl) + '</div>';
      if (it.note) h += '<div class="note-block">' + para(it.note, hl) + '</div>';
    } else if (type === "spell") {
      if (it.wardSymbol) h += '<img class="ward-symbol" alt="' + esc(it.name) + ' symbol" src="' + esc(it.wardSymbol) + '" />';
      var sf = kv("Tier", it.tier) +
        (it.core ? '<span class="kv"><b>Type:</b> <span class="v">Core Spell</span></span>' : '') +
        (it.delivery ? '<span class="kv"><b>Delivery:</b> <span class="v">' + deliverySpan(it.delivery) + '</span></span>' : '') +
        kv("Casting", it.casting);
      if (sf) h += '<div class="field">' + sf + '</div>';
      if (it.call) h += '<div class="callout"><span class="label">Call</span><span class="qcall">' + esc(it.call) + '</span></div>';
      if (it.description) h += '<div class="prose">' + para(it.description, hl) + '</div>';
      if (it.note) h += '<div class="note-block">' + para(it.note, hl) + '</div>';
      if (it.recipe) h += '<div class="callout"><span class="label">Crafting Recipe</span>' + para(it.recipe, hl) + '</div>';
    } else if (type === "crafting") {
      var cf = '<span class="kv"><b>Skill:</b> <span class="v">' + esc(it.table) + '</span></span>' +
        '<span class="kv"><b>Skill Level:</b> <span class="v">' + (it.level ? esc(it.level) : "Base") + '</span></span>' +
        '<span class="kv"><b>Type:</b> <span class="v">' + (it.kind === "Property" ? "Applied Property" : "Craft Item") + '</span></span>';
      h += '<div class="field">' + cf + '</div>';
      if (it.materials && it.materials.length) {
        h += '<div class="callout"><span class="label">Materials</span><div class="mat-list">' +
          it.materials.map(matChip).join("") + '</div></div>';
      } else {
        h += '<div class="callout"><span class="label">Materials</span><span class="qcall" style="color:var(--text-dim)">No materials required</span></div>';
      }
      if (it.effect) h += '<div class="prose">' + para(it.effect, hl) + '</div>';
    } else {
      if (it.description) h += '<div class="prose">' + para(it.description, hl) + '</div>';
    }
    return h || '<div class="prose" style="color:var(--text-faint)">No further details.</div>';
  }

  function para(text, hl) {
    var parts = String(text).split(/\n{2,}|\n/);
    return parts.map(function (p) { return "<p style='margin:0 0 8px'>" + (hl ? highlight(p, hl) : esc(p)) + "</p>"; }).join("");
  }

  /* ---- Search ---- */
  function allEntries() {
    var out = [];
    ["skills", "spells", "crafting", "status"].forEach(function (t) {
      var cfg = TABS[t];
      cfg.items.forEach(function (it) { out.push({ tab: t, type: cfg.type, label: cfg.label, item: it }); });
    });
    return out;
  }

  function renderSearch() {
    var view = document.getElementById("view-search");
    var q = state.query.trim();
    if (!q) {
      view.innerHTML = '<div class="view-title">Search</div>' +
        '<p class="view-sub">Find any skill, spell, craft item, or status effect</p>' +
        '<div class="hint">Type in the box above. Results match names and descriptions across every category. Tap a result to jump straight to it.</div>' +
        searchStats();
      return;
    }
    var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    var results = allEntries().map(function (e) {
      var matNames = e.item.materials ? e.item.materials.map(function (m) { return m.name; }).join(" ") : "";
      var hay = (e.item.name + " " + (e.item.description || "") + " " + (e.item.usage || "") +
        " " + (e.item.call || "") + " " + (e.item.effect || "") + " " + matNames +
        " " + (e.item.category || e.item.group || e.item.table || "")).toLowerCase();
      var score = 0, nameL = e.item.name.toLowerCase();
      for (var i = 0; i < terms.length; i++) {
        if (hay.indexOf(terms[i]) === -1) return null;
        if (nameL.indexOf(terms[i]) !== -1) score += 5;
        if (nameL.indexOf(terms[i]) === 0) score += 5;
        score += 1;
      }
      return { e: e, score: score };
    }).filter(Boolean).sort(function (a, b) {
      return b.score - a.score || a.e.item.name.localeCompare(b.e.item.name);
    });

    var html = '<div class="view-title">Search</div>' +
      '<p class="view-sub">' + results.length + ' result' + (results.length === 1 ? "" : "s") + ' for &ldquo;' + esc(q) + '&rdquo;</p>';
    if (!results.length) {
      view.innerHTML = html + emptyState("No matches", "Try a different term or check the spelling.");
      return;
    }
    var groups = { skill: [], spell: [], crafting: [], status: [] };
    results.forEach(function (r) { groups[r.e.type].push(r.e); });
    var groupTitles = { skill: "Skills", spell: "Spells", crafting: "Crafting", status: "Status Effects" };
    ["skill", "spell", "crafting", "status"].forEach(function (t) {
      if (!groups[t].length) return;
      html += '<div class="result-group-label">' + groupTitles[t] + ' (' + groups[t].length + ')</div>';
      html += '<div class="entry-list">';
      groups[t].forEach(function (e) {
        var it = e.item, id = entryId(e.type, it);
        var cat = it.category || it.group || it.table || "";
        var open = !!state.expanded[id];
        html += '<div class="entry' + (open ? " open" : "") + '" id="res-' + id + '">' +
          '<div class="entry-head" data-sresult="' + e.tab + '|' + esc(cat) + '|' + id + '">' +
            '<div class="entry-title"><div class="entry-name">' + highlight(it.name, terms) + '</div>' +
              '<div class="entry-meta">' + esc(cat) + '</div></div>' +
            '<span class="pill' + (e.type === "spell" ? " violet" : "") + '">' + e.label + '</span>' +
            '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>' +
          '</div></div>';
      });
      html += '</div>';
    });
    view.innerHTML = html;
  }

  function searchStats() {
    return '<div class="cat-grid" style="margin-top:16px">' +
      statCard("skills", DATA.skills.length, "Skills", 0) +
      statCard("spells", DATA.spells.length, "Spells", 4) +
      statCard("crafting", DATA.crafting.length, "Crafting", 6) +
      statCard("status", DATA.statusEffects.length, "Status Effects", 2) + '</div>';
  }
  function statCard(tab, n, label, i) {
    return '<button class="cat-card" data-goto="' + tab + '">' +
      '<div class="cat-ico" style="' + icoStyle(i) + '">' + iconSvg(catIcon(label)) + '</div>' +
      '<div class="cat-name">' + label + '</div>' +
      '<div class="cat-count">' + n + ' entries</div></button>';
  }

  function highlight(text, terms) {
    var out = esc(text);
    (terms || []).forEach(function (t) {
      if (!t) return;
      var re = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
      out = out.replace(re, "<mark>$1</mark>");
    });
    return out;
  }

  function emptyState(big, small) {
    return '<div class="empty">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>' +
      '<p class="big">' + esc(big) + '</p><p>' + esc(small) + '</p></div>';
  }

  /* ============================================================
     Events
     ============================================================ */

  document.querySelector(".tabbar").addEventListener("click", function (e) {
    var btn = e.target.closest(".tab"); if (!btn) return;
    var tab = btn.dataset.tab;
    var search = document.getElementById("search");
    if (tab !== "search") { state.query = ""; search.value = ""; toggleClear(); }
    state.tab = tab;
    if (tab !== "search") state.category = null;
    render();
    window.scrollTo({ top: 0 });
  });

  document.querySelector("main").addEventListener("click", function (e) {
    var mat = e.target.closest("[data-material]");
    if (mat) { openMaterialSheet(mat.dataset.material); return; }

    var wf = e.target.closest("[data-wardfilter]");
    if (wf) { state.wardFilter = wf.dataset.wardfilter; render(); return; }

    var cat = e.target.closest("[data-cat]");
    if (cat) { state.category = cat.dataset.cat; state.wardFilter = "all"; render(); window.scrollTo({ top: 0 }); return; }

    var back = e.target.closest("[data-back]");
    if (back) { state.category = null; state.wardFilter = "all"; render(); window.scrollTo({ top: 0 }); return; }

    var goto = e.target.closest("[data-goto]");
    if (goto) {
      state.query = ""; document.getElementById("search").value = ""; toggleClear();
      state.tab = goto.dataset.goto; state.category = null; render(); window.scrollTo({ top: 0 }); return;
    }

    var toggle = e.target.closest("[data-toggle]");
    if (toggle) {
      var id = toggle.dataset.toggle;
      state.expanded[id] = !state.expanded[id];
      var el = document.getElementById(id);
      if (el) el.classList.toggle("open", state.expanded[id]);
      return;
    }

    var sres = e.target.closest("[data-sresult]");
    if (sres) {
      var parts = sres.dataset.sresult.split("|");
      var tab = parts[0], category = parts[1], eid = parts[2];
      state.query = "";
      document.getElementById("search").value = ""; toggleClear();
      state.tab = tab; state.category = category; state.expanded[eid] = true;
      render();
      requestAnimationFrame(function () {
        var target = document.getElementById(eid);
        if (target) {
          var y = target.getBoundingClientRect().top + window.pageYOffset - 130;
          window.scrollTo({ top: y, behavior: "smooth" });
        }
      });
      return;
    }
  });

  function openMaterialSheet(name) {
    var info = matInfo(name), c = matColor(info);
    var html = '<div class="mat-sheet-head"><span class="mat-swatch" style="background:' + rgb(c) + '"></span>' +
      '<div class="mat-sheet-title">' + esc(name) + '</div></div>';
    if (!info.known) {
      html += '<p class="mat-sheet-note">Not a standard gathered material \u2014 it is typically crafted or provided in-game.</p>';
    } else if (info.propertyBased) {
      var sk = info.sources.map(function (s) { return s.skill; }).join(", ");
      html += '<div class="mat-row"><span class="mat-k">Gathering skill</span><span class="mat-v">' + esc(sk) + '</span></div>' +
        '<div class="mat-row"><span class="mat-k">Acquisition</span><span class="mat-v">Property-based \u2014 1 tag per rank (you choose the property)</span></div>';
    } else {
      html += '<div class="mat-row"><span class="mat-k">Gathering cost</span><span class="mat-v" style="color:' + rgb(c) +
        ';font-weight:650">' + info.points + ' point' + (info.points === 1 ? "" : "s") + ' \u00b7 ' + POINT_LABEL[info.points] + '</span></div>';
      var lines = info.sources.map(function (s) { return s.skill + " (rank " + s.points + ")"; }).join(", ");
      html += '<div class="mat-row"><span class="mat-k">Gathered via</span><span class="mat-v">' + esc(lines) + '</span></div>';
    }
    document.getElementById("mat-sheet-body").innerHTML = html;
    var ov = document.getElementById("mat-overlay");
    ov.hidden = false;
    requestAnimationFrame(function () { ov.classList.add("show"); });
  }
  function closeMaterialSheet() {
    var ov = document.getElementById("mat-overlay");
    ov.classList.remove("show");
    setTimeout(function () { ov.hidden = true; }, 220);
  }
  document.getElementById("mat-close").addEventListener("click", closeMaterialSheet);
  document.getElementById("mat-overlay").addEventListener("click", function (e) {
    if (e.target === this) closeMaterialSheet();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !document.getElementById("mat-overlay").hidden) closeMaterialSheet();
  });

  var searchEl = document.getElementById("search");
  var clearBtn = document.getElementById("clearBtn");
  function toggleClear() { clearBtn.classList.toggle("show", !!searchEl.value); }

  var t;
  searchEl.addEventListener("input", function () {
    toggleClear();
    clearTimeout(t);
    t = setTimeout(function () {
      state.query = searchEl.value;
      render();
    }, 90);
  });
  searchEl.addEventListener("focus", function () {
    if (state.tab !== "search" && !state.query) { /* stay, results appear on type */ }
  });
  clearBtn.addEventListener("click", function () {
    searchEl.value = ""; state.query = ""; toggleClear(); render(); searchEl.focus();
  });

  render();
})();
</script>
</body>
</html>
