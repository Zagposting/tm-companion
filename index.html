eater effects cannot be negated in this way."},{"group":"Defensive Effects","name":"Parry","description":"If you are actively holding a weapon, you may negate any successful melee weapon attack against you (not including attacks delivered by touch)."},{"group":"Defensive Effects","name":"Resist","description":"Each Resist effect specifies what it can protect against (for instance: Torture, Poison, “weapon attacks,” etc.) You may entirely negate one attack or effect of that kind. Most pointedly, this effect is capable of negating an attack with the “Stealth” modifier… but Greater effects cannot be negated in this way."},{"group":"Defensive Effects","name":"Airborne","description":"You must raise both hands above your head to show that this effect is active. While Airborne, you cannot call defenses except “Willpower” or “Resist,” make attacks, actively use skills, or cast spells, but you also cannot be affected by any attacks or spells that can be physically dodged (that is, attacks that could be canceled by a Dodge effect). You can still be affected, however, by non-weapon attacks such as voice, gaze, gesture, or ward."},{"group":"Defensive Effects","name":"Delay","description":"You may prevent any one effect or attack from affecting you for the next 30 seconds. At the end of that duration, you will take the effect or attack’s normal impact; if you have other defenses (such as Willpower), you can choose to use them at that time."},{"group":"Specific Spell Effects","name":"Mistform","description":"You become a translucent, humanoid-shaped cloud of fog that is difficult to damage. Non-elemental weapon and touch attacks cannot affect you while in a Mistform effect. Weapon or touch attacks with Fire, Ice, Lightning, Acid, Light, Darkness, or Greater modifiers affect you normally, as do non-weapon effects such as gaze, voice, gesture, and packets. While in Mistform you are effectively under a Slow effect (which means you cannot run), and you cannot speak, fight, call defenses except “Willpower” or “Resist,” actively use skills, or cast spells. The “Mist Form” spell lasts for 30 seconds, during which time you must hold your hands above your head and repeat “My body is mist” every few seconds."},{"group":"Specific Spell Effects","name":"Sense Magic","description":"When you call Divination’s “Sense Magic” effect, you seek to determine whether or not there is magical energy present within (and/or swirling around) a person, place, or thing. The proper source of this information is a Story Staff member—if you can find one nearby, you should ask them what your Sense Magic effect lets you perceive (as long as they are not otherwise occupied). If no Staff members are around, you can go to Logistics to ask the on-duty Story Staff member there for information… or you can wait, “pondering your visions,” until you find a better opportunity to ask for that information. And, as always, Staff members may choose to provide additional description regarding the nature, context, motion, and other attributes of any magic that you sense."},{"group":"Specific Spell Effects","name":"Restore Corpse","description":"Often associated with Necromancy, this effect instantly rebuilds enough of a corpse for it to have all the limbs and biological systems that it had in life. It does not return Life to the corpse, but it does fit enough pieces back together (or “regrows” them) to allow even a thoroughly dismembered corpse, if repaired and animated, to serve as a fully effective undead minion. (Note that it cannot restore any HP to undead creatures, though.) Because Restore Corpse rebuilds the throat, circulatory system, and gastrointestinal system of the dead body, too, it will allow anyone nearby to administer an Elixir-delivered effect to that corpse: generally, this is used to enable an Alchemical potion of resurrection to function on a beheaded or mutilated body."},{"group":"Core Mechanics","name":"Soulbound","description":"An item that is Soulbound is intrinsically, magically linked to your character’s spirit. Thus, you may exert a certain amount of control over it. A soulbound item has several properties related to how people can interact with it: • A Soulbound item cannot be stolen, destroyed, lost, or given away—even temporarily. Keep in mind, though, that losing the physical tag for a Soulbound item will still result in your being unable to use the item, and Twin Mask staff will be under no obligation to replace it. • A Soulbound item cannot be modified, destroyed, or wielded/worn without the consent of the owner, and that consent cannot be acquired via magical compulsion or control. This means a Soulbound spellbook cannot be opened, a Soulbound sword cannot be picked up, etc. This can never be used to weigh down, block, or impede another player or object; it is simply a way to provide clear guidelines for how people can and cannot interact with Soulbound items. Your weapons can, of course, still be Disarmed, etc. • The lone exception to the above rule is that a Soulbound spellbook may be left in a location to be interacted with by others for the purposes of communal reading or scribing—but such spellbooks and their associated scrolls still cannot be moved, stolen, destroyed, or modified beyond, for example, sitting on a table for anyone to page through. You need express, non-coerced permission from the owner of the spellbook to copy a spell from it! • Building Tags and Blue Research Tags, while they also cannot be stolen, are not Soulbound. They do not possess a link to your spirit, and thus you may not enact the mechanics above (such as limiting access or interaction) with buildings or blue research tags."},{"group":"Core Mechanics","name":"Attunement","description":"Attunement is the process of linking yourself to certain crafted items in a way that allows you to use them to their full potential: • The only items that require attunement are those that have “charges”: limited uses during a certain period of time. A Silver sword does not require attunement, but an item that gives 1 “Resist” (or 3 Resists) that “Return with: Rest” does. An item with both kinds of properties only requires attunement for its limited properties to be used. • When you first acquire an item that you are not attuned to, if it has a limited number of uses, it is considered to have 0 available charges. Every limited-use item will be considered to have all its charges expended when you first acquire it, no matter the source. • Once the item has remained in your possession for 30 uninterrupted minutes, you are considered “Attuned to” the item, and any previous holders are immediately no longer Attuned to it. If the item has charges available (such as an item that Returns with: Rest), you may now use those replenished charges. If the item has longer time limitations, such as “Returns with Sunrise/Sunset,” you must find out whether the item still had charges available before you attune to it. If you are unable to find this information, you must wait until its next normal recharge cycle, no matter how far away."},{"group":"Core Mechanics","name":"Concentration","description":"Many spells require “concentration” to cast or maintain. Concentration represents a heightened state of mental focus and strain as you mentally mold and shape the magical energies into whatever effect you are trying to accomplish. • While concentrating, you are limited to a slow pace of movement—no running! • If you or your armor take damage while concentrating, no matter how little, your concentration breaks and the spell you were trying to cast fails. • While concentrating, you may not use any skills, spells, or attacks other than the one you have actively been concentrating on. • While concentrating, you may not consume potions or trigger crafted items that have limited charges per rest, per sunrise/sunset, or per Twin Mask game. Crafted items that provide effects that require no activation function normally. • The mana for the spell you are attempting to cast is spent once the concentration finishes. For example, if a spell requires 30 seconds of concentration to cast, and you took 1 point of damage 15 seconds in, your concentration would be broken and you would need to spend another 30 seconds concentrating to successfully cast the spell, but you would have spent no mana. • Unless otherwise specified, a spell that requires concentration takes 1 second per level of the spell—1 second of concentration for a 1st-Circle spell, 4 seconds of concentration for a 4th-Circle spell, etc."}],"crafting":[{"table":"Blacksmith","tableType":"item","kind":"Item","name":"Basic Implement","level":1,"materials":[{"name":"Iron","qty":1},{"name":"Wood (Durable)","qty":1}],"effect":"Produces a basic tool with no game-mechanics effect, such a shovel"},{"table":"Blacksmith","tableType":"item","kind":"Item","name":"Animal Traps","level":1,"materials":[{"name":"Iron","qty":3}],"effect":"When you use the HUNTING skill to gain your Check-In materials at Logistics, you gain 1 additional Food (with 1-month expiration); each Animal Traps can only be used once per game, and each character may only benefit from one Animal Traps per game"},{"table":"Blacksmith","tableType":"item","kind":"Item","name":"Cooking Pot","level":1,"materials":[{"name":"Copper","qty":3},{"name":"Wood (Strong + Durable)","qty":1}],"effect":"Whenever you use a COOKING skill to make a food from the Cooking Craft Table, you produce 1 additional serving; you can only use 1 Cooking Pot per COOKING action"},{"table":"Blacksmith","tableType":"item","kind":"Item","name":"Gardener’s Tools","level":1,"materials":[{"name":"Iron","qty":2},{"name":"Wood (Strong + Durable)","qty":1},{"name":"Wood (Durable)","qty":1}],"effect":"When you use the HERBALISM skill to collect your Check-In materials at Logistics, you can convert 1 partially expended Herb Item Tag into a full Herb Item Tag with 1 herb property of your choice. Each Gardener’s Tools may only be used once per game, and each character may only benefit from one Gardener’s Tools per game"},{"table":"Blacksmith","tableType":"item","kind":"Item","name":"Mason’s Chisel","level":2,"materials":[{"name":"Iron","qty":3},{"name":"Wood (Strong + Durable)","qty":1}],"effect":"As you use an ENGINEERING skill to produce some-thing from the Engineering Craft Structure Table, you may reduce the total cost of that structure by up to 2 of any Rank-1 crafting materials (such as Stone, Bone, or Paper)"},{"table":"Blacksmith","tableType":"item","kind":"Item","name":"Surgeon’s Razor","level":2,"materials":[{"name":"Silver","qty":1},{"name":"Herb (Purification)","qty":1}],"effect":"Using the SURGERY skill takes 30 seconds less than it normally would"},{"table":"Blacksmith","tableType":"item","kind":"Item","name":"Surgeon’s Needle","level":2,"materials":[{"name":"Silver","qty":1},{"name":"Cloth","qty":1}],"effect":"Your TRAUMA PATCH skill restores +1 HP if you also have the SURGERY skill. Additionally, the FIELD SURGERY application of the SURGERY skill takes 30 seconds less, to a minimum of 1 minute"},{"table":"Blacksmith","tableType":"item","kind":"Item","name":"Repair Tools","level":2,"materials":[{"name":"Iron","qty":3},{"name":"Wood (Strong + Durable)","qty":1}],"effect":"You may use FIELD REPAIR twice per set of armor every 30 minutes instead of once"},{"table":"Blacksmith","tableType":"item","kind":"Item","name":"Masterwork Tools","level":3,"materials":[{"name":"Iron","qty":2},{"name":"Cloth","qty":1},{"name":"Wood (Strong + Durable)","qty":1}],"effect":"Using any Crafting skill other than COOKING or ENGINEERING takes 15 minutes less (this reduction is applied after other modifiers)"},{"table":"Blacksmith","tableType":"item","kind":"Item","name":"Whetstone","level":3,"materials":[{"name":"Stone","qty":4}],"effect":"Produces a tag with 5 uses; each use takes 30 seconds to apply to a weapon and bestows +1 damage for 30 minutes (see Bestowed Effects in chapter 5) Remember: attacks are capped at 10 damage"},{"table":"Blacksmith","tableType":"item","kind":"Item","name":"Throwing Snare","level":3,"materials":[{"name":"Stone","qty":3},{"name":"Cloth","qty":3},{"name":"Soft Pelt","qty":1}],"effect":"Up to three times, when you make an attack with the THROWN WEAPONS skill, you may call “Bind” instead of weapon damage, preventing your target from taking steps for 3 seconds. This ability has the “Returns With: Rest” property Note: DO NOT use any thrown weapon that incorporates actual rope or restricts movement"},{"table":"Blacksmith","tableType":"item","kind":"Item","name":"Music Box","level":4,"materials":[{"name":"Copper","qty":3},{"name":"Gold","qty":1},{"name":"Bone","qty":1},{"name":"Paper","qty":1}],"effect":"You may use a genre music box to play music that fulfills some or all of the “Bardic Talent” performance required for many Bard skills. All other requirements and mechanics of the Bardic Skills remain the same, including duration. (The music box must play genre-appropriate, immersive music. Characters that play modern or immersion-breaking songs may have their item tag confiscated.)"},{"table":"Blacksmith","tableType":"item","kind":"Property","name":"Lasting","level":1,"materials":[{"name":"Coal","qty":1},{"name":"Iron","qty":1},{"name":"Manganese","qty":1}],"effect":"The item endures for 1 additional year (these materials are used to produce steel)"},{"table":"Blacksmith","tableType":"item","kind":"Item","name":"Arsenal: Superior Equipment","level":1,"materials":[],"effect":"2 Economic Influence Cards Produces a non-expiring tag that can be attached to a non-Provisions Military Ally card; when that Ally is used in Maneuvers as part of a tabletop mod, it will both fight and defend more effectively"},{"table":"Weaponsmith","tableType":"item","kind":"Item","name":"Basic Weapon","level":0,"materials":[],"effect":"Produces any normal melee weapon, ready to have properties applied to it"},{"table":"Weaponsmith","tableType":"item","kind":"Item","name":"Basic Bandolier","level":0,"materials":[],"effect":"Can have WEAPONSMITH properties applied to it (as a Short Weapon), and holds THROWN WEAPONS; this bandolier allows you to treat all THROWN WEAPONS drawn from it as if they had its same properties"},{"table":"Weaponsmith","tableType":"item","kind":"Property","name":"Iron","level":0,"materials":[{"name":"Iron","qty":3}],"effect":"When you attack, you call “iron” along with weapon damage*; cannot be combined with Silver, Gold, or Elemental"},{"table":"Weaponsmith","tableType":"item","kind":"Property","name":"Silver","level":1,"materials":[{"name":"Silver","qty":3},{"name":"Sanctified Water","qty":1},{"name":"Herb (Purification)","qty":3}],"effect":"When you attack, you call “silver” along with weapon damage*; cannot be combined with Iron, Gold, or Elemental"},{"table":"Weaponsmith","tableType":"item","kind":"Property","name":"Gold","level":1,"materials":[{"name":"Gold","qty":3},{"name":"Sanctified Water","qty":1},{"name":"Herb (Purification)","qty":3}],"effect":"When you attack, you call “gold” along with weapon damage*; cannot be combined with Iron, Silver, or Elemental"},{"table":"Weaponsmith","tableType":"item","kind":"Property","name":"Weapon-Casting","level":1,"materials":[{"name":"Mercury","qty":1},{"name":"Silver","qty":1},{"name":"Herb (Enhancement)","qty":1}],"effect":"Equivalent of having the WEAPON CASTING skill, but only with this weapon"},{"table":"Weaponsmith","tableType":"item","kind":"Property","name":"Battering","level":1,"materials":[{"name":"Coal","qty":1},{"name":"Stone","qty":1},{"name":"Iron","qty":1},{"name":"Marble","qty":1},{"name":"Manganese","qty":1},{"name":"Herb (Enchantment)","qty":2},{"name":"Herb (Enhancement)","qty":2}],"effect":"Up to twice, when you hit a target with this weapon, you may call “Stun” instead of weapon damage, knocking them reeling for 3 seconds; this ability has the “Returns With: Rest” property"},{"table":"Weaponsmith","tableType":"item","kind":"Property","name":"Massive","level":1,"materials":[{"name":"Iron","qty":4}],"effect":"Can only be applied to a Two-Handed Weapon; this weapon adds 1 extra damage to all attacks, but only while it is being actively wielded in two hands. This stacks with “Lethal.” (remember: attacks are capped at 10 damage)"},{"table":"Weaponsmith","tableType":"item","kind":"Property","name":"Ambidextrous","level":1,"materials":[{"name":"Mercury","qty":2},{"name":"Salt","qty":2}],"effect":"Can only be applied to a Short Weapon; equivalent to having TWO-WEAPON FIGHTING, but only while actively wielding this weapon"},{"table":"Weaponsmith","tableType":"item","kind":"Property","name":"Lasting","level":1,"materials":[{"name":"Coal","qty":1},{"name":"Iron","qty":1},{"name":"Manganese","qty":1}],"effect":"The weapon endures for 1 additional year (these materials are used to produce steel)"},{"table":"Weaponsmith","tableType":"item","kind":"Property","name":"Crushing","level":2,"materials":[{"name":"Stone","qty":3},{"name":"Iron","qty":2},{"name":"Marble","qty":2},{"name":"Manganese","qty":1},{"name":"Demon Blood","qty":1},{"name":"Herb (Enchantment)","qty":2},{"name":"Herb (Enhancement)","qty":2},{"name":"Herb (Entropic)","qty":4}],"effect":"Up to twice, when you hit a target’s arm or leg with this weapon, you may call “Break Arm” or “Break Leg” instead of weapon damage, rendering that specific limb useless until it can be re-set; this ability has the “Returns With: Rest” property"},{"table":"Weaponsmith","tableType":"item","kind":"Property","name":"Elemental","level":2,"materials":[{"name":"Coal","qty":6},{"name":"Mercury","qty":2},{"name":"Sulfur","qty":2},{"name":"Spell Crystal","qty":1},{"name":"Herb (Enhancement)","qty":2},{"name":"Herb (Entropic)","qty":3}],"effect":"Choose Fire, Ice, Lightning, or Acid at time of creation; when you attack, you call that element along with weapon damage*; cannot be combined with Iron, Silver, or Gold"},{"table":"Weaponsmith","tableType":"item","kind":"Property","name":"Sentinel","level":2,"materials":[{"name":"Salt","qty":1},{"name":"Iron","qty":1},{"name":"Manganese","qty":1},{"name":"Soul Gem","qty":1},{"name":"Celestial Blood","qty":1},{"name":"Sanctified Water","qty":1},{"name":"Herb (Enhancement)","qty":2},{"name":"Herb (Stimulant)","qty":2}],"effect":"Up to twice, while wielding this weapon, you may call “Parry” to cancel an attack, just as though you had used the PARRY skill; this ability has the “Returns With: Rest” property"},{"table":"Weaponsmith","tableType":"item","kind":"Property","name":"Lethal","level":2,"materials":[{"name":"Coal","qty":2},{"name":"Iron","qty":2},{"name":"Manganese","qty":2}],"effect":"This weapon adds 1 extra damage to all attacks (remember: attacks are capped at 10 damage)"},{"table":"Weaponsmith","tableType":"item","kind":"Property","name":"Life-Drinking","level":2,"materials":[{"name":"Obsidian","qty":1},{"name":"Soul Gem","qty":1},{"name":"Demon Blood","qty":1},{"name":"Zye Blood Parasite","qty":2},{"name":"Herb (Entropic)","qty":4},{"name":"Herb (Spiritual)","qty":4}],"effect":"Up to three times, when you hit a target with this weapon, you may call “Drain 3” instead of weapon damage, damaging their HP directly and transferring it to you; this ability has the “Returns With: Rest” property, and is not affected by bonuses to damage (like “Lethal”)"},{"table":"Weaponsmith","tableType":"item","kind":"Item","name":"Arsenal: Iron Weapons","level":1,"materials":[],"effect":"1 Economic Influence Card Produces a non-expiring tag that can be attached to a non-Provisions Military Ally card; when that Ally is used in Maneuvers as part of a tabletop mod, it will fight much more effectively against Fae enemies"},{"table":"Weaponsmith","tableType":"item","kind":"Item","name":"Arsenal: Silver Weapons","level":1,"materials":[],"effect":"1 Economic Influence Card Identical to “Iron Weapons,” but effective against Demon enemies rather than Fae*"},{"table":"Weaponsmith","tableType":"item","kind":"Item","name":"Arsenal: Gold Weapons","level":1,"materials":[],"effect":"2 Economic Influence Cards Identical to “Iron Weapons,” but effective against Celestial enemies rather than Fae*"},{"table":"Weaponsmith","tableType":"item","kind":"Item","name":"Arsenal: Superior Weapons","level":1,"materials":[],"effect":"2 Economic Influence Cards Produces a non-expiring tag that can be attached to a non-Provisions Military Ally card; when that Ally is used in Maneuvers as part of a tabletop mod, it will fight much more effectively against all enemies *Note that, if your weapon can produce multiple damage types (like silver and fire), choose only one to call for each swing."},{"table":"Armorsmith","tableType":"item","kind":"Item","name":"Basic Heavy Armor","level":0,"materials":[],"effect":"Produces a normal type of heavy armor, with an Armor Value of 15, ready to have properties applied to it; it is impossible to wear (and benefit from) more than 1 Armor at a time"},{"table":"Armorsmith","tableType":"item","kind":"Property","name":"Lasting","level":1,"materials":[{"name":"Coal","qty":1},{"name":"Iron","qty":1},{"name":"Manganese","qty":1}],"effect":"The armor endures for 1 additional year (these materials are used to produce steel)"},{"table":"Armorsmith","tableType":"item","kind":"Property","name":"Reinforced","level":1,"materials":[{"name":"Coal","qty":2},{"name":"Iron","qty":2},{"name":"Manganese","qty":2}],"effect":"Increases this armor’s Armor Value by 5"},{"table":"Armorsmith","tableType":"item","kind":"Property","name":"Spellcasting","level":1,"materials":[{"name":"Quartz","qty":1},{"name":"Silver","qty":1},{"name":"Herb (Enhancement)","qty":1}],"effect":"For purposes of allowing spellcasting, you may act as though you were not wearing this armor"},{"table":"Armorsmith","tableType":"item","kind":"Property","name":"Spirit Protection","level":1,"materials":[{"name":"Coal","qty":1},{"name":"Mercury","qty":2},{"name":"Silver","qty":2},{"name":"Sanctified Water","qty":1},{"name":"Herb (Purification)","qty":1}],"effect":"Up to three times, you may call “Resist” to prevent a Drain effect that hits you; this ability has the “Returns With: Rest” property"},{"table":"Armorsmith","tableType":"item","kind":"Property","name":"Glyph-Guarded","level":1,"materials":[{"name":"Salt","qty":1},{"name":"Quartz","qty":1},{"name":"Ritual Component","qty":1},{"name":"Herb (Enhancement)","qty":1}],"effect":"You may call “Resist” to prevent one Break Limb effect that hits you; this ability has the “Returns With: Rest” property"},{"table":"Armorsmith","tableType":"item","kind":"Property","name":"Physically Resistant","level":2,"materials":[{"name":"Coal","qty":4},{"name":"Iron","qty":2},{"name":"Manganese","qty":2}],"effect":"You may call “Resist” to prevent any one weapon attack that hits you; this ability has the “Returns With: Rest” property"},{"table":"Armorsmith","tableType":"item","kind":"Property","name":"Wakethorn","level":2,"materials":[{"name":"Obsidian","qty":1},{"name":"Bone","qty":5},{"name":"Herb (Entropic)","qty":3},{"name":"Herb (Stimulant)","qty":3},{"name":"Wood (Flexible)","qty":4}],"effect":"Whenever you would take a Sleep effect, you may call “Resist” and take 2 damage directly to your HP and a Stun effect instead; if the Stun effect is prevented or not taken for any reason, this ability fails"},{"table":"Armorsmith","tableType":"item","kind":"Property","name":"Mindshatter","level":2,"materials":[{"name":"Quartz","qty":2},{"name":"Silver","qty":2},{"name":"Fae Blood","qty":1},{"name":"Herb (Hallucination)","qty":3}],"effect":"You may call “Resist” to prevent one Dominate effect; this ability has the “Returns With: Rest” property. Whenever you Dodge, Parry, Willpower, or Resist a Dominate effect, you gain a single use of the BREAK LIMB skill that must be used within 3 seconds."},{"table":"Armorsmith","tableType":"item","kind":"Property","name":"Rageguard","level":2,"materials":[{"name":"Mercury","qty":3},{"name":"Zye Blood Parasite","qty":1},{"name":"Herb (Entropic)","qty":3},{"name":"Herb (Stimulant)","qty":3}],"effect":"You may call “Resist” to prevent one Berserk effect; this ability has the “Returns With: Rest” property. Whenever you Dodge, Parry, Willpower, or Resist a Berserk effect, you gain a single use of the BATTLE RAGE skill that must be used within 3 seconds."},{"table":"Armorsmith","tableType":"item","kind":"Property","name":"Deathward","level":2,"materials":[{"name":"Gold","qty":1},{"name":"Feather","qty":4},{"name":"Celestial Blood","qty":2},{"name":"Sanctified Water","qty":2},{"name":"Herb (Rejuvenation)","qty":3},{"name":"Herb (Spiritual)","qty":3}],"effect":"You may call “Resist” to prevent one Death effect; this ability has the “Returns With: Rest” property. Whenever you Dodge, Parry, Willpower, or Resist a Death effect, you may call “Lesser Death” instead of damage for your next weapon attack within 3 seconds"},{"table":"Armorsmith","tableType":"item","kind":"Item","name":"Arsenal: Full Armor","level":1,"materials":[],"effect":"3 Economic Influence Cards Produces a non-expiring tag that can be attached to a non-Provisions Military Ally card; when that Ally is used in Maneuvers as part of a tabletop mod, it is much more likely to survive"},{"table":"Shieldsmith","tableType":"item","kind":"Item","name":"Basic Shield","level":0,"materials":[],"effect":"Produces a normal shield of any legal size; it is impossible to equip (and benefit from) more than 1 shield at a time"},{"table":"Shieldsmith","tableType":"item","kind":"Property","name":"Perfect Grip","level":1,"materials":[{"name":"Iron","qty":3},{"name":"Soft Pelt","qty":1},{"name":"Wood (Flexible + Durable)","qty":1}],"effect":"You may call “no effect” when others try to use Disarm effects on this shield"},{"table":"Shieldsmith","tableType":"item","kind":"Property","name":"Spellcasting","level":1,"materials":[{"name":"Quartz","qty":1},{"name":"Silver","qty":1},{"name":"Herb (Enhancement)","qty":1}],"effect":"For purposes of allowing spellcasting, you may act as though you were not wielding this shield"},{"table":"Shieldsmith","tableType":"item","kind":"Property","name":"Savior","level":1,"materials":[{"name":"Iron","qty":1},{"name":"Mercury","qty":1},{"name":"Manganese","qty":1}],"effect":"You gain the GUARDIAN skill, but only while you are actively wielding this shield"},{"table":"Shieldsmith","tableType":"item","kind":"Property","name":"Lasting","level":1,"materials":[{"name":"Coal","qty":1},{"name":"Iron","qty":1},{"name":"Manganese","qty":1}],"effect":"The shield endures for 1 additional year (these materials are used to produce steel)"},{"table":"Shieldsmith","tableType":"item","kind":"Property","name":"Unbreakable","level":2,"materials":[{"name":"Salt","qty":1},{"name":"Quartz","qty":1},{"name":"Mercury","qty":1},{"name":"Ritual Component","qty":1},{"name":"Herb (Enhancement)","qty":1}],"effect":"You may call “no effect” when others hit your shield with destroy or BREAK SHIELD effects"},{"table":"Shieldsmith","tableType":"item","kind":"Property","name":"Elemental Blocking","level":2,"materials":[{"name":"Mercury","qty":1},{"name":"Sulfur","qty":1},{"name":"Herb (Enhancement)","qty":1},{"name":"Wood (Dense + Durable + Strong)","qty":1}],"effect":"Choose Fire, Ice, Lightning, or Acid at time of creation; when this shield is hit by a packet-delivered attack of that element, you take 0 damage from it"},{"table":"Shieldsmith","tableType":"item","kind":"Property","name":"Spell Reflecting","level":2,"materials":[{"name":"Coal","qty":1},{"name":"Salt","qty":1},{"name":"Quartz","qty":1},{"name":"Copper","qty":2},{"name":"Manganese","qty":1},{"name":"Spell Crystal","qty":1},{"name":"Herb (Enhancement)","qty":1}],"effect":"You may call “Resist” and then return one non-Greater packet-delivered attack that hits this shield; you call “Resist, By My Gesture: [Original Packet Call]” to reflect it against its caster; this ability has the “Returns With: Rest” property and doesn’t require an open hand"},{"table":"Shieldsmith","tableType":"item","kind":"Property","name":"Anchor-Weight","level":2,"materials":[{"name":"Coal","qty":4},{"name":"Iron","qty":2},{"name":"Manganese","qty":2}],"effect":"You may call “Resist” to prevent up to 3 Attract or Repel effects; this ability has the “Returns With: Rest” property"},{"table":"Shieldsmith","tableType":"item","kind":"Property","name":"Kinetic","level":3,"materials":[{"name":"Salt","qty":2},{"name":"Sulfur","qty":2},{"name":"Obsidian","qty":1},{"name":"Wood (Dense + Flexible + Strong)","qty":2}],"effect":"Up to three times, when you block a weapon attack with this shield, you can store that energy and release it through your weapon; your next melee weapon attack within 3 seconds uses the numerical damage value—totally unmodified—of the attack you blocked. This ability has the “Returns With: Rest” property and has no effect on attacks that do not deal numerical damage."},{"table":"Shieldsmith","tableType":"item","kind":"Property","name":"Mirroring","level":4,"materials":[{"name":"Silver","qty":2},{"name":"Glass","qty":2},{"name":"Sanctified Water","qty":1},{"name":"Herb (Purification)","qty":3},{"name":"Wood (Durable + Dense + Lightweight)","qty":1}],"effect":"This shield reflects all gaze attacks; whenever you would be hit by a gaze-delivered attack, you may call “Resist – reflect gaze,” then call the same effect against your attacker; you should role-play the process of your shield reflecting the attack"},{"table":"Locksmith","tableType":"item","kind":"Item","name":"Lock","level":0,"materials":[{"name":"Coal","qty":2},{"name":"Iron","qty":1},{"name":"Manganese","qty":1}],"effect":"(plus cost of Keys chosen; see below) Produces a Lock that cannot be opened without keys made specifically for it; those keys are produced as part of the action taken to make the Lock; also, when you make a Lock, note your current skill level [Apprentice to Grandmaster] in LOCKSMITHING, which determines its LOCKPICKING difficulty"},{"table":"Locksmith","tableType":"item","kind":"Item","name":"Shackles","level":0,"materials":[{"name":"Iron","qty":3}],"effect":"(plus cost of Keys chosen; see below) Produces a set of shackles that can lock together any two limbs of a subject; otherwise, same as Lock (above)"},{"table":"Locksmith","tableType":"item","kind":"Item","name":"Keys","level":0,"materials":[{"name":"Iron","qty":1},{"name":"Silver","qty":1},{"name":"Gold","qty":1}],"effect":"Produces 2 keys that open the Lock they are built for, as part of the action of producing that Lock; alternatively, you can make 2 copies of a key in your possession; keys will match whatever metal was used to make them, which (for duplicates) must match the original"},{"table":"Locksmith","tableType":"item","kind":"Item","name":"Lockpick","level":0,"materials":[{"name":"Iron","qty":1},{"name":"Silver","qty":1},{"name":"Gold","qty":1}],"effect":"Produces a lockpick of whatever metal you chose as its material; will work on any Lock, but may fall prey to different Trap Mechanisms (see below); used in combination with the LOCKPICKING skills"},{"table":"Locksmith","tableType":"item","kind":"Item","name":"Explosive Key","level":3,"materials":[{"name":"Sulfur","qty":2},{"name":"Glass","qty":1},{"name":"Spell Crystal","qty":1},{"name":"Herb (Entropic)","qty":1}],"effect":"Produces 1 special-looking key that, when inserted into a lock, simply destroys the lock and itself"},{"table":"Locksmith","tableType":"item","kind":"Property","name":"Complex","level":1,"materials":[{"name":"Iron","qty":1}],"effect":"This property can be applied only to Locks or Shackles; this Lock or Shackles take an additional 3 minutes to pick"},{"table":"Locksmith","tableType":"item","kind":"Property","name":"Iron Trap Mechanism","level":2,"materials":[{"name":"Iron","qty":3},{"name":"Sulfur","qty":1},{"name":"Herb (Entropic)","qty":3}],"effect":"This property can be applied only to Locks or Shackles; when a non-iron key or a non-iron lockpick is inserted into this item, that key or lockpick is destroyed"},{"table":"Locksmith","tableType":"item","kind":"Property","name":"Silver Trap Mechanism","level":2,"materials":[{"name":"Sulfur","qty":1},{"name":"Silver","qty":3},{"name":"Herb (Entropic)","qty":3}],"effect":"This property can be applied only to Locks or Shackles; when a non-silver key or a non-silver lockpick is inserted into this item, that key or lockpick is destroyed"},{"table":"Locksmith","tableType":"item","kind":"Property","name":"Gold Trap Mechanism","level":2,"materials":[{"name":"Sulfur","qty":1},{"name":"Gold","qty":3},{"name":"Herb (Entropic)","qty":3}],"effect":"This property can be applied only to Locks or Shackles; when a non-gold key or a non-gold lockpick is inserted into this item, that key or lockpick is destroyed"},{"table":"Locksmith","tableType":"item","kind":"Property","name":"Glyph-Guarded","level":2,"materials":[{"name":"Salt","qty":1},{"name":"Quartz","qty":1},{"name":"Mercury","qty":1},{"name":"Ritual Component","qty":1},{"name":"Herb (Enhancement)","qty":1}],"effect":"This property can be applied only to Locks or Shackles; this item is immune to Explosive Keys, physical attacks, and all but the most powerful destructive spells CRAFTING —"},{"table":"Enchanting","tableType":"item","kind":"Item","name":"Enchantment-Ready Ornament","level":0,"materials":[],"effect":"Produces an ornament or object (such as a trinket, belt, ring, charm, necklace, earring, diadem, hat, pair of boots, etc.) that is ready to be enchanted with properties; it must be openly worn (or held) to provide its effect"},{"table":"Enchanting","tableType":"item","kind":"Item","name":"Secure Tome","level":1,"materials":[{"name":"Quartz","qty":1},{"name":"Soft Pelt","qty":1},{"name":"Herb (Enchantment)","qty":2},{"name":"Herb (Spiritual)","qty":2},{"name":"Wood (Durable)","qty":1},{"name":"Paper","qty":2}],"effect":"Can be filled with up to 10 craft recipes or rituals; they become Soulbound: they cannot be stolen, given away, or damaged once committed to this book, unless you choose to break it apart; when a recipe is added, you are immediately attuned to it *"},{"table":"Enchanting","tableType":"item","kind":"Item","name":"Traveling Spellbook or Scroll Case","level":1,"materials":[{"name":"Quartz","qty":1},{"name":"Bone","qty":2},{"name":"Herb (Enchantment)","qty":2},{"name":"Herb (Spiritual)","qty":2},{"name":"Wood (Flexible + Lightweight)","qty":1},{"name":"Paper","qty":2}],"effect":"Can be filled with up to 10 spell scrolls; they become Soulbound: they cannot be stolen, given away, or damaged once committed to this receptacle, unless you choose to break it apart; when a scroll is added, you are immediately attuned to it*"},{"table":"Enchanting","tableType":"item","kind":"Item","name":"Specialist’s Spellbook or Scroll Case","level":1,"materials":[{"name":"Quartz","qty":1},{"name":"Bone","qty":2},{"name":"Soft Pelt","qty":1},{"name":"Herb (Enchantment)","qty":2},{"name":"Herb (Spiritual)","qty":2},{"name":"Wood (Flexible + Lightweight)","qty":2},{"name":"Paper","qty":2}],"effect":"Can be filled with any number of spell scrolls from a single Magical Art; they become Soulbound: they cannot be stolen, given away, or damaged once committed to this receptacle, unless you choose to break it apart; when a scroll is added, you are immediately attuned to it*"},{"table":"Enchanting","tableType":"item","kind":"Item","name":"Master Spellbook or Scroll Case","level":2,"materials":[{"name":"Soul Gem","qty":1},{"name":"Bone","qty":2},{"name":"Soft Pelt","qty":2},{"name":"Cloth","qty":2},{"name":"Herb (Enchantment)","qty":5},{"name":"Herb (Spiritual)","qty":5},{"name":"Wood (Flexible + Lightweight)","qty":3},{"name":"Paper","qty":2}],"effect":"Can be filled with any spell scrolls; they become Soulbound: they cannot be stolen, given away, or damaged once committed to this receptacle, unless you choose to break it apart; when a scroll is added, you are immediately attuned to it*"},{"table":"Enchanting","tableType":"item","kind":"Property","name":"Illuminating","level":1,"materials":[{"name":"Salt","qty":3},{"name":"Quartz","qty":1},{"name":"Glass","qty":1},{"name":"Herb (Purification)","qty":2},{"name":"Herb (Spiritual)","qty":2}],"effect":"The enchanted object emits light, either constantly or at your command; see the “Light Sources” policy for more details"},{"table":"Enchanting","tableType":"item","kind":"Property","name":"Intuitive","level":1,"materials":[{"name":"Bone","qty":1},{"name":"Demon Blood","qty":1},{"name":"Herb (Hallucination)","qty":1},{"name":"Herb (Purification)","qty":1}],"effect":", Any 1 Spell Scroll You may read any spell scroll, even if you do not possess the relevant LORE skill… but you still cannot cast that spell if you do not have the correct MAGIC skill"},{"table":"Enchanting","tableType":"item","kind":"Property","name":"Lasting","level":1,"materials":[{"name":"Coal","qty":1},{"name":"Iron","qty":1},{"name":"Manganese","qty":1}],"effect":"The item endures for 1 additional year (these materials are used to produce steel)"},{"table":"Enchanting","tableType":"item","kind":"Property","name":"Geometer","level":2,"materials":[{"name":"Coal","qty":2},{"name":"Stone","qty":2},{"name":"Marble","qty":2},{"name":"Obsidian","qty":1},{"name":"Bone","qty":2}],"effect":"You may pick up and move one of your ward stones while it is actively forming a warding line, as long as you constantly keep it within your arm-span’s length of another ward stone"},{"table":"Enchanting","tableType":"item","kind":"Property","name":"Poisoned Ring","level":2,"materials":[{"name":"Silver","qty":2},{"name":"Bone","qty":2},{"name":"Herb (Poisonous)","qty":5}],"effect":"Can only be formed as a ring. You may touch a person who is not currently in combat, and not intensely wary of you, with your ring-bearing hand and call “Poison.” This ability has the “Returns With: Rest” property"},{"table":"Enchanting","tableType":"item","kind":"Property","name":"Antidote Ring","level":2,"materials":[{"name":"Silver","qty":2},{"name":"Mercury","qty":1},{"name":"Herb (Enhancement)","qty":1},{"name":"Herb (Entropy)","qty":1},{"name":"Herb (Stimulant)","qty":1}],"effect":"Can only be formed as a ring. You may touch yourself or another person with your ring-bearing hand and call “Remove Poison” to end all Poison effects on them. This ability has the “Returns With: Rest” property."},{"table":"Enchanting","tableType":"item","kind":"Property","name":"Wakeful","level":2,"materials":[{"name":"Mercury","qty":1},{"name":"Spell Crystal","qty":1},{"name":"Feather","qty":1},{"name":"Ritual Component","qty":1},{"name":"Herb (Stimulant)","qty":2}],"effect":"Up to three times, you may call “Resist” to prevent a Sleep effect that hits you; this ability has the “Returns With: Rest” property. A character cannot be attuned to more than one item with the “Wakeful” property."},{"table":"Enchanting","tableType":"item","kind":"Property","name":"Flowing","level":2,"materials":[{"name":"Copper","qty":1},{"name":"Mercury","qty":2},{"name":"Spell Crystal","qty":1},{"name":"Ritual Component","qty":1},{"name":"Herb (Enhancement)","qty":1},{"name":"Herb (Entropic)","qty":1},{"name":"Herb (Stimulant)","qty":3}],"effect":"Up to three times, you may call “Resist” to prevent a Stun OR Paralyze effect that hits you; this ability has the “Returns With: Rest” property. A character cannot be attuned to more than one item with the “Flowing” property."},{"table":"Enchanting","tableType":"item","kind":"Property","name":"Magically Resistant","level":2,"materials":[{"name":"Coal","qty":1},{"name":"Salt","qty":1},{"name":"Quartz","qty":1},{"name":"Copper","qty":2},{"name":"Manganese","qty":1},{"name":"Spell Crystal","qty":1},{"name":"Herb (Enhancement)","qty":1}],"effect":"You may call “Resist” to prevent any one non-weapon attack that hits you; this ability has the “Returns With: Rest” property. A character cannot be attuned to more than one item with the “Magically Resistant” property."},{"table":"Enchanting","tableType":"item","kind":"Property","name":"Mind-Shielding","level":3,"materials":[{"name":"Mercury","qty":2},{"name":"Gold","qty":3},{"name":"Soft Pelt","qty":1},{"name":"Celestial Blood","qty":1},{"name":"Herb (Enhancement)","qty":1},{"name":"Herb (Purification)","qty":1}],"effect":"Up to three times, you may call “Resist” to prevent a Dominate effect that hits you; this ability has the “Returns With: Rest” property. A character cannot be attuned to more than one item with the “Mind-Shielding” property."},{"table":"Enchanting","tableType":"item","kind":"Property","name":"Calm","level":3,"materials":[{"name":"Salt","qty":1},{"name":"Mercury","qty":1},{"name":"Sulfur","qty":1},{"name":"Soul Gem","qty":1},{"name":"Bone","qty":3},{"name":"Demon Blood","qty":2},{"name":"Ritual Component","qty":1},{"name":"Herb (Sedative)","qty":5}],"effect":"Up to three times, you may call “Resist” to prevent a Berserk effect that hits you; this ability has the “Returns With: Rest” property. A character cannot be attuned to more than one item with the “Calm” property."},{"table":"Enchanting","tableType":"item","kind":"Property","name":"Life-Anchored","level":4,"materials":[{"name":"Salt","qty":1},{"name":"Mercury","qty":2},{"name":"Sulfur","qty":1},{"name":"Silver","qty":1},{"name":"Soul Gem","qty":1},{"name":"Bone","qty":1},{"name":"Celestial Blood","qty":3},{"name":"Ritual Component","qty":1},{"name":"Herb (Rejuvenation)","qty":1}],"effect":"Up to three times, you may call “Resist” to prevent a Death effect that hits you; this ability has the “Returns With: Rest” property. A character cannot be attuned to more than one item with the “Life-Anchored” property. *Spellbooks, scroll cases, and tomes are Soulbound—enchanted to be directly connected to you—and cannot be stolen. As such, for logistical rule-enforcement reasons, they must prominently display their ENCHANTING Item tags: 1) on the inside cover of books, or 2) clearly connected to the cap of scroll cases. Additionally, they cannot contain ANY other objects or item tags, except for purely decorative drawings or writings with no mechanical significance. Tucking random money, influence, item tags, or other things into such a scroll case or book is a form of cheating, and it will be dealt with harshly. Scrolls, recipes, and rituals cannot be removed from these items once committed… however, exclusively for purposes of SCROLL SCRIBING, you can loan such a document to a scribe for as long as it takes to copy. [This exception is basically an out-of-character concession to the fact that scribes must gather scrolls and take them to Logistics to make copies. For in-game purposes, your scroll is still bound in your book or case and cannot be stolen.] Once a document is committed to one of these items, it cannot be removed unless you destroy the magic holding together your scroll case or book (and rip up the ENCHANTING Item tag) to release all documents that it once held. (When your character dies, too, you have the option to unbind your book or case and make its contents available to others.)"},{"table":"Artificing","tableType":"item","kind":"Item","name":"Hand-Held Artifact","level":0,"materials":[],"effect":"Produces an item that can have magical properties (below) added to it; for it to work, it must be held in one’s hand, and you cannot benefit from two or more at once. With the exception of staves, these artifacts cannot be used as weapons, shields, or armor."},{"table":"Artificing","tableType":"item","kind":"Property","name":"Dichotomous","level":1,"materials":[{"name":"Demon Blood","qty":1},{"name":"Celestial Blood","qty":1},{"name":"Herb (Entropic)","qty":3},{"name":"Herb (Healing)","qty":3}],"effect":"You can concentrate for 3 seconds, then choose “Light” or “Darkness” to imbue your next weapon attack (within 3 seconds) with that element"},{"table":"Artificing","tableType":"item","kind":"Property","name":"Passing","level":1,"materials":[{"name":"Feathers","qty":3},{"name":"Glass","qty":1},{"name":"Sanctified Water","qty":1},{"name":"Herb (Enchantment)","qty":3},{"name":"Herb (Purification)","qty":3}],"effect":"Up to twice, you may concentrate and call “Pass Ward” to cross over a SINGLE warding line or glyph without suffering its effects. You must maintain concentration during this effect; this ability has the “Returns With: Rest” property"},{"table":"Artificing","tableType":"item","kind":"Property","name":"Arcane Detection","level":1,"materials":[{"name":"Salt","qty":2},{"name":"Quartz","qty":1},{"name":"Cloth","qty":1},{"name":"Ritual Component","qty":1},{"name":"Wood (Dense + Flexible)","qty":2}],"effect":"By concentrating within 3 inches of a target, you may call “Sense Magic” to determine if there is magic present in or around it; this ability has the “Returns With: Rest” property"},{"table":"Artificing","tableType":"item","kind":"Property","name":"Lasting","level":1,"materials":[{"name":"Coal","qty":1},{"name":"Iron","qty":1},{"name":"Manganese","qty":1}],"effect":"The artifact endures for 1 additional year (these materials are used to produce steel)"},{"table":"Artificing","tableType":"item","kind":"Property","name":"Living","level":2,"materials":[{"name":"Soul Gem","qty":1},{"name":"Bone","qty":1},{"name":"Feathers","qty":1},{"name":"Wood (Dense + Durable + Strong)","qty":1},{"name":"Wood (Flexible + Lightweight)","qty":1}],"effect":"You may use CHANNELING spells as though you were in constant contact with a tree; this item must incorporate (or appear to incorporate) a living plant in its design"},{"table":"Artificing","tableType":"item","kind":"Property","name":"Detective","level":2,"materials":[{"name":"Quartz","qty":2},{"name":"Silver","qty":1},{"name":"Cloth","qty":1},{"name":"Zye Scarab","qty":1},{"name":"Herb (Hallucination)","qty":3},{"name":"Herb (Spiritual)","qty":3}],"effect":"If you have the LORE: DIVINATION skill, you may spend 5 mana to choose one of the following skills and use it for the next 3 minutes: EXAMINE WOUNDS, DETECT POISON, DETECT DISEASE, DETECT DISGUISE, or ALCHEMICAL EXAMINATION. (You must follow all time and RP-related requirements of the skill you use)"},{"table":"Artificing","tableType":"item","kind":"Property","name":"Power-Focus","level":2,"materials":[{"name":"Quartz","qty":2},{"name":"Mercury","qty":1},{"name":"Sulfur","qty":1}],"effect":"When you use a MAGIC skill to cast a spell that deals direct numerical damage (to HP), add +1 to that damage; this does not affect Drain effects; this bonus is instead +2 if the spell is delivered by Packet (not Weapon) and you spent at least 2 mana on it (remember: attacks are capped at 10 damage)"},{"table":"Artificing","tableType":"item","kind":"Property","name":"Healing","level":2,"materials":[{"name":"Bone","qty":2},{"name":"Celestial Blood","qty":2},{"name":"Sanctified Water","qty":1},{"name":"Herb (Healing)","qty":5},{"name":"Wood (Dense + Strong)","qty":1}],"effect":"While touching any living thing, you can call “Heal 3” to restore 3 HP to that target; this ability has the “Returns With: Rest” property"},{"table":"Artificing","tableType":"item","kind":"Property","name":"Spell Reflecting","level":2,"materials":[{"name":"Quartz","qty":1},{"name":"Spell Crystal","qty":1},{"name":"Soft Pelt","qty":1},{"name":"Ritual Component","qty":1},{"name":"Wood (Lightweight)","qty":1}],"effect":"You may call “Resist” and then return one non-Greater packet-delivered attack that hits you; you call “Resist, By My Gesture: [Original Packet Call]” against its caster; this ability has the “Returns With: Rest” property and doesn’t require an open hand"},{"table":"Artificing","tableType":"item","kind":"Property","name":"Dueling","level":2,"materials":[{"name":"Coal","qty":1},{"name":"Salt","qty":1},{"name":"Copper","qty":2},{"name":"Manganese","qty":1},{"name":"Spell Crystal","qty":1},{"name":"Herb (Enhancement)","qty":1}],"effect":"This item ONLY functions if you are currently part of a duel that has been initiated with the INVOKE CHALLENGE skill; it ceases functioning immediately upon the duel’s concluding or breaking. Whenever you cast a spell that does numerical damage to HP, add +2 to that damage; this can stack with “Power-Focus” but does not affect Drain effects. (remember: attacks are capped at 10 damage.)"},{"table":"Artificing","tableType":"item","kind":"Property","name":"Stitching","level":3,"materials":[{"name":"Sulfur","qty":1},{"name":"Bone","qty":1},{"name":"Demon Blood","qty":1},{"name":"Child’s Tears","qty":1},{"name":"Herb (Poisonous)","qty":2},{"name":"Herb (Rejuvenation)","qty":2}],"effect":"While touching any corpse, you may concentrate for 3 seconds and then call “Restore Corpse,” magically rebuilding its limbs and biological systems; this ability has the “Returns With: Rest” property"},{"table":"Artificing","tableType":"item","kind":"Property","name":"Translucent","level":3,"materials":[{"name":"Mercury","qty":1},{"name":"Spell Crystal","qty":1},{"name":"Feathers","qty":1},{"name":"Fae Blood","qty":1},{"name":"Glass","qty":1},{"name":"Ritual Component","qty":1}],"effect":"After concentrating for 3 seconds, you may call “my body is mist” in order to produce a Mistform effect on yourself, lasting for up to 30 seconds; this ability has the “Returns With: Rest” property"},{"table":"Artificing","tableType":"item","kind":"Property","name":"Free-Willed","level":3,"materials":[{"name":"Coal","qty":1},{"name":"Quartz","qty":1},{"name":"Obsidian","qty":1},{"name":"Honey","qty":2},{"name":"Celestial Blood","qty":1},{"name":"Fae Blood","qty":1},{"name":"Herb (Hallucination)","qty":8}],"effect":"You may touch any person affected by the Dominate status and call “Remove Dominate” to immediately clear that effect; this ability has the “Returns With: Rest” property"},{"table":"Artificing","tableType":"item","kind":"Property","name":"Olive-Branch","level":3,"materials":[{"name":"Salt","qty":1},{"name":"Marble","qty":1},{"name":"Soul Gem","qty":1},{"name":"Soft Pelt","qty":1},{"name":"Demon Blood","qty":1},{"name":"Cloth","qty":1},{"name":"Zye Blood Parasite","qty":1},{"name":"Herb (Sedative)","qty":8}],"effect":"You may touch any person affected by the Berserk status and call “Remove Berserk” to immediately clear that effect; this ability has the “Returns With: Rest” property CRAFTING —"},{"table":"Cooking","tableType":"food","kind":"Item","name":"Basic Dish","level":0,"materials":[],"effect":"Produces a dish or beverage with no particular arcane effects; this creates 4 servings, and effects that do not say “immediately” last for 3 hours"},{"table":"Cooking","tableType":"food","kind":"Property","name":"Long-Lasting","level":1,"materials":[{"name":"Herb (Enchantment)","qty":2}],"effect":"All of this dish’s other effects last for 3 additional hours. Unlike other crafting trees, this property may not be added multiple times. This effect is not modified by DRINKING SONG."},{"table":"Cooking","tableType":"food","kind":"Property","name":"Cleansing","level":1,"materials":[{"name":"Herb (Purification)","qty":2}],"effect":"Immediately ends ALL currently active COOKING-based effects (often used as an antidote to ongoing, negative food effects). Special: If a food effect is removed in this way, this briefly causes extreme nausea. This effect is not modified by DRINKING SONG."},{"table":"Cooking","tableType":"food","kind":"Property","name":"Restorative","level":1,"materials":[{"name":"Herb (Healing)","qty":2}],"effect":"3 minutes after consuming this dish, you heal 10 HP. This effect cannot be used in combat, and any damage taken or received during the intervening 3 minutes ends the effect prematurely (without any healing). This effect is not modified by DRINKING SONG."},{"table":"Cooking","tableType":"food","kind":"Property","name":"Hallucinogen","level":1,"materials":[{"name":"Herb (Hallucination)","qty":2}],"effect":"Your mind becomes a bit unhinged as you hallucinate, preventing anyone else from controlling you; the first time during the duration of this dish that you would take a “Dominate” effect, you may call “Resist” and call the effect “Self Greater Berserk.” This effect is not modified by DRINKING SONG."},{"table":"Cooking","tableType":"food","kind":"Property","name":"Hearty","level":1,"materials":[{"name":"Herb (Enhancement)","qty":2}],"effect":"Your maximum Health Point total is increased by 2, and you are immediately healed by 2 HP to keep pace with the new maximum. (Remember that all cooking effects are Bestowed Effects) This effect is modified by DRINKING SONG."},{"table":"Cooking","tableType":"food","kind":"Property","name":"Debilitating","level":1,"materials":[{"name":"Herb (Entropic)","qty":2}],"effect":"Your maximum Health Point total is reduced by 2 ; if this brings your maximum to 0 or less, you immediately die. This effect is modified by DRINKING SONG."},{"table":"Cooking","tableType":"food","kind":"Property","name":"Poisonous","level":2,"materials":[{"name":"Herb (Poisonous)","qty":3}],"effect":"You immediately take the “Poison” effect. This only happens once, when the dish is initially consumed. Afterward, the effect of the dish, but not the “Poison” condition, ends. This effect is not modified by DRINKING SONG."},{"table":"Cooking","tableType":"food","kind":"Property","name":"Rejuvenating","level":2,"materials":[{"name":"Herb (Rejuvenation)","qty":3}],"effect":"Every 30 minutes, you regain 3 mana. This effect is modified by DRINKING SONG."},{"table":"Cooking","tableType":"food","kind":"Property","name":"Stabilizing","level":2,"materials":[{"name":"Herb (Sedative)","qty":3}],"effect":"Adds 2 minutes to the length of your Bleedout count. This effect is modified by DRINKING SONG."},{"table":"Cooking","tableType":"food","kind":"Property","name":"Anchoring","level":2,"materials":[{"name":"Herb (Spiritual)","qty":3}],"effect":"Adds 2 minutes to the length of your death count. This effect is modified by DRINKING SONG."},{"table":"Cooking","tableType":"food","kind":"Property","name":"Invigorating","level":2,"materials":[{"name":"Herb (Stimulant)","qty":3}],"effect":"Shortens your Weakness count by 2 minutes. This effect is modified by DRINKING SONG."},{"table":"Cooking","tableType":"food","kind":"Property","name":"Contortionist’s Curry","level":3,"materials":[{"name":"Green Food Tag","qty":1},{"name":"Herb (Hallucination)","qty":1},{"name":"Herb (Entropic)","qty":1}],"effect":"This dish causes an increase in both flexibility and pain tolerance. It bestows 2 uses of the “ESCAPE” skill that may be used at any point in the food’s duration. This effect is modified by DRINKING SONG."},{"table":"Cooking","tableType":"food","kind":"Property","name":"Catered Food","level":3,"materials":[{"name":"Green Food Tag","qty":1},{"name":"Herb (Purification)","qty":1},{"name":"Herb (Stimulant)","qty":1}],"effect":"This dish can only be cooked as part of the “Well Planned Event” influence action. Anyone who consumes this dish may call “No Effect” to “Poison” effects while they attend the Well-Planned Event. This benefit ends as soon as they leave the designated event space. This effect is not modified by DRINKING SONG."},{"table":"Cooking","tableType":"food","kind":"Property","name":"Sacred Libations","level":3,"materials":[{"name":"Green Food Tag","qty":1},{"name":"Sanctified Water","qty":1}],"effect":"You must have the PRIESTHOOD: RANK 1 skill to prepare this dish. Consuming this dish adds +1 to the level of your next Religious Rite, just as if you had performed a sacrifice. See the Divine Magic section of"},{"table":"Tailoring","tableType":"item","kind":"Item","name":"Basic Clothing","level":0,"materials":[],"effect":"Produces any normal type of clothing, with an Armor Value of 0; it is impossible to wear (and benefit from) more than 1 Armor at a time"},{"table":"Tailoring","tableType":"item","kind":"Item","name":"Basic Light Armor","level":0,"materials":[],"effect":"Produces any normal type of light armor, with an Armor Value of 7; it is impossible to wear (and benefit from) more than 1 Armor at a time"},{"table":"Tailoring","tableType":"item","kind":"Property","name":"Lasting","level":1,"materials":[{"name":"Coal","qty":1},{"name":"Iron","qty":1},{"name":"Manganese","qty":1}],"effect":"The gear endures for 1 additional year (these materials are used to produce steel)"},{"table":"Tailoring","tableType":"item","kind":"Property","name":"Reinforced","level":1,"materials":[{"name":"Large Hide","qty":2},{"name":"Cloth","qty":2}],"effect":"Increases the Armor Value of the clothing or armor by 3"},{"table":"Tailoring","tableType":"item","kind":"Property","name":"Spellcasting","level":1,"materials":[{"name":"Quartz","qty":1},{"name":"Silver","qty":1},{"name":"Herb (Enhancement)","qty":1}],"effect":"For purposes of allowing spellcasting, you may act as though you were not wearing this armor"},{"table":"Tailoring","tableType":"item","kind":"Property","name":"Disguise","level":1,"materials":[{"name":"Soft Pelt","qty":2},{"name":"Cloth","qty":2}],"effect":"While wearing this clothing or armor, you are considered to have the DISGUISE skill (see the description of that skill; you will still have to wear a convincing costume for this to do anything)"},{"table":"Tailoring","tableType":"item","kind":"Property","name":"Spirit Protection","level":1,"materials":[{"name":"Mercury","qty":1},{"name":"Silver","qty":3},{"name":"Soft Pelt","qty":1},{"name":"Sanctified Water","qty":1},{"name":"Herb (Purification)","qty":1}],"effect":"Up to three times, you may call “Resist” to prevent a Drain effect that hits you; this ability has the “Returns With: Rest” property"},{"table":"Tailoring","tableType":"item","kind":"Property","name":"Glyph-Guarded","level":1,"materials":[{"name":"Salt","qty":1},{"name":"Quartz","qty":1},{"name":"Mercury","qty":1},{"name":"Ritual Component","qty":1},{"name":"Herb (Enhancement)","qty":1}],"effect":"You may call “Resist” to prevent one Break Limb effect that hits you; this ability has the “Returns With: Rest” property"},{"table":"Tailoring","tableType":"item","kind":"Property","name":"Physically Resistant","level":2,"materials":[{"name":"Honey","qty":4},{"name":"Large Hide","qty":2}],"effect":"You may call “Resist” to prevent any one weapon attack that hits you; this ability has the “Returns With: Rest” property"},{"table":"Tailoring","tableType":"item","kind":"Property","name":"Wakethorn","level":2,"materials":[{"name":"Obsidian","qty":1},{"name":"Bone","qty":3},{"name":"Large Hide","qty":1},{"name":"Herb (Entropic)","qty":3},{"name":"Herb (Stimulant)","qty":3}],"effect":"Whenever you would take a Sleep effect, you may call “Resist” and take 2 damage directly to your HP and a Stun effect instead; if the Stun effect is prevented or not taken for any reason, this ability fails"},{"table":"Tailoring","tableType":"item","kind":"Property","name":"Mindshatter","level":2,"materials":[{"name":"Quartz","qty":1},{"name":"Silver","qty":1},{"name":"Soft Pelt","qty":1},{"name":"Fae Blood","qty":1},{"name":"Herb (Hallucination)","qty":3}],"effect":"You may call “Resist” to prevent one Dominate effect; this ability has the “Returns With: Rest” property. Whenever you Dodge, Parry, Willpower, or Resist a Dominate effect, you gain a single use of the BREAK LIMB skill that must be used within 3 seconds."},{"table":"Tailoring","tableType":"item","kind":"Property","name":"Rageguard","level":2,"materials":[{"name":"Mercury","qty":2},{"name":"Zye Blood Parasite","qty":1},{"name":"Herb (Entropic)","qty":3},{"name":"Herb (Stimulant)","qty":3}],"effect":"You may call “Resist” to prevent one Berserk effect; this ability has the “Returns With: Rest” property. Whenever you Dodge, Parry, Willpower, or Resist a Berserk effect, you gain a single use of the BATTLE RAGE skill that must be used within 3 seconds."},{"table":"Tailoring","tableType":"item","kind":"Property","name":"Deathward","level":2,"materials":[{"name":"Gold","qty":1},{"name":"Feather","qty":3},{"name":"Celestial Blood","qty":2},{"name":"Sanctified Water","qty":1},{"name":"Herb (Rejuvenation)","qty":3},{"name":"Herb (Spiritual)","qty":3}],"effect":"You may call “Resist” to prevent one Death effect; this ability has the “Returns With: Rest” property. Whenever you Dodge, Parry, Willpower, or Resist a Death effect, you may call “Lesser Death” instead of damage for your next weapon attack within 3 seconds"},{"table":"Fletching","tableType":"item","kind":"Item","name":"Basic Quiver of Arrows","level":0,"materials":[],"effect":"Produces a normal quiver of arrows with no special properties; if properties are added, though, all arrows drawn from this quiver gain those properties"},{"table":"Fletching","tableType":"item","kind":"Item","name":"Bundle of Venom Arrows","level":1,"materials":[{"name":"Feathers","qty":1},{"name":"Herb (Poisonous)","qty":5}],"effect":"Creates a tag of 5 special arrows; you may fire one of these arrows and call “Poison” instead of damage (you should mark off one use for each arrow that hits its target)"},{"table":"Fletching","tableType":"item","kind":"Item","name":"Bundle of Messenger Arrows","level":1,"materials":[{"name":"Feathers","qty":1},{"name":"Wood (Lightweight)","qty":1}],"effect":"Creates a tag of 5 special arrows; you may fire one of these arrows to deliver a written message accurately up to 1 mile away (you should mark off one use for each arrow that you use to deliver a message)"},{"table":"Fletching","tableType":"item","kind":"Item","name":"Bundle of “Bricks on Sticks”","level":2,"materials":[{"name":"Stone","qty":1},{"name":"Wood (Dense)","qty":1}],"effect":"Creates a tag of 5 special arrows; you may fire one of these arrows and call “Lesser Sleep” instead of damage (you should mark off one use for each arrow that hits its target)"},{"table":"Fletching","tableType":"item","kind":"Item","name":"Bundle of Harpoon Arrows","level":2,"materials":[{"name":"Iron","qty":1},{"name":"Wood (Durable)","qty":1}],"effect":"Creates a tag of 5 special arrows; you may fire one of these arrows and call “Attract” instead of damage (you should mark off one use for each arrow that hits its target)"},{"table":"Fletching","tableType":"item","kind":"Item","name":"Bundle of Grappling Arrows","level":3,"materials":[{"name":"Feathers","qty":1},{"name":"Wood (Strong)","qty":1}],"effect":"Creates a tag of 5 special arrows; you may fire one of these arrows, then, within 3 seconds of hitting a target, use the LEAP skill in the direction of that target (you should mark off one use for each arrow that hits its target)"},{"table":"Fletching","tableType":"item","kind":"Item","name":"Bundle of Blessed Arrows","level":3,"materials":[{"name":"Feathers","qty":1},{"name":"Sanctified Water","qty":1}],"effect":"Creates a tag of 5 special arrows; you may fire one of these arrows and call “Destroy Lesser Undead” instead of damage (you should mark off one use for each arrow that hits its target)"},{"table":"Fletching","tableType":"item","kind":"Item","name":"Bundle of Marking Arrows","level":4,"materials":[{"name":"Zye Scarab","qty":1},{"name":"Wood (Flexible)","qty":1}],"effect":"Creates a tag of 5 special arrows; you may fire one of these arrows and call “0, Bestow Self 2 Damage,” letting you deal +2 damage with a bow against that target only, for the next 30 minutes (you should mark off one use for each arrow that hits its target)"},{"table":"Fletching","tableType":"item","kind":"Property","name":"Iron","level":0,"materials":[{"name":"Iron","qty":1},{"name":"Feathers","qty":1},{"name":"Wood (Lightweight)","qty":1}],"effect":"When you attack with this arrow, you call “iron” along with arrow damage*; cannot be combined with Silver, Gold, or Elemental"},{"table":"Fletching","tableType":"item","kind":"Property","name":"Silver","level":1,"materials":[{"name":"Silver","qty":1},{"name":"Feathers","qty":1},{"name":"Sanctified Water","qty":1},{"name":"Herb (Purification)","qty":3},{"name":"Wood (Lightweight)","qty":1}],"effect":"When you attack with this arrow, you call “silver” along with arrow damage*; cannot be combined with Iron, Gold, or Elemental"},{"table":"Fletching","tableType":"item","kind":"Property","name":"Gold","level":1,"materials":[{"name":"Gold","qty":1},{"name":"Feathers","qty":1},{"name":"Sanctified Water","qty":1},{"name":"Herb (Purification)","qty":3},{"name":"Wood (Lightweight)","qty":1}],"effect":"When you attack with this arrow, you call “gold” along with arrow damage*; cannot be combined with Iron, Silver, or Elemental"},{"table":"Fletching","tableType":"item","kind":"Property","name":"Arrow-Casting","level":1,"materials":[{"name":"Mercury","qty":1},{"name":"Silver","qty":1},{"name":"Herb (Enhancement)","qty":1}],"effect":"Equivalent of having the WEAPON CASTING skill, but only with this weapon"},{"table":"Fletching","tableType":"item","kind":"Property","name":"Lasting","level":1,"materials":[{"name":"Coal","qty":1},{"name":"Iron","qty":1},{"name":"Manganese","qty":1}],"effect":"The quiver or bundle endures for 1 additional year (these materials are used to produce steel)"},{"table":"Fletching","tableType":"item","kind":"Property","name":"Elemental","level":2,"materials":[{"name":"Coal","qty":2},{"name":"Mercury","qty":2},{"name":"Sulfur","qty":2},{"name":"Spell Crystal","qty":1},{"name":"Feathers","qty":1},{"name":"Herb (Enhancement)","qty":2}],"effect":"Choose Fire, Ice, Lightning, or Acid at time of creation; when you attack, you call that element along with arrow damage*; cannot be combined with Iron, Silver, or Gold"},{"table":"Fletching","tableType":"item","kind":"Property","name":"Life-Drinking","level":2,"materials":[{"name":"Obsidian","qty":1},{"name":"Soul Gem","qty":1},{"name":"Demon Blood","qty":1},{"name":"Zye Blood Parasite","qty":2},{"name":"Herb (Entropic)","qty":4},{"name":"Herb (Spiritual)","qty":4}],"effect":", Up to three times, when you hit a target with this weapon, you may call “Drain 3” instead of weapon damage, damaging their HP directly and transferring it to you; this ability has the “Returns With: Rest” property, and is not affected by bonuses to damage (like “Lethal”)"},{"table":"Fletching","tableType":"item","kind":"Property","name":"Lethal","level":2,"materials":[{"name":"Coal","qty":2},{"name":"Iron","qty":2},{"name":"Manganese","qty":2}],"effect":"Arrows add 1 extra damage to all attacks (remember: attacks are capped at 10 damage) *Note: if your weapon can somehow produce multiple damage types (like iron and ice), choose only 1 to call for each attack."},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Forge","level":1,"materials":[{"name":"Coal","qty":20},{"name":"Stone","qty":10},{"name":"Iron","qty":10}],"effect":"Necessary for the use of BLACKSMITHING, WEAPONSMITHING, ARMORSMITHING, and SHIELDSMITHING skills"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Kitchen","level":1,"materials":[{"name":"Coal","qty":8},{"name":"Salt","qty":10},{"name":"Stone","qty":8},{"name":"Iron","qty":4},{"name":"Marble","qty":2},{"name":"Herb (Purification)","qty":5},{"name":"Wood (Dense + Durable)","qty":8}],"effect":"Necessary for the use of COOKING skills"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Shrine","level":1,"materials":[{"name":"Stone","qty":4},{"name":"Sanctified Water","qty":1},{"name":"Herb (Purification)","qty":3}],"effect":"Necessary for the use of PRIESTHOOD and RITE MASTERY skills; see the Divine Magic section of chapter 4 for more details"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Work Table","level":1,"materials":[{"name":"Iron","qty":8},{"name":"Large Hide","qty":3},{"name":"Wood (Dense + Durable)","qty":10}],"effect":"Necessary for the use of LOCKSMITHING, ENCHANTING, TAILORING, and FLETCHING skills"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Laboratory","level":1,"materials":[{"name":"Coal","qty":4},{"name":"Salt","qty":2},{"name":"Copper","qty":2},{"name":"Marble","qty":1},{"name":"Mercury","qty":3},{"name":"Sulfur","qty":6},{"name":"Spell Crystal","qty":1},{"name":"Herb (Poisonous)","qty":3},{"name":"Herb (Purification)","qty":3}],"effect":"Necessary for the use of ARTIFICING, SCROLL SCRIBING, and STABLE ALCHEMY skills"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Jail","level":1,"materials":[{"name":"Stone","qty":20},{"name":"Iron","qty":10}],"effect":"Allows for the detainment of captured NPCs; can hold up to 10"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Wooden Fortified Building","level":1,"materials":[{"name":"Iron","qty":4},{"name":"Glass","qty":1},{"name":"Wood (Durable)","qty":15}],"effect":"Those inside this building cannot be affected by any effects delivered “by voice” (even if, out of character, those effects are heard)"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Library","level":2,"materials":[{"name":"Iron","qty":2},{"name":"Feathers","qty":3},{"name":"Paper","qty":10},{"name":"Wood (Durable)","qty":10}],"effect":"When used with the RESEARCH skill, serves as a “Research Object” for all possible fields of study"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Tavern","level":2,"materials":[{"name":"Stone","qty":15},{"name":"Food (any variety)","qty":8},{"name":"Glass","qty":2},{"name":"Wood (any variety)","qty":15}],"effect":"After every 30 minutes of rest (no combat or strenuous activity) inside this building, you regain 2 mana"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Hideout","level":2,"materials":[{"name":"Iron","qty":4},{"name":"Wood (Durable)","qty":15}],"effect":"The first 5 people who enter this building every day cannot be located, until the next sunrise, by others using HUNTING to follow tracks. Also, this building’s obscurity makes it impossible to use scrying magic to listen to conversations held within. (“Greater” Divination spell effects could still work, and nonmagical listening does too.)"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Mobile Triage Tent","level":2,"materials":[{"name":"Large Hide","qty":3},{"name":"Cloth","qty":2},{"name":"Herb (Healing)","qty":8},{"name":"Herb (Purification)","qty":4},{"name":"Herb (Rejuvenation)","qty":2},{"name":"Herb (Sedative)","qty":2},{"name":"Herb (Stimulant)","qty":4}],"effect":"Functions exactly as a Healer’s Tent, but may only be set up once per game and provides its benefit for 3 hours; setup takes 3 minutes in one location, and it takes an additional 3 minutes to disassemble and reclaim the Building Tag. You should phys-rep a small healer’s area (you do not need a physical tent) with a very basic shelter and a place to tend wounds."},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Ship","level":2,"materials":[{"name":"Workers","qty":10},{"name":"Iron","qty":2},{"name":"Cloth","qty":6},{"name":"Wood (Durable)","qty":10}],"effect":"Allows you and your chosen guests to travel by sea to any ocean-accessible location; your path cannot be tracked while you are traveling this way; the Workers “spent” during construction become the ship’s crew"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Alchemical Distillery","level":3,"materials":[{"name":"Quartz","qty":2},{"name":"Copper","qty":1},{"name":"Marble","qty":2},{"name":"Glass","qty":5},{"name":"Herb (Enchantment)","qty":2},{"name":"Herb (Enhancement)","qty":2},{"name":"Herb (Entropic)","qty":2},{"name":"Herb (Hallucination)","qty":2},{"name":"Herb (Healing)","qty":2},{"name":"Herb (Poisonous)","qty":2},{"name":"Herb (Purification)","qty":2},{"name":"Herb (Sedative)","qty":2},{"name":"Herb (Spiritual)","qty":2},{"name":"Herb (Stimulant)","qty":2},{"name":"Herb (Rejuvenation)","qty":2},{"name":"Wood (Flexible)","qty":5}],"effect":"Whenever you use a STABLE ALCHEMY skill, you may also instantly make 2 additional potions based on ANY recipes you have access to (you must still expend all necessary materials for those additional potions)"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Healer’s Tent","level":3,"materials":[{"name":"Large Hide","qty":5},{"name":"Cloth","qty":3},{"name":"Herb (Healing)","qty":10},{"name":"Herb (Purification)","qty":5},{"name":"Herb (Rejuvenation)","qty":3},{"name":"Herb (Sedative)","qty":3},{"name":"Herb (Stimulant)","qty":5}],"effect":"After 30 minutes of rest (no combat or strenuous activity) inside this building, you are healed to full health; this effect only changes HP, not broken or missing limbs"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Stone Fortified Building","level":3,"materials":[{"name":"Wooden Fortified Building","qty":1},{"name":"Stone","qty":15},{"name":"Iron","qty":6}],"effect":"Functions identically to a Wooden Fortified Building; additionally, cannot be burned down or easily damaged"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Enhanced Furnace","level":4,"materials":[{"name":"Forge","qty":1},{"name":"Coal","qty":4},{"name":"Stone","qty":1},{"name":"Iron","qty":2},{"name":"Wood (Strong + Durable)","qty":2}],"effect":"Functions as a Forge; in addition, whenever you use a BLACKSMITHING skill to make a new item using this Furnace, you may choose to add one copy of the “Lasting” property without spending any materials"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Printing Press","level":4,"materials":[{"name":"Iron","qty":2},{"name":"Paper","qty":15},{"name":"Wood (Durable)","qty":10}],"effect":"Whenever you use a SCROLL SCRIBING skill, you may also instantly make 2 copies of ANY scrolls in your possession (you must still expend Blood Ink for those scrolls)"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Dungeon","level":4,"materials":[{"name":"Jail","qty":1},{"name":"Stone","qty":20},{"name":"Iron","qty":10},{"name":"Herb (Healing)","qty":5},{"name":"Herb (Poisonous)","qty":5}],"effect":"Functions as a Jail; can hold up to 100 people, and captured NPCs may not use ESCAPE or LOCKPICKING skills; you may employ double your normal uses of TORTURE on captured NPCs"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Warship","level":4,"materials":[{"name":"Ship","qty":1},{"name":"Iron","qty":6},{"name":"Manganese","qty":2},{"name":"Cloth","qty":4},{"name":"Wood (Strong)","qty":4}],"effect":"Functions as a Ship; in addition, is superior in naval combat, enabling the powerful “Warship Strike” Maneuver (from Appendix 1)"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Cargo Ship","level":2,"materials":[{"name":"Ship","qty":1},{"name":"Iron","qty":3},{"name":"Cloth","qty":4},{"name":"Wood (Dense)","qty":4},{"name":"Wood (Strong)","qty":4}],"effect":"Functions as a Ship; in addition, use at Logistics to gain 2 Points worth of goods from the MERCANTILE skill table; each Cargo Ship can only be used once per game"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Fishing Ship","level":2,"materials":[{"name":"Ship","qty":1},{"name":"Iron","qty":2},{"name":"Cloth","qty":4},{"name":"Wood (Dense)","qty":5},{"name":"Wood (Strong)","qty":5}],"effect":"Functions as a Ship; in addition, use at Logistics to gain 3 “Fish” food item tags with 1-month expiration; each Fishing Ship can only be used once per game"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Smuggler’s Skiff","level":3,"materials":[{"name":"Ship","qty":1},{"name":"Iron","qty":2},{"name":"Manganese","qty":2},{"name":"Cloth","qty":8},{"name":"Wood (Lightweight)","qty":4}],"effect":"Functions as a Ship; in addition, may sneak up to 10 extra people (or equivalent goods) past a blockade, guard checkpoint, or similar obstacle"},{"table":"Engineering","tableType":"structure","kind":"Item","name":"Luxury Ship","level":4,"materials":[{"name":"Ship","qty":1},{"name":"Silver","qty":4},{"name":"Gold","qty":3},{"name":"Cloth","qty":3},{"name":"Glass","qty":3},{"name":"Wood (Flexible)","qty":7}],"effect":"Functions as a Ship; in addition, this vessel is extravagant and opulent to an unheard-of degree. …This ship looks very pretty."}],"materials":{"coal":{"display":"Coal","points":1,"sources":[{"skill":"Mining","points":1}]},"salt":{"display":"Salt","points":1,"sources":[{"skill":"Mining","points":1}]},"stone":{"display":"Stone","points":1,"sources":[{"skill":"Mining","points":1}]},"iron":{"display":"Iron","points":2,"sources":[{"skill":"Mining","points":2}]},"quartz":{"display":"Quartz","points":2,"sources":[{"skill":"Mining","points":2}]},"copper":{"display":"Copper","points":2,"sources":[{"skill":"Mining","points":2}]},"marble":{"display":"Marble","points":2,"sources":[{"skill":"Mining","points":2}]},"mercury":{"display":"Mercury","points":3,"sources":[{"skill":"Mining","points":3}]},"sulfur":{"display":"Sulfur","points":3,"sources":[{"skill":"Mining","points":3}]},"silver":{"display":"Silver","points":3,"sources":[{"skill":"Mining","points":3}]},"manganese":{"display":"Manganese","points":3,"sources":[{"skill":"Mining","points":3}]},"obsidian":{"display":"Obsidian","points":4,"sources":[{"skill":"Mining","points":4}]},"gold":{"display":"Gold","points":4,"sources":[{"skill":"Mining","points":4}]},"soul gem":{"display":"Soul Gem","points":4,"sources":[{"skill":"Mining","points":4}]},"spell crystal":{"display":"Spell Crystal","points":4,"sources":[{"skill":"Mining","points":4}]},"bone":{"display":"Bone","points":1,"sources":[{"skill":"Hunting","points":1},{"skill":"Black Market","points":1}]},"feather":{"display":"Feathers","points":1,"sources":[{"skill":"Hunting","points":1}]},"honey":{"display":"Honey","points":1,"sources":[{"skill":"Hunting","points":1}]},"food":{"display":"Food","points":1,"sources":[{"skill":"Hunting","points":1},{"skill":"Mercantile","points":1}]},"soft pelt":{"display":"Soft Pelt","points":2,"sources":[{"skill":"Hunting","points":2}]},"demon blood":{"display":"Demon Blood","points":2,"sources":[{"skill":"Hunting","points":2},{"skill":"Black Market","points":2}]} (function () {

  var DATA = window.DATA || { skills: [], spells: [], statusEffects: [] };

  /* ---- Icons for categories (by keyword) ---- */
  var ICONS = {

    channel: '<path d="M12 3v18M5 12h14M7 7l10 10M17 7 7 17"/>',
    divination: '<circle cx="12" cy="11" r="6"/><path d="M12 17v4M9 21h6"/>',
    sorcery: '<path d="m13 3-9 11h7l-2 7 9-11h-7l2-7Z"/>',
